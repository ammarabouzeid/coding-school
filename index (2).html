      ] },

    { id: 'py-list', title: 'Lists in Depth', mins: 20,
      body: `
<p>A <b>list</b> is an ordered, <b>mutable</b> collection that can hold anything — even other lists.</p>
<h3>Creating and accessing</h3>
${E`
nums = [10, 20, 30, 40, 50]
mixed = [1, "two", 3.0, [4, 5], True]
print(nums[0], nums[-1], nums[1:4], nums[::2], len(nums))
nums[0] = 99                 # lists can change in place
print(nums)
`}
<h3>Adding and removing</h3>
${E`
items = ["a", "b"]
items.append("c")            # add to the end
items.insert(1, "X")         # add at an index
items.extend(["d", "e"])     # add several
print(items)
items.remove("X")            # remove first match by value
last = items.pop()           # remove & return the last (or pop(i))
del items[0]                 # remove by index
print(items, last)
items.clear()
print(items)
`}
<h3>Searching and counting</h3>
${E`
data = [5, 3, 8, 3, 9]
print(data.index(8), data.count(3), 9 in data)
print(min(data), max(data), sum(data), sum(data) / len(data))
`}
<h3>Sorting</h3>
${E`
data = [5, 3, 8, 3, 9]
print(sorted(data))                  # returns a new list
data.sort(reverse=True)              # sorts in place, returns None
print(data)
names = ["bob", "Alice", "carol"]
print(sorted(names, key=str.lower))
data.reverse()
print(data)
`}
<h3>Copies: the classic trap</h3>
<p>Assignment does <b>not</b> copy a list; both names point to the same list.</p>
${E`
a = [1, 2, 3]
b = a                # same list!
b.append(4)
print(a)             # [1, 2, 3, 4]
c = a.copy()         # or a[:] or list(a): a real (shallow) copy
c.append(5)
print(a, c)
`}
<h3>Nested lists (tables)</h3>
${E`
grid = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]
print(grid[1][2])                         # 6
for row in grid:
    print(row)
print([row[0] for row in grid])           # first column
bad = [[0] * 3] * 3                        # DON'T: three references to ONE row
bad[0][0] = 1
print(bad)
good = [[0] * 3 for _ in range(3)]
good[0][0] = 1
print(good)
`}
<h3>Unpacking and slicing assignment</h3>
${E`
first, *middle, last = [1, 2, 3, 4, 5]
print(first, middle, last)
nums = [1, 2, 3, 4, 5]
nums[1:3] = [20, 30, 40]
print(nums)
`}
${tip('Use a list when order matters and you will modify it. If the data should never change, a tuple is safer and a little faster.')}
${warn('<code>list.sort()</code> and <code>list.append()</code> return <code>None</code>. Writing <code>x = x.sort()</code> destroys your list.')}`,
      code: S`
        scores = [72, 95, 88, 61, 99, 85]
        print("sorted:", sorted(scores))
        print("top 3:", sorted(scores, reverse=True)[:3])
        print("average:", round(sum(scores) / len(scores), 1))

        passed = []
        for s in scores:
            if s >= 70:
                passed.append(s)
        print("passed:", passed)

        matrix = [[1, 2, 3], [4, 5, 6]]
        transposed = [[row[i] for row in matrix] for i in range(3)]
        print("transposed:", transposed)

        queue = ["Ali", "Dina"]
        queue.append("Omar")
        print("served:", queue.pop(0), "waiting:", queue)
      `,
      quiz: [
        Q('What does b = a do when a is a list?', ['Copies the list', 'Makes b refer to the same list', 'Sorts the list', 'Deletes a'], 1, 'Assignment copies the reference, not the list.'),
        Q('What does nums.sort() return?', ['The sorted list', 'None', 'A copy', 'The first item'], 1, 'sort() works in place and returns None.'),
        Q('Which creates three independent empty rows?', ['[[]] * 3', '[[] for _ in range(3)]', '[[]] + 3', 'list(3)'], 1, 'The comprehension builds a new list per row.'),
        Q('What does [1,2,3,4,5][::2] return?', ['[1,3,5]', '[2,4]', '[1,2]', '[5,3,1]'], 0, 'Step 2 takes every other element.'),
      ] },

    { id: 'py-tuple', title: 'Tuples', mins: 11,
      body: `
<p>A <b>tuple</b> is like a list that cannot be changed after creation (it is <b>immutable</b>). Tuples use round brackets.</p>
${E`
point = (3, 4)
single = (5,)             # the comma makes it a tuple; (5) is just a number
empty = ()
rgb = 255, 128, 0         # brackets are optional
print(point[0], rgb[-1], len(rgb), type(single))
# point[0] = 9            # TypeError: tuples are immutable
`}
<h3>Why use tuples?</h3>
<ul><li>They protect data that should not change (coordinates, RGB colours, dates).</li><li>They are slightly faster and use less memory.</li><li>Tuples can be dictionary keys and set members; lists cannot.</li></ul>
<h3>Unpacking</h3>
${E`
x, y = (3, 4)
name, age, city = ("Mai", 16, "Cairo")
print(x + y, name, city)
a, b = 1, 2
a, b = b, a               # swap is really tuple packing + unpacking
print(a, b)
first, *rest = (10, 20, 30, 40)
print(first, rest)
`}
<h3>Functions returning several values</h3>
${E`
def stats(values):
    return min(values), max(values), sum(values) / len(values)

low, high, avg = stats([4, 8, 15, 16, 23, 42])
print(low, high, round(avg, 2))
print(stats([1, 2]))       # the whole tuple
`}
<h3>Tuple methods and operations</h3>
${E`
t = (1, 2, 2, 3, 2)
print(t.count(2), t.index(3))
print(t + (4, 5), t * 2, 3 in t)
print(sorted(t))           # sorted() returns a LIST
print(tuple(sorted(t)))
`}
<h3>Tuples as dictionary keys</h3>
${E`
distances = {("Cairo", "Giza"): 20, ("Cairo", "Alexandria"): 220}
print(distances[("Cairo", "Giza")])
`}
${warn('A tuple is only "deeply" immutable if its items are. A tuple holding a list can still have that list modified: <code>t = ([1],); t[0].append(2)</code> works.')}
${tip('Named tuples (<code>from collections import namedtuple</code>) give tuple fields readable names: <code>p.x</code> instead of <code>p[0]</code>.')}`,
      code: S`
        from collections import namedtuple

        def circle(radius):
            import math
            return round(math.pi * radius ** 2, 2), round(2 * math.pi * radius, 2)

        area, circumference = circle(5)
        print("area:", area, "circumference:", circumference)

        Point = namedtuple("Point", ["x", "y"])
        p = Point(3, 4)
        print(p, p.x, p.y, p[0])

        locations = {(30.04, 31.23): "Cairo", (31.20, 29.92): "Alexandria"}
        for (lat, lon), city in locations.items():
            print(f"{city}: {lat}, {lon}")
      `,
      quiz: [
        Q('Which creates a one-element tuple?', ['(5)', '(5,)', '[5]', '{5}'], 1, 'The trailing comma is what makes it a tuple.'),
        Q('Can you do t[0] = 9 on a tuple?', ['Yes', 'No, tuples are immutable', 'Only for numbers', 'Only with append'], 1, 'Item assignment raises TypeError.'),
        Q('Why can a tuple be a dictionary key but a list cannot?', ['Tuples are shorter', 'Tuples are hashable because they are immutable', 'Lists are too big', 'Keys must be numbers'], 1, 'Dict keys must be hashable.'),
      ] },

    { id: 'py-set', title: 'Sets', mins: 12,
      body: `
<p>A <b>set</b> is an unordered collection of <b>unique</b> items. It is built for two jobs: removing duplicates and very fast membership tests (<code>x in s</code>).</p>
${E`
colors = {"red", "green", "blue", "red"}     # the duplicate disappears
print(colors, len(colors))
empty = set()                  # NOT {} - that creates an empty dictionary!
print(set([1, 2, 2, 3, 3, 3]), set("hello"))
print("red" in colors, "pink" in colors)
`}
<h3>Adding and removing</h3>
${E`
s = {1, 2, 3}
s.add(4)
s.update([5, 6, 6])
s.discard(10)            # no error if missing
s.remove(1)              # KeyError if missing
print(s, s.pop())        # pop removes an arbitrary item
`}
<h3>Set mathematics</h3>
${E`
a = {1, 2, 3, 4}
b = {3, 4, 5, 6}
print(a | b, a.union(b))                  # everything
print(a & b, a.intersection(b))           # in both
print(a - b, a.difference(b))             # only in a
print(a ^ b, a.symmetric_difference(b))   # in one but not both
print({1, 2} <= a, {1, 2}.issubset(a), a.isdisjoint({9}))
`}
<h3>Practical uses</h3>
${E`
emails = ["a@x.com", "b@x.com", "a@x.com", "c@x.com", "b@x.com"]
unique = set(emails)
print(len(emails), "->", len(unique))

python_class = {"Ali", "Dina", "Omar"}
java_class = {"Dina", "Noor", "Omar"}
print("both:", python_class & java_class)
print("only python:", python_class - java_class)

seen = set()
for n in [3, 1, 3, 2, 1]:
    if n in seen:
        print(n, "is a duplicate")
    seen.add(n)
`}
<h3>Frozen sets</h3>
<p><code>frozenset(items)</code> is an immutable set, so it can itself be a dictionary key or a member of another set.</p>
${tip('Sets are unordered: do not rely on their print order. Use <code>sorted(s)</code> when you need a stable order.')}
${warn('Set items must be hashable: numbers, strings and tuples are fine; lists and dictionaries are not.')}`,
      code: S`
        words = "to be or not to be that is the question".split()
        unique_words = set(words)
        print("total:", len(words), "unique:", len(unique_words))
        print("sorted unique:", sorted(unique_words))

        morning = {"Ali", "Sara", "Omar"}
        evening = {"Sara", "Noor", "Omar", "Layla"}
        print("came both times:", sorted(morning & evening))
        print("came at least once:", sorted(morning | evening))
        print("only morning:", sorted(morning - evening))
        print("exactly one session:", sorted(morning ^ evening))
      `,
      quiz: [
        Q('What does set([1,1,2,2,3]) produce?', ['{1,1,2,2,3}', '{1,2,3}', '[1,2,3]', '3'], 1, 'Sets keep only unique items.'),
        Q('How do you make an empty set?', ['{}', 'set()', '[]', 'empty()'], 1, '{} makes an empty dictionary.'),
        Q('What does {1,2,3} & {2,3,4} return?', ['{1,2,3,4}', '{2,3}', '{1,4}', '{}'], 1, '& is the intersection.'),
      ] },

    { id: 'py-dict', title: 'Dictionaries in Depth', mins: 20,
      body: `
<p>A <b>dictionary</b> stores <b>key → value</b> pairs. Looking up a key is extremely fast, no matter how many entries there are. Keys must be unique and hashable (strings, numbers, tuples). Since Python 3.7 dictionaries remember insertion order.</p>
${E`
person = {"name": "Mai", "age": 16, "city": "Cairo"}
print(person["name"], len(person))
person["age"] = 17               # update
person["school"] = "ACS"         # add
del person["city"]               # delete
print(person)
`}
<h3>Safe lookups</h3>
${E`
d = {"a": 1}
print(d.get("a"), d.get("z"), d.get("z", 0))     # get never raises
print("a" in d, "z" in d)                         # tests KEYS
try:
    d["z"]
except KeyError as e:
    print("KeyError:", e)
print(d.setdefault("b", 10), d)                   # insert if missing
`}
<h3>Keys, values, items</h3>
${E`
prices = {"apple": 3, "kiwi": 5, "plum": 2}
print(list(prices.keys()), list(prices.values()))
for fruit, price in prices.items():
    print(fruit, "->", price)
print(sum(prices.values()), max(prices, key=prices.get))
print(sorted(prices.items(), key=lambda kv: kv[1]))
`}
<h3>Merging and copying</h3>
${E`
a = {"x": 1, "y": 2}
b = {"y": 20, "z": 30}
print({**a, **b})          # later wins: {'x': 1, 'y': 20, 'z': 30}
print(a | b)               # same, Python 3.9+
a.update(b)
print(a)
copy = a.copy()
`}
<h3>Counting with a dictionary (and Counter)</h3>
${E`
text = "mississippi"
counts = {}
for ch in text:
    counts[ch] = counts.get(ch, 0) + 1
print(counts)

from collections import Counter, defaultdict
print(Counter(text).most_common(2))

groups = defaultdict(list)
for word in ["apple", "avocado", "banana", "blueberry", "cherry"]:
    groups[word[0]].append(word)
print(dict(groups))
`}
<h3>Nested dictionaries</h3>
${E`
school = {
    "Ali":  {"math": 90, "science": 85},
    "Dina": {"math": 78, "science": 92},
}
print(school["Dina"]["science"])
for name, marks in school.items():
    print(name, sum(marks.values()) / len(marks))
`}
${tip('Dictionary comprehensions build dictionaries in one line: <code>{n: n * n for n in range(5)}</code>.')}
${warn('Do not change the size of a dictionary while looping over it. Loop over <code>list(d)</code> if you need to delete items.')}`,
      code: S`
        inventory = {"apples": 12, "pears": 0, "plums": 7}
        inventory["kiwis"] = 4
        inventory["apples"] -= 5
        print(inventory)

        in_stock = {item: qty for item, qty in inventory.items() if qty > 0}
        print("in stock:", in_stock)

        sentence = "the cat and the hat and the bat"
        freq = {}
        for w in sentence.split():
            freq[w] = freq.get(w, 0) + 1
        for word, n in sorted(freq.items(), key=lambda kv: (-kv[1], kv[0])):
            print(f"{word:<5}{'#' * n}")
      `,
      quiz: [
        Q('What does d.get("x", 0) return when "x" is missing?', ['KeyError', 'None', '0', '"x"'], 2, 'get returns the default instead of raising.'),
        Q('What does "a" in d test for a dictionary?', ['Keys', 'Values', 'Items', 'Length'], 0, 'in checks keys.'),
        Q('Which can be a dictionary key?', ['A list', 'A tuple', 'Another dictionary', 'A set'], 1, 'Tuples are hashable; lists, dicts and sets are not.'),
      ] },

    { id: 'py-comp', title: 'Comprehensions & Generator Expressions', mins: 14,
      body: `
<p>A <b>comprehension</b> builds a new collection from an existing one in a single, readable expression.</p>
<h3>List comprehensions</h3>
${E`
squares = [n * n for n in range(1, 6)]
evens = [n for n in range(10) if n % 2 == 0]
words = ["apple", "Kiwi", "plum"]
print(squares, evens, [w.upper() for w in words])
print([x if x > 0 else 0 for x in [-2, 5, -1, 8]])      # conditional expression
`}
<p>The shape is <code>[expression for item in iterable if condition]</code>, equal to this loop:</p>
${E`
result = []
for n in range(10):
    if n % 2 == 0:
        result.append(n * n)
print(result)
print([n * n for n in range(10) if n % 2 == 0])
`}
<h3>Nested comprehensions</h3>
${E`
pairs = [(x, y) for x in range(1, 4) for y in "ab"]
print(pairs)
matrix = [[1, 2], [3, 4], [5, 6]]
flat = [n for row in matrix for n in row]
print(flat)
table = [[i * j for j in range(1, 4)] for i in range(1, 4)]
print(table)
`}
<h3>Dictionary and set comprehensions</h3>
${E`
print({n: n ** 2 for n in range(1, 5)})
print({w: len(w) for w in ["sun", "moon", "star"]})
print({c.lower() for c in "HelloWORLD"})
inverted = {v: k for k, v in {"a": 1, "b": 2}.items()}
print(inverted)
`}
<h3>Generator expressions</h3>
<p>Use round brackets to produce items <b>lazily</b>, one at a time, without building the whole list in memory.</p>
${E`
total = sum(n * n for n in range(1_000_000))      # no giant list is created
print(total)
gen = (n * 2 for n in range(3))
print(next(gen), next(gen), next(gen))
print(any(n > 5 for n in [1, 9, 3]), all(n > 0 for n in [1, 9, 3]))
`}
${tip('If a comprehension needs more than one condition or becomes hard to read, use a normal loop. Clarity beats cleverness.')}
${trick('<code>sum(x for x in data if x &gt; 0)</code> — you can drop the extra brackets when a generator is the only argument.')}`,
      code: S`
        words = ["python", "java", "c++", "go", "rust", "kotlin"]
        long_words = [w.title() for w in words if len(w) > 3]
        print(long_words)

        lengths = {w: len(w) for w in words}
        print(lengths)

        grid = [[(r, c) for c in range(3)] for r in range(2)]
        print(grid)

        numbers = range(1, 21)
        print("sum of odd squares:", sum(n * n for n in numbers if n % 2))
        print("any divisible by 7?", any(n % 7 == 0 for n in numbers))
      `,
      quiz: [
        Q('What does [n * 2 for n in range(3)] produce?', ['[0, 1, 2]', '[0, 2, 4]', '[2, 4, 6]', '[1, 2, 3]'], 1, 'range(3) is 0,1,2 each doubled.'),
        Q('What is the difference between [..] and (..) comprehensions?', ['None', 'The round-bracket version is a lazy generator', 'Round brackets make tuples', 'Square brackets are faster'], 1, 'Generator expressions compute items on demand.'),
        Q('Which builds a dictionary?', ['[k for k in d]', '{k: v for k, v in pairs}', '(k, v for k, v in pairs)', '{k for k in d}'], 1, 'key: value inside { } makes a dict comprehension.'),
      ] },

    { id: 'py-file', title: 'File Handling & JSON', mins: 18,
      body: `
<p>Programs forget everything when they finish, unless they save data to <b>files</b>. Python makes it easy with the built-in <code>open()</code>.</p>
<h3>Writing a text file</h3>
${E`
with open("notes.txt", "w") as f:        # "w" = write (creates or overwrites)
    f.write("first line\n")
    f.write("second line\n")
    f.writelines(["third\n", "fourth\n"])
print("saved")
`}
<p>The <code>with</code> statement closes the file automatically, even when an error happens. Always prefer it.</p>
<h3>File modes</h3>
<table><tr><th>Mode</th><th>Meaning</th></tr><tr><td><code>"r"</code></td><td>read (default); error if the file is missing</td></tr><tr><td><code>"w"</code></td><td>write; erases existing content</td></tr><tr><td><code>"a"</code></td><td>append to the end</td></tr><tr><td><code>"r+"</code></td><td>read and write</td></tr><tr><td><code>"b"</code></td><td>add for binary files, e.g. <code>"rb"</code></td></tr></table>
<h3>Reading</h3>
${E`
with open("notes.txt") as f:
    whole = f.read()            # one big string
print(whole)

with open("notes.txt") as f:
    for number, line in enumerate(f, 1):     # memory-friendly: one line at a time
        print(number, line.rstrip())

with open("notes.txt") as f:
    lines = f.readlines()                    # list of lines
print(len(lines), lines[0])
`}
<h3>Appending</h3>
${E`
with open("notes.txt", "a") as f:
    f.write("fifth line\n")
print(open("notes.txt").read().count("\n"), "lines now")
`}
<h3>Handling missing files</h3>
${E`
try:
    with open("does_not_exist.txt") as f:
        print(f.read())
except FileNotFoundError:
    print("That file does not exist yet.")
`}
<h3>JSON: saving structured data</h3>
${E`
import json
profile = {"name": "Mai", "scores": [90, 85], "active": True}
with open("profile.json", "w") as f:
    json.dump(profile, f, indent=2)

with open("profile.json") as f:
    loaded = json.load(f)
print(loaded["scores"], type(loaded))
print(json.dumps(profile))          # to a string instead of a file
`}
<h3>Files and folders</h3>
${E`
import os
print(os.path.exists("notes.txt"), os.path.getsize("notes.txt"), "bytes")
print(sorted(f for f in os.listdir(".") if f.endswith((".txt", ".json"))))
os.remove("profile.json")
`}
${tip('For CSV data use the <code>csv</code> module, and for paths <code>pathlib.Path</code> — both avoid manual string handling.')}
${warn('Mode <code>"w"</code> deletes the old content immediately. Use <code>"a"</code> if you want to keep it.')}`,
      code: S`
        import json

        todo = [{"task": "learn files", "done": True}, {"task": "build a project", "done": False}]
        with open("todo.json", "w") as f:
            json.dump(todo, f, indent=2)

        with open("todo.json") as f:
            items = json.load(f)
        for item in items:
            mark = "x" if item["done"] else " "
            print(f"[{mark}] {item['task']}")

        with open("log.txt", "w") as f:
            for i in range(1, 4):
                f.write(f"event {i}\n")
        with open("log.txt", "a") as f:
            f.write("event 4\n")
        with open("log.txt") as f:
            print(f.read().strip().split("\n"))
      `,
      quiz: [
        Q('Why use "with open(...) as f"?', ['It is faster', 'It closes the file automatically', 'It encrypts the file', 'It is required for reading'], 1, 'The context manager closes the file even if an error occurs.'),
        Q('Which mode appends to a file?', ['"r"', '"w"', '"a"', '"x"'], 2, '"a" writes at the end without erasing.'),
        Q('What does json.dump() do?', ['Reads JSON', 'Writes Python data as JSON to a file', 'Deletes JSON', 'Prints JSON'], 1, 'dump writes; load reads.'),
      ] },

    { id: 'py-exc', title: 'Exception Handling: try, except, else, finally', mins: 18,
      body: `
<p>Things go wrong at run time: a file is missing, the user types text instead of a number, you divide by zero. Python signals this by <b>raising an exception</b>. If nobody handles it, the program stops with a traceback. With <code>try/except</code> you can recover gracefully.</p>
<h3>Common built-in exceptions</h3>
<table><tr><th>Exception</th><th>Typical cause</th></tr>
<tr><td><code>ZeroDivisionError</code></td><td><code>10 / 0</code></td></tr><tr><td><code>ValueError</code></td><td><code>int("abc")</code></td></tr><tr><td><code>TypeError</code></td><td><code>"a" + 1</code></td></tr>
<tr><td><code>IndexError</code></td><td>list index out of range</td></tr><tr><td><code>KeyError</code></td><td>missing dictionary key</td></tr><tr><td><code>FileNotFoundError</code></td><td>open() on a missing file</td></tr>
<tr><td><code>AttributeError</code></td><td>object has no such attribute</td></tr><tr><td><code>NameError</code></td><td>unknown variable</td></tr></table>
<h3>Basic try / except</h3>
${E`
try:
    result = 10 / 0
    print("never reached")
except ZeroDivisionError:
    print("You cannot divide by zero")
print("the program continues")
`}
<h3>Catching several kinds, and reading the error</h3>
${E`
def parse_age(text):
    try:
        age = int(text)
        return 100 / age
    except ValueError as err:
        print("not a number:", err)
    except ZeroDivisionError:
        print("age cannot be zero")
    except (TypeError, KeyError):
        print("odd input")

parse_age("abc"); parse_age("0"); parse_age("25")
`}
<h3>else and finally</h3>
<ul><li><code>else</code> runs when the <code>try</code> block raised <b>nothing</b>.</li><li><code>finally</code> runs <b>always</b>, perfect for cleanup.</li></ul>
${E`
def read_number(text):
    try:
        n = int(text)
    except ValueError:
        print(repr(text), "is not valid")
        return None
    else:
        print("converted", n)
        return n
    finally:
        print("-- finished checking", repr(text))

read_number("42")
read_number("4x2")
`}
<h3>A friendly input loop</h3>
${E`
inputs = iter(["abc", "-5", "12"])      # pretend these are typed by a user
while True:
    text = next(inputs)
    try:
        n = int(text)
        if n < 0:
            raise ValueError("must be positive")
        break
    except ValueError as err:
        print("Try again:", err)
print("accepted", n)
`}
<h3>Catch-all, and why to avoid it</h3>
${E`
try:
    {}["missing"]
except Exception as e:                 # catches almost everything
    print(type(e).__name__, "->", e)
`}
${tip('Catch the <b>most specific</b> exception you can handle. A bare <code>except:</code> hides bugs, even typos and Ctrl+C.')}
${trick('Python prefers "easier to ask forgiveness than permission" (EAFP): just try the operation and handle the error instead of pre-checking everything.')}`,
      code: S`
        def safe_divide(a, b):
            try:
                return a / b
            except ZeroDivisionError:
                return float("inf")
            except TypeError:
                print("numbers only, please")
                return None

        print(safe_divide(10, 4), safe_divide(1, 0), safe_divide("a", 2))

        data = {"name": "Mai"}
        for key in ["name", "age"]:
            try:
                print(key, "=", data[key])
            except KeyError:
                print(key, "is missing")
            finally:
                print("checked", key)

        numbers = ["10", "x", "30"]
        total = 0
        for text in numbers:
            try:
                total += int(text)
            except ValueError:
                print("skipping", text)
        print("total:", total)
      `,
      quiz: [
        Q('When does the else block of try/except run?', ['Always', 'When an exception happened', 'When no exception happened', 'Never'], 2, 'else runs only if the try block succeeded.'),
        Q('When does finally run?', ['Only on errors', 'Only on success', 'Always', 'Never'], 2, 'finally is for cleanup and always executes.'),
        Q('What does int("abc") raise?', ['TypeError', 'ValueError', 'NameError', 'KeyError'], 1, 'The type is right (str) but the value is not convertible.'),
      ] },

    { id: 'py-exc2', title: 'Raising & Custom Exceptions', mins: 15,
      body: `
<p>You can signal errors yourself with <code>raise</code>, and define your own exception types to make failures meaningful.</p>
<h3>raise</h3>
${E`
def set_age(age):
    if not isinstance(age, int):
        raise TypeError("age must be an integer")
    if age < 0:
        raise ValueError(f"age cannot be negative, got {age}")
    return age

for bad in [-3, "ten"]:
    try:
        set_age(bad)
    except (ValueError, TypeError) as e:
        print(type(e).__name__ + ":", e)
`}
<h3>assert</h3>
<p><code>assert condition, message</code> checks something that must be true while developing.</p>
${E`
def average(nums):
    assert len(nums) > 0, "list must not be empty"
    return sum(nums) / len(nums)

try:
    average([])
except AssertionError as e:
    print("assertion failed:", e)
`}
<h3>Custom exception classes</h3>
<p>Inherit from <code>Exception</code>. You rarely need more than a name and a message — optionally extra data.</p>
${E`
class InsufficientFundsError(Exception):
    def __init__(self, balance, amount):
        self.balance = balance
        self.amount = amount
        super().__init__(f"need {amount - balance} more")

class Account:
    def __init__(self, balance):
        self.balance = balance
    def withdraw(self, amount):
        if amount > self.balance:
            raise InsufficientFundsError(self.balance, amount)
        self.balance -= amount

acct = Account(50)
try:
    acct.withdraw(80)
except InsufficientFundsError as e:
    print("Declined:", e, "| short by", e.amount - e.balance)
`}
<h3>Re-raising and chaining</h3>
${E`
def load(path):
    try:
        open(path)
    except FileNotFoundError as e:
        raise RuntimeError("configuration could not be loaded") from e

try:
    load("settings.cfg")
except RuntimeError as e:
    print(e, "| caused by:", repr(e.__cause__))

try:
    try:
        1 / 0
    except ZeroDivisionError:
        print("logging the error...")
        raise                      # pass the same exception upward
except ZeroDivisionError:
    print("handled at the top")
`}
<h3>An exception hierarchy</h3>
${E`
class ShopError(Exception): pass
class OutOfStock(ShopError): pass
class PaymentFailed(ShopError): pass

for err in (OutOfStock("pens"), PaymentFailed("card declined")):
    try:
        raise err
    except ShopError as e:         # catches any subclass
        print("shop problem:", e)
`}
${tip('Name custom exceptions with an <code>Error</code> suffix and group related ones under a common base class so callers can catch the whole family.')}
${warn('Raise <b>specific</b> exceptions with helpful messages. <code>raise Exception("error")</code> tells the reader nothing.')}`,
      code: S`
        class InvalidGradeError(ValueError):
            pass

        def letter_grade(score):
            if not 0 <= score <= 100:
                raise InvalidGradeError(f"score {score} is outside 0-100")
            for limit, letter in [(90, "A"), (80, "B"), (70, "C"), (60, "D")]:
                if score >= limit:
                    return letter
            return "F"

        for s in [95, 72, 41, 120]:
            try:
                print(s, "->", letter_grade(s))
            except InvalidGradeError as e:
                print("error:", e)

        def withdraw(balance, amount):
            if amount <= 0:
                raise ValueError("amount must be positive")
            if amount > balance:
                raise RuntimeError("insufficient funds")
            return balance - amount

        try:
            print(withdraw(100, 30))
            print(withdraw(100, 300))
        except (ValueError, RuntimeError) as e:
            print("Transaction failed:", e)
      `,
      quiz: [
        Q('Which keyword triggers an exception on purpose?', ['throw', 'raise', 'error', 'except'], 1, 'Python uses raise.'),
        Q('A custom exception class should normally inherit from…', ['object only', 'Exception', 'int', 'str'], 1, 'Subclass Exception (or one of its subclasses).'),
        Q('What does a bare raise inside an except block do?', ['Ends the program silently', 'Re-raises the current exception', 'Creates a new error', 'Clears the error'], 1, 'It propagates the same exception upward.'),
      ] },

    { id: 'py-oop2', title: 'Classes: Attributes, Methods & Special Methods', mins: 20,
      body: `
<p>You met classes already. This lesson fills in the details that make them powerful.</p>
<h3>Instance attributes vs class attributes</h3>
<p>Attributes set on <code>self</code> belong to one object. Attributes defined in the class body are <b>shared</b> by all objects.</p>
${E`
class Player:
    game = "Space Run"            # class attribute: shared
    count = 0

    def __init__(self, name):
        self.name = name          # instance attribute: one per object
        self.score = 0
        Player.count += 1

p1, p2 = Player("Ali"), Player("Dina")
p1.score = 50
print(p1.name, p1.score, p2.score)      # 50 0
print(Player.count, p1.game, p2.game)   # 2 Space Run Space Run
`}
<h3>Three kinds of methods</h3>
${E`
class Temperature:
    scale = "Celsius"

    def __init__(self, degrees):
        self.degrees = degrees

    def to_fahrenheit(self):                 # instance method: uses self
        return self.degrees * 9 / 5 + 32

    @classmethod
    def from_fahrenheit(cls, f):             # class method: alternative constructor
        return cls((f - 32) * 5 / 9)

    @staticmethod
    def is_freezing(c):                      # static method: no self or cls
        return c <= 0

t = Temperature(100)
print(t.to_fahrenheit())
print(Temperature.from_fahrenheit(212).degrees)
print(Temperature.is_freezing(-5))
`}
<h3>__str__ and __repr__</h3>
<p><code>__str__</code> is what <code>print()</code> shows (for users); <code>__repr__</code> is for developers and ideally looks like the code that creates the object.</p>
${E`
class Book:
    def __init__(self, title, pages):
        self.title, self.pages = title, pages
    def __str__(self):
        return f"{self.title} ({self.pages} pages)"
    def __repr__(self):
        return f"Book({self.title!r}, {self.pages})"

b = Book("Dune", 612)
print(b)           # uses __str__
print([b])         # a list shows __repr__
print(repr(b))
`}
<h3>Other handy special ("dunder") methods</h3>
${E`
class Playlist:
    def __init__(self, *songs):
        self.songs = list(songs)
    def __len__(self):
        return len(self.songs)
    def __getitem__(self, i):
        return self.songs[i]
    def __contains__(self, song):
        return song in self.songs

p = Playlist("Intro", "Verse", "Outro")
print(len(p), p[1], "Outro" in p)
for s in p:                      # __getitem__ makes it iterable
    print(s, end=" | ")
print()
`}
<h3>Object identity and attributes at run time</h3>
${E`
class Point: pass
p = Point()
p.x = 3                          # attributes can be added dynamically
print(p.x, hasattr(p, "y"), getattr(p, "y", "no y"))
print(p.__dict__)
`}
${tip('Use a <b>class method</b> as an alternative constructor (<code>from_string</code>, <code>from_file</code>), and a <b>static method</b> for helper functions that belong to the class conceptually.')}
${warn('Assigning through an instance (<code>p1.count = 5</code>) creates a new instance attribute; it does not change the shared class attribute.')}`,
      code: S`
        class BankAccount:
            interest_rate = 0.02
            accounts_opened = 0

            def __init__(self, owner, balance=0):
                self.owner = owner
                self.balance = balance
                BankAccount.accounts_opened += 1

            def deposit(self, amount):
                self.balance += amount
                return self

            def add_interest(self):
                self.balance *= 1 + BankAccount.interest_rate
                return self

            @classmethod
            def from_string(cls, text):
                owner, balance = text.split(":")
                return cls(owner, float(balance))

            def __str__(self):
                return f"{self.owner}: {'$'}{self.balance:,.2f}"

        a = BankAccount.from_string("Mai:1000")
        a.deposit(500).add_interest()
        print(a)
        b = BankAccount("Omar")
        print(b, "| accounts:", BankAccount.accounts_opened)
      `,
      quiz: [
        Q('Which kind of attribute is shared by all objects of a class?', ['Instance attribute', 'Class attribute', 'Local variable', 'Argument'], 1, 'Class attributes live on the class itself.'),
        Q('What is @classmethod typically used for?', ['Private methods', 'Alternative constructors', 'Deleting objects', 'Looping'], 1, 'It receives cls and can create instances.'),
        Q('Which method does print(obj) call?', ['__repr__ always', '__str__ (falling back to __repr__)', '__init__', '__len__'], 1, 'print uses __str__ if defined.'),
      ] },

    { id: 'py-inh', title: 'Inheritance, super() & Multiple Inheritance', mins: 20,
      body: `
<p><b>Inheritance</b> lets a new class reuse and extend an existing one. The existing class is the <b>parent</b> (base / superclass); the new one is the <b>child</b> (derived / subclass). It models an <b>"is-a"</b> relationship: a Dog <i>is an</i> Animal.</p>
${E`
class Animal:
    def __init__(self, name):
        self.name = name
    def speak(self):
        return f"{self.name} makes a sound"
    def move(self):
        return f"{self.name} moves"

class Dog(Animal):                # Dog inherits everything from Animal
    def speak(self):              # ...and overrides speak()
        return f"{self.name} barks"

class Fish(Animal):
    def move(self):
        return f"{self.name} swims"

for pet in [Dog("Rex"), Fish("Nemo"), Animal("Thing")]:
    print(pet.speak(), "/", pet.move())
`}
<h3>super(): reuse the parent's version</h3>
${E`
class Vehicle:
    def __init__(self, brand, wheels):
        self.brand = brand
        self.wheels = wheels
    def describe(self):
        return f"{self.brand} with {self.wheels} wheels"

class Car(Vehicle):
    def __init__(self, brand, doors):
        super().__init__(brand, 4)       # run Vehicle's __init__ first
        self.doors = doors
    def describe(self):
        return super().describe() + f" and {self.doors} doors"

print(Car("Toyota", 4).describe())
`}
<h3>isinstance and issubclass</h3>
${E`
class Vehicle: pass
class Car(Vehicle): pass

c = Car()
print(isinstance(c, Car), isinstance(c, Vehicle), isinstance(c, str))
print(issubclass(Car, Vehicle), Car.__mro__)
`}
<h3>Multiple inheritance</h3>
<p>A class may have several parents. Python resolves method names using the <b>Method Resolution Order (MRO)</b>: child first, then parents left to right.</p>
${E`
class Swimmer:
    def move(self):
        return "swims"
    def breathe(self):
        return "holds breath"

class Flyer:
    def move(self):
        return "flies"

class Duck(Swimmer, Flyer):
    pass

d = Duck()
print(d.move(), "|", d.breathe())
print([c.__name__ for c in Duck.__mro__])
`}
<h3>Mixins</h3>
<p>A common, tidy use of multiple inheritance is a small class that adds one ability.</p>
${E`
class JsonMixin:
    def to_json(self):
        import json
        return json.dumps(self.__dict__)

class User(JsonMixin):
    def __init__(self, name, age):
        self.name, self.age = name, age

print(User("Mai", 16).to_json())
`}
${tip('Prefer <b>composition</b> ("has-a") when the relationship is not truly "is-a": a Car <i>has</i> an Engine, it is not an Engine.')}
${warn('Forgetting <code>super().__init__()</code> in a child leaves the parent\'s attributes unset, which causes <code>AttributeError</code> later.')}`,
      code: S`
        class Employee:
            def __init__(self, name, salary):
                self.name = name
                self.salary = salary
            def pay(self):
                return self.salary
            def __str__(self):
                return f"{type(self).__name__} {self.name}: {self.pay():,.0f}"

        class Manager(Employee):
            def __init__(self, name, salary, bonus):
                super().__init__(name, salary)
                self.bonus = bonus
            def pay(self):
                return super().pay() + self.bonus

        class Intern(Employee):
            def pay(self):
                return self.salary * 0.5

        staff = [Employee("Ali", 3000), Manager("Dina", 5000, 1500), Intern("Omar", 2000)]
        for person in staff:
            print(person)
        print("payroll:", sum(p.pay() for p in staff))
        print([c.__name__ for c in Manager.__mro__])
      `,
      quiz: [
        Q('What does super().__init__(...) do in a child class?', ['Deletes the parent', 'Calls the parent constructor', 'Creates a new class', 'Does nothing'], 1, 'It runs the parent\'s __init__.'),
        Q('Which relationship does inheritance model?', ['has-a', 'is-a', 'uses-a', 'knows-a'], 1, 'A Dog is an Animal.'),
        Q('What decides which method runs with multiple inheritance?', ['Alphabet', 'The MRO (Method Resolution Order)', 'Random choice', 'File order'], 1, 'Python checks the class, then its parents left to right (C3 linearisation).'),
      ] },

    { id: 'py-dunder', title: 'Operator Overloading & Special Methods', mins: 16,
      body: `
<p>When you write <code>a + b</code>, Python actually calls <code>a.__add__(b)</code>. By defining these "dunder" (double underscore) methods you teach your own classes to work with operators, comparisons and built-in functions.</p>
${E`
class Vector:
    def __init__(self, x, y):
        self.x, self.y = x, y

    def __add__(self, other):
        return Vector(self.x + other.x, self.y + other.y)
    def __sub__(self, other):
        return Vector(self.x - other.x, self.y - other.y)
    def __mul__(self, k):                      # vector * number
        return Vector(self.x * k, self.y * k)
    def __rmul__(self, k):                     # number * vector
        return self * k
    def __eq__(self, other):
        return (self.x, self.y) == (other.x, other.y)
    def __neg__(self):
        return Vector(-self.x, -self.y)
    def __abs__(self):
        return (self.x ** 2 + self.y ** 2) ** 0.5
    def __repr__(self):
        return f"Vector({self.x}, {self.y})"

a, b = Vector(1, 2), Vector(3, 4)
print(a + b, b - a, a * 3, 2 * b, -a)
print(a == Vector(1, 2), abs(b))
`}
<h3>The common operator methods</h3>
<table><tr><th>Expression</th><th>Method</th></tr>
<tr><td><code>a + b</code>, <code>a - b</code>, <code>a * b</code>, <code>a / b</code></td><td><code>__add__</code> <code>__sub__</code> <code>__mul__</code> <code>__truediv__</code></td></tr>
<tr><td><code>a == b</code>, <code>a &lt; b</code></td><td><code>__eq__</code>, <code>__lt__</code> (also <code>__le__ __gt__ __ge__</code>)</td></tr>
<tr><td><code>len(a)</code>, <code>a[i]</code>, <code>x in a</code></td><td><code>__len__</code> <code>__getitem__</code> <code>__contains__</code></td></tr>
<tr><td><code>str(a)</code>, <code>repr(a)</code></td><td><code>__str__</code> <code>__repr__</code></td></tr>
<tr><td><code>a()</code></td><td><code>__call__</code></td></tr>
<tr><td><code>abs(a)</code>, <code>bool(a)</code></td><td><code>__abs__</code> <code>__bool__</code></td></tr></table>
<h3>Ordering objects</h3>
${E`
from functools import total_ordering

@total_ordering                      # define __eq__ and __lt__, get the rest free
class Version:
    def __init__(self, text):
        self.parts = tuple(int(p) for p in text.split("."))
    def __eq__(self, other):
        return self.parts == other.parts
    def __lt__(self, other):
        return self.parts < other.parts
    def __repr__(self):
        return "v" + ".".join(map(str, self.parts))

versions = [Version("1.10.0"), Version("1.2.9"), Version("1.2.10")]
print(sorted(versions), max(versions), Version("2.0") > Version("1.9"))
`}
<h3>Callable objects</h3>
${E`
class Multiplier:
    def __init__(self, factor):
        self.factor = factor
    def __call__(self, x):
        return x * self.factor

triple = Multiplier(3)
print(triple(14), list(map(triple, [1, 2, 3])))
`}
${tip('If you define <code>__eq__</code>, also think about <code>__hash__</code>: objects that compare equal must have the same hash if you want to use them in sets or as dictionary keys.')}
${warn('Return <code>NotImplemented</code> (not an exception) from an operator method when the other operand has a type you do not support; Python will then try the reverse operation.')}`,
      code: S`
        from fractions import Fraction

        class Money:
            def __init__(self, cents):
                self.cents = cents
            def __add__(self, other):
                return Money(self.cents + other.cents)
            def __lt__(self, other):
                return self.cents < other.cents
            def __eq__(self, other):
                return self.cents == other.cents
            def __str__(self):
                return f"{'$'}{self.cents // 100}.{self.cents % 100:02d}"

        wallet = [Money(1250), Money(399), Money(5)]
        total = Money(0)
        for m in wallet:
            total = total + m
        print("total:", total)
        print("smallest:", min(wallet), "largest:", max(wallet))
        print(Money(100) == Money(100), Money(100) < Money(99))
        print(Fraction(1, 3) + Fraction(1, 6))
      `,
      quiz: [
        Q('Which method makes a + b work for your class?', ['__plus__', '__add__', '__sum__', '__concat__'], 1, '+ calls __add__.'),
        Q('What does __len__ enable?', ['len(obj)', 'obj + obj', 'obj[0]', 'print(obj)'], 0, 'len(obj) calls obj.__len__().'),
        Q('What makes an object callable like a function?', ['__init__', '__call__', '__run__', '__exec__'], 1, 'Defining __call__ lets you write obj(args).'),
      ] },

    { id: 'py-prop', title: 'Encapsulation & @property', mins: 15,
      body: `
<p><b>Encapsulation</b> means keeping an object's data safe behind a controlled interface so that the object can protect its own rules (a balance never goes negative, an age is always valid).</p>
<h3>Naming conventions for "private" data</h3>
<ul><li><code>name</code> — public: anyone may use it.</li><li><code>_name</code> — "protected by convention": please leave it alone.</li><li><code>__name</code> — name-mangled to <code>_ClassName__name</code> to avoid accidental clashes in subclasses.</li></ul>
${E`
class Safe:
    def __init__(self, code):
        self._opened = False
        self.__code = code            # mangled

    def open(self, attempt):
        self._opened = attempt == self.__code
        return self._opened

s = Safe(1234)
print(s.open(1111), s.open(1234))
# print(s.__code)                    # AttributeError
print(s._Safe__code)                  # still reachable: Python trusts programmers
`}
<h3>@property: attributes with logic</h3>
<p>A property looks like a plain attribute but runs a method. You can validate on assignment without changing how callers use the class.</p>
${E`
class Person:
    def __init__(self, name, age):
        self.name = name
        self.age = age                 # goes through the setter below

    @property
    def age(self):
        return self._age

    @age.setter
    def age(self, value):
        if not 0 <= value <= 130:
            raise ValueError("age must be between 0 and 130")
        self._age = value

p = Person("Mai", 16)
p.age = 17
print(p.age)
try:
    p.age = -5
except ValueError as e:
    print("rejected:", e)
`}
<h3>Read-only and computed properties</h3>
${E`
class Circle:
    def __init__(self, radius):
        self.radius = radius

    @property
    def diameter(self):                 # computed every time
        return self.radius * 2

    @property
    def area(self):
        return round(3.14159 * self.radius ** 2, 2)

c = Circle(5)
print(c.diameter, c.area)
c.radius = 10
print(c.diameter, c.area)               # updated automatically
try:
    c.area = 99
except AttributeError as e:
    print("read-only:", e)
`}
<h3>A complete example: a bank account</h3>
${E`
class Account:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self._balance = balance
        self._history = []

    @property
    def balance(self):
        return self._balance

    def deposit(self, amount):
        if amount <= 0:
            raise ValueError("deposit must be positive")
        self._balance += amount
        self._history.append(("deposit", amount))

    def withdraw(self, amount):
        if amount > self._balance:
            raise ValueError("insufficient funds")
        self._balance -= amount
        self._history.append(("withdraw", amount))

    @property
    def history(self):
        return list(self._history)      # a copy, so callers cannot change it

a = Account("Ali", 100)
a.deposit(50); a.withdraw(30)
print(a.balance, a.history)
`}
${tip('Start with plain public attributes. Switch to a <code>@property</code> later when validation is needed; callers do not have to change.')}`,
      code: S`
        class Thermostat:
            def __init__(self, target=21):
                self.target = target

            @property
            def target(self):
                return self._target

            @target.setter
            def target(self, celsius):
                if not 10 <= celsius <= 30:
                    raise ValueError(f"{celsius} is outside the safe range 10-30")
                self._target = celsius

            @property
            def target_fahrenheit(self):
                return round(self._target * 9 / 5 + 32, 1)

        t = Thermostat()
        print(t.target, t.target_fahrenheit)
        t.target = 25
        print(t.target, t.target_fahrenheit)
        try:
            t.target = 50
        except ValueError as e:
            print("error:", e)
      `,

    { id: 'py-abc', title: 'Polymorphism & Abstract Base Classes', mins: 15,
      body: `
<p><b>Polymorphism</b> ("many forms") means the same operation works on different types of objects, each in its own way. Python achieves it in two flavours.</p>
<h3>1. Through inheritance and overriding</h3>
${E`
class Shape:
    def area(self):
        raise NotImplementedError("subclasses must implement area()")

class Square(Shape):
    def __init__(self, s): self.s = s
    def area(self): return self.s ** 2

class Circle(Shape):
    def __init__(self, r): self.r = r
    def area(self): return round(3.14159 * self.r ** 2, 2)

shapes = [Square(3), Circle(2), Square(1.5)]
for shape in shapes:
    print(type(shape).__name__, shape.area())     # one call, different behaviour
print("total area:", sum(s.area() for s in shapes))
`}
<h3>2. Through duck typing</h3>
<p><i>"If it walks like a duck and quacks like a duck, it is a duck."</i> Python does not care about an object's class, only whether it has the method you call.</p>
${E`
class Duck:
    def speak(self): return "Quack"
class Robot:
    def speak(self): return "Beep"
class Rock:
    pass

for thing in [Duck(), Robot(), Rock()]:
    try:
        print(thing.speak())
    except AttributeError:
        print(type(thing).__name__, "cannot speak")
`}
<h3>Abstract base classes (abc)</h3>
<p>An <b>abstract class</b> defines a contract that children must fulfil. It cannot be instantiated, and Python refuses to create a child that forgot an abstract method.</p>
${E`
from abc import ABC, abstractmethod

class PaymentMethod(ABC):
    @abstractmethod
    def pay(self, amount):
        ...

    def receipt(self, amount):           # a normal, shared method
        return f"Paid {amount} using {type(self).__name__}"

class Card(PaymentMethod):
    def pay(self, amount):
        return f"charging card {amount}"

class Cash(PaymentMethod):
    def pay(self, amount):
        return f"taking cash {amount}"

class Broken(PaymentMethod):
    pass

for method in (Card(), Cash()):
    print(method.pay(20), "|", method.receipt(20))

try:
    PaymentMethod()
except TypeError as e:
    print("cannot instantiate:", e)
try:
    Broken()
except TypeError as e:
    print("incomplete subclass:", e)
`}
<h3>Polymorphic built-ins</h3>
${E`
print(len("abc"), len([1, 2]), len({"a": 1}))      # len works on many types
print(sorted([3, 1, 2]), sorted("cab"))
print(1 + 2, "a" + "b", [1] + [2])                  # + means different things
`}
${tip('Code to an <b>interface</b> ("anything with <code>pay()</code>") instead of a concrete class. New payment types then slot in without changing the calling code.')}`,
      code: S`
        from abc import ABC, abstractmethod
        import math

        class Shape(ABC):
            @abstractmethod
            def area(self): ...
            @abstractmethod
            def perimeter(self): ...
            def describe(self):
                return f"{type(self).__name__}: area={self.area():.2f}, perimeter={self.perimeter():.2f}"

        class Rectangle(Shape):
            def __init__(self, w, h): self.w, self.h = w, h
            def area(self): return self.w * self.h
            def perimeter(self): return 2 * (self.w + self.h)

        class Circle(Shape):
            def __init__(self, r): self.r = r
            def area(self): return math.pi * self.r ** 2
            def perimeter(self): return 2 * math.pi * self.r

        for shape in [Rectangle(3, 4), Circle(1.5)]:
            print(shape.describe())
        try:
            Shape()
        except TypeError as e:
            print("Shape is abstract:", e)
      `,
      quiz: [
        Q('What is duck typing?', ['Typing quickly', 'Using an object based on the methods it has, not its class', 'A type checker', 'Only for birds'], 1, 'If it has the needed method, it works.'),
        Q('What happens if you instantiate an ABC with an unimplemented abstract method?', ['It works', 'TypeError', 'It prints a warning', 'NameError'], 1, 'Python refuses to create the object.'),
        Q('Polymorphism lets you…', ['Call the same method on different object types with different results', 'Hide data', 'Copy objects', 'Import modules'], 0, 'One interface, many implementations.'),
      ] },

    { id: 'py-iter', title: 'Iterators & the Iteration Protocol', mins: 14,
      body: `
<p>Every <code>for</code> loop uses the <b>iterator protocol</b>. Understanding it lets you build your own sequences.</p>
<ul><li>An <b>iterable</b> is anything you can loop over (list, string, dict, file). It has <code>__iter__()</code>.</li><li>An <b>iterator</b> produces values one by one with <code>__next__()</code> and raises <code>StopIteration</code> when finished.</li></ul>
${E`
numbers = [10, 20, 30]
it = iter(numbers)          # get an iterator
print(next(it), next(it), next(it))
try:
    next(it)
except StopIteration:
    print("no more items")
`}
<h3>What a for loop really does</h3>
${E`
it = iter("abc")
while True:
    try:
        ch = next(it)
    except StopIteration:
        break
    print(ch)
`}
<h3>Writing your own iterator class</h3>
${E`
class Countdown:
    def __init__(self, start):
        self.current = start

    def __iter__(self):
        return self

    def __next__(self):
        if self.current <= 0:
            raise StopIteration
        value = self.current
        self.current -= 1
        return value

for n in Countdown(5):
    print(n, end=" ")
print()
print(list(Countdown(3)), sum(Countdown(4)))
`}
<h3>An iterable that can be looped many times</h3>
<p>Return a <i>fresh</i> iterator from <code>__iter__</code> so the object can be reused.</p>
${E`
class Evens:
    def __init__(self, limit):
        self.limit = limit
    def __iter__(self):
        return iter(range(0, self.limit, 2))

e = Evens(10)
print(list(e), list(e))          # works twice
`}
<h3>Useful tools: itertools</h3>
${E`
import itertools
print(list(itertools.islice(itertools.count(1), 5)))           # 1..5 from an endless counter
print(list(itertools.chain([1, 2], "ab")))
print(list(itertools.permutations("abc", 2))[:4])
print(list(itertools.product([0, 1], repeat=2)))
colors = itertools.cycle(["red", "green"])
print([next(colors) for _ in range(5)])
`}
${tip('Iterators are <b>lazy</b>: values are produced on demand, so they can describe infinite sequences or huge files without using much memory.')}
${warn('An iterator can be used only once. After it is exhausted, <code>list(it)</code> returns <code>[]</code> — create a new iterator to start again.')}`,
      code: S`
        class Fibonacci:
            def __init__(self, count):
                self.count = count
                self.a, self.b = 0, 1
                self.emitted = 0

            def __iter__(self):
                return self

            def __next__(self):
                if self.emitted >= self.count:
                    raise StopIteration
                value = self.a
                self.a, self.b = self.b, self.a + self.b
                self.emitted += 1
                return value

        print(list(Fibonacci(10)))
        for i, f in enumerate(Fibonacci(5)):
            print(i, f)

        it = iter([1, 2, 3])
        print(list(it), list(it))      # second time: empty
      `,
      quiz: [
        Q('Which exception ends iteration?', ['EndError', 'StopIteration', 'IndexError', 'BreakError'], 1, 'next() raises StopIteration when the iterator is exhausted.'),
        Q('Which method makes an object an iterator?', ['__iter__ only', '__next__ (together with __iter__)', '__loop__', '__get__'], 1, 'Iterators implement __next__ and return themselves from __iter__.'),
        Q('What does list(it) give the second time you call it on the same exhausted iterator?', ['The same items', '[]', 'An error', 'None'], 1, 'An iterator can only be consumed once.'),
      ] },

    { id: 'py-gen', title: 'Generators & yield', mins: 15,
      body: `
<p>Writing a full iterator class is verbose. A <b>generator function</b> gives you the same result with a few lines: use <code>yield</code> instead of <code>return</code>. The function is <b>paused</b> at each <code>yield</code> and resumes where it left off on the next request.</p>
${E`
def countdown(n):
    while n > 0:
        yield n               # hand a value out, then pause here
        n -= 1
    print("liftoff")

for x in countdown(3):
    print(x)
`}
<h3>Seeing the laziness</h3>
${E`
def noisy():
    print("start")
    yield 1
    print("middle")
    yield 2
    print("end")

g = noisy()          # nothing runs yet!
print("created")
print(next(g))
print(next(g))
try:
    next(g)
except StopIteration:
    print("done")
`}
<h3>Infinite sequences</h3>
${E`
def naturals():
    n = 1
    while True:
        yield n
        n += 1

def take(count, iterable):
    for i, x in enumerate(iterable):
        if i >= count:
            return
        yield x

print(list(take(5, naturals())))
`}
<h3>Processing huge data</h3>
<p>Generators let you chain steps without ever holding everything in memory — a "pipeline":</p>
${E`
def read_lines():
    for i in range(1, 8):
        yield f"item {i}, price {i * 3}"

def parse(lines):
    for line in lines:
        name, price = line.split(", price ")
        yield name, int(price)

def expensive(rows, minimum):
    return (name for name, price in rows if price >= minimum)

print(list(expensive(parse(read_lines()), 15)))
`}
<h3>yield from, send and generator state</h3>
${E`
def flatten(nested):
    for item in nested:
        if isinstance(item, list):
            yield from flatten(item)       # delegate to a sub-generator
        else:
            yield item

print(list(flatten([1, [2, [3, 4]], 5, [[6]]])))

def running_average():
    total, count = 0, 0
    average = None
    while True:
        value = yield average              # receive a value with send()
        total += value
        count += 1
        average = total / count

avg = running_average()
next(avg)                                   # prime the generator
print(avg.send(10), avg.send(20), avg.send(60))
`}
<h3>Generator vs list</h3>
${E`
import sys
big_list = [n for n in range(100000)]
big_gen = (n for n in range(100000))
print(sys.getsizeof(big_list) > 100000, sys.getsizeof(big_gen) < 300)
`}
${tip('Use a generator when you only need to loop once, or when the data is large or infinite. Use a list when you need indexing, length or several passes.')}`,
      code: S`
        def fibonacci():
            a, b = 0, 1
            while True:
                yield a
                a, b = b, a + b

        def first_n(n, gen):
            for _, value in zip(range(n), gen):
                yield value

        print(list(first_n(12, fibonacci())))

        def primes():
            found = []
            n = 2
            while True:
                if all(n % p for p in found):
                    found.append(n)
                    yield n
                n += 1

        print(list(first_n(10, primes())))

        def chunks(items, size):
            for i in range(0, len(items), size):
                yield items[i:i + size]

        print(list(chunks(list("abcdefgh"), 3)))
      `,

      ] },

      body: `
<p>A <b>closure</b> is an inner function that <i>remembers</i> variables from the enclosing function, even after that outer function has finished. A <b>higher-order function</b> takes or returns other functions.</p>
${E`
def make_multiplier(factor):
    def multiply(x):
        return x * factor          # 'factor' is remembered
    return multiply

double = make_multiplier(2)
triple = make_multiplier(3)
print(double(10), triple(10))
print(double.__closure__[0].cell_contents)     # peek at the remembered value
`}
<h3>State without a class</h3>
${E`
def make_counter(start=0):
    count = start
    def increment(step=1):
        nonlocal count
        count += step
        return count
    return increment

a = make_counter()
b = make_counter(100)
print(a(), a(), a(5), b())
`}
<h3>Functions that take functions</h3>
${E`
def apply_n_times(func, n, value):
    for _ in range(n):
        value = func(value)
    return value

print(apply_n_times(lambda x: x * 2, 5, 1))      # 32

def compose(f, g):
    return lambda x: f(g(x))

add_one = lambda x: x + 1
square = lambda x: x * x
print(compose(square, add_one)(4), compose(add_one, square)(4))
`}
<h3>Configurable behaviour</h3>
${E`
def make_greeter(greeting):
    return lambda name: f"{greeting}, {name}!"

formal = make_greeter("Good evening")
casual = make_greeter("Hey")
print(formal("Dr. Abouzeid"), casual("Mai"))

def make_validator(minimum, maximum):
    def check(value):
        return minimum <= value <= maximum
    return check

is_teen = make_validator(13, 19)
print(is_teen(16), is_teen(30))
`}
<h3>The late-binding trap</h3>
${E`
funcs = [lambda: i for i in range(3)]
print([f() for f in funcs])            # [2, 2, 2]  all share the same i!

funcs = [lambda i=i: i for i in range(3)]
print([f() for f in funcs])            # [0, 1, 2]  bind the value with a default
`}
${tip('When a "class with one method" feels heavy, a closure is often enough. When the state grows, switch to a class.')}`,

            def apply(price):
                return round(price * (1 - percent / 100), 2)
            return apply

        student = make_discount(20)
        vip = make_discount(35)
        for price in [100, 49.99]:

    { id: 'py-dec', title: 'Decorators', mins: 17,
      body: `
<p>A <b>decorator</b> wraps a function to add behaviour (timing, logging, access checks, caching) without changing the function's own code. The <code>@name</code> syntax above a function is shorthand for <code>func = name(func)</code>.</p>
<h3>Your first decorator</h3>
${E`
def shout(func):
    def wrapper(*args, **kwargs):
        result = func(*args, **kwargs)
        return result.upper() + "!"
    return wrapper

@shout
def greet(name):
    return "hello " + name

print(greet("mai"))         # same as shout(greet)("mai")
`}
<h3>Keep the original name with functools.wraps</h3>
${E`
import functools

def log_calls(func):
    @functools.wraps(func)            # copies __name__ and __doc__
    def wrapper(*args, **kwargs):
        print(f"calling {func.__name__}{args}")
        result = func(*args, **kwargs)
        print(f"{func.__name__} returned {result}")
        return result
    return wrapper

@log_calls
def add(a, b):
    """Add two numbers."""
    return a + b

add(2, 3)
print(add.__name__, "-", add.__doc__)
`}
<h3>A timing decorator</h3>
${E`
import time, functools

def timed(func):
    @functools.wraps(func)
    def wrapper(*args, **kwargs):
        start = time.perf_counter()
        result = func(*args, **kwargs)
        ms = (time.perf_counter() - start) * 1000
        print(f"{func.__name__} took {ms:.2f} ms")
        return result
    return wrapper

@timed
def total(n):
    return sum(range(n))

print(total(1_000_000))
`}
<h3>Decorators with arguments</h3>
<p>Add one more level: a function that <i>returns</i> the decorator.</p>
${E`
import functools

def repeat(times):
    def decorator(func):
        @functools.wraps(func)
        def wrapper(*args, **kwargs):
            for _ in range(times):
                result = func(*args, **kwargs)
            return result
        return wrapper
    return decorator

@repeat(3)
def hello():
    print("hello")

hello()
`}
<h3>Practical examples</h3>
${E`
import functools

def require_positive(func):
    @functools.wraps(func)
    def wrapper(n):
        if n <= 0:
            raise ValueError(f"{func.__name__} needs a positive number")
        return func(n)
    return wrapper

@require_positive
def square_root(n):
    return n ** 0.5

print(square_root(16))
try:
    square_root(-4)
except ValueError as e:
    print(e)

@functools.lru_cache(maxsize=None)         # built-in caching decorator
def slow_square(n):
    print("computing", n)
    return n * n

print(slow_square(9), slow_square(9))      # the second call is cached
`}
<h3>Stacking decorators</h3>
<p>Decorators apply from the bottom up: <code>@a @b def f</code> equals <code>f = a(b(f))</code>.</p>
${tip('Built-in decorators you already met: <code>@property</code>, <code>@classmethod</code>, <code>@staticmethod</code>. Class decorators and <code>@dataclass</code> are the next step.')}
${warn('Always use <code>*args, **kwargs</code> in the wrapper so it works with any function signature, and apply <code>functools.wraps</code>.')}`,
      code: S`
        import functools

        def count_calls(func):
            @functools.wraps(func)
            def wrapper(*args, **kwargs):
                wrapper.calls += 1
                return func(*args, **kwargs)
            wrapper.calls = 0
            return wrapper

        def debug(func):
            @functools.wraps(func)
            def wrapper(*args, **kwargs):
                shown = ", ".join([repr(a) for a in args] + [f"{k}={v!r}" for k, v in kwargs.items()])
                result = func(*args, **kwargs)
                print(f"{func.__name__}({shown}) -> {result!r}")
                return result
            return wrapper

        @count_calls
        @debug
        def area(width, height=1):
            return width * height

        area(3, 4)
        area(5, height=2)
        print("area was called", area.calls, "times")
      `,
      quiz: [
        Q('What does @decorator above def f() mean?', ['f = decorator(f)', 'f = f(decorator)', 'decorator = f', 'It is a comment'], 0, 'The decorator receives the function and returns a replacement.'),
        Q('Why use functools.wraps?', ['Speed', 'To keep the wrapped function\'s name and docstring', 'To catch errors', 'It is required'], 1, 'Otherwise the wrapper hides the original metadata.'),
        Q('How do you give a decorator its own arguments (like @repeat(3))?', ['Impossible', 'Add another outer function that returns the decorator', 'Use global variables', 'Use a class only'], 1, 'repeat(3) must return the real decorator.'),
      ] },

    { id: 'py-re', title: 'Regular Expressions', mins: 17,
      body: `
<p>A <b>regular expression</b> (regex) is a compact pattern for finding and extracting text: phone numbers, e-mail addresses, dates, words. Python's <code>re</code> module implements them. Always write patterns as <b>raw strings</b> <code>r"..."</code> so backslashes are kept.</p>
<h3>The main functions</h3>
${E`
import re
text = "Call 0100-555-1234 or 0111-222-3333 today"
print(re.search(r"\d{4}-\d{3}-\d{4}", text))            # first match (or None)
print(re.findall(r"\d{4}-\d{3}-\d{4}", text))           # list of all matches
print(re.sub(r"\d", "#", text))                         # replace
print(re.split(r"[ ,]+", "a, b  c,d"))                  # split on a pattern
print(bool(re.match(r"Call", text)), bool(re.match(r"today", text)))   # match = start only
print(bool(re.fullmatch(r"\d+", "12345")))              # whole string must match
`}
<h3>Pattern building blocks</h3>
<table><tr><th>Pattern</th><th>Meaning</th></tr>
<tr><td><code>.</code></td><td>any character except newline</td></tr><tr><td><code>\\d</code> <code>\\w</code> <code>\\s</code></td><td>digit, word character, whitespace (capital = the opposite)</td></tr>
<tr><td><code>[abc]</code> <code>[a-z]</code> <code>[^0-9]</code></td><td>one of / range / not</td></tr><tr><td><code>*</code> <code>+</code> <code>?</code></td><td>0 or more / 1 or more / optional</td></tr>
<tr><td><code>{3}</code> <code>{2,4}</code></td><td>exact / range of repeats</td></tr><tr><td><code>^</code> <code>$</code></td><td>start / end of the string</td></tr><tr><td><code>\\b</code></td><td>word boundary</td></tr>
<tr><td><code>( )</code> and <code>|</code></td><td>group / or</td></tr></table>
<h3>Groups: extract parts</h3>
${E`
import re
m = re.search(r"(\d{4})-(\d{2})-(\d{2})", "Born on 2009-05-17.")
print(m.group(0), m.groups(), m.group(1))

m = re.search(r"(?P<user>[\w.]+)@(?P<domain>[\w.]+)", "mail mai.a@example.com now")
print(m.group("user"), m.group("domain"))

for found in re.finditer(r"\b[A-Z]\w+", "Alice met Bob in Cairo"):
    print(found.group(), found.start())
`}
<h3>Greedy vs lazy</h3>
${E`
import re
html = "<b>bold</b> and <i>italic</i>"
print(re.findall(r"<.+>", html))        # greedy: one giant match
print(re.findall(r"<.+?>", html))       # lazy: the shortest matches
`}
<h3>Validation examples</h3>
${E`
import re
email = re.compile(r"^[\w.+-]+@[\w-]+\.[\w.]+$")
for s in ["mai@example.com", "bad@", "a.b+c@site.org"]:
    print(s, bool(email.match(s)))

password_ok = lambda p: bool(re.fullmatch(r"(?=.*[A-Z])(?=.*\d).{8,}", p))
print(password_ok("Secret123"), password_ok("weak"))
`}
${tip('Use <code>re.compile(pattern)</code> when you reuse a pattern many times, and flags such as <code>re.IGNORECASE</code> for case-insensitive matches.')}

<p>The <code>datetime</code> module handles dates, times, differences between them and formatting.</p>
<h3>Creating dates and times</h3>

d = date(2025, 3, 15)

from datetime import date

def age(born, today=None):
    today = today or date.today()
    years = today.year - born.year
    if (today.month, today.day) < (born.month, born.day):
        years -= 1
    return years

      body: `
<p>A <b>data structure</b> organises data so that certain operations are fast and natural. Python's built-ins cover most needs, but classic structures show you how things work underneath.</p>
<h3>Stack — last in, first out (LIFO)</h3>
<p>Think of a pile of plates. <b>push</b> adds on top, <b>pop</b> removes from the top. Used for undo, bracket matching, call stacks.</p>
${E`
stack = []
stack.append("a"); stack.append("b"); stack.append("c")   # push
print(stack.pop(), stack.pop(), stack)                     # pop -> c b ['a']

def balanced(text):
    pairs = {")": "(", "]": "[", "}": "{"}
    st = []
    for ch in text:
        if ch in "([{":
            st.append(ch)
        elif ch in pairs:
            if not st or st.pop() != pairs[ch]:
                return False
    return not st

print(balanced("{[()]}"), balanced("(]"), balanced("(("))
`}
<h3>Queue — first in, first out (FIFO)</h3>
<p>Like a line at a shop. Use <code>collections.deque</code>: both ends are fast (a list is slow at the front).</p>
${E`
from collections import deque
q = deque()
q.append("Ali"); q.append("Dina"); q.append("Omar")     # enqueue
print(q.popleft(), q)                                    # dequeue -> Ali
q.appendleft("VIP")
print(list(q), len(q))
`}
<h3>Linked list</h3>
<p>A chain of <b>nodes</b>; each node stores a value and a reference to the next node. Inserting at the front is O(1).</p>
${E`
class Node:
    def __init__(self, value, next=None):
        self.value, self.next = value, next

class LinkedList:
    def __init__(self):
        self.head = None
        self.size = 0

    def push_front(self, value):
        self.head = Node(value, self.head)
        self.size += 1

    def append(self, value):
        node = Node(value)
        if not self.head:
            self.head = node
        else:
            cur = self.head
            while cur.next:
                cur = cur.next
            cur.next = node
        self.size += 1

    def __iter__(self):
        cur = self.head
        while cur:
            yield cur.value
            cur = cur.next

    def reverse(self):
        prev, cur = None, self.head
        while cur:
            cur.next, prev, cur = prev, cur, cur.next
        self.head = prev

ll = LinkedList()
for v in [3, 2, 1]:
    ll.push_front(v)
ll.append(4)
print(list(ll), ll.size)
ll.reverse()
print(list(ll))
`}
<h3>Binary search tree</h3>
<p>Each node has up to two children: smaller values go left, larger go right. Searching a balanced tree takes O(log n).</p>
${E`
class TreeNode:
    def __init__(self, key):
        self.key, self.left, self.right = key, None, None

class BST:
    def __init__(self):
        self.root = None

    def insert(self, key):
        self.root = self._insert(self.root, key)

    def _insert(self, node, key):
        if node is None:
            return TreeNode(key)
        if key < node.key:
            node.left = self._insert(node.left, key)
        elif key > node.key:
            node.right = self._insert(node.right, key)
        return node

    def contains(self, key):
        node = self.root
        while node:
            if key == node.key:
                return True
            node = node.left if key < node.key else node.right
        return False

    def inorder(self, node="start"):
        if node == "start":
            node = self.root
        if node:
            yield from self.inorder(node.left)
            yield node.key
            yield from self.inorder(node.right)

    def height(self, node="start"):
        if node == "start":
            node = self.root
        return 0 if node is None else 1 + max(self.height(node.left), self.height(node.right))

tree = BST()
for k in [50, 30, 70, 20, 40, 60, 80, 30]:
    tree.insert(k)
print(list(tree.inorder()))             # sorted order
print(tree.contains(60), tree.contains(65), tree.height())
`}
<h3>Choosing a structure</h3>
<table><tr><th>Need</th><th>Use</th></tr><tr><td>Undo / backtracking</td><td>stack (list)</td></tr><tr><td>Process in arrival order</td><td>queue (<code>deque</code>)</td></tr><tr><td>Fast key lookup</td><td>dict / set</td></tr><tr><td>Always take the smallest item</td><td>heap (<code>heapq</code>)</td></tr><tr><td>Sorted data with fast insert</td><td>tree, or <code>bisect</code> on a list</td></tr></table>
${E`
import heapq
tasks = []
for priority, name in [(3, "write"), (1, "plan"), (2, "code")]:
    heapq.heappush(tasks, (priority, name))
while tasks:
    print(heapq.heappop(tasks))
`}
${tip('In real projects reach for <code>list</code>, <code>dict</code>, <code>set</code>, <code>deque</code> and <code>heapq</code> first. Writing nodes yourself is for understanding and interviews.')}`,
      code: S`
        from collections import deque

        # 1. Reverse a word with a stack
        def reverse_word(word):
            stack = list(word)
            return "".join(stack.pop() for _ in range(len(stack)))

        print(reverse_word("stack"))

        # 2. Print queue simulation
        jobs = deque(["report.pdf", "photo.png", "notes.txt"])
        while jobs:
            print("printing", jobs.popleft(), "| waiting:", len(jobs))

        # 3. Minimal linked list
        class Node:
            def __init__(self, value):
                self.value, self.next = value, None

        head = Node("A"); head.next = Node("B"); head.next.next = Node("C")
        cur, parts = head, []
        while cur:
            parts.append(cur.value)
            cur = cur.next
        print(" -> ".join(parts))

        # 4. Postfix evaluation with a stack
        def postfix(expr):
            st = []
            for tok in expr.split():
                if tok in "+-*/":
                    b, a = st.pop(), st.pop()
                    st.append({"+": a + b, "-": a - b, "*": a * b, "/": a / b}[tok])
                else:
                    st.append(float(tok))
            return st[0]

        print(postfix("3 4 + 2 *"))
      `,
      quiz: [

        Q('In a binary search tree, where do smaller keys go?', ['Right child', 'Left child', 'Root', 'They are rejected'], 1, 'Smaller to the left, larger to the right.'),
      ] },
  ]);

          body: `
<p>C++ is a <b>compiled</b> language: a tool called the <i>compiler</i> translates your human-readable code into machine code before it runs. That makes C++ extremely fast — and a bit stricter than Python.</p>
<h3>The smallest complete program</h3>
${E`
#include <iostream>
using namespace std;

int main() {
    cout << "Hello, World!" << endl;
    return 0;
}
`}
<h3>Line by line</h3>
<ol>
<li><code>#include &lt;iostream&gt;</code> — pulls in the input/output library (gives us <code>cout</code>).</li>
<li><code>using namespace std;</code> — lets us write <code>cout</code> instead of <code>std::cout</code>.</li>
<li><code>int main()</code> — every program starts in the function called <b>main</b>. <code>int</code> means it hands back a whole number.</li>
<li><code>{ ... }</code> — curly braces mark the <b>body</b> of the function.</li>
<li><code>cout &lt;&lt; "text" &lt;&lt; endl;</code> — "put text into the output stream", then end the line. The <code>&lt;&lt;</code> arrows show the data flowing <i>into</i> cout.</li>
<li><code>return 0;</code> — tells the operating system "all went well".</li>
</ol>
<h3>Semicolons are mandatory</h3>
<p>Every statement ends with <code>;</code>. Forget one and the compiler refuses to build your program — try deleting one in the editor below and press Run to see the error message.</p>
<h3>Chaining output</h3>
${E`
cout << "Sum: " << 2 + 3 << endl;
cout << "Tab\there" << "\nNew line" << endl;
cout << "Quote: \"C++\"" << endl;
`}
<h3>Comments</h3>
${E`
// single-line comment
/* multi-line
   comment */
`}
<h3>How compiling works</h3>
<p>On your own computer you would save <code>hello.cpp</code>, then run <code>g++ hello.cpp -o hello</code> and finally <code>./hello</code>. Our editor performs that cycle for you.</p>
${tip('<code>"\\n"</code> and <code>endl</code> both start a new line. <code>"\\n"</code> is a little faster; <code>endl</code> also flushes the output buffer.')}
${warn('Mistakes C++ will not forgive: a missing <code>;</code>, unmatched <code>{ }</code>, misspelling <code>cout</code>, or forgetting <code>#include</code>.')}`,
          code: S`
            #include <iostream>
            using namespace std;

            int main() {
                cout << "Hello, World!" << endl;
                cout << "Welcome to Abouzeid's Coding School" << endl;
                cout << "3 + 4 = " << 3 + 4 << endl;
                return 0;
            }
          `,
          quiz: [
            Q('Where does every C++ program begin executing?', ['The first line of the file', 'The main function', 'The #include line', 'The last function'], 1, 'main() is the entry point.'),
            Q('What does << do in cout << "Hi"?', ['Shifts bits left', 'Sends data into the output stream', 'Compares values', 'Ends the program'], 1, 'It is the stream insertion operator.'),
            Q('What is required at the end of a statement?', ['A colon', 'A period', 'A semicolon', 'Nothing'], 2, 'C++ statements end with a semicolon.'),
          ] },
        { id: 'cpp-2', title: 'Variables, Types & Operators', mins: 16,
          body: `
<p>C++ is <b>statically typed</b>: you must say what <i>kind</i> of value a variable holds when you create it, and the type cannot change later. This lets the compiler catch many mistakes early.</p>
${E`
int age = 15;               // whole number
double price = 9.99;        // decimal number
char grade = 'A';           // ONE character, single quotes
bool passed = true;         // true or false
string name = "Sara";       // text, double quotes
`}
<h3>Common types</h3>
<table>
<tr><th>Type</th><th>Holds</th><th>Example</th></tr>
<tr><td><code>int</code></td><td>whole numbers</td><td>42</td></tr>
<tr><td><code>long long</code></td><td>very large whole numbers</td><td>9000000000</td></tr>
<tr><td><code>double</code></td><td>decimals (more precise than <code>float</code>)</td><td>3.14159</td></tr>
<tr><td><code>char</code></td><td>a single character</td><td>'x'</td></tr>
<tr><td><code>bool</code></td><td>true / false</td><td>true</td></tr>
<tr><td><code>string</code></td><td>text</td><td>"hello"</td></tr>
</table>
<h3>Operators</h3>
${E`
int a = 17, b = 5;
cout << a + b << endl;   // 22
cout << a / b << endl;   // 3   <- INTEGER division drops the decimals!
cout << a % b << endl;   // 2   remainder
cout << (double)a / b << endl;  // 3.4  cast one side to double
a += 3;  a++;  b--;      // shortcuts for a = a + 3, add 1, subtract 1
`}
${warn('<b>Integer division</b> is the classic beginner trap: <code>7 / 2</code> is <code>3</code>, not 3.5. Make at least one side a <code>double</code> (<code>7.0 / 2</code>) to get the decimal answer.')}
<h3>Constants</h3>
<p>Use <code>const</code> for values that must never change: <code>const double PI = 3.14159;</code></p>
<h3>Strings</h3>
${E`
string first = "Ada", last = "Lovelace";
string full = first + " " + last;     // + joins strings
cout << full << " has " << full.length() << " letters" << endl;
`}
<h3>Formatting decimals</h3>
${E`
#include <iomanip>
double v = 2.0 / 3;
cout << v << endl;                              // 0.666667
cout << fixed << setprecision(2) << v << endl;  // 0.67
`}
${tip('Prefer <code>double</code> over <code>float</code>, and <code>int</code> unless you need more range. Initialise variables when you declare them — an uninitialised variable holds garbage.')}
${trick('<code>auto x = 5;</code> lets the compiler deduce the type for you (here <code>int</code>).')}`,
          code: S`
            #include <iostream>
            #include <iomanip>
            using namespace std;

            int main() {
                string item = "pencil";
                double price = 1.25;
                int quantity = 6;
                double total = price * quantity;
                cout << quantity << " " << item << "s cost " << fixed << setprecision(2) << total << endl;

                int a = 7, b = 2;
                cout << "7 / 2 = " << a / b << endl;
                cout << "7.0 / 2 = " << (double)a / b << endl;
                cout << "7 % 2 = " << a % b << endl;
                return 0;

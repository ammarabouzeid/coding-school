new Student("Dina");
new Student("Omar");
System.out.println(Student.count + " students at " + Student.SCHOOL);
`}
<h3>Static methods</h3>
<p>A static method does not need an object. It <b>cannot</b> use <code>this</code> or instance fields directly (there is no current object).</p>
${E`
class MathUtil {
    static int square(int x) { return x * x; }
    static boolean isPrime(int n) {
        if (n < 2) return false;
        for (int d = 2; d * d <= n; d++) if (n % d == 0) return false;
        return true;
    }
    static double average(double... values) {
        double sum = 0;
        for (double v : values) sum += v;
        return values.length == 0 ? 0 : sum / values.length;
    }
}
System.out.println(MathUtil.square(9) + " " + MathUtil.isPrime(97) + " " + MathUtil.average(3, 4, 8));
System.out.println(Math.sqrt(144) + " " + Math.max(3, 9) + " " + Integer.parseInt("42"));
`}
<h3>Why main is static</h3>
<p>The JVM starts your program before any object exists, so <code>main</code> must be callable on the class: <code>public static void main(String[] args)</code>.</p>
<h3>Instance vs static: who can call whom?</h3>
<table><tr><th></th><th>can use instance members</th><th>can use static members</th></tr><tr><td>instance method</td><td>yes</td><td>yes</td></tr><tr><td>static method</td><td>no (needs an object)</td><td>yes</td></tr></table>
${X`
class Demo {
    int value = 5;
    static void test() {
        // System.out.println(value);        // ERROR: non-static variable value cannot be referenced from a static context
        Demo d = new Demo();
        System.out.println(d.value);          // fine: through an object
    }
}
`}
<h3>Static initialisation block</h3>
${E`
class Config {
    static final int[] PRIMES;
    static {                                  // runs once, when the class is first used
        PRIMES = new int[5];
        int found = 0, n = 2;
        while (found < 5) {
            boolean prime = true;
            for (int d = 2; d * d <= n; d++) if (n % d == 0) prime = false;
            if (prime) PRIMES[found++] = n;
            n++;
        }
    }
}
System.out.println(Arrays.toString(Config.PRIMES));
`}
<h3>Patterns using static</h3>
${E`
class IdGenerator {
    private static int next = 1;
    private IdGenerator() {}                  // nobody can create instances
    static int newId() { return next++; }
}
System.out.println(IdGenerator.newId() + " " + IdGenerator.newId() + " " + IdGenerator.newId());

class Logger {                                // a simple singleton: only one instance ever
    private static Logger instance;
    private int lines = 0;
    private Logger() {}
    static Logger getInstance() {
        if (instance == null) instance = new Logger();
        return instance;
    }
    void log(String msg) { lines++; System.out.println("[" + lines + "] " + msg); }
}
Logger.getInstance().log("first");
Logger.getInstance().log("second");
System.out.println(Logger.getInstance() == Logger.getInstance());
`}
${tip('Use static for constants (<code>static final</code>), utility methods that need no object state, and counters shared by every instance. Overusing static makes code hard to test.')}`,
      code: S`
        class Counter {
            private static int totalCreated = 0;
            private int id;
            private int clicks;

            Counter() {
                totalCreated++;
                id = totalCreated;
            }
            void click() { clicks++; }
            int getClicks() { return clicks; }
            int getId() { return id; }
            static int getTotalCreated() { return totalCreated; }
        }

        class Temperature {
            static double toFahrenheit(double c) { return c * 9 / 5 + 32; }
            static double toCelsius(double f) { return (f - 32) * 5 / 9; }
        }

        public class Main {
            public static void main(String[] args) {
                Counter a = new Counter();
                Counter b = new Counter();
                a.click(); a.click(); a.click();
                b.click();
                System.out.println("counter " + a.getId() + ": " + a.getClicks() + " clicks");
                System.out.println("counter " + b.getId() + ": " + b.getClicks() + " clicks");
                System.out.println("counters created: " + Counter.getTotalCreated());
                System.out.println("100 C = " + Temperature.toFahrenheit(100) + " F");
                System.out.println("212 F = " + Temperature.toCelsius(212) + " C");
            }
        }
      `,
      quiz: [
        Q('How many copies of a static field exist?', ['One per object', 'One for the whole class', 'One per method', 'None'], 1, 'Static members are shared.'),
        Q('Why is main declared static?', ['Style', 'The JVM calls it before any object exists', 'To save memory', 'Because it returns void'], 1, 'No instance is available at startup.'),
        Q('Can a static method use an instance field directly?', ['Yes', 'No, it needs an object reference', 'Only if private', 'Only if final'], 1, 'There is no this inside a static method.'),
      ] },

    { id: 'java-inh', title: 'Inheritance', mins: 19,
      body: `
<p><b>Inheritance</b> lets a new class (the <b>subclass</b> or child) reuse and extend an existing class (the <b>superclass</b> or parent) with the keyword <code>extends</code>. It expresses an <b>"is-a"</b> relationship: a Dog <i>is an</i> Animal.</p>
${E`
class Animal {
    protected String name;
    Animal(String name) { this.name = name; }
    void eat()   { System.out.println(name + " is eating"); }
    void sleep() { System.out.println(name + " is sleeping"); }
}

class Dog extends Animal {
    Dog(String name) {
        super(name);                       // call the parent constructor
    }
    void fetch() { System.out.println(name + " fetches the ball"); }
}

Dog d = new Dog("Rex");
d.eat();            // inherited from Animal
d.sleep();
d.fetch();          // Dog's own method
`}
<h3>super(...) and the constructor chain</h3>
<p>When you create a subclass object, the <b>parent constructor runs first</b>. If you do not call <code>super(...)</code> yourself, Java inserts <code>super()</code> (the no-argument one) for you.</p>
${E`
class A {
    A() { System.out.println("A constructor"); }
}
class B extends A {
    B() { System.out.println("B constructor"); }
}
class C extends B {
    C() { System.out.println("C constructor"); }
}
new C();
`}
<h3>Multilevel inheritance</h3>
${E`
class Vehicle   { void move() { System.out.println("moving"); } }
class Car extends Vehicle { void honk() { System.out.println("beep"); } }
class SportsCar extends Car { void turbo() { System.out.println("whoosh"); } }
SportsCar s = new SportsCar();
s.move(); s.honk(); s.turbo();
`}
<h3>What is inherited?</h3>
<ul><li>Public and protected members (and package-private within the same package).</li><li><b>Not</b> private members (they exist in the object but the child cannot access them directly).</li><li><b>Not</b> constructors (but they can be called with <code>super</code>).</li></ul>
<h3>instanceof and the Object class</h3>
<p>Every class extends <code>Object</code> automatically; that is where <code>toString</code>, <code>equals</code> and <code>hashCode</code> come from.</p>
${E`
class Person { }
class Student extends Person { }
Student s = new Student();
System.out.println(s instanceof Student);
System.out.println(s instanceof Person);
System.out.println(s instanceof Object);
Person p = new Person();
System.out.println(p instanceof Student);
`}
<h3>A practical hierarchy</h3>
${E`
class Employee {
    protected String name;
    protected double baseSalary;
    Employee(String name, double baseSalary) { this.name = name; this.baseSalary = baseSalary; }
    double pay() { return baseSalary; }
    public String toString() { return name + " earns " + pay(); }
}
class Manager extends Employee {
    private double bonus;
    Manager(String name, double baseSalary, double bonus) { super(name, baseSalary); this.bonus = bonus; }
    @Override double pay() { return baseSalary + bonus; }
}
class Intern extends Employee {
    Intern(String name) { super(name, 800); }
}
Employee[] staff = { new Employee("Ali", 3000), new Manager("Dina", 5000, 1500), new Intern("Omar") };
double total = 0;
for (Employee e : staff) {
    System.out.println(e);
    total += e.pay();
}
System.out.println("payroll: " + total);
`}
${warn('Java allows only <b>single inheritance</b> of classes (one parent). To combine several abilities use <b>interfaces</b>. Use inheritance only for true "is-a" relationships; for "has-a", put an object inside as a field (<b>composition</b>).')}
${tip('<code>final class X</code> cannot be extended (like <code>String</code>); <code>final</code> methods cannot be overridden.')}`,
      code: S`
        class Shape {
            protected String color;
            Shape(String color) { this.color = color; }
            double area() { return 0; }
            public String toString() { return color + " " + getClass().getSimpleName() + " with area " + String.format("%.2f", area()); }
        }

        class Circle extends Shape {
            private double radius;
            Circle(String color, double radius) { super(color); this.radius = radius; }
            @Override double area() { return Math.PI * radius * radius; }
        }

        class Rectangle extends Shape {
            protected double w, h;
            Rectangle(String color, double w, double h) { super(color); this.w = w; this.h = h; }
            @Override double area() { return w * h; }
        }

        class Square extends Rectangle {
            Square(String color, double side) { super(color, side, side); }
        }

        public class Main {
            public static void main(String[] args) {
                Shape[] shapes = { new Circle("red", 1.5), new Rectangle("blue", 3, 4), new Square("green", 2.5) };
                double total = 0;
                for (Shape s : shapes) {
                    System.out.println(s);
                    total += s.area();
                }
                System.out.printf("total area: %.2f%n", total);
                System.out.println(shapes[2] instanceof Rectangle);
                System.out.println(shapes[0] instanceof Rectangle);
            }
        }
      `,
      quiz: [
        Q('Which keyword makes a class inherit from another?', ['implements', 'extends', 'inherits', 'super'], 1, 'class Dog extends Animal.'),
        Q('Which constructor runs first when creating a subclass object?', ['The subclass constructor', 'The superclass constructor', 'Neither', 'Random'], 1, 'The parent part is built first.'),
        Q('How many direct parent classes can a Java class have?', ['One', 'Two', 'Any number', 'Zero'], 0, 'Java has single inheritance of classes.'),
      ] },

    { id: 'java-over', title: 'Method Overriding & super', mins: 16,
      body: `
<p><b>Overriding</b> means a subclass provides its <b>own version</b> of a method it inherited, with the <b>same name and parameters</b>. When you call the method on a subclass object, the subclass version runs.</p>
${E`
class Animal {
    void speak() { System.out.println("some generic animal sound"); }
}
class Dog extends Animal {
    @Override
    void speak() { System.out.println("Woof!"); }
}
class Cat extends Animal {
    @Override
    void speak() { System.out.println("Meow!"); }
}
new Animal().speak();
new Dog().speak();
new Cat().speak();
`}
<p>Always add <code>@Override</code>. If you misspell the name or get the parameters wrong, the compiler reports an error instead of silently creating an unrelated method.</p>
<h3>Calling the parent version with super</h3>
${E`
class Greeter {
    String greet(String name) { return "Hello, " + name; }
}
class LoudGreeter extends Greeter {
    @Override
    String greet(String name) {
        return super.greet(name).toUpperCase() + "!!!";
    }
}
System.out.println(new Greeter().greet("Mai"));
System.out.println(new LoudGreeter().greet("Mai"));
`}
<h3>Overriding toString, equals and hashCode</h3>
${E`
class Point {
    int x, y;
    Point(int x, int y) { this.x = x; this.y = y; }
    @Override public String toString() { return "(" + x + ", " + y + ")"; }
}
Point p = new Point(3, 4);
System.out.println(p);
System.out.println("point: " + p);
`}
<h3>Overriding rules</h3>
<ul>
<li>Same method name and the same parameter list.</li>
<li>The return type must be the same (or a <i>subtype</i>: a "covariant" return).</li>
<li>The access level may stay the same or become <b>wider</b> (never narrower).</li>
<li><code>static</code>, <code>private</code> and <code>final</code> methods cannot be overridden.</li>
<li>It may not throw broader <i>checked</i> exceptions than the parent.</li>
</ul>
<h3>Overriding vs overloading</h3>
<table><tr><th></th><th>Overloading</th><th>Overriding</th></tr><tr><td>Where</td><td>same class</td><td>parent and child</td></tr><tr><td>Signature</td><td>different parameters</td><td>identical parameters</td></tr><tr><td>Resolved</td><td>at compile time</td><td>at run time (by the real object type)</td></tr></table>
<h3>final methods and classes</h3>
${X`
class Account {
    final void audit() { System.out.println("auditing..."); }    // subclasses cannot override this
}
final class Secret { }                                           // cannot be extended
`}
<h3>Constructors are not overridden</h3>
<p>Each class has its own constructors; the subclass calls the parent's through <code>super(...)</code>.</p>
${E`
class Appliance {
    int watts;
    Appliance(int watts) { this.watts = watts; }
    String describe() { return "an appliance of " + watts + " W"; }
}
class Lamp extends Appliance {
    boolean on;
    Lamp(int watts, boolean on) { super(watts); this.on = on; }
    @Override String describe() { return "a lamp (" + super.describe() + "), " + (on ? "on" : "off"); }
}
System.out.println(new Lamp(40, true).describe());
`}
${tip('When overriding, ask: should I <b>replace</b> the behaviour completely or <b>extend</b> it? To extend, call <code>super.method()</code> first (or last) and add your own steps.')}`,
      code: S`
        class Employee {
            protected String name;
            protected double salary;
            Employee(String name, double salary) { this.name = name; this.salary = salary; }
            double yearlyPay() { return salary * 12; }
            String role() { return "employee"; }
            @Override public String toString() { return name + " (" + role() + "): " + yearlyPay(); }
        }

        class Developer extends Employee {
            Developer(String name, double salary) { super(name, salary); }
            @Override String role() { return "developer"; }
        }

        class Manager extends Employee {
            private int teamSize;
            Manager(String name, double salary, int teamSize) { super(name, salary); this.teamSize = teamSize; }
            @Override double yearlyPay() { return super.yearlyPay() + teamSize * 1000; }
            @Override String role() { return "manager of " + teamSize; }
        }

        public class Main {
            public static void main(String[] args) {
                Employee[] team = { new Employee("Ali", 2000), new Developer("Dina", 3500), new Manager("Omar", 5000, 6) };
                double payroll = 0;
                for (Employee e : team) {
                    System.out.println(e);
                    payroll += e.yearlyPay();
                }
                System.out.println("yearly payroll: " + payroll);
            }
        }
      `,
      quiz: [
        Q('What does @Override do?', ['Makes a method faster', 'Asks the compiler to check that the method really overrides a parent method', 'Hides the method', 'Calls the parent method'], 1, 'It catches typos and signature mismatches.'),
        Q('How do you call the parent version of an overridden method?', ['parent.method()', 'super.method()', 'this.super()', 'base.method()'], 1, 'Use super.'),
        Q('Which method can NOT be overridden?', ['public', 'protected', 'final', 'abstract'], 2, 'final methods are fixed.'),
      ] },

    { id: 'java-poly', title: 'Polymorphism & Dynamic Dispatch', mins: 17,
      body: `
<p><b>Polymorphism</b> ("many forms") means one reference type can refer to objects of many actual types, and a method call runs the version belonging to the <b>actual object</b>, decided at <b>run time</b>. This is called <b>dynamic dispatch</b> (or late binding).</p>
${E`
class Animal {
    void speak() { System.out.println("..."); }
}
class Dog extends Animal { @Override void speak() { System.out.println("Woof"); } }
class Cat extends Animal { @Override void speak() { System.out.println("Meow"); } }
class Cow extends Animal { @Override void speak() { System.out.println("Moo"); } }

Animal a = new Dog();        // parent-type variable, child object (upcasting)
a.speak();                   // Woof: decided by the real object
a = new Cat();
a.speak();                   // Meow

Animal[] farm = { new Dog(), new Cat(), new Cow(), new Animal() };
for (Animal x : farm) x.speak();
`}
<h3>Why it matters: write code once, extend forever</h3>
${E`
abstract class Shape { abstract double area(); }
class Circle extends Shape {
    double r; Circle(double r) { this.r = r; }
    double area() { return Math.PI * r * r; }
}
class Square extends Shape {
    double s; Square(double s) { this.s = s; }
    double area() { return s * s; }
}
class Triangle extends Shape {
    double b, h; Triangle(double b, double h) { this.b = b; this.h = h; }
    double area() { return 0.5 * b * h; }
}

static double totalArea(Shape[] shapes) {         // knows nothing about specific shapes
    double sum = 0;
    for (Shape s : shapes) sum += s.area();
    return sum;
}
Shape[] all = { new Circle(1), new Square(2), new Triangle(3, 4) };
System.out.printf("%.2f%n", totalArea(all));
`}
<p>Add a <code>Pentagon</code> tomorrow and <code>totalArea</code> works without a single change.</p>
<h3>Polymorphic parameters and lists</h3>
${E`
class Notifier {
    void send(String msg) { System.out.println("generic: " + msg); }
}
class EmailNotifier extends Notifier { @Override void send(String msg) { System.out.println("email: " + msg); } }
class SmsNotifier   extends Notifier { @Override void send(String msg) { System.out.println("sms: " + msg); } }

static void alert(Notifier n) { n.send("server is down"); }
alert(new EmailNotifier());
alert(new SmsNotifier());

ArrayList<Notifier> channels = new ArrayList<>();
channels.add(new EmailNotifier());
channels.add(new SmsNotifier());
for (Notifier n : channels) n.send("backup finished");
`}
<h3>Upcasting and downcasting</h3>
<p><b>Upcasting</b> (child → parent) is automatic and safe. <b>Downcasting</b> (parent → child) needs a cast and can fail, so check with <code>instanceof</code> first.</p>
${E`
class Animal { }
class Dog extends Animal { void fetch() { System.out.println("fetching"); } }
class Cat extends Animal { }

Animal a = new Dog();
// a.fetch();                  // compile error: Animal has no fetch()
if (a instanceof Dog) {
    Dog d = (Dog) a;           // downcast
    d.fetch();
}
Animal c = new Cat();
System.out.println(c instanceof Dog);       // false: casting would throw ClassCastException
`}
<h3>Fields are NOT polymorphic</h3>
<p>Only <b>instance methods</b> are dispatched dynamically. Field access and static methods use the <i>declared</i> type of the variable.</p>
${tip('Polymorphism is the heart of object-oriented design: depend on the <b>general</b> type (<code>Shape</code>, <code>List</code>, <code>Comparable</code>), not on a specific class.')}`,
      code: S`
        abstract class Payment {
            protected double amount;
            Payment(double amount) { this.amount = amount; }
            abstract double fee();
            abstract String method();
            void receipt() {
                System.out.printf("%-14s amount %8.2f  fee %6.2f  total %8.2f%n", method(), amount, fee(), amount + fee());
            }
        }

        class CardPayment extends Payment {
            CardPayment(double a) { super(a); }
            double fee() { return amount * 0.03; }
            String method() { return "credit card"; }
        }

        class CashPayment extends Payment {
            CashPayment(double a) { super(a); }
            double fee() { return 0; }
            String method() { return "cash"; }
        }

        class TransferPayment extends Payment {
            TransferPayment(double a) { super(a); }
            double fee() { return 2.5; }
            String method() { return "bank transfer"; }
        }

        public class Main {
            public static void main(String[] args) {
                Payment[] payments = { new CardPayment(200), new CashPayment(50), new TransferPayment(1000) };
                double fees = 0;
                for (Payment p : payments) {
                    p.receipt();
                    fees += p.fee();
                }
                System.out.println("fees collected: " + fees);
            }
        }
      `,
      quiz: [
        Q('When is the method version chosen in a polymorphic call?', ['At compile time', 'At run time, based on the actual object', 'At install time', 'Never'], 1, 'This is dynamic dispatch.'),
        Q('What must you check before downcasting?', ['The method name', 'instanceof', 'The file size', 'Nothing'], 1, 'Otherwise a wrong cast throws ClassCastException.'),
        Q('Animal a = new Dog(); a.speak(); runs…', ['Animal.speak always', 'Dog.speak (if overridden)', 'Neither', 'Both'], 1, 'The object\'s real type decides.'),
      ] },

    { id: 'java-abs', title: 'Abstract Classes & Methods', mins: 15,
      body: `
<p>Sometimes a parent class is only a <b>concept</b>: "a shape", "an employee". It makes no sense to create a bare <code>Shape</code>. An <b>abstract class</b> (declared with <code>abstract</code>) cannot be instantiated; it exists to be extended. It may contain <b>abstract methods</b>: signatures with <b>no body</b> that every concrete child <b>must</b> implement.</p>
${E`
abstract class Shape {
    String name;
    Shape(String name) { this.name = name; }

    abstract double area();                    // no body: children decide
    abstract double perimeter();

    void describe() {                          // normal, shared method
        System.out.printf("%s: area %.2f, perimeter %.2f%n", name, area(), perimeter());
    }
}

class Rectangle extends Shape {
    double w, h;
    Rectangle(double w, double h) { super("rectangle"); this.w = w; this.h = h; }
    double area() { return w * h; }
    double perimeter() { return 2 * (w + h); }
}
class Circle extends Shape {
    double r;
    Circle(double r) { super("circle"); this.r = r; }
    double area() { return Math.PI * r * r; }
    double perimeter() { return 2 * Math.PI * r; }
}

// Shape s = new Shape("x");        // ERROR: Shape is abstract; cannot be instantiated
Shape[] list = { new Rectangle(3, 4), new Circle(1.5) };
for (Shape s : list) s.describe();
`}
<h3>Rules</h3>
<ul><li>A class with <b>any</b> abstract method must itself be declared <code>abstract</code>.</li><li>A subclass must implement <b>all</b> inherited abstract methods, or be declared abstract too.</li><li>Abstract classes can have fields, constructors, and ordinary methods.</li><li>Abstract methods cannot be <code>private</code>, <code>static</code> or <code>final</code>.</li></ul>
<h3>The template method pattern</h3>
<p>An abstract class can define the <b>skeleton</b> of an algorithm, leaving certain steps to subclasses:</p>
${E`
abstract class Report {
    void generate() {                         // the fixed recipe
        System.out.println("--- " + title() + " ---");
        System.out.println(body());
        System.out.println("(" + footer() + ")");
    }
    abstract String title();
    abstract String body();
    String footer() { return "generated automatically"; }     // optional step
}
class SalesReport extends Report {
    String title() { return "Sales"; }
    String body() { return "Total sold: 1,250 items"; }
}
class StaffReport extends Report {
    String title() { return "Staff"; }
    String body() { return "42 employees"; }
    @Override String footer() { return "confidential"; }
}
new SalesReport().generate();
new StaffReport().generate();
`}
<h3>Abstract class or interface?</h3>
<table><tr><th></th><th>Abstract class</th><th>Interface</th></tr><tr><td>Fields with state</td><td>yes</td><td>only constants</td></tr><tr><td>Constructors</td><td>yes</td><td>no</td></tr><tr><td>Inherit from several</td><td>no (one parent)</td><td>yes (implement many)</td></tr><tr><td>Best for</td><td>closely related classes sharing code</td><td>unrelated classes sharing a <i>capability</i></td></tr></table>`,
      code: S`
        abstract class Employee {
            protected String name;
            Employee(String name) { this.name = name; }
            abstract double monthlyPay();
            String payslip() { return String.format("%-8s %10.2f", name, monthlyPay()); }
        }

        class Salaried extends Employee {
            private double yearly;
            Salaried(String name, double yearly) { super(name); this.yearly = yearly; }
            double monthlyPay() { return yearly / 12; }
        }

        class Hourly extends Employee {
            private double rate; private int hours;
            Hourly(String name, double rate, int hours) { super(name); this.rate = rate; this.hours = hours; }
            double monthlyPay() { return rate * hours; }
        }

        class Commission extends Employee {
            private double base, sales;
            Commission(String name, double base, double sales) { super(name); this.base = base; this.sales = sales; }
            double monthlyPay() { return base + sales * 0.05; }
        }

        public class Main {
            public static void main(String[] args) {
                Employee[] staff = { new Salaried("Ali", 60000), new Hourly("Dina", 18.5, 160), new Commission("Omar", 1500, 40000) };
                double total = 0;
                for (Employee e : staff) {
                    System.out.println(e.payslip());
                    total += e.monthlyPay();
                }
                System.out.printf("%-8s %10.2f%n", "TOTAL", total);
            }
        }
      `,
      quiz: [
        Q('Can you create an object of an abstract class with new?', ['Yes', 'No', 'Only if it has a constructor', 'Only inside main'], 1, 'Abstract classes cannot be instantiated.'),
        Q('What must a concrete subclass do with inherited abstract methods?', ['Ignore them', 'Implement all of them', 'Delete them', 'Make them private'], 1, 'Otherwise it must be abstract too.'),
        Q('Which can an abstract class have that an interface (traditionally) cannot?', ['Constants', 'Constructors and instance fields', 'Methods', 'Static methods'], 1, 'Abstract classes can hold state.'),
      ] },

    { id: 'java-iface', title: 'Interfaces', mins: 19,
      body: `
<p>An <b>interface</b> is a pure <b>contract</b>: it lists methods a class promises to provide, without saying how. A class <b>implements</b> an interface with the keyword <code>implements</code>. Unlike inheritance, a class can implement <b>many</b> interfaces.</p>
${E`
interface Flyable {
    void fly();                          // implicitly public abstract
}
interface Swimmable {
    void swim();
}

class Duck implements Flyable, Swimmable {
    public void fly()  { System.out.println("duck flies low"); }
    public void swim() { System.out.println("duck paddles"); }
}
class Plane implements Flyable {
    public void fly() { System.out.println("plane flies high"); }
}

Flyable[] things = { new Duck(), new Plane() };
for (Flyable f : things) f.fly();
Swimmable s = new Duck();
s.swim();
`}
<p>Methods implementing an interface must be <code>public</code>, because interface methods are public.</p>
<h3>Interfaces as types</h3>
<p>An interface name can be used as a variable, parameter or return type. Any object whose class implements it fits.</p>
${E`
interface Logger {
    void log(String message);
}
class ConsoleLogger implements Logger {
    public void log(String message) { System.out.println("[console] " + message); }
}
class PrefixLogger implements Logger {
    private final String prefix;
    PrefixLogger(String prefix) { this.prefix = prefix; }
    public void log(String message) { System.out.println("[" + prefix + "] " + message); }
}
static void process(Logger logger) {          // works with ANY logger
    logger.log("starting");
    logger.log("done");
}
process(new ConsoleLogger());
process(new PrefixLogger("db"));
`}
<h3>Constants, default and static methods</h3>
<p>Since Java 8 an interface can also provide a ready-made <code>default</code> method (an implementation classes inherit unless they override it) and <code>static</code> helper methods. Fields in an interface are always <code>public static final</code> constants.</p>
${E`
interface Greeter {
    String PREFIX = "Hello, ";                       // constant
    String getName();                                 // abstract: must implement

    default String greet() {                          // default method
        return PREFIX + getName() + "!";
    }
    static Greeter of(String n) {                     // static factory
        return () -> n;
    }
}
class Person implements Greeter {
    public String getName() { return "Mai"; }
}
System.out.println(new Person().greet());
System.out.println(Greeter.of("Omar").greet());
System.out.println(Greeter.PREFIX.length());
`}
<h3>Interface inheritance</h3>
${E`
interface Readable { String read(); }
interface Writable { void write(String data); }
interface Storage extends Readable, Writable {         // an interface can extend several
    default void copyFrom(Storage other) { write(other.read()); }
}
class Memory implements Storage {
    private String data = "";
    public String read() { return data; }
    public void write(String d) { data = d; }
}
Memory a = new Memory(), b = new Memory();
a.write("hello interfaces");
b.copyFrom(a);
System.out.println(b.read());
`}
<h3>Common interfaces from the library</h3>
<table><tr><th>Interface</th><th>Method</th><th>Use</th></tr><tr><td><code>Comparable&lt;T&gt;</code></td><td><code>compareTo(T)</code></td><td>natural ordering for sorting</td></tr><tr><td><code>Runnable</code></td><td><code>run()</code></td><td>a task</td></tr><tr><td><code>Comparator&lt;T&gt;</code></td><td><code>compare(a, b)</code></td><td>custom ordering</td></tr><tr><td><code>Iterable&lt;T&gt;</code></td><td><code>iterator()</code></td><td>works in a for-each loop</td></tr></table>
${tip('"Program to an interface": declare <code>List&lt;String&gt; names = new ArrayList&lt;&gt;();</code> not <code>ArrayList&lt;String&gt; names</code>. You can swap the implementation without touching the rest of the code.')}`,
      code: S`
        interface Playable {
            void play();
            default void playTwice() { play(); play(); }
        }

        interface Recordable {
            String record();
        }

        class Song implements Playable, Recordable {
            private final String title;
            Song(String title) { this.title = title; }
            public void play() { System.out.println("playing song: " + title); }
            public String record() { return "recorded " + title; }
        }

        class Podcast implements Playable {
            private final String show; private final int episode;
            Podcast(String show, int episode) { this.show = show; this.episode = episode; }
            public void play() { System.out.println("playing " + show + " episode " + episode); }
        }

        public class Main {
            static void playAll(Playable[] items) {
                for (Playable p : items) p.play();
            }

            public static void main(String[] args) {
                Playable[] playlist = { new Song("Sunrise"), new Podcast("Code Talk", 12), new Song("Night Drive") };
                playAll(playlist);
                playlist[1].playTwice();
                Song s = new Song("Echo");
                Recordable r = s;
                System.out.println(r.record());
                System.out.println(s instanceof Playable);
                System.out.println(playlist[1] instanceof Recordable);
            }
        }
      `,
      quiz: [
        Q('Which keyword makes a class follow an interface?', ['extends', 'implements', 'uses', 'inherits'], 1, 'class Duck implements Flyable.'),
        Q('How many interfaces can a class implement?', ['One', 'Two', 'Any number', 'None'], 2, 'A class can implement many interfaces.'),
        Q('What are interface fields automatically?', ['private', 'public static final', 'protected', 'abstract'], 1, 'They are constants.'),
        Q('What is a default method?', ['A method that always runs', 'An interface method that has a body classes inherit', 'A private method', 'A constructor'], 1, 'Introduced in Java 8.'),
      ] },

    { id: 'java-nest', title: 'Nested & Inner Classes', mins: 13,
      body: `
<p>Java lets you define a class <b>inside</b> another class. Use it when the inner class has no purpose outside its outer class, to keep related code together and hide helpers.</p>
<h3>Static nested class</h3>
<p>A <code>static</code> nested class is just a normal class that lives in the outer class's namespace. It does not need an outer object.</p>
${E`
class Library {
    private String name;
    Library(String name) { this.name = name; }

    static class Book {                         // static nested class
        String title;
        int pages;
        Book(String title, int pages) { this.title = title; this.pages = pages; }
        public String toString() { return title + " (" + pages + ")"; }
    }
}
Library.Book b = new Library.Book("Dune", 612);
System.out.println(b);
`}
<h3>Inner (non-static) class</h3>
<p>An <b>inner class</b> belongs to one <i>instance</i> of the outer class and can use the outer object's members. It is ideal for helper objects that are meaningless without their owner (a <code>Node</code> of a list, an <code>Iterator</code> of a collection).</p>
${X`
class Bank {
    private double total = 0;

    class Account {                             // inner class: can see Bank.this.total
        private double balance;
        void deposit(double amount) {
            balance += amount;
            total += amount;                    // updates the outer object
        }
    }
    double getTotal() { return total; }
}

Bank bank = new Bank();
Bank.Account a1 = bank.new Account();           // needs an outer instance
Bank.Account a2 = bank.new Account();
a1.deposit(100);
a2.deposit(50);
System.out.println(bank.getTotal());            // 150.0
`}
<h3>A linked list with a nested Node class</h3>
${E`
class LinkedStack {
    private static class Node {
        int value;
        Node next;
        Node(int value, Node next) { this.value = value; this.next = next; }
    }

    private Node top;
    private int size;

    void push(int v) { top = new Node(v, top); size++; }
    int pop() {
        int v = top.value;
        top = top.next;
        size--;
        return v;
    }
    boolean isEmpty() { return top == null; }
    int size() { return size; }
}
LinkedStack s = new LinkedStack();
s.push(1); s.push(2); s.push(3);
System.out.println(s.pop() + " " + s.pop() + " " + s.size());
`}
<h3>Local and anonymous classes</h3>
<p>You can declare a class inside a method (a <b>local class</b>) or create a one-off, nameless subclass/implementation right where you need it (an <b>anonymous class</b>). Lambdas have largely replaced anonymous classes for single-method interfaces.</p>
${X`
Runnable task = new Runnable() {                 // anonymous class
    @Override
    public void run() { System.out.println("running"); }
};
task.run();

Comparator<String> byLength = new Comparator<String>() {
    public int compare(String a, String b) { return a.length() - b.length(); }
};
`}
<h3>Summary</h3>
<table><tr><th>Kind</th><th>Needs outer instance?</th><th>Typical use</th></tr><tr><td>Static nested</td><td>no</td><td>helper type: <code>Node</code>, <code>Entry</code>, <code>Builder</code></td></tr><tr><td>Inner</td><td>yes</td><td>object tightly tied to its owner</td></tr><tr><td>Local</td><td>-</td><td>helper inside one method</td></tr><tr><td>Anonymous</td><td>-</td><td>one-off implementation</td></tr></table>
${tip('Default to <b>static nested</b> classes. Make a nested class non-static only when it genuinely needs the outer object.')}
${warn('The browser simulator runs static nested classes. Inner classes that reach into the outer object, local classes and anonymous classes need a real Java compiler, so those examples are read-only.')}`,
      code: S`
        class Playlist {
            private final String name;
            private final java.util.ArrayList<Track> tracks = new java.util.ArrayList<>();

            Playlist(String name) { this.name = name; }

            static class Track {
                final String title;
                final int seconds;
                Track(String title, int seconds) { this.title = title; this.seconds = seconds; }
                String length() { return seconds / 60 + ":" + (seconds % 60 < 10 ? "0" : "") + seconds % 60; }
            }

            void add(String title, int seconds) { tracks.add(new Track(title, seconds)); }

            int totalSeconds() {
                int sum = 0;
                for (Track t : tracks) sum += t.seconds;
                return sum;
            }

            void show() {
                System.out.println("Playlist: " + name);
                for (Track t : tracks) System.out.println("  " + t.title + " [" + t.length() + "]");
                int total = totalSeconds();
                System.out.println("  total " + total / 60 + " min " + total % 60 + " s");
            }
        }

        public class Main {
            public static void main(String[] args) {
                Playlist p = new Playlist("Study mix");
                p.add("Focus", 215);
                p.add("Flow state", 187);
                p.add("Deep work", 302);
                p.show();
                Playlist.Track single = new Playlist.Track("Bonus", 61);
                System.out.println(single.title + " lasts " + single.length());
            }
        }
      `,
      quiz: [
        Q('Which nested class needs no instance of the outer class?', ['Inner class', 'static nested class', 'Anonymous class', 'Local class'], 1, 'static nested classes are independent of outer instances.'),
        Q('Why nest a Node class inside a LinkedList class?', ['It is required', 'It is only meaningful as part of the list and can be hidden', 'It makes it faster', 'Java forbids top-level Node'], 1, 'It keeps implementation details private.'),
        Q('What does an anonymous class lack?', ['Methods', 'A name', 'A body', 'An interface'], 1, 'It is declared and instantiated in one expression without a name.'),
      ] },

    { id: 'java-enum', title: 'Enums', mins: 15,
      body: `
<p>An <b>enum</b> (enumeration) is a special class with a fixed set of named instances. Use it for "one of these values" ideas: days, directions, card suits, order states. The compiler then rejects invalid values.</p>
${E`
enum Day { MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY }

Day today = Day.WEDNESDAY;
System.out.println(today);                       // WEDNESDAY
System.out.println(today.name() + " " + today.ordinal());       // WEDNESDAY 2
System.out.println(today == Day.WEDNESDAY);
System.out.println(today.compareTo(Day.FRIDAY));                // negative: comes earlier
for (Day d : Day.values()) System.out.print(d.ordinal() + ":" + d + " ");
System.out.println();
Day parsed = Day.valueOf("SUNDAY");
System.out.println(parsed);
`}
<h3>enum with switch</h3>
${E`
enum Level { LOW, MEDIUM, HIGH }

Level level = Level.MEDIUM;
switch (level) {
    case LOW:
        System.out.println("relax");
        break;
    case MEDIUM:
        System.out.println("keep going");
        break;
    case HIGH:
        System.out.println("act now");
        break;
}
String text = switch (level) {
    case LOW -> "green";
    case MEDIUM -> "orange";
    case HIGH -> "red";
};
System.out.println(text);
`}
<h3>Enums with fields, constructors and methods</h3>
<p>An enum is a class: it can hold data. Each constant calls the constructor.</p>
${E`
enum Planet {
    MERCURY(3.303e+23, 2.4397e6),
    EARTH(5.976e+24, 6.37814e6),
    MARS(6.421e+23, 3.3972e6);

    private final double mass;
    private final double radius;

    Planet(double mass, double radius) {
        this.mass = mass;
        this.radius = radius;
    }
    double getRadius() { return radius; }
    double surfaceGravity() { return 6.67300E-11 * mass / (radius * radius); }
}
for (Planet p : Planet.values())
    System.out.printf("%-8s gravity %.2f m/s2%n", p, p.surfaceGravity());
`}
${E`
enum Size {
    SMALL("S", 1.0), MEDIUM("M", 1.5), LARGE("L", 2.0);

    private final String code;
    private final double factor;
    Size(String code, double factor) { this.code = code; this.factor = factor; }

    String getCode() { return code; }
    double price(double base) { return base * factor; }
}
for (Size s : Size.values())
    System.out.println(s + " (" + s.getCode() + "): " + s.price(4.0));
`}
<h3>Why enums beat constants</h3>
${X`
// Without an enum: any int is accepted, even nonsense
static final int RED = 0, GREEN = 1, BLUE = 2;
void paint(int color) { ... }
paint(42);                 // compiles, but is meaningless

// With an enum: only a real Color is allowed
void paint(Color color) { ... }
paint(Color.RED);          // paint(42) would not compile
`}
<h3>Useful facts</h3>
<ul><li>Enums are implicitly <code>final</code> and extend <code>java.lang.Enum</code>.</li><li>Compare enum values with <code>==</code> (they are singletons).</li><li>Enums can implement interfaces and have methods per constant.</li><li>Enum constructors are always private.</li></ul>
${tip('<code>EnumMap</code> and <code>EnumSet</code> are fast collections designed for enum keys.')}`,
      code: S`
        enum OrderStatus {
            PLACED("Order received", false),
            PACKED("Being packed", false),
            SHIPPED("On its way", false),
            DELIVERED("Delivered", true),
            CANCELLED("Cancelled", true);

            private final String message;
            private final boolean finalState;

            OrderStatus(String message, boolean finalState) {
                this.message = message;
                this.finalState = finalState;
            }
            String getMessage() { return message; }
            boolean isFinal() { return finalState; }

            OrderStatus next() {
                if (finalState) return this;
                return values()[ordinal() + 1];
            }
        }

        public class Main {
            public static void main(String[] args) {
                OrderStatus status = OrderStatus.PLACED;
                while (true) {
                    System.out.println(status + ": " + status.getMessage());
                    if (status.isFinal()) break;
                    status = status.next();
                }
                System.out.println("all states: " + java.util.Arrays.toString(OrderStatus.values()));
                System.out.println(OrderStatus.valueOf("SHIPPED").ordinal());
            }
        }
      `,
      quiz: [
        Q('What does Day.valueOf("SUNDAY") return?', ['A String', 'The enum constant Day.SUNDAY', 'An int', 'null'], 1, 'valueOf finds the constant by name.'),
        Q('How should you compare two enum values?', ['equals() only', '==', 'compareString', '='], 1, '== is safe because constants are singletons.'),
        Q('What does ordinal() return?', ['The name', 'The position in the declaration (starting at 0)', 'The hash code', 'The length'], 1, 'It is the zero-based position.'),
      ] },

    { id: 'java-obj', title: 'The Object Class: toString, equals & hashCode', mins: 18,
      body: `
<p>Every class in Java extends <code>java.lang.Object</code>, directly or indirectly. That is why every object has methods such as <code>toString()</code>, <code>equals()</code>, <code>hashCode()</code> and <code>getClass()</code>. The defaults are rarely what you want, so good classes <b>override</b> them.</p>
<h3>toString</h3>
${E`
class Plain { int x = 1; }
class Nice {
    int x = 1;
    @Override public String toString() { return "Nice[x=" + x + "]"; }
}
System.out.println(new Nice());                          // Nice[x=1]
System.out.println("value: " + new Nice());
System.out.println(new Plain().toString().startsWith("Plain@"));   // default: ClassName@hash
`}
<h3>equals: same content, not same object</h3>
<p>The default <code>equals</code> is just <code>==</code> (same object). For value-like classes you want "same data = equal".</p>
${E`
class Point {
    final int x, y;
    Point(int x, int y) { this.x = x; this.y = y; }

    @Override
    public boolean equals(Object o) {
        if (this == o) return true;
        if (o == null || getClass() != o.getClass()) return false;
        Point other = (Point) o;
        return x == other.x && y == other.y;
    }
    @Override
    public int hashCode() { return Objects.hash(x, y); }
    @Override
    public String toString() { return "(" + x + ", " + y + ")"; }
}
Point a = new Point(1, 2), b = new Point(1, 2), c = new Point(5, 5);
System.out.println(a == b);              // false: two objects
System.out.println(a.equals(b));         // true: same content
System.out.println(a.equals(c) + " " + a.equals(null));
`}
<h3>The equals / hashCode contract</h3>
<ul><li>If <code>a.equals(b)</code> then <code>a.hashCode() == b.hashCode()</code>.</li><li>Always override <b>both together</b>.</li><li>Hash-based collections (<code>HashMap</code>, <code>HashSet</code>) depend on it:</li></ul>
${E`
class Person {
    final String name; final int age;
    Person(String name, int age) { this.name = name; this.age = age; }
    @Override public boolean equals(Object o) {
        if (!(o instanceof Person)) return false;
        Person p = (Person) o;
        return age == p.age && name.equals(p.name);
    }
    @Override public int hashCode() { return Objects.hash(name, age); }
    @Override public String toString() { return name + "/" + age; }
}
Set<Person> people = new HashSet<>();
people.add(new Person("Ali", 20));
people.add(new Person("Ali", 20));         // equal to the first: ignored
people.add(new Person("Dina", 22));
System.out.println(people.size());
System.out.println(people.contains(new Person("Dina", 22)));
Map<Person, String> roles = new HashMap<>();
roles.put(new Person("Ali", 20), "captain");
System.out.println(roles.get(new Person("Ali", 20)));
`}
<h3>getClass and instanceof</h3>
${E`
String s = "hello";
Object o = s;
System.out.println(o.getClass().getSimpleName());
System.out.println(o instanceof String);
System.out.println(o instanceof Comparable);
System.out.println(new int[0].getClass() == new int[5].getClass());
`}
<h3>The == vs equals recap</h3>
<table><tr><th></th><th><code>==</code></th><th><code>equals()</code></th></tr><tr><td>primitives</td><td>compares values</td><td>(not available)</td></tr><tr><td>objects</td><td>same object?</td><td>same content? (if overridden)</td></tr></table>
${tip('IDEs and <code>record</code> types (Java 16+) can generate <code>equals</code>, <code>hashCode</code> and <code>toString</code> for you. Understand them first, then let tools write them.')}
${warn('Never use a mutable field in <code>hashCode</code> for objects stored in a <code>HashSet</code>/<code>HashMap</code> key: if it changes, the object can no longer be found.')}`,
      code: S`
        import java.util.*;

        class Card {
            private final String rank, suit;
            Card(String rank, String suit) { this.rank = rank; this.suit = suit; }

            @Override public boolean equals(Object o) {
                if (this == o) return true;
                if (o == null || getClass() != o.getClass()) return false;
                Card c = (Card) o;
                return rank.equals(c.rank) && suit.equals(c.suit);
            }
            @Override public int hashCode() { return Objects.hash(rank, suit); }
            @Override public String toString() { return rank + " of " + suit; }
        }

        public class Main {
            public static void main(String[] args) {
                Card a = new Card("Ace", "Spades");
                Card b = new Card("Ace", "Spades");
                Card c = new Card("King", "Hearts");
                System.out.println(a + " == " + b + " ? " + (a == b));
                System.out.println(a + " equals " + b + " ? " + a.equals(b));
                System.out.println("same hash: " + (a.hashCode() == b.hashCode()));

                Set<Card> hand = new HashSet<>();
                hand.add(a); hand.add(b); hand.add(c);
                System.out.println("distinct cards in hand: " + hand.size());
                System.out.println("hand contains new Ace of Spades? " + hand.contains(new Card("Ace", "Spades")));
            }
        }
      `,
      quiz: [
        Q('What does the default equals() compare?', ['Field values', 'Object identity (same object)', 'The class name', 'Nothing'], 1, 'Object.equals is the same as ==.'),
        Q('If you override equals, what else should you override?', ['toString only', 'hashCode', 'getClass', 'finalize'], 1, 'Equal objects must have equal hash codes.'),
        Q('Which methods does every class inherit from Object?', ['print and read', 'toString, equals, hashCode', 'add and remove', 'start and stop'], 1, 'Among others (getClass, notify, wait …).'),
      ] },

    { id: 'java-exc', title: 'Exception Handling: try, catch, finally', mins: 20,
      body: `
<p>When something goes wrong at run time, Java <b>throws an exception</b>: an object that describes the problem. If nobody catches it, the program stops and prints a <b>stack trace</b>. With <code>try / catch</code> you handle the problem and keep the program running.</p>
${E`
int[] numbers = {1, 2, 3};
try {
    System.out.println(numbers[5]);           // throws
    System.out.println("never printed");
} catch (ArrayIndexOutOfBoundsException e) {
    System.out.println("Oops: " + e.getMessage());
}
System.out.println("the program continues");
`}
<h3>The exception hierarchy</h3>
<p>All exceptions derive from <code>Throwable</code>:</p>
<table><tr><th>Branch</th><th>Meaning</th></tr><tr><td><code>Error</code></td><td>serious JVM problems (<code>OutOfMemoryError</code>, <code>StackOverflowError</code>); do not catch</td></tr><tr><td><code>Exception</code> (checked)</td><td>conditions you must handle or declare: <code>IOException</code>, custom checked exceptions</td></tr><tr><td><code>RuntimeException</code> (unchecked)</td><td>programming mistakes: <code>NullPointerException</code>, <code>ArithmeticException</code>, <code>IllegalArgumentException</code></td></tr></table>
<h3>Common exceptions</h3>
${E`
try { System.out.println(10 / 0); }
catch (ArithmeticException e) { System.out.println("ArithmeticException: " + e.getMessage()); }

try { Integer.parseInt("abc"); }
catch (NumberFormatException e) { System.out.println("NumberFormatException: " + e.getMessage()); }

try { Object o = "text"; Integer i = (Integer) o; }
catch (ClassCastException e) { System.out.println("ClassCastException"); }

try { new ArrayList<Integer>().get(0); }
catch (IndexOutOfBoundsException e) { System.out.println("IndexOutOfBoundsException: " + e.getMessage()); }

try { String s = null; System.out.println(s.length()); }
catch (NullPointerException e) { System.out.println("NullPointerException"); }
`}
<h3>Multiple catch blocks</h3>
<p>The <b>first matching</b> catch block runs. Put specific exceptions before general ones (<code>Exception</code> last).</p>
${E`
static void test(String text, int index) {
    try {
        int n = Integer.parseInt(text);
        int[] data = {10, 20, 30};
        System.out.println(data[index] / n);
    } catch (NumberFormatException e) {
        System.out.println("'" + text + "' is not a number");
    } catch (ArithmeticException e) {
        System.out.println("cannot divide by zero");
    } catch (ArrayIndexOutOfBoundsException e) {
        System.out.println("bad index " + index);
    } catch (Exception e) {
        System.out.println("something else: " + e);
    }
}
test("2", 1); test("abc", 0); test("0", 0); test("5", 9);
`}
<h3>Catching several types in one block</h3>
${E`
try {
    int x = Integer.parseInt("12x");
} catch (NumberFormatException | NullPointerException e) {
    System.out.println("invalid input: " + e.getClass().getSimpleName());
}
`}
<h3>finally: always runs</h3>
<p>The <code>finally</code> block runs whether or not an exception happened, even when you <code>return</code> early. Use it for cleanup.</p>
${E`
static int attempt(int divisor) {
    try {
        return 100 / divisor;
    } catch (ArithmeticException e) {
        System.out.println("division failed");
        return -1;
    } finally {
        System.out.println("finally runs for divisor " + divisor);
    }
}
System.out.println(attempt(5));
System.out.println(attempt(0));
`}
<h3>Input validation loop</h3>
${E`
String[] inputs = {"abc", "-5", "12"};
int accepted = -1;
for (String text : inputs) {
    try {
        int n = Integer.parseInt(text);
        if (n < 0) throw new IllegalArgumentException("must be positive");
        accepted = n;
        break;
    } catch (NumberFormatException e) {
        System.out.println(text + ": not a number, try again");
    } catch (IllegalArgumentException e) {
        System.out.println(text + ": " + e.getMessage() + ", try again");
    }
}
System.out.println("accepted " + accepted);
`}
${warn('Never write an empty <code>catch</code> block. Swallowing exceptions hides bugs. At least log the message.')}
${tip('Catch exceptions where you can <i>do something useful</i> about them. Otherwise let them travel up to a method that can.')}`,
      code: S`
        public class Main {
            static double divide(int a, int b) {
                return (double) a / b;       // note: double division, never throws for ints
            }

            static int parseAndDivide(String a, String b) {
                int x = Integer.parseInt(a);
                int y = Integer.parseInt(b);
                return x / y;
            }

            public static void main(String[] args) {
                String[][] cases = { {"20", "4"}, {"20", "0"}, {"x", "4"}, {"7", ""} };
                for (String[] c : cases) {
                    try {
                        System.out.println(c[0] + " / " + c[1] + " = " + parseAndDivide(c[0], c[1]));
                    } catch (ArithmeticException e) {
                        System.out.println(c[0] + " / " + c[1] + ": division by zero");
                    } catch (NumberFormatException e) {
                        System.out.println(c[0] + " / " + c[1] + ": invalid number (" + e.getMessage() + ")");
                    } finally {
                        System.out.println("  -- finished case");
                    }
                }
                int[] arr = new int[2];
                try {
                    arr[2] = 5;
                } catch (ArrayIndexOutOfBoundsException e) {
                    System.out.println("array problem: " + e.getMessage());
                }
            }
        }
      `,
      quiz: [
        Q('When does the finally block run?', ['Only if an exception occurred', 'Only if no exception occurred', 'Always', 'Never'], 2, 'finally is for cleanup and always executes.'),
        Q('Which should come first in a list of catch blocks?', ['Exception', 'The most specific type', 'Throwable', 'It does not matter'], 1, 'A general catch first would hide the specific ones (the compiler rejects it).'),
        Q('Which is an unchecked exception?', ['IOException', 'FileNotFoundException', 'NullPointerException', 'Exception itself'], 2, 'RuntimeException subclasses are unchecked.'),
      ] },

    { id: 'java-throw', title: 'throw, throws, Custom Exceptions & try-with-resources', mins: 20,
      body: `
<h3>throw: raise an exception yourself</h3>
${E`
static void setAge(int age) {
    if (age < 0 || age > 130) {
        throw new IllegalArgumentException("age must be 0-130, got " + age);
    }
    System.out.println("age set to " + age);
}
setAge(25);
try {
    setAge(-4);
} catch (IllegalArgumentException e) {
    System.out.println("rejected: " + e.getMessage());
}
`}
<h3>Checked vs unchecked</h3>
<ul><li><b>Unchecked</b> (<code>RuntimeException</code> and subclasses): the compiler does not force you to handle them.</li><li><b>Checked</b> (other <code>Exception</code> subclasses): the compiler <b>forces</b> you either to catch them or to declare them with <code>throws</code> in the method signature.</li></ul>
${E`
static void risky(boolean fail) throws Exception {        // declares: callers must handle it
    if (fail) throw new Exception("something checked went wrong");
    System.out.println("risky() succeeded");
}
try {
    risky(false);
    risky(true);
} catch (Exception e) {
    System.out.println("caught: " + e.getMessage());
}
`}
<h3>Custom exceptions</h3>
<p>Extend <code>Exception</code> (checked) or <code>RuntimeException</code> (unchecked). Provide constructors that pass the message to <code>super</code>.</p>
${E`
class InsufficientFundsException extends Exception {
    private final double shortBy;
    public InsufficientFundsException(String message, double shortBy) {
        super(message);
        this.shortBy = shortBy;
    }
    public double getShortBy() { return shortBy; }
}

class Account {
    private double balance;
    Account(double balance) { this.balance = balance; }
    void withdraw(double amount) throws InsufficientFundsException {
        if (amount > balance)
            throw new InsufficientFundsException("balance too low", amount - balance);
        balance -= amount;
    }
    double getBalance() { return balance; }
}

Account acct = new Account(100);
try {
    acct.withdraw(60);
    acct.withdraw(80);
} catch (InsufficientFundsException e) {
    System.out.println(e.getMessage() + ", short by " + e.getShortBy());
}
System.out.println("balance: " + acct.getBalance());
`}
<h3>Exception hierarchies</h3>
${E`
class AppException extends RuntimeException {
    AppException(String m) { super(m); }
}
class ValidationException extends AppException {
    ValidationException(String m) { super("validation: " + m); }
}
class StorageException extends AppException {
    StorageException(String m) { super("storage: " + m); }
}
for (int i = 0; i < 3; i++) {
    try {
        if (i == 0) throw new ValidationException("name is empty");
        if (i == 1) throw new StorageException("disk full");
        System.out.println("ok");
    } catch (ValidationException e) {
        System.out.println("fix your input -> " + e.getMessage());
    } catch (AppException e) {
        System.out.println("general app error -> " + e.getMessage());
    }
}
`}
<h3>Chaining: keep the original cause</h3>
${E`
static void load() {
    try {
        Integer.parseInt("not a number");
    } catch (NumberFormatException e) {
        throw new IllegalStateException("configuration is broken", e);     // wrap, keep the cause
    }
}
try {
    load();
} catch (IllegalStateException e) {
    System.out.println(e.getMessage());
    System.out.println("caused by: " + e.getCause().getClass().getSimpleName());
}
`}
<h3>try-with-resources: automatic cleanup</h3>
<p>Resources that implement <code>AutoCloseable</code> are closed automatically at the end of the <code>try</code>, even if an exception is thrown. No <code>finally</code> needed.</p>
${E`
class Connection implements AutoCloseable {
    private final String name;
    Connection(String name) { this.name = name; System.out.println("open " + name); }
    void query() { System.out.println("querying " + name); }
    @Override public void close() { System.out.println("close " + name); }
}
try (Connection a = new Connection("db1"); Connection b = new Connection("db2")) {
    a.query();
    b.query();
    throw new RuntimeException("crash in the middle");
} catch (RuntimeException e) {
    System.out.println("handled: " + e.getMessage());
}
`}
<p>Resources are closed in <b>reverse</b> order of opening. Typical resources: <code>Scanner</code>, <code>FileReader</code>, <code>BufferedWriter</code>, database connections.</p>
${tip('Use <b>unchecked</b> exceptions for programming errors (bad arguments, wrong state) and <b>checked</b> exceptions for recoverable external problems (missing file, network down).')}
${warn('Do not use exceptions for normal control flow, and never catch <code>Throwable</code> or <code>Error</code> casually.')}`,
      code: S`
        class InvalidMoveException extends Exception {
            public InvalidMoveException(String message) { super(message); }
        }

        class Board {
            private final char[] cells = new char[9];
            Board() { java.util.Arrays.fill(cells, '.'); }

            void place(char player, int position) throws InvalidMoveException {
                if (position < 0 || position > 8) throw new InvalidMoveException("position " + position + " is off the board");
                if (cells[position] != '.') throw new InvalidMoveException("cell " + position + " is already taken");
                cells[position] = player;
            }
            void print() {
                for (int i = 0; i < 9; i += 3) System.out.println(cells[i] + " " + cells[i + 1] + " " + cells[i + 2]);
            }
        }

        public class Main {
            public static void main(String[] args) {
                Board board = new Board();
                int[] moves = {4, 0, 4, 11, 8};
                char player = 'X';
                for (int move : moves) {
                    try {
                        board.place(player, move);
                        System.out.println(player + " played " + move);
                        player = (player == 'X') ? 'O' : 'X';
                    } catch (InvalidMoveException e) {
                        System.out.println("invalid move: " + e.getMessage());
                    }
                }
                board.print();
            }
        }
      `,
      quiz: [
        Q('What does the throws clause do?', ['Throws the exception', 'Declares that the method may throw a (checked) exception', 'Catches an exception', 'Ends the program'], 1, 'Callers must then handle or re-declare it.'),
        Q('Which keyword actually raises an exception?', ['throws', 'throw', 'raise', 'catch'], 1, 'throw new SomeException(...).'),
        Q('What does try-with-resources guarantee?', ['Faster code', 'Resources are closed automatically', 'No exceptions occur', 'Thread safety'], 1, 'AutoCloseable.close() is called at the end.'),
      ] },

    { id: 'java-list', title: 'ArrayList & LinkedList', mins: 19,
      body: `
<p>An array has a fixed size. The <b>Collections Framework</b> (package <code>java.util</code>) provides resizable containers. The most used is <code>ArrayList</code>, a growable array. <code>List</code> is the <b>interface</b>; <code>ArrayList</code> and <code>LinkedList</code> are implementations.</p>
${E`
ArrayList<String> names = new ArrayList<>();       // <String> = this list holds Strings (generics)
names.add("Ali");
names.add("Dina");
names.add("Omar");
names.add(1, "Layla");                              // insert at an index
System.out.println(names);                          // [Ali, Layla, Dina, Omar]
System.out.println(names.get(2) + " " + names.size());
names.set(0, "Aly");                                // replace
names.remove("Dina");                               // remove by value
names.remove(0);                                    // remove by index
System.out.println(names + " " + names.contains("Omar") + " " + names.indexOf("Omar") + " " + names.isEmpty());
`}
<h3>Lists hold objects: use wrapper types</h3>
${E`
ArrayList<Integer> nums = new ArrayList<>();        // not int!
nums.add(10); nums.add(20); nums.add(30); nums.add(20);
int sum = 0;
for (int n : nums) sum += n;                        // auto-unboxing
System.out.println(sum + " " + nums.lastIndexOf(20));
nums.remove(Integer.valueOf(20));                   // remove the VALUE 20 (first match)
System.out.println(nums);
nums.remove(0);                                     // remove the ELEMENT AT INDEX 0
System.out.println(nums);
`}
${warn('For <code>List&lt;Integer&gt;</code>, <code>list.remove(2)</code> removes the element at <b>index</b> 2. To remove the <b>value</b> 2 write <code>list.remove(Integer.valueOf(2))</code>.')}
<h3>Looping</h3>
${E`
List<String> fruits = new ArrayList<>(List.of("apple", "kiwi", "plum"));
for (int i = 0; i < fruits.size(); i++) System.out.print(fruits.get(i) + " ");
System.out.println();
for (String f : fruits) System.out.print(f.toUpperCase() + " ");
System.out.println();
fruits.forEach(f -> System.out.print(f.length() + " "));
System.out.println();
`}
<h3>Bulk operations and sorting</h3>
${E`
List<Integer> a = new ArrayList<>(Arrays.asList(5, 2, 9, 1));
List<Integer> b = new ArrayList<>(List.of(7, 8));
a.addAll(b);
Collections.sort(a);
System.out.println(a);
a.sort(Collections.reverseOrder());
System.out.println(a);
System.out.println(Collections.max(a) + " " + Collections.min(a));
Collections.reverse(a);
System.out.println(a + " " + a.subList(1, 3));
a.removeIf(n -> n % 2 == 0);
System.out.println(a);
a.clear();
System.out.println(a.size());
`}
<h3>LinkedList</h3>
<p>A <code>LinkedList</code> is a chain of nodes. Adding or removing at the <b>ends</b> is fast; getting the <i>n</i>-th element is slow (it must walk the chain). It also acts as a queue or deque.</p>
${E`
LinkedList<String> queue = new LinkedList<>();
queue.add("b");
queue.addFirst("a");
queue.addLast("c");
System.out.println(queue + " " + queue.getFirst() + " " + queue.getLast());
queue.removeFirst();
System.out.println(queue.peek() + " " + queue.size());
`}
<h3>ArrayList or LinkedList?</h3>
<table><tr><th></th><th>ArrayList</th><th>LinkedList</th></tr><tr><td>get(i)</td><td>fast</td><td>slow</td></tr><tr><td>add/remove at the end</td><td>fast</td><td>fast</td></tr><tr><td>add/remove at the start/middle</td><td>slow (shifts items)</td><td>fast at the ends</td></tr></table>
${tip('Choose <code>ArrayList</code> by default. Declare variables with the interface type: <code>List&lt;String&gt; names = new ArrayList&lt;&gt;();</code>.')}`,
      code: S`
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<String> todo = new ArrayList<>();
                todo.add("buy milk");
                todo.add("learn Java");
                todo.add("walk the dog");
                todo.add("call Mai");
                System.out.println("tasks: " + todo.size());

                todo.remove("walk the dog");
                todo.add(0, "wake up");
                Collections.sort(todo);
                for (int i = 0; i < todo.size(); i++) System.out.println((i + 1) + ". " + todo.get(i));

                List<Integer> scores = new ArrayList<>(Arrays.asList(72, 95, 58, 88, 95, 64));
                int total = 0;
                for (int s : scores) total += s;
                System.out.println("average: " + (double) total / scores.size());
                System.out.println("highest: " + Collections.max(scores) + ", lowest: " + Collections.min(scores));
                scores.removeIf(s -> s < 70);
                System.out.println("passed: " + scores);
                Set<Integer> distinct = new TreeSet<>(scores);
                System.out.println("distinct sorted: " + distinct);
            }
        }
      `,
      quiz: [
        Q('Which creates a list of Strings?', ['ArrayList<String> l = new ArrayList<>();', 'ArrayList l = new String[];', 'String list = new ArrayList();', 'List<int> l;'], 0, 'Generics use the wrapper/object type in angle brackets.'),
        Q('What does list.remove(Integer.valueOf(3)) do for a List<Integer>?', ['Removes index 3', 'Removes the first element equal to 3', 'Adds 3', 'Throws'], 1, 'The Integer argument selects remove(Object).'),
        Q('Which method returns the number of elements in a list?', ['length()', 'size()', 'count()', 'length'], 1, 'Arrays use .length; collections use size().'),
      ] },

    { id: 'java-map', title: 'HashMap, LinkedHashMap & TreeMap', mins: 19,
      body: `
<p>A <b>Map</b> stores <b>key → value</b> pairs. Keys are unique. Looking up by key is very fast. Think of a phone book: name → number.</p>
<table><tr><th>Class</th><th>Order of keys</th><th>Speed</th></tr><tr><td><code>HashMap</code></td><td>no guaranteed order</td><td>O(1) average</td></tr><tr><td><code>LinkedHashMap</code></td><td>insertion order</td><td>O(1)</td></tr><tr><td><code>TreeMap</code></td><td>sorted by key</td><td>O(log n)</td></tr></table>
${E`
Map<String, Integer> ages = new HashMap<>();
ages.put("Ali", 20);
ages.put("Dina", 22);
ages.put("Omar", 19);
ages.put("Ali", 21);                         // replaces the old value
System.out.println(ages.get("Dina") + " " + ages.get("Zed") + " " + ages.size());
System.out.println(ages.containsKey("Omar") + " " + ages.containsValue(22));
System.out.println(ages.getOrDefault("Zed", -1));
ages.remove("Omar");
System.out.println(ages.size());
`}
<h3>Iterating</h3>
${E`
Map<String, Integer> stock = new LinkedHashMap<>();       // keeps insertion order
stock.put("apples", 12);
stock.put("pears", 0);
stock.put("plums", 7);
for (String key : stock.keySet()) System.out.print(key + " ");
System.out.println();
for (int qty : stock.values()) System.out.print(qty + " ");
System.out.println();
for (Map.Entry<String, Integer> e : stock.entrySet())
    System.out.println(e.getKey() + " -> " + e.getValue());
stock.forEach((k, v) -> System.out.print(k + "=" + v + ";"));
System.out.println();
`}
<h3>TreeMap: sorted</h3>
${E`
TreeMap<String, Double> prices = new TreeMap<>();
prices.put("tea", 1.5);
prices.put("apple", 0.5);
prices.put("coffee", 2.25);
System.out.println(prices);                                   // sorted by key
System.out.println(prices.firstKey() + " " + prices.lastKey());
System.out.println(prices.firstEntry().getValue());
`}
<h3>Counting with a map</h3>
${E`
String text = "to be or not to be that is the question";
Map<String, Integer> freq = new TreeMap<>();
for (String word : text.split(" ")) {
    freq.put(word, freq.getOrDefault(word, 0) + 1);
}
System.out.println(freq);
Map<Character, Integer> letters = new TreeMap<>();
for (char c : "mississippi".toCharArray()) letters.merge(c, 1, Integer::sum);
System.out.println(letters);
`}
<h3>Helpful methods</h3>
${E`
Map<String, List<String>> groups = new TreeMap<>();
groups.computeIfAbsent("fruit", k -> new ArrayList<>()).add("apple");
groups.computeIfAbsent("fruit", k -> new ArrayList<>()).add("kiwi");
groups.computeIfAbsent("veg", k -> new ArrayList<>()).add("carrot");
System.out.println(groups);

Map<String, Integer> m = new HashMap<>();
m.putIfAbsent("a", 1);
m.putIfAbsent("a", 99);                       // ignored: key exists
m.merge("a", 10, Integer::sum);               // 1 + 10
System.out.println(m);
`}
${warn('Keys of a <code>HashMap</code> should be <b>immutable</b> and must implement <code>equals</code>/<code>hashCode</code> consistently (strings and wrapper types already do). Do not rely on the iteration order of a HashMap.')}
${tip('<code>Map.of("a", 1, "b", 2)</code> creates a small immutable map in one line (Java 9+).')}`,
      code: S`
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                String text = "the cat saw the dog and the dog saw the cat";
                Map<String, Integer> counts = new TreeMap<>();
                for (String w : text.split(" ")) counts.merge(w, 1, Integer::sum);
                System.out.println("word counts: " + counts);

                String best = null;
                int most = 0;
                for (Map.Entry<String, Integer> e : counts.entrySet()) {
                    if (e.getValue() > most) { most = e.getValue(); best = e.getKey(); }
                }
                System.out.println("most common: " + best + " (" + most + ")");

                Map<String, String> capitals = new LinkedHashMap<>();
                capitals.put("Egypt", "Cairo");
                capitals.put("Japan", "Tokyo");
                capitals.put("Brazil", "Brasilia");
                for (String country : capitals.keySet())
                    System.out.println(country + " -> " + capitals.get(country));
                System.out.println("capital of Peru: " + capitals.getOrDefault("Peru", "unknown"));

                Map<Integer, List<String>> byLength = new TreeMap<>();
                for (String w : new TreeSet<>(Arrays.asList(text.split(" "))))
                    byLength.computeIfAbsent(w.length(), k -> new ArrayList<>()).add(w);
                System.out.println("grouped by length: " + byLength);
            }
        }
      `,
      quiz: [
        Q('What does map.get(key) return when the key is missing?', ['0', 'null', 'An exception', 'An empty string'], 1, 'get returns null; getOrDefault lets you choose.'),
        Q('Which map keeps keys sorted?', ['HashMap', 'TreeMap', 'LinkedHashMap', 'Hashtable only'], 1, 'TreeMap orders by key.'),
        Q('What does put do if the key already exists?', ['Throws', 'Replaces the old value', 'Ignores the new value', 'Stores two values'], 1, 'Keys are unique, so the value is replaced.'),
      ] },

    { id: 'java-set', title: 'Sets: HashSet, LinkedHashSet & TreeSet', mins: 14,
      body: `
<p>A <b>Set</b> is a collection with <b>no duplicates</b>. Adding an item that is already present does nothing. Sets are ideal for removing duplicates and for fast "is it in here?" checks.</p>
<table><tr><th>Class</th><th>Order</th></tr><tr><td><code>HashSet</code></td><td>not guaranteed</td></tr><tr><td><code>LinkedHashSet</code></td><td>insertion order</td></tr><tr><td><code>TreeSet</code></td><td>sorted</td></tr></table>
${E`
Set<String> colors = new HashSet<>();
System.out.println(colors.add("red"));       // true: added
System.out.println(colors.add("green"));
System.out.println(colors.add("red"));       // false: duplicate ignored
System.out.println(colors.size() + " " + colors.contains("green") + " " + colors.contains("pink"));
colors.remove("red");
System.out.println(colors.size());
`}
<h3>Removing duplicates from a list</h3>
${E`
List<Integer> numbers = Arrays.asList(5, 3, 5, 1, 3, 9, 1);
Set<Integer> unique = new LinkedHashSet<>(numbers);      // keeps first-seen order
Set<Integer> sorted = new TreeSet<>(numbers);            // sorted
System.out.println(unique);
System.out.println(sorted);
List<Integer> back = new ArrayList<>(sorted);
System.out.println(back.size());
`}
<h3>Set mathematics</h3>
${E`
Set<Integer> a = new TreeSet<>(Arrays.asList(1, 2, 3, 4));
Set<Integer> b = new TreeSet<>(Arrays.asList(3, 4, 5, 6));

Set<Integer> union = new TreeSet<>(a);
union.addAll(b);                          // a ∪ b

Set<Integer> intersection = new TreeSet<>(a);
intersection.retainAll(b);                // a ∩ b

Set<Integer> difference = new TreeSet<>(a);
difference.removeAll(b);                  // a - b

System.out.println(union + " " + intersection + " " + difference);
System.out.println(a.containsAll(Arrays.asList(1, 2)));
`}
<h3>TreeSet extras</h3>
${E`
TreeSet<Integer> scores = new TreeSet<>(Arrays.asList(70, 85, 92, 60, 78));
System.out.println(scores.first() + " " + scores.last());
System.out.println(scores.floor(80) + " " + scores.ceiling(80));      // closest below / above
System.out.println(scores.headSet(78) + " " + scores.tailSet(85));
System.out.println(scores.higher(92));                                // null: nothing larger
`}
<h3>Practical examples</h3>
${E`
String[] visits = {"home", "about", "home", "blog", "about", "home"};
Set<String> seen = new LinkedHashSet<>();
for (String page : visits) {
    if (!seen.add(page)) System.out.println(page + " (repeat visit)");
}
System.out.println("distinct pages: " + seen);

String text = "programming";
Set<Character> letters = new TreeSet<>();
for (char c : text.toCharArray()) letters.add(c);
System.out.println(letters);
`}
${tip('<code>add()</code> returns <code>true</code> only if the set changed, so <code>if (!set.add(x))</code> is a neat duplicate detector.')}
${warn('For your own classes, <code>HashSet</code> needs correct <code>equals</code> and <code>hashCode</code>; <code>TreeSet</code> needs <code>Comparable</code> (or a <code>Comparator</code>).')}`,
      code: S`
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                String[] morning = {"Ali", "Sara", "Omar", "Ali"};
                String[] evening = {"Sara", "Noor", "Omar", "Layla"};

                Set<String> am = new TreeSet<>(Arrays.asList(morning));
                Set<String> pm = new TreeSet<>(Arrays.asList(evening));
                System.out.println("morning (no duplicates): " + am);

                Set<String> both = new TreeSet<>(am);
                both.retainAll(pm);
                Set<String> either = new TreeSet<>(am);
                either.addAll(pm);
                Set<String> onlyMorning = new TreeSet<>(am);
                onlyMorning.removeAll(pm);

                System.out.println("came both times: " + both);
                System.out.println("came at least once: " + either);
                System.out.println("only in the morning: " + onlyMorning);

                Set<Integer> lottery = new TreeSet<>();
                int[] draw = {17, 4, 42, 4, 8, 17, 23};
                for (int n : draw) {
                    if (!lottery.add(n)) System.out.println(n + " was drawn twice");
                }
                System.out.println("unique numbers: " + lottery);
            }
        }

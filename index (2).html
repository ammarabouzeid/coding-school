    { id: 'cpp-struct', title: 'Structures (struct)', mins: 15,
      body: `
<p>An array holds many values of <i>one</i> type. A <b>structure</b> groups values of <i>different</i> types into one new type, so related data travels together.</p>
${E`
struct Student {
    string name;
    int age;
    double gpa;
};

Student s1;
s1.name = "Mai";
s1.age = 16;
s1.gpa = 3.8;
cout << s1.name << " is " << s1.age << " with GPA " << s1.gpa << endl;

Student s2 = {"Omar", 17, 3.2};            // aggregate initialisation, in member order
Student s3{"Dina", 15, 3.95};              // brace initialisation
cout << s2.name << " " << s3.name << endl;
`}
<h3>Structures are values: copying</h3>
<p>Assigning one structure to another copies every member. The copy is independent.</p>
${E`
struct Point { int x, y; };
Point a = {3, 4};
Point b = a;            // copy
b.x = 100;
cout << a.x << " " << b.x << endl;     // 3 100
`}
<h3>Arrays and vectors of structures</h3>
${E`
struct Book { string title; int pages; };
vector<Book> shelf = {{"Dune", 612}, {"Emma", 474}, {"Ulysses", 730}};
int total = 0;
for (const Book& b : shelf) {
    cout << b.title << ": " << b.pages << endl;
    total += b.pages;
}
cout << "total pages: " << total << endl;
`}
<h3>Passing structures to functions</h3>
${E`
struct Rect { double w, h; };

double area(const Rect& r) { return r.w * r.h; }       // const reference: no copy

void scale(Rect& r, double k) { r.w *= k; r.h *= k; }  // reference: modifies the original

Rect box = {2.0, 3.0};
scale(box, 2);
cout << area(box) << endl;                              // 24
`}
<h3>Member functions and constructors</h3>
<p>In C++ a <code>struct</code> can also have functions and constructors; the only difference from a <code>class</code> is that members are <b>public by default</b>.</p>
${E`
struct Circle {
    double radius;
    Circle(double r) : radius(r) {}
    double area() const { return 3.14159 * radius * radius; }
    double circumference() const { return 2 * 3.14159 * radius; }
};
Circle c(5);
cout << c.area() << " " << c.circumference() << endl;
`}
<h3>Nested structures</h3>
${E`
struct Date { int day, month, year; };
struct Person { string name; Date born; };
Person p = {"Mai", {17, 5, 2009}};
cout << p.name << " was born in " << p.born.year << endl;
`}
${tip('Use a <code>struct</code> for plain bundles of data and a <code>class</code> when you want to hide data behind functions (encapsulation).')}`,
      code: S`
        #include <iostream>
        #include <string>
        #include <vector>
        #include <algorithm>
        using namespace std;

        struct Student {
            string name;
            int mark;
        };

        void print(const Student& s) { cout << s.name << ": " << s.mark << endl; }

        int main() {
            vector<Student> students = {{"Ali", 78}, {"Dina", 95}, {"Omar", 85}, {"Noor", 61}};
            Student best = students[0];
            double sum = 0;
            for (const Student& s : students) {
                sum += s.mark;
                if (s.mark > best.mark) best = s;
            }
            cout << "best: "; print(best);
            cout << "average: " << sum / students.size() << endl;

            sort(students.begin(), students.end(), [](const Student& a, const Student& b) { return a.mark > b.mark; });
            cout << "ranking:" << endl;
            for (const Student& s : students) print(s);
            return 0;
        }
      `,
      quiz: [
        Q('What is the access level of struct members by default?', ['private', 'public', 'protected', 'none'], 1, 'struct members are public by default; class members are private.'),
        Q('How do you read the age member of a structure variable s?', ['s->age only', 's.age', 's::age', 's[age]'], 1, 'The dot operator accesses members.'),
        Q('What does Student b = a; do?', ['Makes b an alias of a', 'Copies every member of a into b', 'Deletes a', 'Is an error'], 1, 'Structures are copied member by member.'),
      ] },

    { id: 'cpp-enum', title: 'Enumerations (enum)', mins: 11,
      body: `
<p>An <b>enumeration</b> is a type with a small set of named constants. Use it instead of "magic numbers" so code says what it means.</p>
${E`
enum Color { RED, GREEN, BLUE };      // RED = 0, GREEN = 1, BLUE = 2
Color c = GREEN;
cout << c << endl;                    // 1
if (c == GREEN) cout << "go!" << endl;
`}
<h3>Choosing the numbers</h3>
${E`
enum Level { LOW = 1, MEDIUM = 5, HIGH = 10 };
enum Weekday { MON = 1, TUE, WED, THU, FRI };      // TUE = 2, WED = 3, ...
cout << LOW << " " << HIGH << " " << WED << endl;
`}
<h3>enum with switch</h3>
${E`
enum Direction { NORTH, EAST, SOUTH, WEST };
Direction d = SOUTH;
switch (d) {
    case NORTH: cout << "up" << endl; break;
    case EAST:  cout << "right" << endl; break;
    case SOUTH: cout << "down" << endl; break;
    case WEST:  cout << "left" << endl; break;
}
`}
<h3>enum class: the safer, modern enum</h3>
<p>A plain <code>enum</code> dumps its names into the surrounding scope and converts to <code>int</code> silently. An <b><code>enum class</code></b> keeps names inside its own scope (<code>Color::RED</code>) and is a separate type.</p>
${E`
enum class Status { Pending, Active, Closed };
Status s = Status::Active;
if (s == Status::Active) cout << "active" << endl;
cout << static_cast<int>(s) << endl;       // explicit conversion needed
`}
<h3>Converting an enum to text</h3>
${E`
enum Season { WINTER, SPRING, SUMMER, AUTUMN };
string name(Season s) {
    switch (s) {
        case WINTER: return "winter";
        case SPRING: return "spring";
        case SUMMER: return "summer";
        default: return "autumn";
    }
}
for (int i = WINTER; i <= AUTUMN; i++) cout << name((Season)i) << " ";
cout << endl;
`}
${tip('Prefer <code>enum class</code> in new code. Two plain enums in the same scope cannot reuse a name like <code>RED</code>; two enum classes can.')}`,
      code: S`
        #include <iostream>
        #include <string>
        using namespace std;

        enum class Light { Red, Yellow, Green };

        string describe(Light l) {
            switch (l) {
                case Light::Red: return "stop";
                case Light::Yellow: return "get ready";
                case Light::Green: return "go";
            }
            return "?";
        }

        Light next(Light l) {
            switch (l) {
                case Light::Red: return Light::Green;
                case Light::Green: return Light::Yellow;
                default: return Light::Red;
            }
        }

        int main() {
            Light light = Light::Red;
            for (int i = 0; i < 6; i++) {
                cout << i << ": " << describe(light) << endl;
                light = next(light);
            }
            return 0;
        }
      `,
      quiz: [
        Q('What value does BLUE have in enum Color { RED, GREEN, BLUE }?', ['0', '1', '2', '3'], 2, 'Numbering starts at 0.'),
        Q('How do you access a constant of enum class Status?', ['Active', 'Status::Active', 'Status.Active', 'Status->Active'], 1, 'Enum class names are scoped.'),
        Q('Why prefer enum class?', ['It is faster', 'Names are scoped and there are no silent int conversions', 'It allows more constants', 'It is shorter'], 1, 'It prevents name clashes and accidental mixing.'),
      ] },

    { id: 'cpp-ptr', title: 'Pointers & Memory Addresses', mins: 20,
      body: `
<p>Every variable lives at an <b>address</b> in memory. A <b>pointer</b> is a variable that stores such an address. Pointers are what make C++ fast and powerful (and dangerous), so go step by step.</p>
<h3>Address-of (&amp;) and dereference (*)</h3>
<ul><li><code>&amp;x</code> — the address of <code>x</code>.</li><li><code>int* p</code> — declares a pointer to an <code>int</code>.</li><li><code>*p</code> — follows the pointer to the value it points at ("dereferencing").</li></ul>
${E`
int n = 10;
int* p = &n;                 // p holds the address of n
cout << "value of n: " << n << endl;
cout << "value through p: " << *p << endl;
*p = 25;                     // change n THROUGH the pointer
cout << "n is now " << n << endl;
`}
${X`
// Printing the pointer itself shows an address that changes from run to run:
cout << &n << endl;      // e.g. 0x7ffd5c3a1b24
cout << p  << endl;      // the same address
cout << &p << endl;      // the address of the pointer variable itself
`}
<h3>Pointers as function parameters</h3>
<p>Passing an address lets a function change the caller's variable (the C way; references do the same more safely).</p>
${E`
void increment(int* p) { (*p)++; }
void swapInts(int* a, int* b) { int t = *a; *a = *b; *b = t; }

int x = 5, y = 9;
increment(&x);
swapInts(&x, &y);
cout << x << " " << y << endl;      // 9 6
`}
<h3>nullptr</h3>
<p>A pointer that points at nothing should hold <code>nullptr</code>. Always check before dereferencing.</p>
${E`
int* p = nullptr;
if (p == nullptr) cout << "p points to nothing" << endl;
int value = 7;
p = &value;
if (p != nullptr) cout << *p << endl;
`}
<h3>Pointers to structures and objects: the arrow operator</h3>
<p>For a pointer to a struct or object, <code>p-&gt;member</code> is shorthand for <code>(*p).member</code>.</p>
${E`
struct Player { string name; int score; };
Player hero = {"Ayah", 120};
Player* ptr = &hero;
cout << ptr->name << " " << (*ptr).score << endl;
ptr->score += 30;
cout << hero.score << endl;                // 150
`}
<h3>Pointer vs reference</h3>
<table><tr><th></th><th>Reference <code>int&amp;</code></th><th>Pointer <code>int*</code></th></tr>
<tr><td>Can be empty?</td><td>No, must refer to something</td><td>Yes (<code>nullptr</code>)</td></tr>
<tr><td>Can be re-pointed?</td><td>No</td><td>Yes</td></tr>
<tr><td>Syntax to use</td><td>like the variable itself</td><td><code>*p</code> / <code>p-&gt;</code></td></tr></table>
<h3>const and pointers</h3>
${X`
const int* a = &n;       // pointer to a constant int: cannot change *a, can re-point a
int* const b = &n;       // constant pointer: can change *b, cannot re-point b
const int* const c = &n; // neither
`}
${warn('A <b>dangling pointer</b> points to memory that no longer belongs to you (a destroyed local variable, or memory you already freed). Dereferencing it is undefined behaviour. An <b>uninitialised pointer</b> is just as bad: initialise with <code>nullptr</code>.')}
${tip('Our browser simulator supports the pointer operations in this lesson (address-of, dereference, arrow, nullptr). Pointer <i>arithmetic</i> (p++) needs a real compiler.')}`,
      code: S`
        #include <iostream>
        using namespace std;

        void resetToZero(int* p) { if (p != nullptr) *p = 0; }
        void addTax(double* price, double rate) { *price = *price * (1 + rate); }

        struct Counter { int hits; };
        void hit(Counter* c) { c->hits++; }

        int main() {
            int score = 80;
            int* ptr = &score;
            cout << "score = " << score << ", *ptr = " << *ptr << endl;
            *ptr += 15;
            cout << "after change through pointer: " << score << endl;

            double price = 100;
            addTax(&price, 0.14);
            cout << "with tax: " << price << endl;

            resetToZero(&score);
            resetToZero(nullptr);
            cout << "reset: " << score << endl;

            Counter c = {0};
            for (int i = 0; i < 3; i++) hit(&c);
            cout << "hits: " << c.hits << endl;
            return 0;
        }
      `,
      quiz: [
        Q('What does the * in *p do (not in a declaration)?', ['Multiplies', 'Dereferences: gets the value p points to', 'Gets the address', 'Declares a pointer'], 1, '*p is the value stored at the address in p.'),
        Q('What does &x give you?', ['The value of x', 'The address of x', 'A reference type', 'x squared'], 1, '& is the address-of operator.'),
        Q('How do you read member name through a pointer p to a struct?', ['p.name', 'p->name', 'p::name', '*p.name'], 1, 'The arrow operator.'),
      ] },

    { id: 'cpp-ptrarr', title: 'Pointers and Arrays', mins: 15,
      body: `
<p>In C++ an array's name behaves like a pointer to its <b>first element</b>. That is why arrays are passed to functions without copying, and why the two ideas are so closely related.</p>
${E`
int nums[4] = {10, 20, 30, 40};
int* p = nums;               // no & needed: nums already "is" the address of nums[0]
cout << *p << endl;          // 10
cout << *(p + 1) << endl;    // 20: one element further
cout << *(p + 3) << endl;    // 40
cout << p[2] << endl;        // 30: p[i] is the same as *(p + i)
`}
<p><code>p + 1</code> does not add 1 byte; it moves forward by one <b>element</b> (4 bytes for an <code>int</code>). So <code>nums[i]</code> is really <code>*(nums + i)</code>.</p>
<h3>Walking through an array with a pointer</h3>
${E`
int data[5] = {3, 1, 4, 1, 5};
int* p = data;
int sum = 0;
for (int i = 0; i < 5; i++) sum += *(p + i);
cout << "sum: " << sum << endl;
`}
${X`
// Classic pointer-style loop (needs a real compiler):
for (int* q = data; q != data + 5; q++) cout << *q << " ";
`}
<h3>Arrays in functions are pointers</h3>
<p>These two parameter declarations mean exactly the same thing:</p>
${E`
void doubleAll(int* arr, int n) {            // same as int arr[]
    for (int i = 0; i < n; i++) arr[i] *= 2;
}
int values[3] = {1, 2, 3};
doubleAll(values, 3);
cout << values[0] << values[1] << values[2] << endl;     // 246
`}
<p>Because the function receives only an address, it does <b>not</b> know the array's length, so you must pass it along.</p>
<h3>An array of pointers: a list of names</h3>
${E`
string words[] = {"alpha", "beta", "gamma"};
string* best = &words[0];
for (int i = 1; i < 3; i++)
    if (words[i].length() > best->length()) best = &words[i];
cout << *best << endl;
`}
<h3>Pointers and strings</h3>
<p>A C-string literal like <code>"hello"</code> is an array of characters ending with <code>'\\0'</code>. Old code uses <code>const char*</code> for it; in new code prefer <code>std::string</code>.</p>
${tip('Prefer <code>vector</code> and <code>std::array</code> over raw arrays. Use pointers when you really need addresses: dynamic memory, data structures like linked lists, and interfacing with C libraries.')}
${warn('Walking a pointer past the end of an array (or before its start) is undefined behaviour, exactly like an out-of-range index.')}`,
      code: S`
        #include <iostream>
        using namespace std;

        int maxOf(const int* a, int n) {
            int best = a[0];
            for (int i = 1; i < n; i++) if (*(a + i) > best) best = *(a + i);
            return best;
        }

        void reverse(int* a, int n) {
            for (int i = 0; i < n / 2; i++) {
                int t = a[i];
                a[i] = a[n - 1 - i];
                a[n - 1 - i] = t;
            }
        }

        int main() {
            int data[] = {7, 42, 3, 19, 25};
            int n = 5;
            int* p = data;
            cout << "first: " << *p << ", third: " << *(p + 2) << ", last: " << p[n - 1] << endl;
            cout << "max: " << maxOf(data, n) << endl;
            reverse(data, n);
            for (int i = 0; i < n; i++) cout << data[i] << " ";
            cout << endl;
            return 0;
        }
      `,
      quiz: [
        Q('Given int a[5]; int* p = a; what is *(p + 2)?', ['a[0]', 'a[2]', 'a[3]', 'The address of a[2]'], 1, 'p + 2 moves two elements forward.'),
        Q('Which is equal to a[i]?', ['*(a + i)', '&(a + i)', 'a + i', '*a + i'], 0, 'Indexing is pointer arithmetic plus a dereference.'),
        Q('Why must you pass the length when passing an array to a function?', ['Style rule', 'The function only receives an address, not the size', 'Arrays are slow', 'To avoid copying'], 1, 'The size information is lost.'),
      ] },

    { id: 'cpp-dyn', title: 'Dynamic Memory: new & delete', mins: 18,
      body: `
<p>Normal local variables live on the <b>stack</b>: they are created when a function starts and destroyed automatically when it ends. Sometimes you need memory that <b>outlives</b> the function or whose size is only known at run time. That memory comes from the <b>heap</b> (or "free store") and <i>you</i> are responsible for giving it back.</p>
<ul><li><code>new</code> allocates memory and returns its address.</li><li><code>delete</code> releases a single object, <code>delete[]</code> releases an array.</li></ul>
${E`
int* p = new int(42);              // one int on the heap, initialised to 42
cout << *p << endl;
*p += 8;
cout << *p << endl;
delete p;                          // give the memory back
p = nullptr;                       // good habit: no dangling pointer
`}
<h3>Dynamic arrays: size chosen at run time</h3>
${E`
int n = 5;
int* squares = new int[n];
for (int i = 0; i < n; i++) squares[i] = i * i;
for (int i = 0; i < n; i++) cout << squares[i] << " ";
cout << endl;
delete[] squares;                  // arrays need delete[]
`}
<h3>Objects on the heap</h3>
${E`
struct Node { int value; };
Node* node = new Node{7};
cout << node->value << endl;
delete node;
`}
<h3>Memory problems you must know</h3>
<table><tr><th>Problem</th><th>What happens</th></tr>
<tr><td><b>Memory leak</b></td><td>you forget <code>delete</code>; memory is lost until the program ends</td></tr>
<tr><td><b>Dangling pointer</b></td><td>you use a pointer after <code>delete</code></td></tr>
<tr><td><b>Double delete</b></td><td>you delete the same memory twice: crash</td></tr>
<tr><td><b>Mismatched delete</b></td><td><code>new[]</code> must pair with <code>delete[]</code></td></tr></table>
${X`
int* leak() {
    int* big = new int[1000000];
    return nullptr;          // we lost the only pointer: memory leaked forever
}
`}
<h3>Destructors and deleting objects</h3>
<p>When you <code>delete</code> an object, its destructor runs. Objects on the stack have their destructor run automatically when they go out of scope.</p>
${E`
class Resource {
public:
    Resource() { cout << "acquired" << endl; }
    ~Resource() { cout << "released" << endl; }
};

Resource* r = new Resource();
cout << "using it" << endl;
delete r;                          // prints "released"
`}
<h3>The modern way: let the library do it</h3>
<p>Since C++11, <b>smart pointers</b> (<code>std::unique_ptr</code>, <code>std::shared_ptr</code> in <code>&lt;memory&gt;</code>) call <code>delete</code> for you, and <code>vector</code>/<code>string</code> manage their own memory. Write <code>new</code>/<code>delete</code> by hand only to understand how it works, or when a library requires it.</p>
${X`
#include <memory>
auto p = std::make_unique<int>(42);        // freed automatically
auto list = std::make_unique<int[]>(10);
`}
${tip('Rule of thumb: every <code>new</code> must have exactly one matching <code>delete</code> on every path through the program. If that feels hard, use a <code>vector</code> or a smart pointer instead.')}`,
      code: S`
        #include <iostream>
        using namespace std;

        class Tracker {
            int id;
        public:
            Tracker(int i) : id(i) { cout << "Tracker " << id << " created" << endl; }
            ~Tracker() { cout << "Tracker " << id << " destroyed" << endl; }
            void work() { cout << "Tracker " << id << " working" << endl; }
        };

        int main() {
            int n = 4;
            int* numbers = new int[n];
            for (int i = 0; i < n; i++) numbers[i] = (i + 1) * 10;
            int total = 0;
            for (int i = 0; i < n; i++) total += numbers[i];
            cout << "total = " << total << endl;
            delete[] numbers;

            Tracker* t = new Tracker(1);
            t->work();
            delete t;

            cout << "end of main" << endl;
            return 0;
        }
      `,
      quiz: [
        Q('Which statement frees a dynamic array allocated with new int[10]?', ['delete p;', 'delete[] p;', 'free(p);', 'remove p;'], 1, 'new[] pairs with delete[].'),
        Q('What is a memory leak?', ['Using too many variables', 'Heap memory that is never released', 'A bug in the compiler', 'Reading outside an array'], 1, 'Allocated memory the program can no longer free.'),
        Q('What is a dangling pointer?', ['A pointer to nullptr', 'A pointer to memory that has been freed', 'A const pointer', 'A pointer to a pointer'], 1, 'Using it is undefined behaviour.'),
      ] },

    { id: 'cpp-ctor', title: 'Constructors & Destructors', mins: 20,
      body: `
<p>A <b>constructor</b> is a special function that runs automatically when an object is created and prepares it for use. It has the <b>same name as the class</b> and <b>no return type</b>. A <b>destructor</b> (<code>~ClassName</code>) runs when the object is destroyed and cleans up.</p>
${E`
class Rectangle {
public:
    double width, height;

    Rectangle() { width = 1; height = 1; cout << "default" << endl; }
    Rectangle(double w, double h) { width = w; height = h; cout << "custom" << endl; }
    double area() { return width * height; }
};

Rectangle a;                      // default constructor
Rectangle b(3, 4);                // constructor with parameters
cout << a.area() << " " << b.area() << endl;
`}
<h3>Member initialiser lists</h3>
<p>The preferred way to set members: they are initialised <i>before</i> the constructor body runs. It is required for <code>const</code> members and references.</p>
${E`
class Player {
    string name;
    int lives;
public:
    Player(string n, int l = 3) : name(n), lives(l) {}
    void show() { cout << name << " has " << lives << " lives" << endl; }
};
Player p1("Ali");
Player p2("Sara", 5);
p1.show(); p2.show();
`}
<h3>Constructor overloading and delegation</h3>
${E`
class Car {
    string brand;
    int year;
public:
    Car() : Car("unknown", 2020) {}                   // delegates to the next one
    Car(string b) : Car(b, 2020) {}
    Car(string b, int y) : brand(b), year(y) {}
    void show() { cout << brand << " (" << year << ")" << endl; }
};
Car().show();
Car("Toyota").show();
Car("Kia", 2015).show();
`}
<h3>The copy constructor</h3>
<p>When you copy an object (<code>Point q = p;</code>) C++ calls the <b>copy constructor</b>. If you write nothing, a member-by-member copy is made. Write your own when the object owns resources (like heap memory).</p>
${E`
class Point {
public:
    int x, y;
    Point(int a, int b) : x(a), y(b) {}
    Point(const Point& other) : x(other.x), y(other.y) { cout << "copied" << endl; }
};
Point p(1, 2);
Point q = p;                  // copy constructor runs
q.x = 99;
cout << p.x << " " << q.x << endl;
`}
<h3>Destructors and the order of destruction</h3>
${E`
class Noisy {
    string name;
public:
    Noisy(string n) : name(n) { cout << "+ " << name << endl; }
    ~Noisy() { cout << "- " << name << endl; }
};

void scope() {
    Noisy a("first");
    Noisy b("second");
    cout << "inside the function" << endl;
}                                      // b is destroyed first, then a
scope();
cout << "back in main" << endl;
`}
<p>Objects are destroyed in the <b>reverse</b> order of their creation. The destructor is the right place to close files, release memory and free other resources (<b>RAII</b>: Resource Acquisition Is Initialisation).</p>
${tip('The "rule of three": if a class needs a custom destructor, copy constructor <i>or</i> copy assignment operator, it almost always needs all three. (Modern C++ adds move operations: the "rule of five".)')}
${warn('A constructor cannot return a value, and you cannot call it like an ordinary method on an existing object.')}`,
      code: S`
        #include <iostream>
        #include <string>
        using namespace std;

        class BankAccount {
            string owner;
            double balance;
            static int totalAccounts;
        public:
            BankAccount() : owner("nobody"), balance(0) { totalAccounts++; cout << "empty account opened" << endl; }
            BankAccount(string o, double b = 0) : owner(o), balance(b) { totalAccounts++; cout << "account for " << o << " opened" << endl; }
            ~BankAccount() { cout << "account of " << owner << " closed (balance " << balance << ")" << endl; }
            void deposit(double amount) { balance += amount; }
            static int count() { return totalAccounts; }
        };
        int BankAccount::totalAccounts = 0;

        void demo() {
            BankAccount a("Mai", 100);
            BankAccount b;
            a.deposit(50);
            cout << "accounts: " << BankAccount::count() << endl;
        }

        int main() {
            demo();
            cout << "after demo" << endl;
            return 0;
        }
      `,
      quiz: [
        Q('What is the name of a class\'s constructor?', ['init', 'The same as the class', 'construct', 'new'], 1, 'The constructor has the class name and no return type.'),
        Q('In which order are local objects destroyed?', ['Same order as created', 'Reverse order of creation', 'Random', 'Alphabetical'], 1, 'Last created, first destroyed.'),
        Q('What does a member initialiser list do?', ['Declares members', 'Initialises members before the constructor body', 'Deletes members', 'Calls the destructor'], 1, 'Syntax: Constructor(args) : member(value), ... {}'),
      ] },

    { id: 'cpp-access', title: 'Access Specifiers, this & static Members', mins: 19,
      body: `
<h3>public, private and protected</h3>
<p>Access specifiers control who may use a class's members:</p>
<table><tr><th>Specifier</th><th>Accessible from</th></tr>
<tr><td><code>public</code></td><td>anywhere</td></tr><tr><td><code>private</code> (default in a class)</td><td>only inside the class (and its friends)</td></tr><tr><td><code>protected</code></td><td>the class and its derived classes</td></tr></table>
${X`
class Account {
private:
    double balance;          // hidden from outside code
public:
    void deposit(double amount) { if (amount > 0) balance += amount; }
    double getBalance() const { return balance; }
};

Account a;
a.deposit(50);
// a.balance = 1000000;      // ERROR: 'balance' is private
`}
<h3>Encapsulation with getters and setters</h3>
<p>Keep data private and expose a small, safe interface. The class can then protect its own rules.</p>
${E`
class Thermostat {
    double celsius;
public:
    Thermostat() : celsius(20) {}
    double get() const { return celsius; }
    void set(double c) {
        if (c < 5 || c > 35) { cout << "refused: " << c << endl; return; }
        celsius = c;
    }
};
Thermostat t;
t.set(24);
t.set(99);
cout << t.get() << endl;
`}
<h3>The this pointer</h3>
<p>Inside a member function, <code>this</code> points to the object the function was called on. It resolves name clashes and enables <b>method chaining</b> by returning <code>*this</code>.</p>
${E`
class Pizza {
    string size;
    int toppings;
public:
    Pizza() : size("medium"), toppings(0) {}
    Pizza& setSize(string size) { this->size = size; return *this; }
    Pizza& addTopping() { toppings++; return *this; }
    void show() { cout << size << " pizza, " << toppings << " toppings" << endl; }
};
Pizza p;
p.setSize("large").addTopping().addTopping().addTopping();
p.show();
`}
<h3>static members: shared by all objects</h3>
<p>A <code>static</code> data member exists <b>once</b> for the whole class. A <code>static</code> member function belongs to the class and can be called without an object.</p>
${E`
class Student {
    string name;
    static int count;                       // one shared counter
public:
    Student(string n) : name(n) { count++; }
    static int getCount() { return count; } // no 'this' inside
};
int Student::count = 0;                     // define it once, outside the class

Student a("Ali"), b("Dina"), c("Omar");
cout << Student::getCount() << endl;        // 3
`}
<h3>const member functions</h3>
<p>Marking a member function <code>const</code> promises it will not modify the object. Such functions are the only ones you may call on a <code>const</code> object.</p>
${E`
class Counter {
    int n = 0;
public:
    void add() { n++; }
    int value() const { return n; }
};
const Counter fixed;
cout << fixed.value() << endl;
// fixed.add();      // error: add() is not const
`}
${tip('Default to <code>private</code> data and mark every getter <code>const</code>. Loosen access only when you have a reason.')}`,
      code: S`
        #include <iostream>
        #include <string>
        using namespace std;

        class Library {
            string name;
            int books;
            static int libraries;
        public:
            Library(string n, int b) : name(n), books(b) { libraries++; }
            Library& addBooks(int n) { if (n > 0) books += n; return *this; }
            Library& removeBooks(int n) { if (n <= books) books -= n; else cout << "not enough books in " << name << endl; return *this; }
            int getBooks() const { return books; }
            string getName() const { return name; }
            static int count() { return libraries; }
        };
        int Library::libraries = 0;

        int main() {
            Library city("City Library", 100);
            Library school("School Library", 20);
            city.addBooks(50).removeBooks(30);
            school.removeBooks(500);
            cout << city.getName() << ": " << city.getBooks() << endl;
            cout << school.getName() << ": " << school.getBooks() << endl;
            cout << "libraries: " << Library::count() << endl;
            return 0;
        }
      `,
      quiz: [
        Q('Which members can outside code NOT access?', ['public', 'private', 'static', 'const'], 1, 'private members are hidden.'),
        Q('What does a static data member mean?', ['One copy shared by all objects', 'One copy per object', 'A constant', 'A pointer'], 0, 'It belongs to the class itself.'),
        Q('What does return *this; in a member function enable?', ['Recursion', 'Method chaining', 'Copying', 'Deleting'], 1, 'You can call obj.a().b().c().'),
      ] },

    { id: 'cpp-inh', title: 'Inheritance', mins: 21,
      body: `
<p><b>Inheritance</b> builds a new class (<b>derived</b> / child) from an existing one (<b>base</b> / parent). The child gets the parent's members and can add or change behaviour. It models an <b>"is-a"</b> relationship: a Dog <i>is an</i> Animal.</p>
${E`
class Animal {
protected:
    string name;
public:
    Animal(string n) : name(n) {}
    void eat() { cout << name << " is eating" << endl; }
    void speak() { cout << name << " makes a sound" << endl; }
};

class Dog : public Animal {                // Dog inherits from Animal
public:
    Dog(string n) : Animal(n) {}           // call the base constructor
    void fetch() { cout << name << " fetches the ball" << endl; }
};

Dog d("Rex");
d.eat();           // inherited
d.fetch();         // its own
d.speak();         // inherited (for now)
`}
<h3>Access in inheritance</h3>
<table><tr><th>Base member</th><th>public inheritance</th><th>protected inheritance</th><th>private inheritance</th></tr>
<tr><td>public</td><td>public</td><td>protected</td><td>private</td></tr><tr><td>protected</td><td>protected</td><td>protected</td><td>private</td></tr><tr><td>private</td><td colspan="3">never accessible in the child</td></tr></table>
<p>Use <code>public</code> inheritance for "is-a" in almost every case.</p>
<h3>Constructor and destructor order</h3>
<p>Base constructors run <b>first</b>, then the derived one. Destructors run in the opposite order.</p>
${E`
class Base {
public:
    Base() { cout << "Base constructor" << endl; }
    ~Base() { cout << "Base destructor" << endl; }
};
class Derived : public Base {
public:
    Derived() { cout << "Derived constructor" << endl; }
    ~Derived() { cout << "Derived destructor" << endl; }
};
void run() { Derived d; cout << "working..." << endl; }
run();
`}
<h3>Overriding (redefining) a base method</h3>
${E`
class Shape {
public:
    string describe() { return "a shape"; }
};
class Square : public Shape {
public:
    string describe() { return "a square"; }          // hides the base version
    string both() { return describe() + " (also " + Shape::describe() + ")"; }
};
Square s;
cout << s.describe() << endl;
cout << s.both() << endl;
`}
<h3>Multi-level inheritance</h3>
${E`
class Vehicle   { public: string wheels() { return "has wheels"; } };
class Car : public Vehicle   { public: string doors() { return "has doors"; } };
class SportsCar : public Car { public: string speed() { return "is fast"; } };
SportsCar sc;
cout << sc.wheels() << ", " << sc.doors() << ", " << sc.speed() << endl;
`}
<h3>Multiple inheritance</h3>
<p>A class may have several bases. Use it sparingly: it can create ambiguity when two bases have a member with the same name.</p>
${E`
class Swimmer { public: void swim() { cout << "swimming" << endl; } };
class Flyer   { public: void fly()  { cout << "flying" << endl; } };
class Duck : public Swimmer, public Flyer {};
Duck d;
d.swim();
d.fly();
`}
${tip('Ask: "is every Derived really a Base?" If not, use <b>composition</b> (a member variable) instead of inheritance. A Car <i>has an</i> Engine; it is not an Engine.')}`,
      code: S`
        #include <iostream>
        #include <string>
        using namespace std;

        class Employee {
        protected:
            string name;
            double baseSalary;
        public:
            Employee(string n, double s) : name(n), baseSalary(s) { cout << "Employee " << n << " created" << endl; }
            ~Employee() { cout << "Employee " << name << " removed" << endl; }
            double salary() { return baseSalary; }
            void print() { cout << name << " earns " << salary() << endl; }
        };

        class Manager : public Employee {
            double bonus;
        public:
            Manager(string n, double s, double b) : Employee(n, s), bonus(b) { cout << "Manager role added" << endl; }
            ~Manager() { cout << "Manager role removed" << endl; }
            double salary() { return Employee::salary() + bonus; }
            void print() { cout << name << " (manager) earns " << salary() << endl; }
        };

        void demo() {
            Employee e("Ali", 3000);
            Manager m("Dina", 5000, 1500);
            e.print();
            m.print();
        }

        int main() {
            demo();
            return 0;
        }
      `,
      quiz: [
        Q('In class Dog : public Animal, which is the base class?', ['Dog', 'Animal', 'Both', 'Neither'], 1, 'The class after the colon is the base.'),
        Q('Which constructor runs first when creating a Derived object?', ['Derived', 'Base', 'Neither', 'Random'], 1, 'Bases are constructed before derived parts.'),
        Q('What does protected mean?', ['Anyone can use it', 'Only the class itself', 'The class and its derived classes', 'Only friends'], 2, 'protected sits between public and private.'),
      ] },

    { id: 'cpp-virt', title: 'Polymorphism & virtual Functions', mins: 21,
      body: `
<p><b>Polymorphism</b> means "many forms": the same call does different things depending on the real type of the object. In C++ it works through <b>base-class pointers or references</b> and <b>virtual functions</b>.</p>
<h3>The problem without virtual</h3>
<p>A base pointer can hold the address of a derived object. But if the function is <i>not</i> virtual, the pointer's <b>declared</b> type decides which version runs:</p>
${X`
class Animal { public: void speak() { cout << "..." << endl; } };           // not virtual
class Dog : public Animal { public: void speak() { cout << "Woof" << endl; } };

Animal* a = new Dog();
a->speak();          // prints "..."  (the Animal version!)
`}
<h3>The solution: virtual</h3>
${E`
class Animal {
public:
    virtual void speak() { cout << "..." << endl; }
    virtual ~Animal() {}                     // virtual destructor (see below)
};
class Dog : public Animal {
public:
    void speak() override { cout << "Woof!" << endl; }
};
class Cat : public Animal {
public:
    void speak() override { cout << "Meow!" << endl; }
};

Animal* pets[3] = {new Dog(), new Cat(), new Animal()};
for (int i = 0; i < 3; i++) pets[i]->speak();       // the REAL type decides
for (int i = 0; i < 3; i++) delete pets[i];
`}
<p>The keyword <code>override</code> asks the compiler to check you really are overriding a virtual function (it catches typos and signature mismatches).</p>
<h3>References work too</h3>
${E`
class Shape {
public:
    virtual double area() { return 0; }
    virtual string name() { return "shape"; }
    virtual ~Shape() {}
};
class Circle : public Shape {
    double r;
public:
    Circle(double radius) : r(radius) {}
    double area() override { return 3.14159 * r * r; }
    string name() override { return "circle"; }
};
class Rect : public Shape {
    double w, h;
public:
    Rect(double a, double b) : w(a), h(b) {}
    double area() override { return w * h; }
    string name() override { return "rectangle"; }
};

void report(Shape& s) { cout << s.name() << ": " << s.area() << endl; }

Circle c(2);
Rect r(3, 4);
report(c);
report(r);
`}
<h3>A vector of base pointers</h3>
${E`
class Employee {
public:
    virtual double pay() { return 1000; }
    virtual ~Employee() {}
};
class Manager : public Employee { public: double pay() override { return 2500; } };
class Intern : public Employee { public: double pay() override { return 400; } };

vector<Employee*> staff = {new Employee(), new Manager(), new Intern()};
double total = 0;
for (Employee* e : staff) total += e->pay();
cout << "payroll: " << total << endl;
for (Employee* e : staff) delete e;
`}
<h3>Virtual destructors</h3>
<p>If you delete a derived object through a base pointer, the base destructor must be <code>virtual</code>; otherwise only the base part is cleaned up (undefined behaviour). <b>Rule: any class meant to be a base should have a virtual destructor.</b></p>
${E`
class Base {
public:
    virtual ~Base() { cout << "~Base" << endl; }
};
class Child : public Base {
public:
    ~Child() { cout << "~Child" << endl; }
};
Base* p = new Child();
delete p;                 // ~Child then ~Base
`}
<h3>How it works (in one paragraph)</h3>
<p>A class with virtual functions gets a hidden table of function addresses (the <b>vtable</b>); each object carries a hidden pointer to it. A virtual call looks the function up in that table at <b>run time</b> ("dynamic dispatch"), which costs a tiny bit of speed.</p>
${warn('<b>Object slicing:</b> assigning a derived object to a <i>base object variable</i> (<code>Animal a = dog;</code>) copies only the base part. Use pointers or references for polymorphism.')}
${tip('Note for the simulator: it always performs dynamic dispatch, as if every method were virtual. In a real compiler, forgetting <code>virtual</code> gives the "..." result shown above.')}`,
      code: S`
        #include <iostream>
        #include <string>
        #include <vector>
        using namespace std;

        class Notification {
        public:
            virtual string text() { return "generic notification"; }
            virtual int priority() { return 1; }
            virtual ~Notification() { cout << "(notification deleted)" << endl; }
        };

        class Email : public Notification {
            string from;
        public:
            Email(string f) : from(f) {}
            string text() override { return "email from " + from; }
        };

        class Alarm : public Notification {
        public:
            string text() override { return "ALARM!"; }
            int priority() override { return 10; }
        };

        int main() {
            vector<Notification*> inbox = {new Email("Mai"), new Alarm(), new Notification()};
            for (Notification* n : inbox)
                cout << "[" << n->priority() << "] " << n->text() << endl;
            for (Notification* n : inbox) delete n;
            return 0;
        }
      `,
      quiz: [
        Q('Which keyword enables run-time (dynamic) dispatch?', ['static', 'virtual', 'inline', 'const'], 1, 'A virtual function is looked up at run time.'),
        Q('Why should a polymorphic base class have a virtual destructor?', ['Speed', 'So deleting a derived object through a base pointer cleans up properly', 'It is optional style', 'To prevent copying'], 1, 'Otherwise the derived destructor is skipped.'),
        Q('What does the override keyword do?', ['Makes a function private', 'Asks the compiler to verify it overrides a virtual function', 'Deletes the base function', 'Makes it static'], 1, 'It turns silent mistakes into compile errors.'),
      ] },

    { id: 'cpp-abs', title: 'Abstract Classes & Interfaces', mins: 15,
      body: `
<p>Sometimes a base class is only a <b>contract</b>: it says <i>what</i> every derived class must be able to do, without saying <i>how</i>. In C++ that is an <b>abstract class</b>: a class with at least one <b>pure virtual function</b>, written <code>= 0</code>.</p>
${E`
class Shape {
public:
    virtual double area() = 0;               // pure virtual: no body here
    virtual double perimeter() = 0;
    virtual string name() { return "shape"; }
    virtual ~Shape() {}
};

class Rectangle : public Shape {
    double w, h;
public:
    Rectangle(double a, double b) : w(a), h(b) {}
    double area() override { return w * h; }
    double perimeter() override { return 2 * (w + h); }
    string name() override { return "rectangle"; }
};

class Circle : public Shape {
    double r;
public:
    Circle(double radius) : r(radius) {}
    double area() override { return 3.14159 * r * r; }
    double perimeter() override { return 2 * 3.14159 * r; }
    string name() override { return "circle"; }
};

Shape* shapes[2] = {new Rectangle(3, 4), new Circle(1.5)};
for (Shape* s : shapes)
    cout << s->name() << ": area " << s->area() << ", perimeter " << s->perimeter() << endl;
for (Shape* s : shapes) delete s;
`}
<ul><li>You <b>cannot create</b> an object of an abstract class (<code>Shape s;</code> is an error).</li><li>A derived class that does not implement <i>all</i> pure virtual functions is abstract too.</li><li>Abstract classes <b>can</b> have data, constructors and ordinary methods that derived classes share.</li></ul>
<h3>Interfaces</h3>
<p>C++ has no <code>interface</code> keyword. By convention an <b>interface</b> is an abstract class with <i>only</i> pure virtual functions and no data. A class can implement several interfaces through multiple inheritance.</p>
${E`
class Printable {
public:
    virtual void print() = 0;
    virtual ~Printable() {}
};
class Saveable {
public:
    virtual void save() = 0;
    virtual ~Saveable() {}
};

class Document : public Printable, public Saveable {
    string title;
public:
    Document(string t) : title(t) {}
    void print() override { cout << "printing " << title << endl; }
    void save() override { cout << "saving " << title << endl; }
};

Document d("report");
d.print();
d.save();
Printable* p = &d;
p->print();
`}
<h3>Program to an interface</h3>
${E`
class Logger {
public:
    virtual void log(string msg) = 0;
    virtual ~Logger() {}
};
class ConsoleLogger : public Logger {
public:
    void log(string msg) override { cout << "[console] " << msg << endl; }
};
class FileLogger : public Logger {
public:
    void log(string msg) override { cout << "[file] " << msg << endl; }
};

void process(Logger& logger) {          // works with ANY logger
    logger.log("starting");
    logger.log("done");
}
ConsoleLogger c; FileLogger f;
process(c);
process(f);
`}
${tip('Abstract classes let new types slot into old code: <code>process()</code> never changes, yet it works with loggers that were written long after it.')}`,

    { id: 'cpp-friend', title: 'Friend Functions & Operator Overloading', mins: 20,
      body: `
<h3>Friend functions</h3>
<p>A <b>friend</b> function is a non-member function that the class allows to see its <code>private</code> members. Use it sparingly, for functions that are logically part of the class interface but cannot be members (for example operators with a stream on the left).</p>
${E`
class Box {
    double width;
public:
    Box(double w) : width(w) {}
    friend double compareWidths(const Box& a, const Box& b);
};
double compareWidths(const Box& a, const Box& b) {
    return a.width - b.width;           // allowed: it is a friend
}
Box x(5), y(3);
cout << compareWidths(x, y) << endl;
`}
<h3>Operator overloading</h3>
<p>You can give the built-in operators a meaning for your own classes. The function name is <code>operator</code> followed by the symbol.</p>
${E`
class Vec2 {
public:
    double x, y;
    Vec2(double a = 0, double b = 0) : x(a), y(b) {}
    Vec2 operator+(const Vec2& o) { return Vec2(x + o.x, y + o.y); }
    Vec2 operator-(const Vec2& o) { return Vec2(x - o.x, y - o.y); }
    Vec2 operator*(double k)      { return Vec2(x * k, y * k); }
    bool operator==(const Vec2& o) { return x == o.x && y == o.y; }
};

Vec2 a(1, 2), b(3, 4);
Vec2 sum = a + b;
Vec2 diff = b - a;
Vec2 scaled = a * 3;
cout << sum.x << "," << sum.y << " " << diff.x << "," << diff.y << " " << scaled.x << "," << scaled.y << endl;
cout << (a == Vec2(1, 2)) << (a == b) << endl;
`}
<h3>Printing your own type with operator&lt;&lt;</h3>
<p>The stream is on the <i>left</i> of <code>&lt;&lt;</code>, so this operator cannot be a member; it is written as a (friend) free function that returns the stream so calls can be chained.</p>
${E`
class Fraction {
    int num, den;
public:
    Fraction(int n, int d) : num(n), den(d) {}
    friend ostream& operator<<(ostream& os, const Fraction& f) {
        os << f.num << "/" << f.den;
        return os;
    }
};
Fraction f(3, 4);
cout << "fraction: " << f << endl;
`}
<h3>Which operators can be overloaded?</h3>
<p>Almost all: <code>+ - * / % == != &lt; &gt; &lt;= &gt;= [] () ++ -- += -= &lt;&lt; &gt;&gt; =</code> … Not overloadable: <code>:: . .* ?: sizeof</code>.</p>
<h3>More operator forms (read-only here)</h3>
<p>These work in a real compiler; the browser simulator supports the binary and comparison operators shown above.</p>
${X`
class Counter {
    int n = 0;
public:
    Counter& operator++() { ++n; return *this; }          // prefix  ++c
    Counter operator++(int) { Counter old = *this; ++n; return old; }   // postfix c++
    int operator[](int i) const { return n + i; }          // c[2]
    int operator()(int x) const { return n * x; }          // c(5)  - a "functor"
    operator int() const { return n; }                      // implicit conversion
};
`}
${tip('Follow the principle of least surprise: <code>+</code> should add, <code>==</code> should compare, <code>&lt;&lt;</code> should print. Do not overload an operator to do something unrelated.')}`,
      code: S`
        #include <iostream>
        #include <string>

            int cents;
        public:
            Money(int c = 0) : cents(c) {}
            Money operator+(const Money& o) { return Money(cents + o.cents); }
            Money operator-(const Money& o) { return Money(cents - o.cents); }
            bool operator<(const Money& o) { return cents < o.cents; }
            bool operator==(const Money& o) { return cents == o.cents; }
            friend ostream& operator<<(ostream& os, const Money& m) {
                os << "$" << m.cents / 100 << "." << (m.cents % 100 < 10 ? "0" : "") << m.cents % 100;

        };

        int main() {
            Money price(1999), tax(280), discount(500);
            Money total = price + tax - discount;
            cout << "price:    " << price << endl;

      quiz: [
        Q('What can a friend function do?', ['Access private members of the class', 'Inherit from it', 'Change its name', 'Nothing special'], 0, 'The class grants it access.'),
        Q('What is the function name used to overload +?', ['plus', 'operator+', 'add', 'op_add'], 1, 'operator followed by the symbol.'),
        Q('Why is operator<< usually a non-member (friend) function?', ['It is faster', 'The stream is the left operand', 'Members cannot print', 'It is the law'], 1, 'The left operand must be cout, which is not your class.'),
      ] },

    { id: 'cpp-tmpl', title: 'Templates: Generic Functions & Classes', mins: 19,
      body: `
<p>Suppose you want a <code>maxOf</code> function for <code>int</code>, <code>double</code> and <code>string</code>. Writing three copies is tedious. A <b>template</b> lets you write the code <i>once</i> with a placeholder type; the compiler generates the right version for every type you use. This is <b>generic programming</b>.</p>
<h3>Function templates</h3>
${E`
template <typename T>
T maxOf(T a, T b) {
    return (a > b) ? a : b;
}

cout << maxOf(3, 7) << endl;                          // T = int
cout << maxOf(2.5, 1.5) << endl;                      // T = double
cout << maxOf(string("apple"), string("pear")) << endl;   // T = string
cout << maxOf<double>(3, 2.5) << endl;                // explicit type
`}
<h3>Several type parameters</h3>
${E`
template <typename A, typename B>
void showPair(A first, B second) {
    cout << "(" << first << ", " << second << ")" << endl;
}
showPair(1, "one");
showPair(2.5, 'x');
showPair(string("age"), 16);
`}
<h3>Generic helper functions</h3>
${E`
template <typename T>
void swapValues(T& a, T& b) { T tmp = a; a = b; b = tmp; }

template <typename T>
T sumAll(const vector<T>& items) {
    T total = items[0];                 // start from the first element
    for (size_t i = 1; i < items.size(); i++) total = total + items[i];
    return total;
}

int a = 1, b = 2;
swapValues(a, b);
cout << a << b << endl;
cout << sumAll(vector<int>{1, 2, 3, 4}) << " " << sumAll(vector<double>{0.5, 1.5}) << endl;
`}
<h3>Class templates</h3>
<p>The standard containers (<code>vector&lt;T&gt;</code>, <code>stack&lt;T&gt;</code> …) are class templates. You can write your own:</p>
${E`
template <typename T>
class Box {
    T content;
public:
    Box(T c) : content(c) {}
    T get() { return content; }
    void set(T c) { content = c; }
};

Box<int> number(42);
Box<string> text("hello");
cout << number.get() << " " << text.get() << endl;
number.set(7);
cout << number.get() << endl;
`}
<h3>A generic stack</h3>
${E`
template <typename T>
class Stack {
    vector<T> items;
public:
    void push(T x) { items.push_back(x); }
    T pop() { T top = items.back(); items.pop_back(); return top; }
    T peek() { return items.back(); }
    bool empty() { return items.empty(); }
    int size() { return items.size(); }
};

Stack<int> s;
s.push(10); s.push(20); s.push(30);
cout << s.pop() << " " << s.peek() << " " << s.size() << endl;

Stack<string> words;
words.push("a"); words.push("b");
cout << words.pop() << words.pop() << endl;
`}
<h3>Template specialisation (read-only)</h3>
${X`
template <>                       // a special version just for bool
class Box<bool> {
    bool content;
public:
    Box(bool c) : content(c) {}
    string get() { return content ? "yes" : "no"; }
};
`}
${tip('Templates are resolved at compile time and produce fast code with full type checking. The price is long error messages when a type does not support what the template does (for example <code>&gt;</code> on a type that has no such operator).')}`,
      code: S`
        #include <iostream>
        #include <string>
        #include <vector>
        using namespace std;

        template <typename T>
        T largest(const vector<T>& items) {
            T best = items[0];
            for (const T& x : items) if (x > best) best = x;
            return best;
        }

        template <typename T>
        class Pair {
            T first, second;
        public:
            Pair(T a, T b) : first(a), second(b) {}
            T bigger() { return first > second ? first : second; }
            void swap() { T t = first; first = second; second = t; }
            void show() { cout << "(" << first << ", " << second << ")" << endl; }
        };

        int main() {
            cout << largest(vector<int>{3, 9, 4}) << endl;
            cout << largest(vector<double>{2.5, 0.5}) << endl;
            cout << largest(vector<string>{"pear", "apple", "zebra"}) << endl;

            Pair<int> p(4, 8);
            p.show();
            p.swap();
            p.show();
            cout << p.bigger() << endl;
            Pair<string> s("left", "right");
            s.show();
            return 0;
        }
      `,
      quiz: [
        Q('What does template <typename T> introduce?', ['A new variable', 'A placeholder type T', 'A macro', 'A namespace'], 1, 'T stands for any type chosen when the template is used.'),
        Q('How do you create a Box that holds a double?', ['Box(double) b;', 'Box<double> b;', 'Box.double b;', 'double Box b;'], 1, 'Provide the type in angle brackets.'),
        Q('Which standard type is a class template?', ['int', 'vector<T>', 'bool', 'char'], 1, 'vector, stack, map … are all templates.'),
      ] },

    { id: 'cpp-stl', title: 'The STL: stack, queue, set, deque & pair', mins: 21,
      body: `
<p>The <b>Standard Template Library (STL)</b> is a collection of ready-made, well-tested data structures (<b>containers</b>) and algorithms. Learning to pick the right container is one of the biggest steps toward writing real C++.</p>
<table><tr><th>Container</th><th>What it is</th></tr>
<tr><td><code>vector</code></td><td>resizable array — the default choice</td></tr><tr><td><code>deque</code></td><td>fast insert/remove at <i>both</i> ends</td></tr>
<tr><td><code>stack</code></td><td>last in, first out</td></tr><tr><td><code>queue</code></td><td>first in, first out</td></tr><tr><td><code>priority_queue</code></td><td>always gives the largest item first</td></tr>
<tr><td><code>set</code></td><td>sorted collection of unique items</td></tr><tr><td><code>map</code></td><td>sorted key → value pairs (next lesson)</td></tr></table>
<h3>pair</h3>
${E`
pair<string, int> p = make_pair("Ali", 20);
cout << p.first << " " << p.second << endl;
vector<pair<string, int>> people = {{"Dina", 22}, {"Omar", 19}};
for (auto& person : people) cout << person.first << ":" << person.second << " ";
cout << endl;
`}
<h3>stack: last in, first out</h3>
<p>Operations: <code>push</code>, <code>pop</code> (removes), <code>top</code> (reads), <code>empty</code>, <code>size</code>.</p>
${E`
stack<int> st;
st.push(1); st.push(2); st.push(3);
cout << "top: " << st.top() << ", size: " << st.size() << endl;
while (!st.empty()) {
    cout << st.top() << " ";
    st.pop();
}
cout << endl;
`}
${E`
bool balanced(const string& text) {
    stack<char> open;
    for (char c : text) {
        if (c == '(' || c == '[' || c == '{') open.push(c);
        else if (c == ')' || c == ']' || c == '}') {
            if (open.empty()) return false;
            char t = open.top(); open.pop();
            if ((c == ')' && t != '(') || (c == ']' && t != '[') || (c == '}' && t != '{')) return false;
        }
    }
    return open.empty();
}
cout << balanced("{[()]}") << balanced("(]") << balanced("((") << endl;
`}
<h3>queue: first in, first out</h3>
${E`
queue<string> line;
line.push("Ali"); line.push("Dina"); line.push("Omar");
cout << "front: " << line.front() << ", back: " << line.back() << endl;
while (!line.empty()) {
    cout << "serving " << line.front() << endl;
    line.pop();
}
`}
<h3>priority_queue: largest first</h3>
${E`
priority_queue<int> pq;
for (int x : {5, 1, 9, 3, 7}) pq.push(x);
while (!pq.empty()) { cout << pq.top() << " "; pq.pop(); }
cout << endl;

priority_queue<int, vector<int>, greater<int>> smallestFirst;
for (int x : {5, 1, 9, 3, 7}) smallestFirst.push(x);
cout << smallestFirst.top() << endl;
`}
<h3>deque: both ends</h3>
${E`
deque<int> d = {2, 3, 4};
d.push_front(1);
d.push_back(5);
cout << d.front() << " " << d.back() << " " << d.size() << endl;
d.pop_front();
d.pop_back();
for (int x : d) cout << x << " ";
cout << endl;
`}
<h3>set: unique and sorted</h3>
${E`
set<int> s = {5, 1, 3, 3, 1, 4};
cout << s.size() << ": ";
for (int x : s) cout << x << " ";                     // 1 3 4 5
cout << endl;
s.insert(2);
s.erase(5);
cout << "contains 3? " << s.count(3) << ", contains 9? " << s.count(9) << endl;
`}
<h3>Choosing a container</h3>
<table><tr><th>You need…</th><th>Use</th></tr><tr><td>A list you index and grow</td><td><code>vector</code></td></tr><tr><td>Undo, bracket matching, DFS</td><td><code>stack</code></td></tr><tr><td>Waiting lines, BFS, buffers</td><td><code>queue</code></td></tr><tr><td>"Give me the best/smallest next"</td><td><code>priority_queue</code></td></tr><tr><td>Remove duplicates, fast "is it in here?"</td><td><code>set</code></td></tr></table>
${tip('All STL containers manage their own memory and know their size. Look for <code>size()</code>, <code>empty()</code>, <code>clear()</code> on each.')}`,
      code: S`
        #include <iostream>
        #include <stack>
        #include <queue>
        #include <set>
        #include <string>
        using namespace std;

        string reverseWords(const string& text) {
            stack<string> words;
            string cur;
            for (char c : text + " ") {
                if (c == ' ') { if (!cur.empty()) words.push(cur); cur = ""; }
                else cur += c;
            }
            string result;
            while (!words.empty()) { result += words.top(); words.pop(); if (!words.empty()) result += " "; }
            return result;
        }

        int main() {
            cout << reverseWords("C++ is really great") << endl;

            queue<int> tickets;
            for (int i = 101; i <= 104; i++) tickets.push(i);
            while (!tickets.empty()) {
                cout << "ticket " << tickets.front() << " served" << endl;
                tickets.pop();
            }

            set<string> visited;
            string pages[] = {"home", "about", "home", "blog", "about"};
            for (const string& p : pages) {
                if (visited.count(p)) cout << p << " (again)" << endl;
                else { visited.insert(p); cout << p << " (new)" << endl; }
            }
            cout << visited.size() << " distinct pages" << endl;

            priority_queue<int> tasks;
            tasks.push(3); tasks.push(10); tasks.push(5);
            cout << "most urgent: " << tasks.top() << endl;
            return 0;
        }
      `,
      quiz: [
        Q('Which container removes elements in last-in, first-out order?', ['queue', 'stack', 'set', 'vector'], 1, 'stack is LIFO.'),
        Q('What does set<int> do with duplicate insertions?', ['Keeps both', 'Ignores them (items are unique)', 'Throws an error', 'Counts them'], 1, 'A set stores each value once, in sorted order.'),
        Q('What does a priority_queue<int> top() return by default?', ['The smallest', 'The largest', 'The first inserted', 'The last inserted'], 1, 'It is a max-heap by default.'),
      ] },

    { id: 'cpp-map', title: 'map & unordered_map', mins: 16,
      body: `
<p>A <b>map</b> stores <b>key → value</b> pairs, like a dictionary. Keys are unique. <code>std::map</code> keeps keys <b>sorted</b>; <code>std::unordered_map</code> is usually faster for lookups but has no particular order.</p>
${E`
map<string, int> ages;
ages["Ali"] = 20;
ages["Dina"] = 22;
ages["Omar"] = 19;
ages["Ali"] = 21;                                // updates the existing key
cout << ages["Dina"] << " " << ages.size() << endl;

for (auto kv : ages) cout << kv.first << " is " << kv.second << endl;     // sorted by key
`}
<h3>Checking for a key</h3>
${E`
map<string, int> stock = {{"apple", 5}, {"pear", 0}};
if (stock.count("apple")) cout << "we sell apples" << endl;
if (stock.count("kiwi") == 0) cout << "no kiwis" << endl;

auto it = stock.find("pear");
if (it != stock.end()) cout << "pear quantity: " << it->second << endl;
cout << stock.at("apple") << endl;
`}
${warn('<code>m[key]</code> <b>creates</b> the key with a default value (0 for numbers) when it is missing. To test membership without adding, use <code>count()</code> or <code>find()</code>. <code>at(key)</code> throws <code>out_of_range</code> for a missing key.')}
<h3>Erasing and clearing</h3>
${E`
map<int, string> codes = {{1, "one"}, {2, "two"}, {3, "three"}};
codes.erase(2);
cout << codes.size() << endl;
codes.clear();
cout << codes.empty() << endl;
`}
<h3>Counting things: the classic job for a map</h3>
${E`
string text = "to be or not to be that is the question";
map<string, int> freq;
string word;
for (char c : text + " ") {
    if (c == ' ') { if (!word.empty()) freq[word]++; word = ""; }
    else word += c;
}
for (auto kv : freq) cout << kv.first << ": " << kv.second << endl;
`}
<h3>Structured bindings (C++17)</h3>
${E`
map<string, double> prices = {{"tea", 1.5}, {"coffee", 2.25}};
for (auto [item, price] : prices) cout << item << " costs " << price << endl;
`}
<h3>Values that are containers</h3>
${E`
map<string, vector<int>> grades;
grades["Ali"].push_back(90);
grades["Ali"].push_back(80);
grades["Dina"].push_back(95);
for (auto kv : grades) {
    int sum = 0;
    for (int g : kv.second) sum += g;
    cout << kv.first << " average: " << (double)sum / kv.second.size() << endl;
}
`}
<h3>unordered_map</h3>
${E`
unordered_map<string, int> visits;
visits["home"] += 3;
visits["blog"] += 1;
visits["home"] += 2;
cout << visits["home"] << " " << visits["blog"] << " " << visits.size() << endl;
`}
<table><tr><th></th><th><code>map</code></th><th><code>unordered_map</code></th></tr><tr><td>Order</td><td>sorted by key</td><td>unspecified</td></tr><tr><td>Lookup</td><td>O(log n)</td><td>O(1) on average</td></tr><tr><td>Key type needs</td><td><code>&lt;</code></td><td>a hash function</td></tr></table>
${tip('Use <code>map</code> when you need sorted output or range queries, <code>unordered_map</code> when you only need fast lookups.')}`,
      code: S`
        #include <iostream>
        #include <map>
        #include <string>
        using namespace std;

        int main() {
            string text = "the cat saw the dog and the dog saw the cat";
            map<string, int> counts;
            string word;
            for (char c : text + " ") {
                if (c == ' ') { if (!word.empty()) counts[word]++; word = ""; }
                else word += c;
            }
            cout << "word counts:" << endl;
            for (auto kv : counts) cout << "  " << kv.first << " -> " << kv.second << endl;

            string best; int most = 0;
            for (auto kv : counts) if (kv.second > most) { most = kv.second; best = kv.first; }
            cout << "most common: " << best << " (" << most << ")" << endl;

            map<char, int> letters;

    { id: 'cpp-algo', title: 'STL Algorithms', mins: 17,
      body: `
<p>The header <code>&lt;algorithm&gt;</code> (plus <code>&lt;numeric&gt;</code>) contains dozens of ready-made functions that work on containers. They take a <b>range</b> given by <code>begin()</code> and <code>end()</code>, so the same algorithm works on vectors, arrays, deques and more. Using them makes code shorter, clearer and usually faster than hand-written loops.</p>
<h3>Sorting and reversing</h3>
${E`
vector<int> v = {5, 2, 9, 1, 7};
sort(v.begin(), v.end());                          // ascending
for (int x : v) cout << x << " ";
cout << endl;
sort(v.begin(), v.end(), greater<int>());          // descending
for (int x : v) cout << x << " ";
cout << endl;
reverse(v.begin(), v.end());
for (int x : v) cout << x << " ";
cout << endl;
`}
<h3>Custom ordering with a lambda</h3>
${E`
vector<string> words = {"banana", "kiwi", "apple", "fig"};
sort(words.begin(), words.end(), [](const string& a, const string& b) {
    return a.length() < b.length();
});
for (const string& w : words) cout << w << " ";
cout << endl;
`}
<h3>Minimum, maximum and searching</h3>
${E`
vector<int> v = {4, 8, 15, 16, 23, 42};
cout << *max_element(v.begin(), v.end()) << " " << *min_element(v.begin(), v.end()) << endl;
cout << "count of 15: " << count(v.begin(), v.end(), 15) << endl;
cout << "even numbers: " << count_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; }) << endl;

if (find(v.begin(), v.end(), 23) != v.end()) cout << "23 is in the vector" << endl;
cout << "index of 16: " << find(v.begin(), v.end(), 16) - v.begin() << endl;
cout << max(3, 9) << " " << min(3, 9) << endl;
`}
<h3>Binary search on sorted data</h3>
${E`
vector<int> sorted = {2, 4, 6, 8, 10, 12};
cout << binary_search(sorted.begin(), sorted.end(), 8) << binary_search(sorted.begin(), sorted.end(), 5) << endl;
cout << "first element >= 7 is at index " << lower_bound(sorted.begin(), sorted.end(), 7) - sorted.begin() << endl;
`}
<h3>Summing and filling (<code>&lt;numeric&gt;</code>)</h3>
${E`
vector<int> nums = {1, 2, 3, 4, 5};
cout << "sum: " << accumulate(nums.begin(), nums.end(), 0) << endl;
cout << "product: " << accumulate(nums.begin(), nums.end(), 1, [](int a, int b) { return a * b; }) << endl;

vector<int> zeros(5);
fill(zeros.begin(), zeros.end(), 7);
vector<int> seq(5);
iota(seq.begin(), seq.end(), 10);                  // 10 11 12 13 14
for (int x : zeros) cout << x << " ";
cout << endl;
for (int x : seq) cout << x << " ";
cout << endl;
`}
<h3>Transforming and testing every element</h3>
${E`
vector<int> v = {1, 2, 3, 4};
transform(v.begin(), v.end(), v.begin(), [](int x) { return x * x; });
for (int x : v) cout << x << " ";
cout << endl;
cout << all_of(v.begin(), v.end(), [](int x) { return x > 0; })
     << any_of(v.begin(), v.end(), [](int x) { return x > 10; })
     << none_of(v.begin(), v.end(), [](int x) { return x < 0; }) << endl;
for_each(v.begin(), v.end(), [](int x) { cout << "[" << x << "]"; });
cout << endl;
`}
<h3>Removing duplicates</h3>
${E`
vector<int> d = {3, 1, 3, 2, 1, 2, 3};
sort(d.begin(), d.end());
d.erase(unique(d.begin(), d.end()), d.end());
for (int x : d) cout << x << " ";
cout << endl;
`}
${tip('Before writing a loop, ask "is there an algorithm for this?" — <code>sort</code>, <code>find</code>, <code>count_if</code>, <code>accumulate</code>, <code>transform</code>, <code>all_of</code> cover most everyday tasks.')}`,
      code: S`
        #include <iostream>
        #include <vector>
        #include <algorithm>
        #include <numeric>
        #include <string>
        using namespace std;

        int main() {
            vector<int> scores = {72, 95, 58, 88, 95, 64, 79};
            sort(scores.begin(), scores.end());
            cout << "sorted: ";
            for (int s : scores) cout << s << " ";
            cout << endl;

            double avg = (double)accumulate(scores.begin(), scores.end(), 0) / scores.size();
            cout << "average: " << avg << endl;
            cout << "highest: " << *max_element(scores.begin(), scores.end()) << endl;
            cout << "passed (>= 70): " << count_if(scores.begin(), scores.end(), [](int s) { return s >= 70; }) << endl;

            scores.erase(unique(scores.begin(), scores.end()), scores.end());
            cout << "distinct scores: " << scores.size() << endl;

            reverse(scores.begin(), scores.end());
            cout << "top 3: " << scores[0] << ", " << scores[1] << ", " << scores[2] << endl;
            cout << "was 88 achieved? " << (find(scores.begin(), scores.end(), 88) != scores.end() ? "yes" : "no") << endl;
            return 0;
        }
      `,
      quiz: [
        Q('What do begin() and end() describe?', ['The first and last values', 'A range to work on', 'The size', 'Two copies'], 1, 'Algorithms take a start and an end position.'),
        Q('Which algorithm adds up all elements?', ['sum', 'accumulate', 'total', 'reduce_all'], 1, 'accumulate(first, last, initialValue).'),
        Q('Why call erase(unique(...), end()) after sorting?', ['To sort faster', 'unique only moves duplicates to the end; erase removes them', 'To reverse', 'It is a bug'], 1, 'unique works on adjacent duplicates, so the data must be sorted.'),
      ] },

    { id: 'cpp-file', title: 'File Input & Output', mins: 17,
      body: `
<p>Files let your program <b>remember</b> things between runs. The header <code>&lt;fstream&gt;</code> provides three stream types that work just like <code>cout</code> and <code>cin</code>:</p>
<table><tr><th>Class</th><th>Use</th></tr><tr><td><code>ofstream</code></td><td>output file stream: write</td></tr><tr><td><code>ifstream</code></td><td>input file stream: read</td></tr><tr><td><code>fstream</code></td><td>both</td></tr></table>
<h3>Writing a file</h3>
${E`
ofstream out("diary.txt");
out << "Day 1: learned about streams" << endl;
out << "Day 2: wrote to a file" << endl;
out << "score: " << 95 << endl;
out.close();
cout << "saved" << endl;
`}
<h3>Reading a file line by line</h3>
${E`
ofstream w("diary.txt");
w << "first line" << endl << "second line" << endl << "third line" << endl;
w.close();

ifstream in("diary.txt");
string line;
int number = 0;
while (getline(in, line)) {
    number++;
    cout << number << ": " << line << endl;
}
in.close();
`}
<h3>Reading words and numbers</h3>
${E`
ofstream w("data.txt");
w << "10 20 30 40" << endl;
w.close();

ifstream in("data.txt");
int x, sum = 0;
while (in >> x) sum += x;              // stops when no more numbers
cout << "sum: " << sum << endl;
`}
<h3>Checking that the file opened</h3>
${E`
ifstream in("missing.txt");
if (!in) {
    cout << "could not open missing.txt" << endl;
} else {
    cout << "opened" << endl;
}
ofstream out("ok.txt");
cout << out.is_open() << endl;
`}
<h3>Appending</h3>
<p>The mode <code>ios::app</code> adds to the end instead of erasing the file.</p>
${E`
ofstream first("log.txt");
first << "start" << endl;
first.close();

ofstream more("log.txt", ios::app);
more << "second entry" << endl;
more.close();

ifstream in("log.txt");
string line;
while (getline(in, line)) cout << line << endl;
`}
<h3>A mini record-keeping program</h3>
${E`
struct Item { string name; double price; };
vector<Item> items = {{"pen", 1.5}, {"book", 12.25}, {"bag", 30}};

ofstream save("items.txt");
for (const Item& it : items) save << it.name << " " << it.price << endl;
save.close();

ifstream load("items.txt");
string name; double price, total = 0;
while (load >> name >> price) {
    cout << name << " costs " << price << endl;
    total += price;
}
cout << "total: " << total << endl;
`}
<h3>String streams</h3>
<p><code>&lt;sstream&gt;</code> lets you use the same <code>&lt;&lt;</code> / <code>&gt;&gt;</code> tricks on strings: perfect for building text and splitting it.</p>
${E`
ostringstream builder;
builder << "x=" << 5 << ", y=" << 2.5;
string result = builder.str();
cout << result << endl;

istringstream parts("12 apples 3.5");
int count; string what; double weight;
parts >> count >> what >> weight;
cout << count << "|" << what << "|" << weight << endl;
`}
${tip('Close files when you are done (<code>close()</code>), or let the stream object go out of scope — its destructor closes it for you.')}
${warn('The browser simulator keeps files in a temporary in-memory "disk" that disappears when the program ends, but the code you write is the same as for real files.')}`,

<style>
/* ==========================================================================
   Abouzeid's Coding School — styles
   Design tokens live on :root; the dark theme just re-declares them.
   ========================================================================== */
:root {
  --bg: #f6f7fb; --surface: #ffffff; --surface-2: #eef0f8; --border: #e3e6f2;
  --text: #1c2038; --muted: #667091; --brand: #5b4bf0; --brand-2: #8b5cf6; --brand-ink: #ffffff;
  --green: #16a34a; --green-bg: #dcfce7; --red: #dc2626; --red-bg: #fee2e2; --orange: #f97316; --yellow: #f59e0b;
  --code-bg: #f3f4fb; --editor-bg: #fbfbfe; --shadow: 0 1px 2px rgba(20,24,60,.06), 0 8px 24px rgba(20,24,60,.06);
  --radius: 16px; --font: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  --t-kw: #7c3aed; --t-str: #15803d; --t-num: #c2410c; --t-com: #8a93b2; --t-fn: #0369a1;
}
:root[data-theme="dark"] {
  --bg: #0e1120; --surface: #171b30; --surface-2: #20253f; --border: #2a3050;
  --text: #e8ebfa; --muted: #98a1c8; --brand: #8b7cff; --brand-2: #b18cff; --brand-ink: #11132a;
  --green: #4ade80; --green-bg: #12301f; --red: #f87171; --red-bg: #3a1a1f; --orange: #fb923c; --yellow: #fbbf24;
  --code-bg: #11152a; --editor-bg: #10142a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --t-kw: #c4a7ff; --t-str: #86efac; --t-num: #fdba74; --t-com: #6f789e; --t-fn: #7dd3fc;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.6; font-size: 16px; transition: background .25s, color .25s; }
a { color: var(--brand); text-decoration: none; } a:hover { text-decoration: underline; }
h1, h2, h3 { line-height: 1.25; margin: 1.4em 0 .5em; } h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin-top: 0; } h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; }
code { font-family: var(--mono); background: var(--code-bg); border: 1px solid var(--border); padding: .08em .4em; border-radius: 6px; font-size: .88em; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.skip { position: absolute; left: -999px; } .skip:focus { left: 8px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 99; }

/* ---------- header ---------- */
.topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.topbar .wrap { display: flex; align-items: center; gap: 14px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--text); font-size: 1.08rem; letter-spacing: -.01em; }
.logo:hover { text-decoration: none; }
.logo-mark { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; display: grid; place-items: center; font-family: var(--mono); font-weight: 800; font-size: .95rem; box-shadow: 0 4px 14px color-mix(in srgb, var(--brand) 45%, transparent); }
nav.main { display: flex; gap: 4px; margin-left: 12px; }
nav.main a { color: var(--muted); font-weight: 800; padding: 8px 12px; border-radius: 10px; font-size: .95rem; }
nav.main a:hover { background: var(--surface-2); text-decoration: none; color: var(--text); }
nav.main a.active { color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, transparent); }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-weight: 900; font-size: .9rem; white-space: nowrap; }
.chip.fire { color: var(--orange); } .chip.xp { color: var(--brand); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 2px solid var(--border); overflow: hidden; font-size: 1.25rem; cursor: pointer; padding: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.big { width: 112px; height: 112px; font-size: 3.4rem; cursor: default; border-width: 4px; border-color: var(--brand); }
.btn.burger { display: none; }
#userSlot .btn { white-space: nowrap; }
@media (max-width: 520px) { .logo span:last-child, #xpChip { display: none; } .topbar .wrap { gap: 8px; } }
@media (max-width: 860px) {
  .btn.burger { display: inline-flex; }
  nav.main { position: fixed; inset: 64px 0 auto 0; background: var(--surface); flex-direction: column; padding: 10px 16px 16px; border-bottom: 1px solid var(--border); transform: translateY(-130%); transition: transform .25s; margin: 0; box-shadow: var(--shadow); }
  nav.main.open { transform: none; }
  .chip .lbl { display: none; }
}

/* ---------- buttons ---------- */
.btn { font: inherit; font-weight: 900; cursor: pointer; border: 2px solid var(--border); background: var(--surface); color: var(--text); padding: 10px 18px; border-radius: 12px; box-shadow: 0 3px 0 var(--border); transition: transform .08s, box-shadow .08s, background .2s; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: color-mix(in srgb, var(--brand) 70%, #000); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 60%, #000); }
.btn.primary:hover { background: color-mix(in srgb, var(--brand) 90%, #fff); }
.btn.success { background: var(--green); color: #052e14; border-color: color-mix(in srgb, var(--green) 70%, #000); box-shadow: 0 4px 0 color-mix(in srgb, var(--green) 60%, #000); }
.btn.ghost { box-shadow: none; border-color: transparent; background: transparent; }
.btn.tiny { padding: 4px 10px; font-size: .8rem; border-radius: 9px; box-shadow: none; }
.btn.icon { padding: 8px 10px; box-shadow: none; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

/* ---------- cards / layout ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 18px; } .grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); } .grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
main { padding: 28px 0 90px; min-height: 70vh; }
.page-in { animation: rise .35s ease both; } @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: 28px; align-items: center; padding: 18px 0 34px; }
.hero p.lead { font-size: 1.2rem; color: var(--muted); max-width: 52ch; }
.hero .grad { background: linear-gradient(90deg, var(--brand), var(--brand-2), var(--orange)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
.hero-card { padding: 0; overflow: hidden; }
.hero-card .bar { display: flex; gap: 6px; padding: 12px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.hero-card .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; } .hero-card .bar i:nth-child(2) { background: #febc2e; } .hero-card .bar i:nth-child(3) { background: #28c840; }
.hero-card pre { margin: 0; padding: 18px; font-family: var(--mono); font-size: .9rem; min-height: 200px; white-space: pre-wrap; }
@media (max-width: 800px) { .hero { grid-template-columns: 1fr; } }

.lang-card { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; transition: transform .2s, box-shadow .2s; border-top: 6px solid var(--c); color: var(--text); }
.lang-card:hover { transform: translateY(-4px); text-decoration: none; }
.lang-card .ico { font-size: 2.4rem; } .lang-card h3 { margin: 0; }
.progress { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), #86efac); border-radius: 99px; transition: width .5s; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 12px; }
.feature .em { font-size: 1.8rem; }
.feature h3 { margin: .3em 0 .2em; }

/* ---------- curriculum ---------- */
.module-title { margin: 26px 0 10px; color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 900; }
.lesson-row { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 10px; color: var(--text); transition: transform .15s, border-color .2s; }
.lesson-row:hover { transform: translateX(4px); border-color: var(--brand); text-decoration: none; }
.badge-n { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 900; border: 2px solid var(--border); }
.lesson-row.done .badge-n { background: var(--green); color: #052e14; border-color: var(--green); }
.lesson-row .meta { margin-left: auto; color: var(--muted); font-size: .85rem; white-space: nowrap; }

/* ---------- lesson ---------- */
.lesson-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 26px; align-items: start; }
.side { position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow: auto; padding: 14px; }
.side a { display: flex; gap: 8px; padding: 8px 10px; border-radius: 10px; color: var(--text); font-weight: 700; font-size: .92rem; }
.side a:hover { background: var(--surface-2); text-decoration: none; } .side a.cur { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); }
.side .mt { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 8px 4px; font-weight: 900; }
@media (max-width: 920px) { .lesson-layout { grid-template-columns: 1fr; } .side { position: static; max-height: none; display: none; } }
.prose { font-size: 1.04rem; } .prose p, .prose li { max-width: 74ch; }
.prose table { border-collapse: collapse; width: 100%; margin: 12px 0; display: block; overflow-x: auto; }
.prose th, .prose td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; } .prose th { background: var(--surface-2); }
.ex { position: relative; margin: 14px 0; }
.ex pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; overflow-x: auto; font-size: .9rem; line-height: 1.55; }
.ex pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.ex .btn { position: absolute; top: 8px; right: 8px; opacity: .0; transition: opacity .15s; } .ex:hover .btn, .ex .btn:focus-visible { opacity: 1; }
@media (hover: none) { .ex .btn { opacity: 1; position: static; margin-top: 6px; } }
.callout { display: flex; gap: 10px; flex-direction: column; border-left: 5px solid var(--brand); background: var(--surface-2); padding: 12px 16px; border-radius: 0 12px 12px 0; margin: 16px 0; }
.callout.tip { border-color: var(--green); } .callout.trick { border-color: var(--brand-2); } .callout.warn { border-color: var(--orange); }
.callout b { font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; }

/* ---------- editor ---------- */
.editor { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--editor-bg); box-shadow: var(--shadow); margin: 16px 0; }
.ed-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.ed-bar .title { font-weight: 900; margin-right: auto; display: flex; align-items: center; gap: 8px; }
select, input[type=text], input[type=email], input[type=password], input[type=search], textarea.plain { font: inherit; color: var(--text); background: var(--surface); border: 2px solid var(--border); border-radius: 10px; padding: 8px 12px; }
.ed-body { font-variant-ligatures: none; display: flex; height: var(--h, 300px); font-family: var(--mono); font-size: 14px; line-height: 21px; }
.ed-gutter { width: 46px; flex: none; overflow: hidden; background: var(--surface-2); color: var(--muted); text-align: right; padding: 12px 8px 12px 0; user-select: none; white-space: pre; }
.ed-code { position: relative; flex: 1; min-width: 0; }
.ed-code pre, .ed-code textarea { position: absolute; inset: 0; margin: 0; padding: 12px 14px; border: 0; font: inherit; line-height: inherit; tab-size: 4; white-space: pre; overflow: auto; letter-spacing: 0; }
.ed-code pre { pointer-events: none; overflow: hidden; color: var(--text); }
.ed-code textarea { background: transparent; color: transparent; caret-color: var(--text); resize: none; outline: none; -webkit-text-fill-color: transparent; }
.ed-code textarea::selection { background: color-mix(in srgb, var(--brand) 35%, transparent); -webkit-text-fill-color: transparent; }
.tk-kw { color: var(--t-kw); font-weight: 700; } .tk-str { color: var(--t-str); } .tk-num { color: var(--t-num); } .tk-com { color: var(--t-com); font-style: italic; } .tk-fn { color: var(--t-fn); }
.out { margin: 0; padding: 12px 16px; background: #0b0e1c; color: #d8dcf5; font-family: var(--mono); font-size: .88rem; min-height: 86px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; border-top: 1px solid var(--border); }
.out .err { color: #ff8a8a; } .out .ok { color: #7ee2a0; } .out .dim { color: #7c85ad; }
.stdin { padding: 8px 12px; border-top: 1px solid var(--border); font-size: .88rem; } .stdin summary { cursor: pointer; font-weight: 800; color: var(--muted); } .stdin textarea { width: 100%; margin-top: 6px; font-family: var(--mono); min-height: 60px; }

/* ---------- quiz ---------- */
.q { margin: 18px 0; padding: 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
.q .qt { font-weight: 900; white-space: pre-wrap; margin-bottom: 10px; }
.opt { display: block; width: 100%; text-align: left; margin: 8px 0; font: inherit; font-weight: 700; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: border-color .15s, background .15s, transform .08s; }
.opt:hover:not([disabled]) { border-color: var(--brand); background: var(--surface-2); }
.opt.right { border-color: var(--green); background: var(--green-bg); } .opt.wrong { border-color: var(--red); background: var(--red-bg); animation: shake .3s; }
.opt[disabled] { cursor: default; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.why { margin-top: 8px; font-size: .94rem; color: var(--muted); }
.result { text-align: center; padding: 24px; border-radius: 16px; background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 14%, var(--surface)), color-mix(in srgb, var(--green) 14%, var(--surface))); border: 1px solid var(--border); }
.result .big { font-size: 3rem; }

/* ---------- profile ---------- */
.profile-head { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 18px 0; }
.stat { text-align: center; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); } .stat b { display: block; font-size: 1.8rem; } .stat span { color: var(--muted); font-size: .85rem; font-weight: 800; }
.emoji-pick { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; } .emoji-pick button { font-size: 1.5rem; width: 46px; height: 46px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); cursor: pointer; } .emoji-pick button:hover { border-color: var(--brand); transform: scale(1.08); }
.badges { display: flex; flex-wrap: wrap; gap: 10px; } .bdg { padding: 10px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 800; } .bdg.off { opacity: .35; filter: grayscale(1); }
label.f { display: block; font-weight: 800; margin: 12px 0 4px; } .f-in { width: 100%; }

/* ---------- modal / toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(8,10,25,.6); backdrop-filter: blur(4px); z-index: 80; display: grid; place-items: center; padding: 16px; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(420px, 100%); background: var(--surface); border-radius: 20px; padding: 26px; border: 1px solid var(--border); box-shadow: var(--shadow); max-height: 92vh; overflow: auto; }
.tabs { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 8px; } .tabs button { flex: 1; font: inherit; font-weight: 900; padding: 8px; border: 0; background: transparent; border-radius: 9px; cursor: pointer; color: var(--muted); } .tabs button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.err-msg { color: var(--red); font-weight: 800; min-height: 1.4em; font-size: .9rem; }
#toasts { position: fixed; top: 76px; right: 16px; z-index: 120; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--green); padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); font-weight: 800; animation: rise .3s both; max-width: 320px; }

/* ---------- AI assistant ---------- */
.ai-fab { position: fixed; right: 18px; bottom: 18px; z-index: 60; width: 62px; height: 62px; border-radius: 50%; border: 0; cursor: pointer; font-size: 1.8rem; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 10px 28px color-mix(in srgb, var(--brand) 55%, transparent); transition: transform .2s; }
.ai-fab:hover { transform: scale(1.08) rotate(-4deg); }
.ai-panel { position: fixed; right: 18px; bottom: 92px; z-index: 61; width: min(400px, calc(100vw - 24px)); height: min(560px, calc(100vh - 120px)); display: none; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden; }
.ai-panel.open { display: flex; animation: rise .25s both; }
.ai-head { padding: 14px 16px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; display: flex; align-items: center; gap: 10px; font-weight: 900; } .ai-head small { display: block; font-weight: 600; opacity: .85; }
.ai-head .btn { margin-left: auto; background: rgba(255,255,255,.18); border-color: transparent; color: #fff; box-shadow: none; }
.ai-log { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.msg { max-width: 92%; padding: 10px 14px; border-radius: 16px; font-size: .94rem; word-wrap: break-word; }
.msg.bot { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; align-self: flex-start; }
.msg.me { background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; align-self: flex-end; white-space: pre-wrap; }
.msg pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; overflow-x: auto; font-size: .82rem; margin: 8px 0 0; } .msg p { margin: 0 0 6px; }
.msg.typing { opacity: .6; }
.sugg { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px 0; background: var(--bg); } .sugg button { font: inherit; font-size: .8rem; font-weight: 800; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 5px 10px; border-radius: 99px; cursor: pointer; } .sugg button:hover { border-color: var(--brand); }
.ai-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--surface); } .ai-form textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 2px solid var(--border); border-radius: 12px; padding: 8px 10px; max-height: 110px; }
footer { border-top: 1px solid var(--border); padding: 26px 0 100px; color: var(--muted); text-align: center; font-size: .9rem; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

[hidden] { display: none !important; }
.ex pre.static { border-style: dashed; }



</style>

/* ===== curriculum-core.js ===== */
/* curriculum-core.js — tiny helpers used by the lesson files (curriculum-py/cpp/java.js) */
(function (g) {
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // remove the common indentation + leading/trailing blank lines (lets lesson files stay indented)
  const dedent = s => {
    s = s.replace(/^\n+/, '').replace(/\s+$/, '');
    const lines = s.split('\n');
    const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
    return lines.map(l => l.slice(ind)).join('\n');
  };
  g.CK = {
    esc,
    // S`...` : raw (backslashes kept) + dedented -> used for starter code
    S: (s, ...v) => dedent(String.raw(s, ...v)),
    // E`...` : a runnable code example block inside a lesson body
    E: (s, ...v) => `<div class="ex"><pre><code>${esc(dedent(String.raw(s, ...v)))}</code></pre><button class="btn tiny" data-load type="button">▶ Load in editor</button></div>`,
    // X`...` : a code block that is shown for reading only (no "Load in editor" button) — for ideas the browser simulator cannot run
    X: (s, ...v) => `<div class="ex"><pre class="static"><code>${esc(dedent(String.raw(s, ...v)))}</code></pre></div>`,
    tip: t => `<div class="callout tip"><b>💡 Tip</b><span>${t}</span></div>`,
    trick: t => `<div class="callout trick"><b>✨ Pro trick</b><span>${t}</span></div>`,
    warn: t => `<div class="callout warn"><b>⚠️ Watch out</b><span>${t}</span></div>`,
    // multiple-choice question: Q(question, [options], indexOfCorrect, explanation)
    Q: (q, opts, a, why) => ({ q, opts, a, why }),
  };
  g.CURRICULUM = g.CURRICULUM || {};
  // extra lessons are registered by id; curriculum-plan.js arranges every lesson into modules
  g.CK.extra = { py: {}, cpp: {}, java: {} };
  g.CK.add = (lang, list) => list.forEach(l => { g.CK.extra[lang][l.id] = l; });
})(globalThis);

/* ===== curriculum-py.js ===== */
/* curriculum-py.js — Python track */
(function (g) {

  g.CURRICULUM.py = {

      { title: 'Module 1 · Foundations', lessons: [
        { id: 'py-1', title: 'Hello, World! Your First Program', mins: 10,
          body: `
<p>Every programmer starts here. A <b>program</b> is simply a list of instructions the computer follows from top to bottom. Python reads your file line by line and does what each line says. Your very first instruction will make the computer <i>talk</i>.</p>
<h3>Step 1 — The <code>print()</code> function</h3>
<p><code>print()</code> displays text on the screen. Text must be wrapped in quotes so Python knows it is <b>text</b> (called a <i>string</i>) and not a command.</p>
${E`
print("Hello, World!")
print('Single quotes work too')
print("Abouzeid's Coding School")   # a quote inside quotes: mix the two kinds
`}
<h3>Step 2 — What just happened?</h3>
<ol>
  <li><code>print</code> is the name of a built-in <b>function</b> (a reusable mini-program).</li>
  <li>The parentheses <code>( )</code> are how you <i>call</i> (use) it.</li>
  <li>Whatever sits inside the parentheses is handed to the function — we call that an <b>argument</b>.</li>
</ol>
<h3>Step 3 — Comments</h3>
<p>Anything after a <code>#</code> is ignored by Python. Use comments to explain <i>why</i> your code does something — your future self will thank you.</p>
${E`
# This whole line is a comment
print("Comments are free")  # this one sits at the end of a line
`}
<h3>Step 4 — Printing several things</h3>
${E`
print("Python", "is", "fun")        # commas add a space between items
print("Line one\nLine two")         # \n starts a new line
print("Tab\tseparated")             # \t is a tab
print("Math:", 2 + 3 * 4)           # Python can calculate too (multiplication first!)
print()                             # an empty print = blank line
print("Done!", end="")              # end="" stops the automatic new line
`}
${tip('Python is <b>case-sensitive</b>: <code>print</code> works, <code>Print</code> and <code>PRINT</code> do not.')}
<h3>Common mistakes (and how to read the error)</h3>
<ul>
  <li>Forgetting a closing quote or parenthesis → <code>SyntaxError</code>. Count your pairs!</li>
  <li>Mis-spelling the function → <code>NameError: name 'pritn' is not defined</code>.</li>
  <li>Indenting a line by accident → <code>IndentationError</code>. Python uses spaces at the start of a line as <i>structure</i>, so top-level lines must start at column 0.</li>
</ul>
${trick('Read errors <b>from the bottom up</b>. The last line names the error type; the line just above it points to the exact spot in your code.')}
<h3>Your turn</h3>
<p>Edit the program below so it prints your name and your favourite hobby on two separate lines, then press <b>Run</b>.</p>`,
          code: S`
            print("Hello, World!")
            print("My name is ...")      # <- change me
            print("I love ...")          # <- and me
            print("2 + 2 =", 2 + 2)
          `,
          quiz: [
            Q('Which line prints the word Hi on the screen?', ['print(Hi)', 'print("Hi")', 'echo "Hi"', 'Print("Hi")'], 1, 'Text needs quotes, and Python is case-sensitive so it must be lower-case print.'),
            Q('What does a # do in Python?', ['Starts a comment that Python ignores', 'Prints a hash symbol', 'Ends the program', 'Creates a variable'], 0, 'Everything after # on that line is a comment.'),
            Q('What does print("a\\nb") display?', ['a\\nb', 'a b', 'a on one line and b on the next', 'An error'], 2, '\\n is the new-line escape sequence.'),
          ] },
        { id: 'py-2', title: 'Variables & Data Types', mins: 14,
          body: `
<p>A <b>variable</b> is a labelled box that stores a value so you can use it later. You create one with the equals sign <code>=</code> — it means <i>"store the value on the right into the name on the left"</i>, not "is equal to".</p>
${E`
age = 15
name = "Layla"
height = 1.62
is_student = True
print(name, "is", age, "years old")
`}
<h3>The four basic types</h3>
<table>
<tr><th>Type</th><th>Example</th><th>What it holds</th></tr>
<tr><td><code>int</code></td><td><code>42</code>, <code>-7</code></td><td>whole numbers</td></tr>
<tr><td><code>float</code></td><td><code>3.14</code>, <code>-0.5</code></td><td>decimal numbers</td></tr>
<tr><td><code>str</code></td><td><code>"hello"</code></td><td>text (a "string")</td></tr>
<tr><td><code>bool</code></td><td><code>True</code>, <code>False</code></td><td>yes/no answers</td></tr>
</table>
<p>Ask Python for a value's type with <code>type()</code>. Python decides the type automatically — this is called <b>dynamic typing</b>.</p>
${E`
x = 10
print(type(x))        # <class 'int'>
x = "ten"             # the same box can now hold text
print(type(x))        # <class 'str'>
`}
<h3>Naming rules</h3>
<ul>
<li>Letters, digits and underscores only; cannot start with a digit.</li>
<li>No spaces and no reserved words (<code>if</code>, <code>for</code>, <code>class</code>…).</li>
<li>Convention: <code>snake_case</code> (<code>total_price</code>), and make names meaningful — <code>price</code> beats <code>p</code>.</li>
</ul>
<h3>Arithmetic operators</h3>
${E`
a, b = 17, 5
print(a + b)    # 22  addition
print(a - b)    # 12  subtraction
print(a * b)    # 85  multiplication
print(a / b)    # 3.4 true division (always a float)
print(a // b)   # 3   floor division (drops the remainder)
print(a % b)    # 2   modulo (the remainder)
print(a ** b)   # 1419857  power
`}
${tip('<code>%</code> is great for "is it even?" checks: <code>n % 2 == 0</code> is <code>True</code> for even numbers.')}
<h3>Strings: joining, f-strings and conversion</h3>
${E`
first = "Ada"
last = "Lovelace"
print(first + " " + last)             # + joins strings
print("ha" * 3)                       # * repeats them: hahaha
age = 36
print(f"{first} was {age} once")       # f-string: put variables inside { }
print(f"Next year: {age + 1}")         # even expressions work!
print(len(first), first.upper(), last.lower())
print(int("42") + 8, str(8) + "!", float("2.5"))   # converting between types
`}
${warn('<code>"5" + 5</code> is an error: Python will not guess whether you mean text or math. Convert first: <code>int("5") + 5</code>.')}
${trick('Swap two variables without a temporary box: <code>a, b = b, a</code>.')}`,
          code: S`
            item = "notebook"
            price = 2.5
            quantity = 4
            total = price * quantity
            print(f"{quantity} x {item} = {total} dollars")
            print("Type of total:", type(total))
            print("Whole dollars:", int(total) // 1, "| remainder:", 17 % 5)
          `,
          quiz: [
            Q('What is the type of 3.0?', ['int', 'float', 'str', 'bool'], 1, 'Numbers with a decimal point are floats.'),
            Q('What does 17 // 5 give?', ['3.4', '3', '2', '4'], 1, '// is floor division: 17 divided by 5 is 3 with remainder 2.'),
            Q('Which is a valid variable name?', ['2cats', 'my-var', 'my_var', 'for'], 2, 'Underscores are allowed; digits first, hyphens and keywords are not.'),
            Q('f"{2+3}" produces…', ['{2+3}', '5', '2+3', 'Error'], 1, 'Inside { } Python evaluates the expression.'),
          ] },
        { id: 'py-3', title: 'Making Decisions with if / elif / else', mins: 14,
          body: `
<p>Programs become powerful when they can <b>choose</b>. A decision is based on a <b>condition</b> — an expression that is either <code>True</code> or <code>False</code>.</p>
<h3>Comparison operators</h3>
<p><code>==</code> equal · <code>!=</code> not equal · <code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code>. Remember: <code>=</code> <i>assigns</i>, <code>==</code> <i>compares</i>.</p>
<h3>The if statement</h3>
${E`
temperature = 31
if temperature > 30:
    print("It's hot!")
    print("Drink water.")
print("This line always runs")
`}
<p>Notice two things: the <b>colon</b> at the end of the <code>if</code> line, and the <b>indentation</b> (4 spaces). Indented lines belong to the <code>if</code>. This is how Python groups code into <b>blocks</b>.</p>
<h3>else and elif</h3>
${E`
score = 82
if score >= 90:
    grade = "A"
elif score >= 80:
    grade = "B"
elif score >= 70:
    grade = "C"
else:
    grade = "Try again"
print("Grade:", grade)
`}
<p>Python checks from top to bottom and runs only the <b>first</b> block whose condition is true.</p>
<h3>Combining conditions</h3>
${E`
age = 20
has_ticket = True
if age >= 18 and has_ticket:       # both must be true
    print("Welcome in")
if age < 13 or age > 65:           # either can be true
    print("Discount!")
if not has_ticket:                 # flips True/False
    print("Please buy a ticket")
`}
${trick('Chain comparisons like in math: <code>if 1 &lt;= month &lt;= 12:</code>. Check membership with <code>in</code>: <code>if letter in "aeiou":</code>.')}
<h3>Truthiness</h3>
<p>Python treats <code>0</code>, <code>""</code> (empty text), <code>[]</code> and <code>None</code> as <code>False</code>; most other things are <code>True</code>. So <code>if name:</code> means "if name is not empty".</p>
${warn('Writing <code>if x = 5:</code> is a SyntaxError. You need <code>==</code>.')}`,
          code: S`
            number = 7
            if number % 2 == 0:
                print(number, "is even")
            else:
                print(number, "is odd")

            for age in [4, 15, 30, 70]:
                if age < 13:
                    print(age, "-> child")
                elif age < 65:
                    print(age, "-> adult")
                else:
                    print(age, "-> senior")
          `,
          quiz: [
            Q('Which operator checks whether two values are equal?', ['=', '==', '=>', 'is equal'], 1, '== compares; = assigns.'),
            Q('What is printed?\n\nx = 5\nif x > 10:\n    print("A")\nelif x > 3:\n    print("B")\nelse:\n    print("C")', ['A', 'B', 'C', 'B and C'], 1, 'x > 10 is false, x > 3 is true, so only B runs.'),
            Q('What must follow the condition in an if line?', ['A semicolon', 'A colon', 'Curly braces', 'The word then'], 1, 'Python uses a colon and indentation.'),
          ] },
        { id: 'py-4', title: 'Loops: Repeating Work', mins: 15,
          body: `
<p>Computers excel at repetition. A <b>loop</b> runs a block of code many times so you do not have to copy-paste.</p>
<h3>The for loop and range()</h3>
${E`
for i in range(5):          # i takes the values 0,1,2,3,4
    print("Round", i)

for n in range(1, 6):       # start at 1, stop BEFORE 6
    print(n, "squared is", n * n)

for n in range(10, 0, -3):  # start, stop, step -> 10 7 4 1
    print(n)
`}
<p><code>range(stop)</code>, <code>range(start, stop)</code> and <code>range(start, stop, step)</code> never include the <i>stop</i> value.</p>
<h3>Looping over things</h3>
${E`
for letter in "code":
    print(letter)
for fruit in ["apple", "kiwi", "plum"]:
    print("I like", fruit)
`}
<h3>The while loop</h3>
<p>A <code>while</code> loop repeats <i>as long as</i> a condition stays true. Use it when you do not know in advance how many rounds you need.</p>
${E`
count = 3
while count > 0:
    print(count)
    count -= 1          # shorthand for count = count - 1
print("Liftoff!")
`}
${warn('If nothing inside a <code>while</code> ever makes the condition false you get an <b>infinite loop</b>. Always update the variable you test!')}
<h3>break and continue</h3>
${E`
for n in range(1, 20):
    if n % 2 == 0:
        continue        # skip the rest of this round
    if n > 9:
        break           # leave the loop entirely
    print(n)
`}
<h3>Accumulator pattern</h3>
<p>Very common: start a total at 0 and add to it each round.</p>
${E`
total = 0
for n in range(1, 101):
    total += n
print("Sum 1..100 =", total)   # 5050
`}
${trick('<code>enumerate(items)</code> gives you the index <i>and</i> the value: <code>for i, x in enumerate(names):</code>. Loops can be nested to build tables.')}`,
          code: S`
            # Multiplication table of 7
            for i in range(1, 11):
                print(f"7 x {i} = {7 * i}")

            # Sum of the even numbers up to 20
            total = 0
            for n in range(2, 21, 2):
                total += n
            print("Sum of evens:", total)
          `,
          quiz: [
            Q('How many times does range(3) loop?', ['2', '3', '4', 'Forever'], 1, 'range(3) produces 0, 1, 2.'),
            Q('What does range(2, 8, 2) produce?', ['2, 4, 6', '2, 4, 6, 8', '2, 3, 4, 5, 6, 7', '0, 2, 4, 6'], 0, 'Starts at 2, step 2, stops before 8.'),
            Q('Which keyword exits a loop immediately?', ['continue', 'stop', 'break', 'exit'], 2, 'break leaves the loop; continue only skips to the next round.'),
          ] },
      ] },
      { title: 'Module 2 · Building Blocks', lessons: [
        { id: 'py-5', title: 'Functions: Reusable Code', mins: 15,
          body: `
<p>A <b>function</b> is a named block of code you can run whenever you want. Functions remove repetition and give structure to big programs.</p>
<h3>Defining and calling</h3>
${E`
def greet():
    print("Hello from a function!")

greet()      # call it
greet()      # call it again
`}
<h3>Parameters and return values</h3>
<p><b>Parameters</b> are inputs; <code>return</code> sends a result back to whoever called the function.</p>
${E`
def add(a, b):
    return a + b

result = add(3, 4)
print(result)           # 7
print(add(10, 5) * 2)   # 30 - a call is just a value
`}
${warn('<code>print</code> shows something on screen; <code>return</code> hands a value back. A function with no <code>return</code> gives back <code>None</code>.')}
<h3>Default and keyword arguments</h3>
${E`
def power(base, exponent=2):
    return base ** exponent

print(power(5))                  # 25  (default exponent)
print(power(2, 10))              # 1024
print(power(exponent=3, base=2)) # 8   (named arguments, any order)
`}
<h3>Scope</h3>
<p>Variables created inside a function are <b>local</b> — they vanish when it finishes. The outside world cannot see them.</p>
${E`
def make_label():
    label = "inside"
    return label

print(make_label())
# print(label)    # NameError: label only exists inside the function
`}
<h3>Docstrings and good design</h3>
${E`
def is_even(n):
    """Return True when n is even."""
    return n % 2 == 0

def average(numbers):
    return sum(numbers) / len(numbers)

print(is_even(10), average([4, 8, 9]))
`}
${tip('Aim for functions that do <b>one thing</b> and have a name that starts with a verb: <code>calculate_tax</code>, <code>is_valid</code>.')}
${trick('A function can return several values at once: <code>return low, high</code>, then <code>lo, hi = get_range()</code>.')}`,
          code: S`
            def celsius_to_fahrenheit(c):
                return c * 9 / 5 + 32

            def describe(temp_c):
                f = celsius_to_fahrenheit(temp_c)
                if f > 86:
                    return "hot"
                elif f > 59:
                    return "pleasant"
                return "cold"

            for t in [0, 18, 35]:
                print(t, "C =", celsius_to_fahrenheit(t), "F ->", describe(t))
          `,
          quiz: [
            Q('Which keyword defines a function?', ['function', 'def', 'fun', 'define'], 1, 'def name(parameters):'),
            Q('What does a function return when it has no return statement?', ['0', 'An empty string', 'None', 'An error'], 2, 'It returns None.'),
            Q('Where can a local variable be used?', ['Anywhere in the file', 'Only inside the function that created it', 'Only in loops', 'In other programs'], 1, 'Local scope is limited to the function.'),
          ] },
        { id: 'py-6', title: 'Lists, Dictionaries & Tuples', mins: 18,
          body: `
<p>So far a variable held a single value. <b>Collections</b> hold many values together.</p>
<h3>Lists — ordered and changeable</h3>
${E`
colors = ["red", "green", "blue"]
print(colors[0])         # red  (counting starts at 0!)
print(colors[-1])        # blue (negative = from the end)
colors.append("pink")    # add to the end
colors.insert(1, "gold") # insert at position 1
colors.remove("green")   # delete by value
last = colors.pop()      # remove & return the last item
print(colors, len(colors), "gold" in colors)
nums = [5, 2, 9, 1]
nums.sort()
print(nums, sum(nums), max(nums), min(nums))
print(nums[1:3])         # slicing: items 1 and 2 -> [2, 5]
`}
<h3>Looping and list comprehensions</h3>
${E`
squares = []
for n in range(1, 6):
    squares.append(n * n)
print(squares)

# the same in one line - a list comprehension:
squares2 = [n * n for n in range(1, 6)]
evens = [n for n in range(20) if n % 2 == 0]
print(squares2, evens)
`}
<h3>Dictionaries — look things up by key</h3>
<p>A dictionary stores <b>key: value</b> pairs, like a real dictionary maps a word to its meaning.</p>
${E`
student = {"name": "Omar", "age": 16, "grade": "A"}
print(student["name"])
student["age"] = 17            # change
student["city"] = "Cairo"      # add
print(student.get("phone", "unknown"))   # safe lookup with default
for key, value in student.items():
    print(key, "->", value)
print(list(student.keys()))
`}
<h3>Tuples and sets</h3>
${E`
point = (3, 4)              # tuple: ordered but NOT changeable
x, y = point                # unpacking
print(x, y)
unique = {1, 2, 2, 3, 3, 3} # set: no duplicates
print(unique, len(unique))
`}
<h3>Which one should I use?</h3>
<ul><li><b>list</b> — an ordered sequence you will change.</li><li><b>dict</b> — fast lookup by a name/ID.</li><li><b>tuple</b> — a fixed group (coordinates, RGB colour).</li><li><b>set</b> — uniqueness and membership tests.</li></ul>
${tip('Counting words? A dictionary does it: <code>counts[w] = counts.get(w, 0) + 1</code>.')}
${warn('<code>IndexError: list index out of range</code> means you asked for a position that does not exist. The last valid index is <code>len(list) - 1</code>.')}`,
          code: S`
            text = "the quick brown fox jumps over the lazy dog the end"
            counts = {}
            for word in text.split():
                counts[word] = counts.get(word, 0) + 1
            print(counts)

            scores = [72, 95, 88, 61, 99]
            print("Top score:", max(scores))
            print("Average:", sum(scores) / len(scores))
            print("Passed:", [s for s in scores if s >= 70])
          `,
          quiz: [
            Q('Given a = [10, 20, 30], what is a[1]?', ['10', '20', '30', 'Error'], 1, 'Indexes start at 0.'),
            Q('Which structure maps keys to values?', ['list', 'tuple', 'dictionary', 'range'], 2, 'Dictionaries use key: value pairs.'),
            Q('What does [x*2 for x in [1,2,3]] give?', ['[1,2,3]', '[2,4,6]', '[2,3,4]', '6'], 1, 'Each item is doubled.'),
          ] },
      ] },
      { title: 'Module 3 · Going Further', lessons: [
        { id: 'py-7', title: 'Object-Oriented Programming', mins: 20,
          body: `
<p>Real-world programs model <i>things</i>: students, bank accounts, enemies in a game. <b>Object-Oriented Programming (OOP)</b> lets you bundle <b>data</b> (attributes) and <b>behaviour</b> (methods) into one unit.</p>
<h3>Class vs object</h3>
<p>A <b>class</b> is a blueprint (like the plan of a house). An <b>object</b> (instance) is one real house built from it. You can build many.</p>
${E`
class Dog:
    def __init__(self, name, age):     # constructor: runs when an object is created
        self.name = name               # attributes belong to the object
        self.age = age

    def bark(self):                    # a method
        return f"{self.name} says Woof!"

    def birthday(self):
        self.age += 1

rex = Dog("Rex", 3)
luna = Dog("Luna", 5)
print(rex.bark())
rex.birthday()
print(rex.name, rex.age, luna.age)
`}
<p><code>self</code> means "this particular object". Python passes it automatically when you call <code>rex.bark()</code>.</p>
<h3>The four pillars</h3>
<ul>
<li><b>Encapsulation</b> — keep data and the code that uses it together; hide details (by convention, start private names with <code>_</code>).</li>
<li><b>Inheritance</b> — a new class reuses and extends an existing one.</li>
<li><b>Polymorphism</b> — different classes respond to the same method name in their own way.</li>
<li><b>Abstraction</b> — expose a simple interface, hide the complexity.</li>
</ul>
<h3>Inheritance &amp; polymorphism in action</h3>
${E`
class Animal:
    def __init__(self, name):
        self.name = name
    def speak(self):
        return "..."

class Cat(Animal):                 # Cat inherits from Animal
    def speak(self):               # override
        return f"{self.name}: Meow"

class Cow(Animal):
    def speak(self):
        return f"{self.name}: Moo"

for pet in [Cat("Tom"), Cow("Bella"), Animal("Thing")]:
    print(pet.speak())             # same call, different behaviour
`}
<h3>A practical example: a bank account</h3>
${E`
class Account:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self._balance = balance

    def deposit(self, amount):
        if amount <= 0:
            raise ValueError("Deposit must be positive")
        self._balance += amount

    def balance(self):
        return self._balance

    def __str__(self):             # what print() shows
        return f"{self.owner}: {self._balance}"

acc = Account("Sara", 100)
acc.deposit(50)
print(acc)
`}
${tip('Name classes in <code>CapitalizedWords</code>, and ask "does this class have <i>one</i> clear job?"')}
${warn('Forgetting <code>self</code> as the first parameter of a method gives <code>TypeError: takes 0 positional arguments but 1 was given</code>.')}`,
          code: S`
            class Student:
                def __init__(self, name):
                    self.name = name
                    self.grades = []

                def add_grade(self, g):
                    self.grades.append(g)

                def average(self):
                    return sum(self.grades) / len(self.grades)

                def __str__(self):
                    return f"{self.name} (avg {self.average():.1f})"

            s = Student("Mona")
            for g in [90, 85, 100]:
                s.add_grade(g)
            print(s)
          `,
          quiz: [
            Q('What is a class?', ['A running program', 'A blueprint for creating objects', 'A kind of loop', 'A variable type'], 1, 'Classes are blueprints; objects are the things built from them.'),
            Q('What is __init__ for?', ['Deleting an object', 'Initialising a new object', 'Printing', 'Importing modules'], 1, 'It is the constructor.'),
            Q('Cat(Animal) means…', ['Cat contains Animal', 'Cat inherits from Animal', 'Animal inherits from Cat', 'They are unrelated'], 1, 'The parent class goes in the parentheses.'),
          ] },
        { id: 'py-8', title: 'Recursion, Searching & Sorting', mins: 22,
          body: `
<p>Now we meet classic <b>algorithms</b> — step-by-step recipes for solving problems efficiently.</p>
<h3>Recursion: a function that calls itself</h3>
<p>Every recursive function needs (1) a <b>base case</b> that stops, and (2) a <b>recursive case</b> that makes the problem smaller.</p>
${E`
def factorial(n):
    if n <= 1:                 # base case
        return 1
    return n * factorial(n - 1)   # smaller problem

print(factorial(5))            # 120

def fib(n):
    return n if n < 2 else fib(n - 1) + fib(n - 2)
print([fib(i) for i in range(10)])
`}
<h3>Linear vs binary search</h3>
<p>Linear search checks every item: slow on huge lists. <b>Binary search</b> works on <i>sorted</i> data and halves the search area each step.</p>
${E`
def binary_search(items, target):
    low, high = 0, len(items) - 1
    while low <= high:
        mid = (low + high) // 2
        if items[mid] == target:
            return mid
        elif items[mid] < target:
            low = mid + 1
        else:
            high = mid - 1
    return -1

print(binary_search([1, 3, 5, 7, 9, 11], 9))   # 4
`}
<h3>Sorting</h3>
<p>Bubble sort repeatedly swaps neighbours that are in the wrong order. It is easy to understand (but slow on big data).</p>
${E`
def bubble_sort(a):
    a = a[:]                          # work on a copy
    for i in range(len(a)):
        for j in range(len(a) - 1 - i):
            if a[j] > a[j + 1]:
                a[j], a[j + 1] = a[j + 1], a[j]
    return a
print(bubble_sort([5, 2, 9, 1, 7]))
`}
<h3>Big-O: how does it scale?</h3>
<table>
<tr><th>Notation</th><th>Name</th><th>Example</th></tr>
<tr><td>O(1)</td><td>constant</td><td>list[i], dict lookup</td></tr>
<tr><td>O(log n)</td><td>logarithmic</td><td>binary search</td></tr>
<tr><td>O(n)</td><td>linear</td><td>linear search, one loop</td></tr>
<tr><td>O(n²)</td><td>quadratic</td><td>bubble sort, nested loops</td></tr>
</table>
${trick('In real projects use Python\'s built-in <code>sorted(items)</code> / <code>items.sort()</code> (O(n log n)) and the <code>bisect</code> module — but understanding the algorithms makes you a better problem solver.')}
${warn('Recursion without a base case runs until Python raises <code>RecursionError</code>.')}`,
          code: S`
            def gcd(a, b):
                if b == 0:
                    return a
                return gcd(b, a % b)

            def bubble_sort(a):
                a = a[:]
                for i in range(len(a)):
                    for j in range(len(a) - 1 - i):
                        if a[j] > a[j + 1]:
                            a[j], a[j + 1] = a[j + 1], a[j]
                return a

            print("gcd(48, 18) =", gcd(48, 18))
            print(bubble_sort([9, 4, 7, 1, 8, 2]))
          `,
          quiz: [
            Q('What is the base case of a recursive function?', ['The first call', 'The condition that stops the recursion', 'The return type', 'A loop'], 1, 'Without it recursion never ends.'),
            Q('Binary search requires the data to be…', ['Unique', 'Numbers only', 'Sorted', 'In a dictionary'], 2, 'Halving only works when the data is ordered.'),
            Q('Which complexity grows slowest as n gets large?', ['O(n²)', 'O(n)', 'O(log n)', 'O(2ⁿ)'], 2, 'Logarithmic growth is very gentle.'),
          ] },
      ] },
    ],
  };
})(globalThis);

    { id: 'py-kw', title: 'Keywords, Identifiers & Statements', mins: 12,
      body: `
<p>Before writing bigger programs you need to know the vocabulary Python reserves for itself, how you may name your own things, and how Python decides where one instruction ends and the next begins.</p>
<h3>Keywords</h3>
<p><b>Keywords</b> are words with a special meaning (<code>if</code>, <code>for</code>, <code>def</code>…). You cannot use them as names. Python can list them for you:</p>
${E`
import keyword
print(len(keyword.kwlist), "keywords:")
print(keyword.kwlist)
print(keyword.iskeyword("class"), keyword.iskeyword("Class"))   # case matters
`}
<p><code>True</code>, <code>False</code> and <code>None</code> are keywords too — and the only ones that start with a capital letter.</p>
<h3>Identifiers</h3>
<p>An <b>identifier</b> is the name of a variable, function, class or module. The rules:</p>
<ul>
<li>Letters (a–z, A–Z), digits and underscores only; it cannot start with a digit.</li>
<li>It is case-sensitive: <code>score</code> and <code>Score</code> are different names.</li>
<li>It cannot be a keyword and it cannot contain spaces or symbols such as <code>$</code> or <code>-</code>.</li>
</ul>
${E`
user_name = "Sara"      # good: snake_case
userAge2 = 14           # legal, but not the Python style
_hidden = 1             # a leading underscore means "internal use"
# 2nd_place = 2         # SyntaxError: starts with a digit
# my-var = 3            # SyntaxError: hyphen is minus
`}
${tip('Use <code>snake_case</code> for variables and functions, <code>CapitalizedWords</code> for classes and <code>UPPER_CASE</code> for constants. A good name explains itself: <code>total_price</code> beats <code>tp</code>.')}
<h3>Statements and line continuation</h3>
<p>A <b>statement</b> is one instruction. Normally one line holds one statement, but long statements can be split safely inside brackets, or with a backslash:</p>
${E`
total = (10 + 20 +
         30 + 40)            # inside ( ) Python knows the statement continues
long_text = "Python " \
            "is readable"    # a backslash continues the line
a = 1; b = 2; c = a + b      # several statements on one line need ;  (avoid this style)
print(total, long_text, c)
`}
<h3>Indentation and blocks</h3>
<p>Python has no braces. A <b>block</b> (the body of an <code>if</code>, loop or function) is the group of lines indented by the same amount — the convention is <b>4 spaces</b>.</p>
${E`
if 5 > 3:
    print("inside the block")
    print("still inside")
print("outside again")
`}
${warn('Inconsistent indentation raises <code>IndentationError</code>. Never mix tabs and spaces in the same file.')}
<h3>Comments and docstrings</h3>
${E`
# A comment explains WHY, not what
def area(w, h):
    """Return the area of a rectangle.   <- a docstring documents the function"""
    return w * h

print(area.__doc__)
`}
${trick('Use <code>help(print)</code> or <code>print(len.__doc__)</code> to read built-in documentation right from your code.')}`,
      code: S`
        import keyword
        print("Python has", len(keyword.kwlist), "keywords")
        print("Is 'while' a keyword?", keyword.iskeyword("while"))

        total_price = (12.5 +
                       7.25 +
                       3.0)
        print("Total:", total_price)

        def greet(name):
            """Say hello to someone."""
            return "Hello, " + name

        print(greet("Mai"))
        print(greet.__doc__)
      `,
      quiz: [
        Q('Which of these is NOT a valid identifier?', ['_score', 'score2', '2score', 'Score'], 2, 'An identifier cannot start with a digit.'),
        Q('How does Python group the lines of a block?', ['Curly braces', 'begin / end words', 'Indentation', 'Semicolons'], 2, 'Consistent indentation (4 spaces) defines a block.'),
        Q('Which statement about keywords is true?', ['They can be used as variable names', 'True, False and None are keywords', 'They are case-insensitive', 'Python has no keywords'], 1, 'Keywords are reserved and case-sensitive; True/False/None are keywords.'),
      ] },

    { id: 'py-types', title: 'Data Types & Type Conversion', mins: 15,
      body: `
<p>Every value in Python has a <b>type</b> that decides what you can do with it. The built-in function <code>type()</code> tells you the type, and <code>isinstance()</code> checks it.</p>
<h3>The core types</h3>
${E`
print(type(42))            # int      whole numbers (any size!)
print(type(3.14))          # float    decimal numbers
print(type(2 + 3j))        # complex  numbers with an imaginary part
print(type("hi"))          # str      text
print(type(True))          # bool     True / False
print(type(None))          # NoneType "no value"
print(type([1, 2]), type((1, 2)), type({1, 2}), type({"a": 1}))
print(isinstance(5, int), isinstance(5.0, int))
`}
<h3>Integers have no size limit</h3>
${E`
print(2 ** 100)            # 1267650600228229401496703205376
print(10 ** 20 + 1)
`}
<h3>Floats are approximate</h3>
<p>Computers store decimals in binary, so some numbers cannot be exact. This surprises everybody once:</p>
${E`
print(0.1 + 0.2)                    # 0.30000000000000004
print(round(0.1 + 0.2, 2))          # 0.3
print(0.1 + 0.2 == 0.3)             # False !
import math
print(math.isclose(0.1 + 0.2, 0.3)) # True  - compare floats like this
`}
<h3>Type conversion (casting)</h3>
<p><b>Implicit</b> conversion happens automatically when it is safe (int + float gives float). <b>Explicit</b> conversion uses the type as a function.</p>
${E`
print(5 + 2.5)             # 7.5  (int became float)
print(int("42") + 8)       # 50   text -> int
print(float("3.5") * 2)    # 7.0
print(str(99) + " red balloons")
print(int(9.99), int(-9.99))   # 9 -9   int() truncates toward zero
print(bool(0), bool(""), bool([]), bool("0"), bool(7))   # False False False True True
print(list("abc"), tuple([1, 2]), set([1, 1, 2]))
`}
${warn('<code>int("3.7")</code> and <code>int("abc")</code> raise <code>ValueError</code>. Convert with <code>int(float("3.7"))</code> or validate first.')}
<h3>None</h3>
<p><code>None</code> means "nothing here yet". Functions without a <code>return</code> give back <code>None</code>. Test for it with <code>is None</code>.</p>
${tip('Truthiness rule of thumb: zero, empty containers, <code>""</code> and <code>None</code> are False; everything else is True.')}`,
      code: S`
        values = [42, 3.14, "hello", True, None, [1, 2], (3, 4), {"k": 1}]
        for v in values:
            print(repr(v).ljust(10), type(v).__name__)

        print("-- conversions --")
        print(int("12") + 1, float("2.5") + 1, str(7) + "!")
        print(int(7.9), round(7.9), bool(""), bool("False"))
        print(0.1 + 0.2, round(0.1 + 0.2, 2))
      `,
      quiz: [
        Q('What does int(9.99) return?', ['10', '9', '9.99', 'Error'], 1, 'int() truncates the decimal part.'),
        Q('Why is 0.1 + 0.2 == 0.3 False in Python?', ['A Python bug', 'Floats are stored approximately in binary', 'Python rounds up', 'It is actually True'], 1, 'Binary floating point cannot store 0.1 exactly. Use math.isclose().'),
        Q('What is bool("0")?', ['False', 'True', 'Error', 'None'], 1, 'Any non-empty string is True, even "0" or "False".'),
        Q('Which value represents "no value"?', ['0', '""', 'None', 'False'], 2, 'None is the single value of type NoneType.'),
      ] },

    { id: 'py-io', title: 'Input, Output & Import', mins: 16,
      body: `
<p>Programs become useful when they talk to people. You already know <code>print()</code>; now we look at its options, at reading input, at formatting nicely, and at borrowing code with <code>import</code>.</p>
<h3>print() in detail</h3>
${E`
print("a", "b", "c")                  # a b c
print("a", "b", "c", sep="-")         # a-b-c
print("loading", end="...")           # no newline at the end
print("done")
print("Total:", 5 * 3)
`}
<h3>input(): ask the user</h3>
<p><code>input(prompt)</code> pauses, reads one line and always returns a <b>string</b>. Convert it when you need a number.</p>
${E`
name = input("Your name? ")
age = int(input("Your age? "))
print("Hi", name, "- next year you will be", age + 1)
`}
<p>On this site, type the answers (one per line) in the <b>Input</b> box under the editor first. The starter code below is pre-filled for you.</p>
<h3>Formatting output</h3>
<p>f-strings are the modern, readable way. After a colon you can add a <b>format spec</b>:</p>
${E`
pi = 3.14159265
item, price, qty = "pen", 1.5, 12
print(f"pi is about {pi:.2f}")              # 2 decimals
print(f"{item:<8}|{price:>6.2f}|{qty:^6}|")  # left, right, centre alignment
print(f"{1234567:,}")                       # thousands separator: 1,234,567
print(f"{0.256:.1%}")                       # percentage: 25.6%
print(f"{42:05d} {255:x} {255:b}")          # zero pad, hex, binary
print("{} has {} items".format("cart", 3))  # older .format() style
print(f"{item = }")                         # debugging aid: item = 'pen'
`}
<h3>import: use code written by others</h3>
<p>Python ships with a huge <b>standard library</b>. Import a module, or just the names you need:</p>
${E`
import math
from random import randint, seed
import datetime as dt          # 'as' gives a shorter alias

print(math.sqrt(144), math.pi)
seed(1)                        # makes random numbers repeatable
print(randint(1, 6))
print(dt.date(2025, 1, 31).strftime("%d %B %Y"))
`}
${tip('Prefer <code>import module</code> over <code>from module import *</code>. The star-import hides where names come from and can overwrite your own.')}
${trick('<code>dir(math)</code> lists everything a module offers; <code>help(math.floor)</code> explains one function.')}`,
      stdin: 'Mai\n16',
      code: S`
        name = input("Your name? ")
        age = int(input("Your age? "))
        print(f"Hello {name}! Next year you will be {age + 1}.")

        price = 4.5
        qty = 3
        print(f"{'Item':<10}{'Price':>8}{'Qty':>5}")
        print(f"{'Notebook':<10}{price:>8.2f}{qty:>5}")
        print(f"Total: {price * qty:,.2f}")

        import math
        print("Square root of 2 =", round(math.sqrt(2), 4))
      `,
      quiz: [
        Q('What type does input() always return?', ['int', 'float', 'str', 'It depends on what you type'], 2, 'input() returns text; convert with int() or float().'),
        Q('What does print("a", "b", sep="-") display?', ['a b', 'a-b', 'ab', 'a- b'], 1, 'sep controls the separator between items.'),
        Q('What does f"{3.14159:.2f}" produce?', ['3.14159', '3.14', '3.1', '3'], 1, '.2f means two digits after the decimal point.'),
      ] },

    { id: 'py-ops', title: 'Operators in Depth', mins: 16,
      body: `
<p>Operators are symbols that combine values. You already met the arithmetic ones; here is the complete toolbox.</p>
<h3>Arithmetic</h3>
${E`
a, b = 17, 5
print(a + b, a - b, a * b)       # 22 12 85
print(a / b, a // b, a % b)      # 3.4 3 2    true / floor division, remainder
print(a ** 2, -a, abs(-a))       # 289 -17 17
print(divmod(a, b))              # (3, 2)     quotient and remainder together
print(-7 // 2, -7 % 2)           # -4 1       floor division rounds DOWN
`}
<h3>Comparison (result is True/False)</h3>
${E`
x = 7
print(x == 7, x != 7, x > 3, x <= 7)
print(1 < x < 10)                # chained comparison: 1 < x and x < 10
print("apple" < "banana")        # strings compare alphabetically
`}
<h3>Logical</h3>
<p><code>and</code>, <code>or</code>, <code>not</code> — and they <b>short-circuit</b>: Python stops as soon as the answer is known.</p>
${E`
age = 20
print(age > 18 and age < 65, age < 13 or age > 65, not age == 20)
name = ""
print(name or "Guest")           # 'or' returns the first truthy value: Guest
print(0 and 5, 3 and 5)          # 'and' returns the first falsy value, else the last: 0 5
`}
<h3>Assignment shortcuts</h3>
${E`
n = 10
n += 5; n -= 3; n *= 2; n //= 5; n **= 2; n %= 7
print(n)
x = y = 0               # chained assignment
a, b = 1, 2
a, b = b, a             # swap!
print(a, b)
`}
<h3>Bitwise (work on the binary digits)</h3>
${E`
print(5 & 3, 5 | 3, 5 ^ 3)       # 1 7 6     AND, OR, XOR
print(~5, 5 << 1, 5 >> 1)        # -6 10 2   NOT, shift left (x2), shift right (/2)
print(bin(10), int("1010", 2))   # 0b1010 10
`}
<h3>Identity and membership</h3>
${E`
a = [1, 2]; b = [1, 2]; c = a
print(a == b, a is b, a is c)    # True False True: == compares values, is compares identity
print(3 in [1, 2, 3], "x" not in "python", "th" in "python")
`}
<h3>Precedence (highest to lowest)</h3>
<table><tr><th>Level</th><th>Operators</th></tr>
<tr><td>1</td><td><code>( )</code></td></tr><tr><td>2</td><td><code>**</code></td></tr><tr><td>3</td><td><code>+x -x ~x</code></td></tr>
<tr><td>4</td><td><code>* / // %</code></td></tr><tr><td>5</td><td><code>+ -</code></td></tr><tr><td>6</td><td><code>&lt;&lt; &gt;&gt;</code></td></tr>
<tr><td>7</td><td><code>&amp; ^ |</code></td></tr><tr><td>8</td><td><code>== != &lt; &gt; in is</code></td></tr><tr><td>9</td><td><code>not</code>, then <code>and</code>, then <code>or</code></td></tr></table>
${tip('When in doubt, add parentheses. <code>(2 + 3) * 4</code> is clearer than relying on the table.')}
${warn('Use <code>is</code> only for <code>None</code> (<code>x is None</code>), never to compare numbers or strings.')}`,
      code: S`
        a, b = 17, 5
        print("division:", a / b, "floor:", a // b, "remainder:", a % b)
        print("power:", 2 ** 10, "divmod:", divmod(a, b))
        print("chained:", 1 < b < 10)
        print("short-circuit:", "" or "default", 0 and 99)
        print("bitwise:", 6 & 3, 6 | 3, 6 ^ 3, 1 << 4)
        print("membership:", "py" in "python", 4 not in [1, 2, 3])
        x = 5
        x += 3
        x *= 2
        print("x =", x)
        print("precedence:", 2 + 3 * 4, (2 + 3) * 4, 2 ** 3 ** 2)
      `,
      quiz: [
        Q('What is -7 // 2 in Python?', ['-3', '-4', '3', '-3.5'], 1, 'Floor division rounds toward negative infinity: -3.5 becomes -4.'),
        Q('What does "" or "Guest" evaluate to?', ['""', 'True', '"Guest"', 'False'], 2, 'or returns the first truthy operand.'),
        Q('Which operator compares identity?', ['==', 'is', 'in', '='], 1, 'is checks whether two names refer to the same object.'),
        Q('What is 2 + 3 * 4?', ['20', '14', '24', '9'], 1, 'Multiplication binds tighter than addition.'),
      ] },

    { id: 'py-bc', title: 'break, continue, pass & loop else', mins: 12,
      body: `
<p>These small statements give you fine control over loops (and over empty blocks).</p>
<h3>break — leave the loop now</h3>
${E`
for n in range(2, 50):
    if n * n > 200:
        print("first square above 200 comes from", n)
        break
`}
<h3>continue — skip to the next round</h3>
${E`
for n in range(1, 11):
    if n % 3 == 0:
        continue            # skip multiples of 3
    print(n, end=" ")
print()
`}
<h3>pass — do nothing (a placeholder)</h3>
<p>A block cannot be empty. <code>pass</code> fills it so the code is valid while you plan the rest.</p>
${E`
def feature_to_do_later():
    pass

for i in range(3):
    if i == 1:
        pass                # nothing special for 1
    else:
        print("round", i)
`}
<h3>The for-else and while-else clause</h3>
<p>An <code>else</code> after a loop runs only when the loop <b>finished without hitting break</b>. It is perfect for searches.</p>
${E`
def is_prime(n):
    if n < 2:
        return False
    for d in range(2, int(n ** 0.5) + 1):
        if n % d == 0:
            break
    else:
        return True      # no divisor found -> prime
    return False

print([n for n in range(2, 30) if is_prime(n)])
`}
<h3>Loops that wait for a condition</h3>
${E`
attempts = 0
while True:
    attempts += 1
    if attempts == 4:
        print("stopped after", attempts, "attempts")
        break
`}
${tip('<code>while True:</code> with a <code>break</code> inside is a common, readable way to write "repeat until something happens".')}
${warn('<code>break</code> only exits the <b>innermost</b> loop. To leave nested loops, put them in a function and <code>return</code>.')}`,
      code: S`
        # skip negatives, stop at 0
        numbers = [4, -2, 9, -7, 0, 15]
        total = 0
        for n in numbers:
            if n == 0:
                print("zero found, stopping")
                break
            if n < 0:
                continue
            total += n
        print("sum of positives before zero:", total)

        # search with for-else
        for word in ["cat", "dog", "bird"]:
            if word.startswith("z"):
                print("found a z-word")
                break
        else:
            print("no word starts with z")
      `,
      quiz: [
        Q('What does continue do?', ['Ends the loop', 'Skips the rest of this round and starts the next', 'Restarts the program', 'Does nothing'], 1, 'continue jumps to the next iteration.'),
        Q('When does the else block of a for loop run?', ['Always', 'Only if the loop never ran', 'When the loop ends without break', 'When break is used'], 2, 'for-else runs when no break happened.'),
        Q('What is pass used for?', ['Skipping a loop round', 'A placeholder for an empty block', 'Passing arguments', 'Exiting a function'], 1, 'pass does nothing; it keeps the syntax valid.'),
      ] },

    { id: 'py-loop2', title: 'Looping Tools: range, enumerate, zip & Nested Loops', mins: 16,
      body: `
<p>Python gives you several helpers that make loops shorter and less error-prone than counting by hand.</p>
<h3>range() recap</h3>
${E`
print(list(range(5)))              # [0, 1, 2, 3, 4]
print(list(range(2, 10, 3)))       # [2, 5, 8]
print(list(range(10, 0, -4)))      # [10, 6, 2]
`}
<h3>enumerate() — index and value together</h3>
${E`
fruits = ["apple", "kiwi", "plum"]
for i, fruit in enumerate(fruits, start=1):
    print(i, fruit)
`}
<h3>zip() — walk several lists in parallel</h3>
${E`
names = ["Ali", "Dina", "Omar"]
scores = [90, 85, 77]
for name, score in zip(names, scores):
    print(f"{name}: {score}")
print(dict(zip(names, scores)))     # build a dictionary
`}
<h3>reversed() and sorted()</h3>
${E`
for x in reversed([1, 2, 3]):
    print(x, end=" ")
print()
print(sorted(["pear", "fig", "apple"], key=len))   # sort by length
`}
<h3>Nested loops</h3>
<p>A loop inside a loop runs the inner one completely for each outer round — perfect for tables and patterns.</p>
${E`
for row in range(1, 5):
    print("*" * row)

for i in range(1, 4):
    for j in range(1, 4):
        print(i * j, end="\t")
    print()
`}
<h3>Common patterns</h3>
${E`
# counter
vowels = 0
for ch in "programming language":
    if ch in "aeiou":
        vowels += 1
print("vowels:", vowels)

# maximum
best = None
for n in [4, 17, 9, 12]:
    if best is None or n > best:
        best = n
print("largest:", best)

# sum of digits
total, n = 0, 90817
while n > 0:
    total += n % 10
    n //= 10
print("digit sum:", total)
`}
${trick('Looping over a dictionary? Use <code>for key, value in d.items():</code>. Looping over a string gives you its characters.')}
${warn('Do not modify a list while looping over it (adding/removing items). Loop over a copy: <code>for x in items[:]:</code>.')}`,
      code: S`
        students = ["Layla", "Omar", "Noor"]
        marks = [88, 95, 71]
        for rank, (name, mark) in enumerate(zip(students, marks), start=1):
            grade = "A" if mark >= 90 else "B" if mark >= 80 else "C"
            print(f"{rank}. {name:<6} {mark} -> {grade}")

        print()
        for i in range(1, 6):
            print(" " * (5 - i) + "*" * (2 * i - 1))

        print()
        for n in range(1, 4):
            print(" ".join(str(n * k) for k in range(1, 6)))
      `,
      quiz: [
        Q('What does enumerate(["a","b"], start=1) yield?', ['(0,"a"), (1,"b")', '(1,"a"), (2,"b")', '"a", "b"', '1, 2'], 1, 'start=1 makes the counter begin at 1.'),
        Q('What does zip([1,2],[3,4]) pair up?', ['(1,3), (2,4)', '(1,2), (3,4)', '(1,4), (2,3)', '[1,2,3,4]'], 0, 'zip pairs items by position.'),
        Q('How many times does print run? for i in range(3): for j in range(2): print(i, j)', ['3', '2', '5', '6'], 3, '3 outer × 2 inner = 6.'),
      ] },

    { id: 'py-args', title: 'Function Arguments: Default, Keyword, *args & **kwargs', mins: 17,
      body: `
<p>Python functions are very flexible about how they receive data. Master these patterns and library documentation becomes easy to read.</p>
<h3>Positional and keyword arguments</h3>
${E`
def describe(animal, sound):
    return f"The {animal} says {sound}"

print(describe("cow", "moo"))                  # by position
print(describe(sound="woof", animal="dog"))    # by name, any order
`}
<h3>Default values</h3>
${E`
def power(base, exponent=2):
    return base ** exponent

print(power(5), power(2, 10))
`}
${warn('Never use a mutable default like <code>def add(x, items=[])</code>. The list is created once and shared between calls! Use <code>items=None</code> and create the list inside.')}
${E`
def add_item(x, items=None):
    if items is None:
        items = []
    items.append(x)
    return items

print(add_item(1), add_item(2))     # [1] [2]  - separate lists
`}
<h3>*args — any number of positional arguments</h3>
${E`
def total(*numbers):
    print(type(numbers), numbers)    # a tuple
    return sum(numbers)

print(total(1, 2, 3), total(10))
`}
<h3>**kwargs — any number of keyword arguments</h3>
${E`
def show_profile(name, **details):
    print(name)
    for key, value in details.items():
        print(f"  {key}: {value}")

show_profile("Mai", age=16, city="Cairo", hobby="coding")
`}
<h3>Unpacking when calling</h3>
${E`
def volume(l, w, h):
    return l * w * h

dims = [2, 3, 4]
options = {"l": 5, "w": 2, "h": 2}
print(volume(*dims), volume(**options))
`}
<h3>Order of parameters</h3>
<p>Required parameters first, then defaults, then <code>*args</code>, then keyword-only, then <code>**kwargs</code>. A bare <code>*</code> or <code>/</code> forces keyword-only / positional-only arguments.</p>
${E`
def connect(host, port=80, *, secure=False):    # secure must be named
    return f"{'https' if secure else 'http'}://{host}:{port}"

print(connect("example.com", secure=True))
`}
<h3>Returning several values and type hints</h3>
${E`
def min_max(values: list) -> tuple:
    return min(values), max(values)      # really returns a tuple

low, high = min_max([4, 9, 2, 7])
print(low, high)
`}
${tip('Type hints (<code>: int</code>, <code>-&gt; str</code>) are not enforced by Python but make code self-documenting and help editors catch mistakes.')}`,
      code: S`
        def make_order(item, quantity=1, *extras, **options):
            line = f"{quantity} x {item}"
            if extras:
                line += " + " + ", ".join(extras)
            for key, value in options.items():
                line += f" [{key}={value}]"
            return line

        print(make_order("pizza"))
        print(make_order("pizza", 2, "cola", "salad", size="large", crust="thin"))

        def average(*nums):
            return sum(nums) / len(nums) if nums else 0

        print(average(80, 90, 100), average())
      `,
      quiz: [
        Q('What type is *args inside the function?', ['list', 'tuple', 'dict', 'set'], 1, '*args collects extra positional arguments into a tuple.'),
        Q('What is wrong with def f(x, items=[])?', ['Nothing', 'The default list is shared between calls', 'Lists cannot be defaults', 'It is a syntax error'], 1, 'Mutable defaults are created once. Use None instead.'),
        Q('Which call is valid for def f(a, b=2, *, c=3)?', ['f(1, 2, 3)', 'f(1, c=5)', 'f(c=5)', 'f(1, 2, 3, 4)'], 1, 'c is keyword-only; a is required.'),
      ] },

    { id: 'py-scope', title: 'Scope: Local, Global, nonlocal & Namespaces', mins: 14,
      body: `
<p>A <b>namespace</b> is a mapping from names to objects. A name is only visible in the places where it lives: that region is its <b>scope</b>. Python looks names up in this order, known as <b>LEGB</b>:</p>
<ol><li><b>L</b>ocal — inside the current function</li><li><b>E</b>nclosing — in outer functions</li><li><b>G</b>lobal — at the top of the file</li><li><b>B</b>uilt-in — <code>print</code>, <code>len</code>, …</li></ol>
${E`
x = "global"

def outer():
    x = "enclosing"
    def inner():
        x = "local"
        print("inner sees:", x)
    inner()
    print("outer sees:", x)

outer()
print("module sees:", x)
`}
<h3>Reading is free, assigning creates a local</h3>
${E`
counter = 0

def show():
    print("counter is", counter)     # reading a global is fine

def broken():
    counter += 1                     # UnboundLocalError: Python treats counter as local here

show()
try:
    broken()
except UnboundLocalError as e:
    print("Error:", e)
`}
<h3>global</h3>
<p>The <code>global</code> keyword lets a function rebind a module-level name.</p>
${E`
score = 0

def add_point():
    global score
    score += 1

add_point(); add_point()
print(score)
`}
${tip('Prefer passing values in and returning results out. Functions that change globals are harder to test and understand.')}
<h3>nonlocal</h3>
<p><code>nonlocal</code> rebinds a variable of the nearest <b>enclosing function</b> (not global).</p>
${E`
def make_counter():
    count = 0
    def tick():
        nonlocal count
        count += 1
        return count
    return tick

c = make_counter()
print(c(), c(), c())
`}
<h3>Inspecting namespaces</h3>
${E`
def f():
    a = 1
    b = 2
    print(locals())

f()
print("f" in globals(), "print" in dir(__builtins__))
`}
${warn('Do not name variables after built-ins (<code>list</code>, <code>sum</code>, <code>max</code>, <code>str</code>). You would hide the real function in that scope.')}`,
      code: S`
        total = 100          # global

        def apply_discount(price):
            discount = 0.1   # local to this function
            return price * (1 - discount)

        print(apply_discount(total))
        # print(discount)    # NameError: discount only exists inside the function

        def make_bank_account(balance):
            def deposit(amount):
                nonlocal balance
                balance += amount
                return balance
            return deposit

        deposit = make_bank_account(50)
        print(deposit(25), deposit(10))
      `,
      quiz: [
        Q('What does LEGB stand for?', ['Loop, Else, Global, Break', 'Local, Enclosing, Global, Built-in', 'Last, Early, Global, Base', 'List, Event, Group, Block'], 1, 'It is the order Python searches for a name.'),
        Q('Which keyword changes a variable of an enclosing function?', ['global', 'nonlocal', 'local', 'outer'], 1, 'nonlocal binds to the nearest enclosing function scope.'),
        Q('Why does counter += 1 fail inside a function without global?', ['Counters are read-only', 'Assignment makes counter a local variable that has no value yet', 'Python forbids +=', 'It does not fail'], 1, 'Any assignment inside a function creates a local name.'),
      ] },

    { id: 'py-rec', title: 'Recursion', mins: 17,
      body: `
<p>A <b>recursive</b> function solves a problem by calling itself on a smaller version of the same problem. Every recursion needs:</p>
<ol><li>a <b>base case</b> that can be answered directly, and</li><li>a <b>recursive step</b> that moves toward the base case.</li></ol>
<h3>Example 1: countdown</h3>
${E`
def countdown(n):
    if n == 0:                 # base case
        print("Liftoff!")
        return
    print(n)
    countdown(n - 1)           # smaller problem

countdown(3)
`}
<h3>Example 2: sum of a list</h3>
${E`
def total(items):
    if not items:              # empty list -> 0
        return 0
    return items[0] + total(items[1:])

print(total([4, 8, 15, 16]))
`}
<h3>How the calls stack up</h3>
<p>Each call waits for the next one to finish. For <code>factorial(3)</code>: <code>3 * factorial(2)</code> → <code>3 * (2 * factorial(1))</code> → <code>3 * (2 * 1)</code> = 6. Python keeps these waiting calls on the <b>call stack</b>.</p>
${E`
def factorial(n):
    if n <= 1:
        return 1
    return n * factorial(n - 1)

print([factorial(n) for n in range(1, 8)])
`}
<h3>Example 3: Fibonacci and memoisation</h3>
<p>The naive version recomputes the same values again and again (exponentially slow). Caching results fixes that.</p>
${E`
from functools import lru_cache

@lru_cache(maxsize=None)
def fib(n):
    return n if n < 2 else fib(n - 1) + fib(n - 2)

print(fib(50))      # instant with the cache
`}
<h3>Example 4: Towers of Hanoi</h3>
${E`
def hanoi(n, source, target, spare):
    if n == 0:
        return
    hanoi(n - 1, source, spare, target)
    print(f"move disk {n}: {source} -> {target}")
    hanoi(n - 1, spare, target, source)

hanoi(3, "A", "C", "B")
`}
<h3>Recursion limits</h3>
${E`
import sys
print(sys.getrecursionlimit())     # usually 1000

def forever(n):
    return forever(n + 1)          # no base case!

try:
    forever(0)
except RecursionError as e:
    print("RecursionError:", e)
`}
${tip('Anything recursive can be written with a loop. Use recursion when it matches the problem: trees, nested data, divide-and-conquer.')}
${warn('Forgetting the base case, or not moving toward it, causes infinite recursion and a <code>RecursionError</code>.')}`,
      code: S`
        def power(base, exp):
            if exp == 0:
                return 1
            return base * power(base, exp - 1)

        def digit_sum(n):
            if n < 10:
                return n
            return n % 10 + digit_sum(n // 10)

        def reverse(text):
            if len(text) <= 1:
                return text
            return reverse(text[1:]) + text[0]

        print(power(2, 10))
        print(digit_sum(90817))
        print(reverse("recursion"))
      `,
      quiz: [
        Q('What stops a recursion?', ['The recursive step', 'The base case', 'A loop', 'The return type'], 1, 'The base case returns without calling again.'),
        Q('What does factorial(4) return?', ['10', '16', '24', '4'], 2, '4 × 3 × 2 × 1 = 24.'),
        Q('Which error appears when recursion never ends?', ['ValueError', 'RecursionError', 'TypeError', 'NameError'], 1, 'Python raises RecursionError when the stack limit is exceeded.'),
      ] },

    { id: 'py-lambda', title: 'Lambda, map, filter & sorted()', mins: 14,
      body: `
<p>A <b>lambda</b> is a tiny anonymous function written in one expression: <code>lambda parameters: expression</code>. It returns the value of the expression automatically.</p>
${E`
square = lambda x: x * x
add = lambda a, b: a + b
print(square(7), add(2, 3))

# the same with def:
def square2(x):
    return x * x
`}
<h3>Where lambdas shine: short throw-away functions</h3>
<h3>map() — transform every item</h3>
${E`
nums = [1, 2, 3, 4]
print(list(map(lambda n: n * 10, nums)))        # [10, 20, 30, 40]
print(list(map(str.upper, ["a", "b"])))         # existing functions work too
`}
<h3>filter() — keep items that pass a test</h3>
${E`
print(list(filter(lambda n: n % 2 == 0, range(10))))     # [0, 2, 4, 6, 8]
words = ["tree", "", "sun", ""]
print(list(filter(None, words)))                          # removes empty strings
`}
<h3>sorted(), min(), max() with key=</h3>
<p>The <code>key</code> function is applied to each item to decide the order.</p>
${E`
people = [("Ali", 31), ("Dina", 24), ("Omar", 28)]
print(sorted(people, key=lambda p: p[1]))               # by age
print(max(people, key=lambda p: p[1]))
print(sorted(["banana", "kiwi", "fig"], key=len, reverse=True))
`}
<h3>reduce() — fold a list into one value</h3>
${E`
from functools import reduce
print(reduce(lambda acc, n: acc * n, [1, 2, 3, 4, 5]))   # 120
`}
<h3>Functions are values</h3>
<p>You can store functions in variables, put them in lists and pass them to other functions.</p>
${E`
def apply(func, value):
    return func(value)

operations = {"double": lambda x: x * 2, "negate": lambda x: -x}
for name, f in operations.items():
    print(name, apply(f, 21))
`}
${tip('If a lambda gets long or needs a name for clarity, write a normal <code>def</code>. Readability wins.')}
${trick('List comprehensions are often clearer than map/filter: <code>[n * 10 for n in nums if n &gt; 1]</code>. You will meet them soon.')}`,
      code: S`
        prices = [19.99, 5.5, 42.0, 7.25]
        with_tax = list(map(lambda p: round(p * 1.14, 2), prices))
        print(with_tax)

        cheap = list(filter(lambda p: p < 10, prices))
        print(cheap)

        students = [("Noor", 92), ("Ali", 78), ("Dina", 85)]
        ranking = sorted(students, key=lambda s: s[1], reverse=True)
        for place, (name, mark) in enumerate(ranking, 1):
            print(place, name, mark)
      `,
      quiz: [
        Q('What does (lambda x: x + 1)(4) return?', ['4', '5', 'a function', 'Error'], 1, 'The lambda is called immediately with 4.'),
        Q('Which function keeps only items that pass a test?', ['map', 'filter', 'reduce', 'zip'], 1, 'filter(function, items) keeps items where function returns True.'),
        Q('What does sorted(words, key=len) sort by?', ['Alphabet', 'Word length', 'Last letter', 'Nothing'], 1, 'key=len compares the lengths.'),
      ] },

    { id: 'py-mod', title: 'Modules & Packages', mins: 16,
      body: `
<p>As programs grow you split them into files. In Python every <code>.py</code> file is a <b>module</b>, and a folder of modules is a <b>package</b>.</p>
<h3>Importing in different ways</h3>
${E`
import math                     # use as math.sqrt(...)
from math import sqrt, pi       # use sqrt(...) directly
import random as rnd            # alias
print(math.floor(2.7), sqrt(81), round(pi, 3))
`}
<h3>Useful standard-library modules</h3>
<table><tr><th>Module</th><th>What it gives you</th></tr>
<tr><td><code>math</code></td><td>sqrt, ceil, floor, pi, trigonometry</td></tr>
<tr><td><code>random</code></td><td>randint, choice, shuffle, sample</td></tr>
<tr><td><code>datetime</code></td><td>dates and times</td></tr>
<tr><td><code>collections</code></td><td>Counter, deque, defaultdict</td></tr>
<tr><td><code>statistics</code></td><td>mean, median, stdev</td></tr>
<tr><td><code>json</code>, <code>csv</code></td><td>reading and writing data files</td></tr>
<tr><td><code>os</code>, <code>pathlib</code></td><td>files and folders</td></tr></table>
${E`
import random, statistics
random.seed(7)                          # repeatable results
print(random.randint(1, 100), random.choice(["red", "green", "blue"]))
data = [4, 8, 15, 16, 23, 42]
print(statistics.mean(data), statistics.median(data))
`}
<h3>Writing your own module</h3>
<p>Any Python file can be imported. Let us create <code>geometry.py</code> from code and import it:</p>
${E`
source = '''
PI = 3.14159

def circle_area(r):
    return PI * r * r

if __name__ == "__main__":
    print("running geometry.py directly")
'''
with open("geometry.py", "w") as f:
    f.write(source)

import geometry
print(geometry.circle_area(2))
print(geometry.__name__)
`}
<h3>if __name__ == "__main__"</h3>
<p>When a file is run directly its <code>__name__</code> is <code>"__main__"</code>; when it is imported, <code>__name__</code> is the module name. This idiom lets a file act as both a library and a script.</p>
<h3>Packages</h3>
<p>A package is a folder containing modules (and usually an <code>__init__.py</code>). You import from it with dots: <code>from shop.cart import add_item</code>. Third-party packages are installed with <code>pip install name</code> and then imported the same way.</p>
${tip('Name modules in <code>lower_case</code> and avoid names that clash with the standard library (a file called <code>random.py</code> would hide the real one).')}
${warn('Importing the same module twice is cheap: Python loads it once and reuses it. Edit your module? Restart the program (or use <code>importlib.reload</code>).')}`,
      code: S`
        import math, random, statistics
        from collections import Counter

        random.seed(3)
        rolls = [random.randint(1, 6) for _ in range(12)]
        print("rolls:", rolls)
        print("mean:", round(statistics.mean(rolls), 2), "most common:", Counter(rolls).most_common(1))

        radius = 3
        print("circle area:", round(math.pi * radius ** 2, 2))
        print("hypotenuse:", math.hypot(3, 4), "ceil:", math.ceil(4.1))
      `,
      quiz: [
        Q('What is a module?', ['A folder of images', 'A Python file that can be imported', 'A kind of loop', 'A variable'], 1, 'Every .py file is a module.'),
        Q('What does if __name__ == "__main__": do?', ['Runs code only when the file is executed directly', 'Imports the main module', 'Defines main()', 'Nothing'], 0, 'It guards code that should not run on import.'),
        Q('Which statement imports only sqrt from math?', ['import math.sqrt', 'from math import sqrt', 'include sqrt', 'using math'], 1, 'from module import name.'),
      ] },
  ]);
})(globalThis);

(function (g) {
  const { E, S, tip, trick, warn, Q } = g.CK;
  g.CK.add('py', [
    { id: 'py-str', title: 'Strings in Depth', mins: 18,
      body: `
<p>A <b>string</b> is an ordered, <b>immutable</b> sequence of characters. "Immutable" means you can never change a string in place; every operation builds a new one.</p>
<h3>Creating strings</h3>
${E`
a = "double quotes"
b = 'single quotes'
c = """a string
spanning several lines"""
d = "She said \"hi\" and left\tnow\nnew line"
e = r"C:\new\table"           # raw string: backslashes are kept as typed
print(a, b, c, d, e, sep="\n")
`}
<h3>Indexing and slicing</h3>
${E`
s = "PYTHON"
print(s[0], s[-1], len(s))      # P N 6
print(s[1:4], s[:2], s[3:])     # YTH PY HON
print(s[::2], s[::-1])          # PTO NOHTYP   (step; reversed)
# s[0] = "J"                    # TypeError: strings are immutable
print("J" + s[1:])              # build a new string instead
`}
<h3>Useful methods</h3>
${E`
t = "  Learn Python, learn well  "
print(t.strip())                         # remove outer spaces
print(t.lower(), t.upper(), t.title())
print(t.replace("learn", "teach"))       # case-sensitive
print(t.count("n"), t.find("Py"), t.find("zzz"))   # find returns -1 if missing
print("learn" in t.lower())
print(t.strip().split(","))              # ['Learn Python', ' learn well']
print("-".join(["a", "b", "c"]))         # a-b-c
print("data.csv".endswith(".csv"), "Hello".startswith("He"))
`}
<h3>Testing the content</h3>
${E`
print("123".isdigit(), "abc".isalpha(), "ab12".isalnum(), "  ".isspace())
print("Hello".islower(), "HELLO".isupper())
`}
<h3>Looping and building strings</h3>
${E`
word = "banana"
print({ch: word.count(ch) for ch in set(word)})
result = ""
for ch in word:
    if ch != "a":
        result += ch
print(result)                    # bnn
print("=" * 20)
print("ab" * 3)
`}
<h3>Formatting recap</h3>
${E`
name, score = "Ali", 91.456
print(f"{name} scored {score:.1f}")
print("%s scored %.1f" % (name, score))
print("{} scored {:.1f}".format(name, score))
`}
<h3>Characters and codes</h3>
${E`
print(ord("A"), chr(97))              # 65 a
shifted = "".join(chr(ord(c) + 1) for c in "HAL")
print(shifted)                         # IBM
`}
${tip('To build a big string from many pieces, collect them in a list and use <code>"".join(parts)</code>. It is much faster than repeated <code>+=</code>.')}
${warn('<code>strip()</code> returns a new string. Writing <code>text.strip()</code> alone does nothing — assign the result: <code>text = text.strip()</code>.')}`,
      code: S`
        sentence = "the quick brown fox jumps over the lazy dog"
        words = sentence.split()
        print("words:", len(words))
        print("longest:", max(words, key=len))
        print("title case:", sentence.title())
        print("reversed words:", " ".join(reversed(words)))

        def is_palindrome(text):
            cleaned = "".join(ch.lower() for ch in text if ch.isalnum())
            return cleaned == cleaned[::-1]

        print(is_palindrome("A man, a plan, a canal: Panama"))
        print(is_palindrome("Python"))
        caesar = "".join(chr((ord(c) - 97 + 3) % 26 + 97) if c.isalpha() else c for c in "hello world")
        print("caesar +3:", caesar)
      `,
      quiz: [
        Q('What does "Python"[1:4] return?', ['Pyt', 'yth', 'ytho', 'tho'], 1, 'Slices start at index 1 and stop before 4.'),
        Q('Which statement is true about strings?', ['They are mutable', 'They are immutable', 'They cannot be sliced', 'They are numbers'], 1, 'You cannot change a string in place.'),
        Q('What does "a,b,c".split(",") return?', ['"abc"', '["a","b","c"]', '("a","b","c")', '"a b c"'], 1, 'split returns a list of parts.'),

          body: `
<p>Decisions use <b>bool</b> conditions. In C++ the condition goes in <b>parentheses</b> and the block in <b>braces</b>.</p>
${E`
int score = 85;
if (score >= 90) {
    cout << "A" << endl;
} else if (score >= 80) {
    cout << "B" << endl;
} else {
    cout << "Keep practising" << endl;
}
`}
<h3>Comparison and logic operators</h3>
<p><code>==</code> <code>!=</code> <code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code> compare. Combine with <code>&amp;&amp;</code> (and), <code>||</code> (or), <code>!</code> (not).</p>
${E`
int age = 20; bool member = true;
if (age >= 18 && member) cout << "Entry allowed" << endl;
if (age < 13 || age > 65) cout << "Discount" << endl;
if (!member) cout << "Please join" << endl;
`}
${warn('<code>if (x = 5)</code> <i>assigns</i> 5 and is always true. You almost always mean <code>if (x == 5)</code>.')}
<h3>The ternary operator</h3>
<p>A compact if/else that produces a value: <code>condition ? valueIfTrue : valueIfFalse</code></p>
${E`
int n = 7;
string kind = (n % 2 == 0) ? "even" : "odd";
cout << n << " is " << kind << endl;
`}
<h3>switch for many fixed choices</h3>
${E`
int day = 3;
switch (day) {
    case 1: cout << "Mon" << endl; break;
    case 2: cout << "Tue" << endl; break;
    case 3: cout << "Wed" << endl; break;
    default: cout << "Other" << endl;
}
`}
<p>Each <code>case</code> needs a <code>break;</code>, otherwise execution <i>falls through</i> into the next case.</p>
${tip('Even with a single statement, many teams always use braces: it prevents bugs when you add a second line later.')}`,
          code: S`
            #include <iostream>
            using namespace std;

            int main() {
                int number = 12;
                if (number % 3 == 0 && number % 5 == 0) {
                    cout << "FizzBuzz" << endl;
                } else if (number % 3 == 0) {
                    cout << "Fizz" << endl;
                } else if (number % 5 == 0) {
                    cout << "Buzz" << endl;
                } else {
                    cout << number << endl;
                }

                int day = 6;
                switch (day) {
                    case 6:
                    case 7:
                        cout << "Weekend!" << endl;
                        break;
                    default:
                        cout << "Weekday" << endl;
                }
                return 0;
            }
          `,
          quiz: [
            Q('Which symbol means logical AND?', ['&', '&&', 'and', '||'], 1, '&& is logical AND in C++.'),
            Q('What happens if you forget break in a switch case?', ['Compile error', 'Execution continues into the next case', 'The program ends', 'Nothing'], 1, 'This is called fall-through.'),

<h3>The for loop</h3>
<p>Use it when you know how many times to repeat. It has three parts: <b>start; condition; step</b>.</p>
${E`
for (int i = 1; i <= 5; i++) {
    cout << "Round " << i << endl;
}
`}
<ol>
<li><code>int i = 1</code> runs once, at the start.</li>
<li><code>i &lt;= 5</code> is checked before every round.</li>
<li><code>i++</code> runs after every round (adds 1).</li>
</ol>
<h3>The while loop</h3>
${E`
int n = 3;
while (n > 0) {
    cout << n << "..." << endl;
    n--;
}
cout << "Go!" << endl;
`}
<h3>do-while: run at least once</h3>
${E`
int tries = 0;
do {
    tries++;
    cout << "Attempt " << tries << endl;
} while (tries < 3);
`}
<h3>break, continue and nested loops</h3>

for (int i = 1; i <= 3; i++) {
    for (int j = 1; j <= 3; j++) {

    cout << endl;
}
for (int k = 1; k <= 10; k++) {
    if (k == 4) continue;   // skip 4
    if (k == 7) break;      // stop at 7
    cout << k << " ";
}
cout << endl;
`}

${E`

for (int x : nums) cout << x * 2 << " ";
cout << endl;

<p>A <b>function</b> packages code under a name. In C++ you declare its <b>return type</b>, its <b>name</b>, and its <b>parameters</b> (with types).</p>
${E`
int add(int a, int b) {
    return a + b;
}

void greet(string name) {      // void = returns nothing
    cout << "Hello, " << name << "!" << endl;
}

int main() {
    cout << add(3, 4) << endl;
    greet("Noor");
    return 0;
}
`}
<h3>Declaration order &amp; prototypes</h3>
<p>C++ reads top to bottom, so a function must be known <i>before</i> it is called. Either define it above <code>main</code>, or write a <b>prototype</b> (just the signature + <code>;</code>) at the top and the full body later.</p>
${E`
int square(int x);                 // prototype

int main() {
    cout << square(6) << endl;
    return 0;
}

int square(int x) {                // definition
    return x * x;
}
`}
<h3>Default arguments</h3>
${E`
int power(int base, int exp = 2) {
    int result = 1;
    for (int i = 0; i < exp; i++) result *= base;
    return result;
}
// power(5) -> 25   power(2, 10) -> 1024
`}
<h3>Pass by value vs by reference</h3>
<p>By default a function gets a <b>copy</b> of each argument. Add <code>&amp;</code> to work on the original (<code>void addOne(int &amp;x)</code>). References are an important C++ superpower; you will use them heavily with large vectors to avoid copying.</p>
${warn('Browser note: the practice simulator does not model references for plain numbers; run that kind of code in a real compiler to see it.')}
<h3>Scope &amp; recursion</h3>
<p>Variables live only inside the braces where they are created. A function may call itself (recursion) as long as it has a base case.</p>

            #include <iostream>
            using namespace std;

            bool isPrime(int n) {
                if (n < 2) return false;
                for (int i = 2; i * i <= n; i++) {
                    if (n % i == 0) return false;
                }
                return true;
            }

            int factorial(int n) {
                if (n <= 1) return 1;
                return n * factorial(n - 1);
            }

            int main() {
                for (int n = 1; n <= 20; n++) {
                    if (isPrime(n)) cout << n << " ";
                }
                cout << endl;
                cout << "5! = " << factorial(5) << endl;
                return 0;
            }
          `,

${E`

<h3>vector: the resizable array (use this by default!)</h3>
${E`
#include <vector>
vector<int> v = {5, 3, 8};

<p>A <b>class</b> is a blueprint that bundles <b>data</b> (member variables) with the <b>functions</b> that work on it (member functions). An <b>object</b> is one instance of that blueprint.</p>
${E`
class Rectangle {
private:                       // hidden from the outside (encapsulation)
    double width;
    double height;
public:                        // the safe interface
    Rectangle(double w, double h) {   // constructor: same name as the class
        width = w;
        height = h;
    }
    double area() { return width * height; }
    void describe() {
        cout << width << " x " << height << " = " << area() << endl;
    }
};

int main() {
    Rectangle r(3, 4);
    r.describe();
    return 0;
}

<h3>Access specifiers</h3>
<ul><li><code>private</code> — only the class itself can use it.</li><li><code>public</code> — anyone can.</li><li><code>protected</code> — the class and its children.</li></ul>
<p>Hiding data behind functions (<b>encapsulation</b>) lets a class protect itself: a <code>BankAccount</code> can refuse a negative deposit.</p>
<h3>Inheritance</h3>
${E`
class Animal {
public:
    string name;
    Animal(string n) { name = n; }
    string speak() { return name + " makes a sound"; }
};

class Dog : public Animal {          // Dog IS-A Animal
public:
    Dog(string n) : Animal(n) { }
    string speak() { return name + " says Woof"; }
};
`}
<h3>Polymorphism &amp; virtual functions</h3>
<p>Mark a base-class function <code>virtual</code> and call it through a base pointer: C++ then picks the right version at run time. (Pointers and <code>virtual</code> are covered in the advanced track — the idea is: <i>same call, different behaviour</i>.)</p>

            class BankAccount {

            public:
                BankAccount(string o, double b) {

<h3>Recursion</h3>
<p>A function that calls itself on a smaller problem until it hits a <b>base case</b>.</p>
${E`
int fib(int n) {
    if (n < 2) return n;            // base case
    return fib(n - 1) + fib(n - 2); // recursive case
}
`}
<h3>Binary search</h3>
<p>On a <i>sorted</i> vector, compare with the middle item and discard half of the data each step: O(log n).</p>
${E`
int binarySearch(vector<int> a, int target) {
    int low = 0, high = a.size() - 1;
    while (low <= high) {
        int mid = (low + high) / 2;
        if (a[mid] == target) return mid;
        if (a[mid] < target) low = mid + 1;
        else high = mid - 1;
    }
    return -1;      // not found
}
`}
<h3>Bubble sort</h3>
${E`
int a[] = {5, 2, 9, 1, 7};
int n = 5;
for (int i = 0; i < n - 1; i++)
    for (int j = 0; j < n - 1 - i; j++)
        if (a[j] > a[j + 1]) swap(a[j], a[j + 1]);
for (int x : a) cout << x << " ";
`}
<h3>How fast is it? (Big-O)</h3>
<table><tr><th>Algorithm</th><th>Time</th></tr>
<tr><td>Linear search</td><td>O(n)</td></tr><tr><td>Binary search</td><td>O(log n)</td></tr>
<tr><td>Bubble sort</td><td>O(n²)</td></tr><tr><td><code>std::sort</code></td><td>O(n log n)</td></tr></table>
${tip('In contests and real projects use <code>sort(v.begin(), v.end())</code> from <code>&lt;algorithm&gt;</code>. Learn the manual versions to understand <i>why</i> they work.')}
${trick('Integer overflow: <code>(low + high) / 2</code> can overflow for huge arrays; the safe form is <code>low + (high - low) / 2</code>.')}`,
          code: S`
            #include <iostream>
            #include <vector>
            using namespace std;

            int binarySearch(vector<int> a, int target) {
                int low = 0, high = a.size() - 1;
                while (low <= high) {
                    int mid = (low + high) / 2;
                    if (a[mid] == target) return mid;
                    if (a[mid] < target) low = mid + 1;
                    else high = mid - 1;
                }
                return -1;
            }

            int main() {
                vector<int> a = {9, 4, 7, 1, 8, 2};
                int n = a.size();
                for (int i = 0; i < n - 1; i++) {
                    for (int j = 0; j < n - 1 - i; j++) {
                        if (a[j] > a[j + 1]) swap(a[j], a[j + 1]);
                    }
                }
                for (int x : a) cout << x << " ";
                cout << endl;
                cout << "Index of 7: " << binarySearch(a, 7) << endl;
                return 0;
            }
          `,

<p>A <b>variable</b> is a named place in memory that holds a value. In C++ you declare the <b>type</b> first, then the name, and you can give it a starting value at the same time.</p>
${E`
int age = 15;               // classic initialisation
double price(9.99);         // constructor style
int level{3};               // brace (uniform) initialisation
auto score = 42;            // the compiler deduces: int
string name = "Sara";
cout << name << " " << age << " " << price << " " << level << " " << score << endl;
`}
<h3>Declaring several at once</h3>
${E`
int a = 1, b = 2, c = a + b;
int x, y, z;                // uninitialised in real C++ (garbage!) - always give a value
x = y = z = 0;              // chained assignment
cout << a << b << c << x << y << z << endl;
`}
<h3>Naming rules</h3>
<ul><li>Letters, digits and underscores; cannot start with a digit.</li><li>Case-sensitive: <code>Total</code> and <code>total</code> are different.</li><li>Cannot be a keyword (<code>int</code>, <code>class</code>, <code>return</code> …).</li></ul>
<h3>Literals: values written directly in code</h3>
${E`
cout << 42 << " " << -7 << endl;              // integer literals
cout << 3.14 << " " << 2.5e3 << endl;        // floating-point literals (2.5e3 = 2500)
cout << 'A' << " " << "text" << endl;        // character and string literals
cout << true << " " << false << endl;        // boolean literals print as 1 and 0
cout << 0x1F << " " << 010 << " " << 0b101 << endl;   // hex, octal, binary: 31 8 5
cout << "Tab:\there | Quote:\" | Backslash:\\ | New:\nline" << endl;
`}
<p>Escape sequences begin with a backslash: <code>\\n</code> new line, <code>\\t</code> tab, <code>\\"</code> a quote, <code>\\\\</code> a backslash.</p>
<h3>Constants: values that must not change</h3>
${E`
const double PI = 3.14159;
constexpr int DAYS = 7;          // known at compile time
#define MAX_PLAYERS 4            // old C-style macro (no type, no semicolon)
cout << PI * 2 << " " << DAYS * 4 << " " << MAX_PLAYERS << endl;

<p>The <b>type</b> of a variable decides how much memory it uses and what values it can hold. The sizes below are typical on a modern 64-bit computer.</p>
<table><tr><th>Type</th><th>Typical size</th><th>Holds</th></tr>
<tr><td><code>bool</code></td><td>1 byte</td><td><code>true</code> / <code>false</code></td></tr>
<tr><td><code>char</code></td><td>1 byte</td><td>one character, or a small integer</td></tr>
<tr><td><code>short</code></td><td>2 bytes</td><td>-32,768 … 32,767</td></tr>
<tr><td><code>int</code></td><td>4 bytes</td><td>about ±2.1 billion</td></tr>
<tr><td><code>long long</code></td><td>8 bytes</td><td>about ±9.2 × 10<sup>18</sup></td></tr>
<tr><td><code>float</code></td><td>4 bytes</td><td>≈ 7 significant digits</td></tr>
<tr><td><code>double</code></td><td>8 bytes</td><td>≈ 15 significant digits</td></tr></table>
${E`
cout << "int: " << sizeof(int) << " bytes" << endl;

<h3>Type modifiers</h3>
<p><code>signed</code> / <code>unsigned</code> decide whether negative values are allowed; <code>short</code> / <code>long</code> change the size. <code>unsigned int</code> cannot be negative but doubles the positive range (0 … ~4.29 billion).</p>
${E`
unsigned int apples = 25;
long long population = 8000000000LL;      // the LL suffix marks a long long literal
short tiny = 1200;
float ratio = 0.75f;                      // f marks a float literal
cout << apples << " " << population << " " << tiny << " " << ratio << endl;
`}
<h3>char is a number too</h3>
${E`
char letter = 'A';
cout << letter << " has code " << (int)letter << endl;     // A has code 65
char next = letter + 1;
cout << next << endl;                                      // B
cout << (char)(97) << endl;                                // a
`}
<h3>Type conversion</h3>
<p><b>Implicit</b> conversion happens automatically (an <code>int</code> becomes a <code>double</code> in mixed arithmetic). <b>Explicit</b> casting is written by you.</p>
${E`
int whole = 7;
double part = 2.0;
cout << whole / part << endl;              // 3.5   int promoted to double
int a = 7, b = 2;
cout << a / b << endl;                     // 3     integer division
cout << (double)a / b << endl;             // 3.5   cast one operand
cout << static_cast<double>(a) / b << endl;  // 3.5   the C++ way
int truncated = 9.99;                      // the decimals are cut off, not rounded
cout << truncated << endl;                 // 9
`}
${tip('Prefer <code>static_cast&lt;type&gt;(value)</code> to the old C-style <code>(type)value</code>: it is easier to spot and safer.')}

    { id: 'cpp-ops', title: 'Operators in Depth', mins: 18,
      body: `
<h3>Arithmetic</h3>
${E`
int a = 17, b = 5;
cout << a + b << " " << a - b << " " << a * b << endl;     // 22 12 85
cout << a / b << " " << a % b << endl;                    // 3 2   (integer division, remainder)
cout << 17.0 / 5 << endl;                                 // 3.4
`}
<h3>Increment and decrement: prefix vs postfix</h3>
${E`
int n = 5;
int x = n++;     // x gets the OLD value (5), then n becomes 6
int y = ++n;     // n becomes 7 first, then y gets 7
cout << x << " " << y << " " << n << endl;     // 5 7 7
n--; --n;
cout << n << endl;                             // 5
`}
<h3>Assignment shortcuts</h3>
${E`
int v = 10;
v += 5; v -= 3; v *= 2; v /= 4; v %= 4;
cout << v << endl;
`}
<h3>Relational and logical</h3>
${E`
int age = 20;
cout << (age > 18) << (age == 20) << (age != 20) << endl;      // 110
cout << (age > 18 && age < 65) << (age < 13 || age > 65) << (!(age > 18)) << endl;   // 100
`}
<p>The logical operators <b>short-circuit</b>: in <code>a &amp;&amp; b</code>, if <code>a</code> is false, <code>b</code> is never evaluated.</p>
${E`
int x = 0;
if (x != 0 && 10 / x > 1) cout << "big" << endl;
else cout << "safe: the division was skipped" << endl;
`}
<h3>Bitwise operators</h3>
<table><tr><th>Operator</th><th>Meaning</th><th>Example (5 = 0101, 3 = 0011)</th></tr>
<tr><td><code>&amp;</code></td><td>AND</td><td>5 &amp; 3 = 1</td></tr><tr><td><code>|</code></td><td>OR</td><td>5 | 3 = 7</td></tr><tr><td><code>^</code></td><td>XOR</td><td>5 ^ 3 = 6</td></tr>
<tr><td><code>~</code></td><td>NOT</td><td>~5 = -6</td></tr><tr><td><code>&lt;&lt;</code></td><td>shift left (× 2 each step)</td><td>5 &lt;&lt; 1 = 10</td></tr><tr><td><code>&gt;&gt;</code></td><td>shift right (÷ 2)</td><td>5 &gt;&gt; 1 = 2</td></tr></table>
${E`
int p = 5, q = 3;
cout << (p & q) << " " << (p | q) << " " << (p ^ q) << " " << (~p) << endl;
cout << (p << 1) << " " << (p >> 1) << " " << (1 << 4) << endl;
cout << "is " << 12 << " even? " << ((12 & 1) == 0) << endl;
`}
<h3>Ternary and sizeof</h3>
${E`
int n = 7;
string kind = (n % 2 == 0) ? "even" : "odd";
cout << n << " is " << kind << endl;
cout << sizeof(n) << " " << sizeof(double) << endl;
`}
<h3>Precedence (high → low)</h3>
<table><tr><th>Level</th><th>Operators</th></tr><tr><td>1</td><td><code>( )</code>, <code>++ --</code> (postfix)</td></tr><tr><td>2</td><td><code>! ~ ++ --</code> (prefix), unary <code>-</code>, <code>sizeof</code></td></tr><tr><td>3</td><td><code>* / %</code></td></tr><tr><td>4</td><td><code>+ -</code></td></tr><tr><td>5</td><td><code>&lt;&lt; &gt;&gt;</code></td></tr><tr><td>6</td><td><code>&lt; &lt;= &gt; &gt;=</code></td></tr><tr><td>7</td><td><code>== !=</code></td></tr><tr><td>8</td><td><code>&amp;</code> then <code>^</code> then <code>|</code></td></tr><tr><td>9</td><td><code>&amp;&amp;</code> then <code>||</code></td></tr><tr><td>10</td><td><code>?:</code>, assignments</td></tr></table>
${warn('Comparison binds tighter than bitwise operators: <code>x &amp; 1 == 0</code> means <code>x &amp; (1 == 0)</code>. Write <code>(x &amp; 1) == 0</code>.')}
${tip('When in doubt, use parentheses. They cost nothing and make intent obvious.')}`,
      code: S`
        #include <iostream>
        using namespace std;

        int main() {
            int a = 23, b = 5;
            cout << "a / b = " << a / b << ", a % b = " << a % b << endl;
            cout << "double division: " << (double)a / b << endl;

            int i = 3;
            int post = i++;
            int pre = ++i;
            cout << "post=" << post << " pre=" << pre << " i=" << i << endl;

            cout << "bits: " << (12 & 10) << " " << (12 | 10) << " " << (12 ^ 10) << " " << (1 << 3) << endl;
            cout << "precedence: " << 2 + 3 * 4 << " " << (2 + 3) * 4 << endl;

        }
      `,

        Q('What is 5 << 1?', ['2', '10', '6', '4'], 1, 'Shifting left by one doubles the number.'),

    { id: 'cpp-io', title: 'Input & Output: cin, cout & Formatting', mins: 18,
      body: `
<p>C++ input and output work through <b>streams</b>. <code>cout</code> is the output stream, <code>cin</code> is the input stream, and <code>cerr</code> writes error messages. The arrows show the direction of the data: <code>&lt;&lt;</code> pushes data <i>into</i> <code>cout</code>, <code>&gt;&gt;</code> pulls data <i>out of</i> <code>cin</code>.</p>
<h3>Reading values with cin</h3>
${E`
string name;
int age;
cout << "Name and age? ";
cin >> name >> age;              // whitespace separates the values
cout << "Hello " << name << ", next year you will be " << age + 1 << endl;
`}
<p>On this site, type the answers into the <b>Input</b> box under the editor (one per line) or wait for the pop-up. The starter code is pre-filled for you.</p>
<h3>Reading a whole line: getline</h3>
<p><code>cin &gt;&gt;</code> stops at the first space. To read a full sentence use <code>getline(cin, text)</code>.</p>
${E`
string sentence;
cout << "Tell me something: ";
getline(cin, sentence);
cout << "You said: " << sentence << " (" << sentence.length() << " characters)" << endl;
`}
${warn('After <code>cin &gt;&gt; number</code> the newline is still waiting in the buffer, so the next <code>getline</code> returns an empty line. Call <code>cin.ignore()</code> in between.')}
${E`
int number;
string line;
cin >> number;
cin.ignore();                    // throw away the leftover newline
getline(cin, line);
cout << number << " / " << line << endl;
`}
<h3>Formatting output</h3>
<p>Include <code>&lt;iomanip&gt;</code> for these manipulators:</p>
${E`
double pi = 3.14159265;
cout << pi << endl;                                  // 3.14159
cout << fixed << setprecision(2) << pi << endl;      // 3.14
cout << setw(10) << "right" << "|" << endl;          // pad to width 10
cout << left << setw(10) << "left" << "|" << endl;
cout << setfill('*') << setw(8) << 42 << endl;       // ****0042? no: ******42
cout << boolalpha << true << " " << false << endl;   // true false
cout << hex << 255 << " " << dec << 255 << endl;     // ff 255
`}
<h3>A formatted table</h3>
${E`
string items[] = {"Pen", "Notebook", "Ruler"};
double prices[] = {1.5, 4.25, 2.0};
cout << left << setw(12) << "Item" << right << setw(8) << "Price" << endl;
cout << string(20, '-') << endl;
for (int i = 0; i < 3; i++)
    cout << left << setw(12) << items[i] << right << setw(8) << fixed << setprecision(2) << prices[i] << endl;
`}
<h3>printf-style output</h3>
${E`
printf("%d items cost %.2f dollars (%s)\n", 3, 7.5, "total");
printf("%5d|%-5d|%05d\n", 42, 42, 42);
`}
<h3>endl vs "\\n"</h3>
<p><code>endl</code> ends the line <i>and flushes</i> the buffer; <code>"\\n"</code> only ends the line, so it is faster in loops that print a lot.</p>
${tip('Check that reading succeeded: <code>if (cin &gt;&gt; n) { ... }</code> is true only if a number was read. Use <code>while (cin &gt;&gt; x)</code> to read until the input ends.')}`,
      stdin: 'Mai 16\nlearning C++ is fun',
      code: S`
        #include <iostream>
        #include <iomanip>
        #include <string>
        using namespace std;

        int main() {
            string name;
            int age;
            cout << "Name and age? ";
            cin >> name >> age;
            cin.ignore();
            string motto;
            cout << "Your motto? ";
            getline(cin, motto);

            cout << "\n--- Profile ---" << endl;
            cout << left << setw(8) << "Name:" << name << endl;
            cout << left << setw(8) << "Age:" << age << endl;
            cout << left << setw(8) << "Motto:" << motto << endl;
            double hours = age * 1.5;
            cout << fixed << setprecision(1) << "Study hours: " << hours << endl;
            return 0;
        }
      `,
      quiz: [
        Q('Which operator reads from cin?', ['<<', '>>', '=>', '<-'], 1, '>> extracts data from the input stream.'),
        Q('Why call cin.ignore() between cin >> x and getline?', ['To clear the screen', 'To remove the leftover newline', 'To close the stream', 'It is optional decoration'], 1, 'The newline would make getline return an empty string.'),
        Q('What does setw(10) do?', ['Sets precision to 10', 'Pads the next output to a width of 10', 'Waits 10 seconds', 'Limits input to 10 chars'], 1, 'setw sets the minimum field width of the next item.'),
      ] },

    { id: 'cpp-bc', title: 'break, continue, goto & Nested Loops', mins: 13,
      body: `
<h3>break: leave the loop (or switch) now</h3>
${E`
for (int i = 1; i <= 10; i++) {
    if (i * i > 30) {
        cout << "stopped at " << i << endl;
        break;
    }
}
`}
<h3>continue: skip to the next iteration</h3>
${E`
for (int i = 1; i <= 10; i++) {
    if (i % 3 == 0) continue;     // skip multiples of 3
    cout << i << " ";
}
cout << endl;
`}
<h3>Searching: the classic use of break</h3>
${E`
int data[] = {4, 8, 15, 16, 23, 42};
int target = 16, found = -1;
for (int i = 0; i < 6; i++) {
    if (data[i] == target) {
        found = i;
        break;
    }
}
cout << "index: " << found << endl;
`}
<h3>Nested loops</h3>
<p>The inner loop runs completely for every round of the outer loop. Use them for tables, grids and patterns.</p>
${E`
for (int row = 1; row <= 4; row++) {
    for (int col = 1; col <= row; col++) cout << "* ";
    cout << endl;
}
for (int i = 1; i <= 3; i++) {
    for (int j = 1; j <= 5; j++) cout << i * j << "\t";
    cout << endl;
}
`}
<h3>Leaving two loops at once</h3>
<p><code>break</code> only leaves the <i>innermost</i> loop. Use a flag, or move the loops into a function and <code>return</code>.</p>
${E`
bool done = false;
for (int a = 1; a < 20 && !done; a++) {
    for (int b = a; b < 20; b++) {
        if (a * a + b * b == 13 * 13) {
            cout << "found " << a << " " << b << endl;
            done = true;
            break;
        }
    }
}
`}
<h3>goto (and why you should avoid it)</h3>
<p><code>goto label;</code> jumps to a named place in the same function. It exists, but jumping around makes code hard to follow. Loops and functions replace almost every use. Our browser simulator does not run <code>goto</code>, so this one is for reading only:</p>
${X`
#include <iostream>
using namespace std;
int main() {
    int tries = 0;
retry:
    tries++;
    cout << "attempt " << tries << endl;
    if (tries < 3) goto retry;     // jump back up
    return 0;
}
`}
${tip('A <code>do-while</code> or a <code>while (true)</code> loop with <code>break</code> expresses "repeat until" far more clearly than <code>goto</code>.')}`,
      code: S`
        #include <iostream>
        using namespace std;

        int main() {
            // first prime above 50
            for (int n = 51; ; n++) {
                bool prime = true;
                for (int d = 2; d * d <= n; d++) {
                    if (n % d == 0) { prime = false; break; }
                }
                if (prime) { cout << "first prime above 50: " << n << endl; break; }
            }

            // multiplication triangle, skipping 4s
            for (int i = 1; i <= 5; i++) {
                for (int j = 1; j <= i; j++) {
                    if ((i * j) % 4 == 0) continue;
                    cout << i * j << " ";
                }
                cout << endl;
            }
            return 0;
        }
      `,
      quiz: [
        Q('What does continue do?', ['Exits the loop', 'Skips the rest of this iteration', 'Restarts the program', 'Pauses the loop'], 1, 'It jumps to the next iteration.'),
        Q('A break inside the inner of two nested loops…', ['Leaves both loops', 'Leaves only the inner loop', 'Leaves the program', 'Is an error'], 1, 'break always affects the innermost loop or switch.'),
        Q('Why is goto usually discouraged?', ['It is slow', 'It makes control flow hard to follow', 'It does not compile', 'It uses memory'], 1, 'Jumps create "spaghetti code".'),
      ] },

    { id: 'cpp-fn2', title: 'Default Arguments, Overloading & inline Functions', mins: 16,
      body: `
<h3>Default arguments</h3>
<p>Give trailing parameters a default value, and callers may leave them out.</p>
${E`
void greet(string name, string greeting = "Hello") {
    cout << greeting << ", " << name << "!" << endl;
}

double area(double w, double h = 1.0) { return w * h; }

greet("Sara");
greet("Omar", "Welcome");
cout << area(5) << " " << area(5, 3) << endl;
`}
${warn('Defaults must come <b>last</b>: <code>void f(int a = 1, int b)</code> is an error. When prototype and definition are separate, put the default in the prototype only.')}
<h3>Function overloading</h3>
<p>Several functions may share a name if their <b>parameter lists differ</b> (different count or types). The compiler picks the best match. The return type alone is not enough.</p>
${E`
int add(int a, int b) { return a + b; }
double add(double a, double b) { return a + b; }
string add(string a, string b) { return a + b; }
int add(int a, int b, int c) { return a + b + c; }

cout << add(2, 3) << endl;                          // int version
cout << add(2.5, 1.25) << endl;                     // double version
cout << add(string("C++"), string("!")) << endl;    // string version
cout << add(1, 2, 3) << endl;                       // three-parameter version
`}
<h3>Overloading for different tasks</h3>
${E`
void show(int x)    { cout << "int: " << x << endl; }
void show(string s) { cout << "text: " << s << endl; }
void show(double d) { cout << "decimal: " << d << endl; }
void show(bool b)   { cout << "bool: " << (b ? "yes" : "no") << endl; }

show(7);
show("hello");
show(3.5);
show(true);
`}
<h3>inline functions</h3>
<p>The keyword <code>inline</code> is a hint that the compiler may paste the function body at every call instead of jumping to it. It suits tiny functions. Modern compilers decide this themselves, so it matters mostly for functions defined in header files.</p>
${E`
inline int square(int x) { return x * x; }
inline bool isEven(int n) { return n % 2 == 0; }
cout << square(9) << " " << isEven(10) << endl;
`}
<h3>constexpr functions</h3>
${E`
constexpr int cube(int x) { return x * x * x; }
constexpr int big = cube(4);      // computed at compile time
cout << big << endl;
`}
<h3>Returning several values</h3>
${E`
pair<int, int> minMax(int a, int b) {
    return make_pair(min(a, b), max(a, b));
}
auto result = minMax(9, 4);
cout << result.first << " " << result.second << endl;
`}
${tip('Overloading is great for "the same idea on different types" (<code>print</code>, <code>add</code>, <code>area</code>). If the functions do <i>different</i> things, give them different names.')}`,
      code: S`
        #include <iostream>
        #include <string>
        using namespace std;

        double area(double side) { return side * side; }
        double area(double w, double h) { return w * h; }
        double area(double r, bool circle) { return circle ? 3.14159 * r * r : r * r; }

        void box(string text, char border = '*', int padding = 1) {
            string line(text.length() + 2 * padding + 2, border);
            cout << line << endl;
            cout << border << string(padding, ' ') << text << string(padding, ' ') << border << endl;
            cout << line << endl;
        }

        int main() {
            cout << area(3.0) << " " << area(3.0, 4.0) << " " << area(2.0, true) << endl;
            box("Hello");
            box("C++", '#', 3);
            return 0;
        }
      `,
      quiz: [
        Q('Which is a valid overload of int f(int a)?', ['double f(int a)', 'int f(double a)', 'int f(int b)', 'void f(int c)'], 1, 'Overloads must differ in parameter types or count.'),
        Q('Where must default arguments appear?', ['First', 'Last (rightmost parameters)', 'Anywhere', 'Only in main'], 1, 'Once a parameter has a default, all those after it need one too.'),
        Q('What does inline suggest to the compiler?', ['Run in parallel', 'Paste the body at the call site', 'Make the function private', 'Skip type checks'], 1, 'It avoids call overhead for tiny functions.'),
      ] },

    { id: 'cpp-ref', title: 'Pass by Value, by Reference & const References', mins: 17,
      body: `
<p>When you call a function, how are the arguments handed over? C++ lets you choose.</p>
<h3>Pass by value (a copy)</h3>
<p>The function receives its own copy; changes do not affect the caller.</p>
${E`
void tryToChange(int x) {
    x = 100;
    cout << "inside: " << x << endl;
}

int n = 5;
tryToChange(n);
cout << "outside: " << n << endl;       // still 5
`}
<h3>Pass by reference (the original)</h3>
<p>A <b>reference parameter</b> (<code>int&amp; x</code>) is another name for the caller's variable.</p>
${E`
void doubleIt(int& x) { x = x * 2; }

void swapValues(int& a, int& b) {
    int temp = a;
    a = b;
    b = temp;
}

int n = 21;
doubleIt(n);
int p = 1, q = 2;
swapValues(p, q);
cout << n << " " << p << " " << q << endl;     // 42 2 1
`}
<h3>Returning several results through references</h3>
${E`
void divide(int a, int b, int& quotient, int& remainder) {
    quotient = a / b;
    remainder = a % b;
}
int q, r;
divide(17, 5, q, r);
cout << q << " r " << r << endl;       // 3 r 2
`}
<h3>const references: fast and safe</h3>
<p>Copying a big <code>string</code> or <code>vector</code> is slow. Pass it by <b>const reference</b>: no copy, and the function promises not to modify it.</p>
${E`
int sum(const vector<int>& values) {
    int total = 0;
    for (int v : values) total += v;
    // values.push_back(1);        // error: values is const
    return total;
}

void shout(const string& text) { cout << text << "!" << endl; }

vector<int> data = {4, 8, 15, 16, 23, 42};
cout << sum(data) << endl;
shout("no copy made");
`}
<h3>References as variables</h3>
${E`
int score = 10;
int& alias = score;        // alias IS score
alias = 25;
cout << score << " " << alias << endl;     // 25 25
`}
<h3>Which one should I use?</h3>
<table><tr><th>Situation</th><th>Parameter style</th></tr>
<tr><td>Small value (<code>int</code>, <code>double</code>, <code>char</code>) you only read</td><td><code>int x</code> (by value)</td></tr>
<tr><td>Large object you only read</td><td><code>const string&amp; s</code></td></tr>
<tr><td>You must modify the caller's variable</td><td><code>int&amp; x</code></td></tr></table>
<h3>Arrays and vectors by reference</h3>
${E`
void addOne(vector<int>& v) {
    for (int& x : v) x++;           // int& lets the loop change elements
}
vector<int> nums = {1, 2, 3};
addOne(nums);
for (int x : nums) cout << x << " ";
cout << endl;
`}
${tip('A reference must be initialised when it is created, and it can never be re-seated to refer to something else. A pointer (next topic) can.')}
${warn('Never return a reference to a <b>local</b> variable: the variable is destroyed when the function ends, leaving a dangling reference.')}`,
      code: S`
        #include <iostream>
        #include <string>
        #include <vector>
        using namespace std;

        void swapValues(int& a, int& b) { int t = a; a = b; b = t; }
        void normalize(string& s) {
            for (char& c : s) c = tolower(c);
        }
        void minMax(const vector<int>& v, int& lo, int& hi) {
            lo = hi = v[0];
            for (int x : v) {
                if (x < lo) lo = x;
                if (x > hi) hi = x;
            }
        }

        int main() {
            int a = 3, b = 9;
            swapValues(a, b);
            cout << "a=" << a << " b=" << b << endl;

            string word = "HeLLo";
            normalize(word);
            cout << word << endl;

            vector<int> data = {14, 3, 99, -5, 42};
            int lo, hi;
            minMax(data, lo, hi);
            cout << "min " << lo << " max " << hi << endl;
            return 0;
        }
      `,
      quiz: [
        Q('What does void f(int& x) allow?', ['Reading only', 'Changing the caller\'s variable', 'Returning an int', 'Passing a pointer'], 1, 'A reference parameter aliases the argument.'),
        Q('Why pass a big vector as const vector<int>& ?', ['It is required', 'It avoids copying and prevents modification', 'It sorts it', 'It makes it faster to write'], 1, 'No copy is made, and the function cannot change it.'),
        Q('What is printed? void f(int x){ x = 9; } int n = 1; f(n); cout << n;', ['9', '1', '0', 'Error'], 1, 'x is a copy, so n stays 1.'),
      ] },

    { id: 'cpp-rec', title: 'Recursion', mins: 17,
      body: `
<p>A function is <b>recursive</b> when it calls itself on a smaller version of the problem. It needs a <b>base case</b> (the simplest answer, no more calls) and a <b>recursive case</b> that moves toward it.</p>
<h3>Factorial</h3>
${E`
int factorial(int n) {
    if (n <= 1) return 1;             // base case
    return n * factorial(n - 1);      // recursive case
}
cout << factorial(5) << " " << factorial(10) << endl;
`}
<p>Trace <code>factorial(3)</code>: <code>3 * factorial(2)</code> → <code>3 * (2 * factorial(1))</code> → <code>3 * (2 * 1)</code> = 6. Each waiting call sits on the <b>call stack</b>.</p>
<h3>Fibonacci (and why naive recursion can be slow)</h3>
${E`
int fib(int n) {
    if (n < 2) return n;
    return fib(n - 1) + fib(n - 2);
}
for (int i = 0; i < 10; i++) cout << fib(i) << " ";
cout << endl;
`}
<p>The same values are recomputed many times. <b>Memoisation</b> stores results:</p>
${E`
long long memo[60];
long long fastFib(int n) {
    if (n < 2) return n;
    if (memo[n] != 0) return memo[n];
    return memo[n] = fastFib(n - 1) + fastFib(n - 2);
}
cout << fastFib(50) << endl;
`}
<h3>More examples</h3>
${E`
int power(int base, int exp) {
    if (exp == 0) return 1;
    return base * power(base, exp - 1);
}
int gcd(int a, int b) { return b == 0 ? a : gcd(b, a % b); }
int digitSum(int n) { return n < 10 ? n : n % 10 + digitSum(n / 10); }
bool isPalindrome(const string& s, int lo, int hi) {
    if (lo >= hi) return true;
    if (s[lo] != s[hi]) return false;
    return isPalindrome(s, lo + 1, hi - 1);
}
cout << power(2, 10) << " " << gcd(48, 18) << " " << digitSum(90817) << endl;
cout << isPalindrome("racecar", 0, 6) << isPalindrome("hello", 0, 4) << endl;
`}
<h3>Towers of Hanoi</h3>
${E`
void hanoi(int n, char from, char to, char via) {
    if (n == 0) return;
    hanoi(n - 1, from, via, to);
    cout << "move disk " << n << " " << from << " -> " << to << endl;
    hanoi(n - 1, via, to, from);
}
hanoi(3, 'A', 'C', 'B');
`}
<h3>Recursion vs loops</h3>
<p>Every recursion can be written as a loop. Use recursion when the problem is naturally self-similar (trees, folders, divide and conquer, backtracking); use loops for simple repetition because they are faster and use no stack.</p>
${warn('No base case, or a recursive call that does not get closer to it, means infinite recursion and a <b>stack overflow</b> crash.')}`,
      code: S`
        #include <iostream>
        #include <string>
        using namespace std;

        int sumTo(int n) { return n == 0 ? 0 : n + sumTo(n - 1); }

        string reverseText(const string& s) {
            if (s.length() <= 1) return s;
            return reverseText(s.substr(1)) + s[0];
        }

        void countdown(int n) {
            if (n == 0) { cout << "Liftoff!" << endl; return; }
            cout << n << "... ";
            countdown(n - 1);
        }

        int binarySearch(const int a[], int lo, int hi, int target) {
            if (lo > hi) return -1;
            int mid = (lo + hi) / 2;
            if (a[mid] == target) return mid;
            if (a[mid] < target) return binarySearch(a, mid + 1, hi, target);
            return binarySearch(a, lo, mid - 1, target);
        }

        int main() {
            cout << sumTo(100) << endl;
            cout << reverseText("recursion") << endl;
            countdown(5);
            int sorted[] = {2, 5, 8, 12, 16, 23, 38, 56, 72, 91};
            cout << "index of 23: " << binarySearch(sorted, 0, 9, 23) << endl;
            return 0;
        }
      `,
      quiz: [
        Q('What does every recursive function need?', ['A loop', 'A base case', 'A global variable', 'A pointer'], 1, 'The base case ends the recursion.'),
        Q('What is factorial(4)?', ['10', '16', '24', '12'], 2, '4 × 3 × 2 × 1.'),
        Q('What happens with infinite recursion?', ['It runs forever harmlessly', 'Stack overflow crash', 'The compiler fixes it', 'It returns 0'], 1, 'Each call uses stack memory until it runs out.'),
      ] },

    { id: 'cpp-scope', title: 'Variable Scope & Storage Classes', mins: 15,
      body: `
<p>The <b>scope</b> of a name is the part of the program where it can be used. The <b>lifetime</b> of a variable is how long its memory exists.</p>
<h3>Local scope: inside braces</h3>
${E`
int x = 1;
{
    int y = 2;               // y exists only inside these braces
    cout << x << y << endl;
}
// cout << y;                // error: y was not declared in this scope
for (int i = 0; i < 2; i++) cout << i;   // i lives only inside the for
cout << endl;
`}
<h3>Global variables</h3>
<p>Declared outside every function, a global is visible everywhere below it and lives for the whole program.</p>
${E`
int counter = 0;                 // global

void hit() { counter++; }

hit(); hit(); hit();
cout << "hits: " << counter << endl;
`}
${tip('Globals make code hard to test and reason about. Prefer parameters and return values. Global <b>constants</b> are fine.')}
<h3>Shadowing</h3>
<p>An inner variable with the same name <b>hides</b> the outer one inside its block.</p>
${E`
int value = 10;
{
    int value = 99;              // shadows the outer value
    cout << "inner: " << value << endl;
}
cout << "outer: " << value << endl;
`}
<p>You can reach a hidden <i>global</i> with the scope operator <code>::</code>, e.g. <code>::value</code>.</p>
<h3>Storage classes</h3>
<table><tr><th>Keyword</th><th>Meaning</th></tr>
<tr><td><code>auto</code> (default)</td><td>ordinary local variable; created on entry, destroyed at the end of its block</td></tr>
<tr><td><code>static</code> (local)</td><td>created once, <b>keeps its value between calls</b></td></tr>
<tr><td><code>extern</code></td><td>declares a global that is defined in another file</td></tr>
<tr><td><code>register</code></td><td>obsolete hint; ignored by modern compilers</td></tr>
<tr><td><code>thread_local</code></td><td>one copy per thread</td></tr></table>
${E`
int nextId() {
    static int id = 0;          // initialised only the first time
    id++;
    return id;
}
void ordinary() {
    int count = 0;              // recreated on every call
    count++;
    cout << "ordinary count: " << count << endl;
}
cout << nextId() << nextId() << nextId() << endl;     // 123
ordinary(); ordinary();
`}
<h3>Lifetime of loop variables and function parameters</h3>
${E`
int total = 0;
for (int i = 1; i <= 3; i++) {
    int square = i * i;         // new variable each round
    total += square;
}
cout << total << endl;
`}
${warn('Do not return the address of a local variable. When the function ends, the local is gone and the address is invalid.')}`,
      code: S`
        #include <iostream>
        using namespace std;

        const int MAX_TRIES = 3;
        int totalCalls = 0;

        int attempt() {
            static int tries = 0;
            tries++;
            totalCalls++;
            return tries;
        }

        void demoShadow() {
            int x = 1;
            if (x == 1) {
                int x = 2;
                cout << "inner x = " << x << endl;
            }
            cout << "outer x = " << x << endl;
        }

        int main() {
            for (int i = 0; i < MAX_TRIES; i++)
                cout << "attempt number " << attempt() << endl;
            cout << "total calls: " << totalCalls << endl;
            demoShadow();
            return 0;
        }
      `,
      quiz: [
        Q('What does a static local variable do?', ['Is destroyed at once', 'Keeps its value between function calls', 'Becomes global', 'Cannot be changed'], 1, 'It is initialised once and lives for the whole program.'),
        Q('Where is a variable declared inside { } visible?', ['Everywhere', 'Only inside those braces', 'In the whole file', 'In other files'], 1, 'Block scope.'),
        Q('What is shadowing?', ['A hidden bug', 'An inner variable hiding an outer one with the same name', 'Copying a variable', 'A debugging mode'], 1, 'The inner name takes priority in its block.'),
      ] },

    { id: 'cpp-lambda', title: 'Lambda Expressions', mins: 14,
      body: `
<p>A <b>lambda</b> is a small unnamed function you write right where you need it. Syntax:</p>
${X`
[capture](parameters) { body }
`}
${E`
auto greet = []() { cout << "Hello from a lambda!" << endl; };
auto square = [](int x) { return x * x; };
auto add = [](int a, int b) { return a + b; };
greet();
cout << square(7) << " " << add(2, 3) << endl;
`}
<h3>Lambdas with algorithms</h3>
${E`
vector<int> nums = {5, 2, 9, 1, 7, 4};
sort(nums.begin(), nums.end(), [](int a, int b) { return a > b; });     // descending
for (int n : nums) cout << n << " ";
cout << endl;
int evens = count_if(nums.begin(), nums.end(), [](int n) { return n % 2 == 0; });
cout << "evens: " << evens << endl;
for_each(nums.begin(), nums.end(), [](int n) { cout << n * n << " "; });
cout << endl;
`}
<h3>Sorting objects by a field</h3>
${E`
struct Student { string name; int mark; };
vector<Student> list = {{"Ali", 78}, {"Dina", 95}, {"Omar", 85}};
sort(list.begin(), list.end(), [](const Student& a, const Student& b) { return a.mark > b.mark; });
for (const Student& s : list) cout << s.name << " " << s.mark << endl;
`}
<h3>Captures: using outside variables</h3>
<p>The brackets <code>[ ]</code> say which outside variables the lambda may use:</p>
<ul><li><code>[ ]</code> nothing</li><li><code>[x]</code> a <b>copy</b> of x</li><li><code>[&amp;x]</code> a <b>reference</b> to x (can modify it)</li><li><code>[=]</code> copies of everything used</li><li><code>[&amp;]</code> references to everything used</li></ul>
${E`
int total = 0;
vector<int> prices = {5, 10, 15};
for_each(prices.begin(), prices.end(), [&total](int p) { total += p; });
cout << "total: " << total << endl;

int threshold = 8;
int bigOnes = count_if(prices.begin(), prices.end(), [threshold](int p) { return p > threshold; });
cout << "above " << threshold << ": " << bigOnes << endl;
`}
${warn('A capture <code>[=]</code> copies the value at the moment the lambda is created. Changing the original variable later does not change the lambda\'s copy. (Our browser simulator treats captures like references, so test this idea in a real compiler.)')}
<h3>Storing lambdas</h3>
${E`
function<int(int, int)> op = [](int a, int b) { return a * b; };
cout << op(6, 7) << endl;

auto makeMultiplier = [](int factor) {
    return [factor](int x) { return x * factor; };
};
auto triple = makeMultiplier(3);
cout << triple(14) << endl;
`}
${tip('Use a lambda for a one-off short function (sort rule, filter test). Use a normal named function when the logic is reused or long.')}`,
      code: S`
        #include <iostream>
        #include <vector>
        #include <algorithm>
        #include <string>

            vector<string> words = {"banana", "kiwi", "apple", "fig", "cherry"};

    { id: 'cpp-arr', title: 'Arrays', mins: 17,
      body: `
<p>An <b>array</b> stores a fixed number of values of the <b>same type</b> in consecutive memory. Items are reached by an <b>index</b> that starts at <b>0</b>.</p>
${E`
int scores[5] = {90, 80, 70, 60, 50};

int zeros[4] = {0};                                 // all four become 0

<h3>Looping over an array</h3>
${E`

<h3>Arrays and functions</h3>
<p>An array is passed to a function as a <b>pointer to its first element</b>. The function does not know the length, so pass it too. Changes made inside the function affect the original array.</p>
${E`

    for (int i = 0; i < n; i++) arr[i] *= 2;
}

    int s = 0;
    for (int i = 0; i < n; i++) s += arr[i];
    return s;
}

doubleAll(values, 3);

`}
<h3>Counting with an array</h3>

    if (freq[i] > 0) cout << char('a' + i) << "=" << freq[i] << " ";

${warn('C++ does <b>not</b> check array bounds. Reading or writing <code>arr[10]</code> of a 5-element array compiles, but is <b>undefined behaviour</b>: garbage values, corrupted memory or a crash. Always keep indices between <code>0</code> and <code>size - 1</code>.')}
${tip('The size of a plain array must be known at compile time and cannot change. When you need a growable list, use <code>vector</code> (coming up).')}`,
      code: S`
        #include <iostream>
        using namespace std;

        int findMax(const int a[], int n) {
            int best = a[0];
            for (int i = 1; i < n; i++) if (a[i] > best) best = a[i];
            return best;
        }

        void bubbleSort(int a[], int n) {
            for (int i = 0; i < n - 1; i++)
                for (int j = 0; j < n - 1 - i; j++)
                    if (a[j] > a[j + 1]) { int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t; }
        }

        int main() {
            int temps[] = {21, 25, 19, 30, 27, 23, 22};
            int n = sizeof(temps) / sizeof(temps[0]);
            double sum = 0;
            for (int t : temps) sum += t;
            cout << "days: " << n << ", average: " << sum / n << endl;
            cout << "hottest: " << findMax(temps, n) << endl;
            bubbleSort(temps, n);
            for (int i = 0; i < n; i++) cout << temps[i] << (i < n - 1 ? ", " : "\n");
            return 0;
        }
      `,

<h3>Three dimensions</h3>
<p><code>int cube[2][3][4]</code> is two layers of 3×4 tables. Add one more <code>[ ]</code> and one more nested loop per dimension.</p>

      code: S`
        #include <iostream>
        #include <iomanip>
        using namespace std;

        int main() {
            const int N = 4;
            int table[N][N];
            for (int i = 0; i < N; i++)
                for (int j = 0; j < N; j++)
                    table[i][j] = (i + 1) * (j + 1);

    { id: 'cpp-str', title: 'Strings: std::string & C-Strings', mins: 20,
      body: `
<p>Text in C++ comes in two flavours: the modern, friendly <b><code>std::string</code></b> (use this) and the old C-style <b>character array</b>.</p>
<h3>Creating and joining</h3>
${E`
string a = "Hello";
string b(3, '!');              // "!!!"
string c = a + ", " + "world" + b;
c += "?";
cout << c << " (" << c.length() << " chars, size " << c.size() << ")" << endl;
cout << c.empty() << " " << string().empty() << endl;
`}
<h3>Accessing characters</h3>
${E`
string s = "PYTHON";
cout << s[0] << s[5] << " " << s.at(1) << " " << s.front() << s.back() << endl;
s[0] = 'J';                              // strings are mutable in C++
cout << s << endl;
for (char ch : s) cout << ch << "-";
cout << endl;
`}
<h3>Common operations</h3>
${E`
string t = "the quick brown fox";
cout << t.substr(4, 5) << endl;               // "quick"  (start, length)
cout << t.find("brown") << " " << t.find("zzz") << endl;     // 10 and -1 (npos)
if (t.find("fox") != string::npos) cout << "has fox" << endl;
t.replace(4, 5, "slow");                      // replace 5 chars at position 4
t.insert(0, ">> ");
t.erase(t.length() - 4);                      // remove the last 4 characters
cout << t << endl;
t.append("!!");
t.push_back('?');
t.pop_back();
cout << t << endl;
`}
<h3>Comparing</h3>
${E`
string x = "apple", y = "banana";
cout << (x == y) << (x < y) << (x != y) << endl;     // 011
cout << x.compare("apple") << endl;                  // 0 means equal
`}

${E`

    if (isupper(c)) upper++;
    else if (isdigit(c)) digits++;
    else if (isspace(c)) spaces++;
}
cout << upper << " " << digits << " " << spaces << endl;
string shout = word;
for (char& c : shout) c = toupper(c);
cout << shout << endl;

int n = stoi("42") + 1;
double d = stod("3.5") * 2;
string back = to_string(n) + "/" + to_string(7);
cout << n << " " << d << " " << back << endl;
`}
<h3>Reading strings with spaces</h3>
${E`

cout << "[" << full << "]" << endl;
`}
<h3>Practical examples: palindrome and vowels</h3>
${E`
string text = "racecar";
bool pal = true;
for (int i = 0; i < text.length() / 2; i++)
    if (text[i] != text[text.length() - 1 - i]) pal = false;
cout << text << (pal ? " is" : " is not") << " a palindrome" << endl;

    if (string("aeiou").find(c) != string::npos) vowels++;

<h3>C-strings (character arrays)</h3>
<p>Inherited from C: an array of <code>char</code> ending with the invisible null character <code>'\\0'</code>. You meet them in older code.</p>
${E`
char word[] = "hello";               // 5 letters + '\0' = 6 bytes
cout << word << " " << strlen(word) << endl;
cout << strcmp("abc", "abd") << endl;     // negative: "abc" comes first
string modern = word;                // convert to std::string
cout << modern.length() << endl;
`}
${tip('Prefer <code>std::string</code>. It grows automatically, knows its length and has all the operations above. Use <code>.c_str()</code> when an old function needs a C-string.')}
${warn('<code>str.find()</code> returns <code>string::npos</code> (a huge number) when nothing is found. Comparing the result with <code>-1</code> directly is a classic bug; compare with <code>string::npos</code>.')}`,

        #include <string>
        using namespace std;

        int main() {
            string line;
            getline(cin, line);

        Q('What does "Hello".substr(1, 3) return?', ['Hel', 'ell', 'ello', 'llo'], 1, 'Start at index 1, take 3 characters.'),

    { id: 'cpp-vec', title: 'Vectors: Resizable Arrays', mins: 19,
      body: `
<p><code>vector</code> is the array you will use 95% of the time: it <b>grows and shrinks</b> automatically, knows its own size, and cleans up after itself.</p>
${E`
vector<int> v;                   // empty
vector<int> w = {5, 3, 8};       // with values
vector<int> zeros(4, 0);         // four zeros
vector<string> names = {"Ali", "Dina"};
cout << v.size() << " " << w.size() << " " << zeros.size() << " " << names.size() << endl;
`}
<h3>Adding, reading, removing</h3>
${E`
vector<int> v = {10, 20, 30};
v.push_back(40);                 // add at the end
cout << v[0] << " " << v.at(1) << " " << v.front() << " " << v.back() << endl;
v.pop_back();                    // remove the last
v.insert(v.begin() + 1, 15);     // insert 15 at index 1
v.erase(v.begin());              // remove the first element
for (int x : v) cout << x << " ";
cout << endl;
v.clear();
cout << v.size() << " " << v.empty() << endl;
`}
<h3>Safe access with at()</h3>
${E`
vector<int> v = {1, 2, 3};
try {
    cout << v.at(10) << endl;     // throws out_of_range
} catch (const out_of_range& e) {
    cout << "caught: index too big" << endl;
}
`}
<h3>Looping</h3>
${E`
vector<int> nums = {4, 8, 15, 16};
for (size_t i = 0; i < nums.size(); i++) cout << nums[i] << " ";
cout << endl;
for (int n : nums) cout << n << " ";           // read-only copy
cout << endl;
for (int& n : nums) n *= 2;                    // reference: modify in place
for (const int& n : nums) cout << n << " ";    // const reference: no copy
cout << endl;
`}
<h3>Statistics</h3>
${E`
vector<double> marks = {72.5, 91.0, 85.5, 60.0};
double sum = 0;
for (double m : marks) sum += m;
cout << "average: " << sum / marks.size() << endl;
sort(marks.begin(), marks.end());
cout << "lowest " << marks.front() << ", highest " << marks.back() << endl;
`}
<h3>Vector of vectors (2D)</h3>
${E`
int rows = 3, cols = 4;
vector<vector<int>> grid(rows, vector<int>(cols, 0));
for (int r = 0; r < rows; r++)
    for (int c = 0; c < cols; c++) grid[r][c] = r * cols + c;
for (auto& row : grid) {
    for (int x : row) cout << x << "\t";
    cout << endl;
}
`}
<h3>Resizing and other helpers</h3>
${E`
vector<int> v = {1, 2, 3};
v.resize(5);                      // new elements become 0
cout << v.size() << endl;
vector<int> copy = v;             // vectors copy by value
copy[0] = 99;
cout << v[0] << " " << copy[0] << endl;
vector<int> a = {1, 2}, b = {9, 9, 9};
a.swap(b);
cout << a.size() << b.size() << endl;
`}
${tip('Use <code>reserve(n)</code> when you know roughly how many items are coming; it avoids repeated re-allocation.')}
${warn('<code>v[i]</code> does <b>not</b> check the index (like arrays); <code>v.at(i)</code> does. And <code>v.size()</code> is unsigned: <code>v.size() - 1</code> on an empty vector wraps to a huge number.')}`,
      code: S`
        #include <iostream>
        #include <vector>
        #include <algorithm>
        #include <string>
        using namespace std;

        int main() {
            vector<int> scores;
            int values[] = {88, 92, 79, 65, 97, 84};
            for (int v : values) scores.push_back(v);

            sort(scores.begin(), scores.end());
            cout << "sorted: ";
            for (int s : scores) cout << s << " ";
            cout << endl;

            int total = 0;
            for (int s : scores) total += s;
            cout << "average: " << (double)total / scores.size() << endl;
            cout << "median: " << scores[scores.size() / 2] << endl;

            vector<int> passed;
            for (int s : scores) if (s >= 80) passed.push_back(s);
            cout << passed.size() << " scored 80 or more" << endl;

            vector<string> todo = {"read", "code", "test"};
            todo.insert(todo.begin(), "plan");
            todo.pop_back();
            for (const string& t : todo) cout << "- " << t << endl;
            return 0;
        }
      `,
      quiz: [
        Q('Which call adds an element to the end of a vector?', ['v.add(x)', 'v.push_back(x)', 'v.append(x)', 'v.insert_end(x)'], 1, 'push_back.'),
        Q('What is the difference between v[i] and v.at(i)?', ['None', 'at() checks the index and throws out_of_range', 'at() is slower to type only', '[] throws'], 1, 'at() is bounds-checked.'),
        Q('What does vector<int> v(4, 7) create?', ['{4, 7}', '{7, 7, 7, 7}', '{4, 4, 4, 4, 4, 4, 4}', 'An empty vector'], 1, 'Four elements, each 7.'),
      ] },

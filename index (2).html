    { id: 'cpp-exc', title: 'Exception Handling: try, catch & throw', mins: 18,
      body: `
<p>Errors are a fact of life: a file is missing, a number is invalid, memory runs out. C++ separates the code that <b>detects</b> a problem from the code that <b>handles</b> it with <b>exceptions</b>:</p>
<ul><li><code>throw</code> — signal a problem.</li><li><code>try</code> — a block of code that might throw.</li><li><code>catch</code> — handle a particular kind of problem.</li></ul>
${E`
double divide(double a, double b) {
    if (b == 0) throw runtime_error("division by zero");
    return a / b;
}

try {
    cout << divide(10, 4) << endl;
    cout << divide(5, 0) << endl;       // throws here
    cout << "never printed" << endl;
} catch (const runtime_error& e) {
    cout << "Error: " << e.what() << endl;
}
cout << "program continues" << endl;
`}
<h3>What happens when something is thrown</h3>
<ol><li>The current function stops immediately.</li><li>C++ <b>unwinds</b> the stack: it leaves functions one by one, destroying local objects, until it finds a matching <code>catch</code>.</li><li>If nothing matches, the program terminates.</li></ol>
${E`
void level3() { throw invalid_argument("bad input deep inside"); }
void level2() { level3(); cout << "level2 never finishes" << endl; }
void level1() {
    try { level2(); }
    catch (const invalid_argument& e) { cout << "caught in level1: " << e.what() << endl; }
}
level1();
`}
<h3>Standard exception classes (<code>&lt;stdexcept&gt;</code>)</h3>
<table><tr><th>Class</th><th>Typical use</th></tr>
<tr><td><code>invalid_argument</code></td><td>a function got a bad parameter</td></tr><tr><td><code>out_of_range</code></td><td>index or key out of range (<code>vector::at</code>)</td></tr>
<tr><td><code>runtime_error</code></td><td>problem detected only while running</td></tr><tr><td><code>logic_error</code></td><td>a flaw in program logic</td></tr><tr><td><code>overflow_error</code></td><td>arithmetic overflow</td></tr></table>
All derive from <code>exception</code>, which has the method <code>what()</code>.
<h3>Library functions that throw</h3>
${E`
vector<int> v = {1, 2, 3};
try {
    cout << v.at(10) << endl;
} catch (const out_of_range& e) {
    cout << "index error" << endl;
}
try {
    int n = stoi("hello");
    cout << n << endl;
} catch (const invalid_argument& e) {
    cout << "not a number" << endl;
}
`}
<h3>Several catch blocks, in order</h3>
<p>Catch blocks are tried from top to bottom; the <b>first match</b> wins. Put specific types first and general ones last.</p>
${E`
void test(int code) {
    try {
        if (code == 1) throw invalid_argument("code 1");
        if (code == 2) throw out_of_range("code 2");
        if (code == 3) throw 42;
        if (code == 4) throw string("text error");
        cout << "no error for code " << code << endl;
    }
    catch (const invalid_argument& e) { cout << "invalid_argument: " << e.what() << endl; }
    catch (const exception& e)        { cout << "other exception: " << e.what() << endl; }
    catch (int n)                     { cout << "an int was thrown: " << n << endl; }
    catch (...)                       { cout << "something else was thrown" << endl; }
}
for (int i = 0; i <= 4; i++) test(i);
`}
<h3>Rethrowing</h3>
${E`
try {
    try {
        throw runtime_error("disk problem");
    } catch (const runtime_error& e) {
        cout << "logging: " << e.what() << endl;
        throw;                                  // pass it up to the next handler
    }
} catch (const exception& e) {
    cout << "handled at the top: " << e.what() << endl;
}
`}
${tip('Catch by <b>const reference</b> (<code>const exception&amp;</code>). Catching by value copies the object and can slice derived exception types.')}
${warn('Do not use exceptions for ordinary control flow (like leaving a loop). They are for exceptional situations, and throwing is much slower than an <code>if</code>.')}`,
      code: S`
        #include <iostream>
        #include <stdexcept>
        #include <string>
        #include <vector>
        using namespace std;

        int parseAge(const string& text) {
            int age = stoi(text);
            if (age < 0 || age > 130) throw out_of_range("age must be between 0 and 130, got " + to_string(age));
            return age;
        }

        double average(const vector<double>& v) {
            if (v.empty()) throw invalid_argument("cannot average an empty list");
            double sum = 0;
            for (double x : v) sum += x;
            return sum / v.size();
        }

        int main() {
            string inputs[] = {"25", "abc", "200", "-3", "42"};
            for (const string& s : inputs) {
                try {
                    cout << "age " << parseAge(s) << " accepted" << endl;
                } catch (const invalid_argument& e) {
                    cout << "'" << s << "' is not a number" << endl;
                } catch (const out_of_range& e) {
                    cout << "rejected: " << e.what() << endl;
                }
            }
            try {
                cout << average({4, 8, 15}) << endl;
                cout << average({}) << endl;
            } catch (const exception& e) {
                cout << "error: " << e.what() << endl;
            }
            return 0;
        }
      `,
      quiz: [
        Q('Which keyword raises an exception?', ['raise', 'throw', 'error', 'except'], 1, 'C++ uses throw.'),
        Q('How should you usually catch an exception object?', ['By value', 'By const reference', 'By pointer', 'It does not matter'], 1, 'const T& avoids copying and slicing.'),
        Q('What does catch (...) do?', ['Catches only ints', 'Catches any exception', 'Rethrows', 'Is a syntax error'], 1, 'The ellipsis matches everything.'),
      ] },

    { id: 'cpp-exc2', title: 'Custom Exceptions & RAII', mins: 16,
      body: `
<p>The standard classes are not always specific enough. You can create your own exception types by inheriting from <code>std::exception</code> (or one of its children) and overriding <code>what()</code>.</p>
${E`
class InsufficientFunds : public exception {
    string message;
public:
    InsufficientFunds(double balance, double needed)
        : message("balance " + to_string((int)balance) + " is " + to_string((int)(needed - balance)) + " short") {}
    const char* what() const noexcept override { return message.c_str(); }
};

class Account {
    double balance;
public:
    Account(double b) : balance(b) {}
    void withdraw(double amount) {
        if (amount > balance) throw InsufficientFunds(balance, amount);
        balance -= amount;
        cout << "withdrew " << amount << ", left " << balance << endl;
    }
};

Account acct(100);
try {
    acct.withdraw(30);
    acct.withdraw(500);
} catch (const InsufficientFunds& e) {
    cout << "Declined: " << e.what() << endl;
}
`}
<h3>An exception hierarchy</h3>
${E`
class ShopError : public runtime_error {
public:
    ShopError(const string& msg) : runtime_error(msg) {}
};
class OutOfStock : public ShopError {
public:
    OutOfStock(const string& item) : ShopError(item + " is out of stock") {}
};
class PaymentFailed : public ShopError {
public:
    PaymentFailed(const string& why) : ShopError("payment failed: " + why) {}
};

void order(int what) {
    if (what == 1) throw OutOfStock("laptop");
    if (what == 2) throw PaymentFailed("card expired");
    cout << "order complete" << endl;
}

for (int i = 0; i < 3; i++) {
    try { order(i); }
    catch (const OutOfStock& e) { cout << "stock: " << e.what() << endl; }
    catch (const ShopError& e)  { cout << "shop problem: " << e.what() << endl; }
}
`}
<h3>Exceptions and cleanup: RAII</h3>
<p>When an exception unwinds the stack, C++ runs the <b>destructors</b> of every local object. That makes destructors the perfect place to release resources. This pattern is called <b>RAII</b> (Resource Acquisition Is Initialisation): acquire in the constructor, release in the destructor, and cleanup is automatic — even when an error happens.</p>
${E`
class FileGuard {
    string name;
public:
    FileGuard(string n) : name(n) { cout << "open " << name << endl; }
    ~FileGuard() { cout << "close " << name << endl; }
};

void process() {
    FileGuard a("input.txt");
    FileGuard b("output.txt");
    cout << "working..." << endl;
    throw runtime_error("crash in the middle");
}

try {
    process();
} catch (const exception& e) {
    cout << "caught: " << e.what() << endl;
}
`}
<p>Both files were closed (in reverse order) even though <code>process()</code> never reached its end. That is why modern C++ prefers <code>vector</code>, <code>string</code>, <code>ofstream</code> and smart pointers over manual <code>new</code>/<code>delete</code>: they are all RAII types.</p>
<h3>noexcept</h3>
<p><code>void f() noexcept</code> promises that <code>f</code> will not throw. The compiler may optimise, and if the promise is broken the program terminates.</p>
<h3>Guidelines</h3>
<ul><li>Throw by <b>value</b>, catch by <b>const reference</b>.</li><li>Derive your own exceptions from <code>std::exception</code> or <code>std::runtime_error</code>.</li><li>Never let an exception escape a destructor.</li><li>Use exceptions for errors you cannot handle locally, return codes for expected outcomes.</li></ul>
${tip('A hierarchy lets callers choose how precisely to react: catch <code>OutOfStock</code> to offer an alternative, or catch <code>ShopError</code> to just show a message.')}`,
      code: S`
        #include <iostream>
        #include <stdexcept>
        #include <string>
        using namespace std;

        class TemperatureError : public runtime_error {
            double value;
        public:
            TemperatureError(double v) : runtime_error("temperature out of range: " + to_string((int)v)), value(v) {}
            double getValue() const { return value; }
        };

        class Heater {
        public:
            Heater() { cout << "[heater on]" << endl; }
            ~Heater() { cout << "[heater off]" << endl; }
        };

        void setTarget(double celsius) {
            Heater h;
            if (celsius < 5 || celsius > 35) throw TemperatureError(celsius);
            cout << "target set to " << celsius << endl;
        }

        int main() {
            double requests[] = {21, 50, 18};
            for (double r : requests) {
                try {
                    setTarget(r);
                } catch (const TemperatureError& e) {
                    cout << "error: " << e.what() << " (value " << e.getValue() << ")" << endl;
                }
            }
            return 0;
        }
      `,
      quiz: [
        Q('From which class do custom exceptions usually inherit?', ['int', 'std::exception (or a subclass)', 'std::string', 'object'], 1, 'Deriving from std::exception lets generic handlers catch them.'),
        Q('What does RAII guarantee?', ['Faster code', 'Resources are released automatically when objects are destroyed, even after an exception', 'No exceptions', 'Thread safety'], 1, 'Destructors run during stack unwinding.'),
        Q('What does noexcept promise?', ['The function is fast', 'The function will not throw', 'The function is constant', 'The function is inline'], 1, 'Breaking the promise terminates the program.'),
      ] },
  ]);
})(globalThis);

<p>Java is <b>compiled and then run on the JVM</b> (Java Virtual Machine). <code>javac</code> turns your <code>.java</code> file into <i>bytecode</i>, and the JVM runs that bytecode on any operating system — "write once, run anywhere".</p>
${E`
public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, World!");
    }
}
`}
<h3>Every word explained</h3>
<ul>
<li><code>public class Main</code> — in Java <b>all code lives inside a class</b>. The file name must match the public class name.</li>
<li><code>public static void main(String[] args)</code> — the <b>entry point</b>. The JVM looks for exactly this line. <code>void</code> = returns nothing.</li>
<li><code>System.out.println(...)</code> — prints text then a new line. <code>System.out.print(...)</code> prints without the new line.</li>
<li><code>{ }</code> blocks and <code>;</code> after every statement — just like C++.</li>
</ul>
<h3>Printing</h3>
${E`
System.out.println("Line one");
System.out.print("No new line... ");
System.out.println("continued");
System.out.println("Sum: " + (2 + 3));        // + joins text and values
System.out.printf("Pi is about %.2f%n", 3.14159);   // formatted output
`}
<h3>Comments</h3>
${E`
// single line

   line */

<h3>Recursion &amp; binary search</h3>
${E`
static int binarySearch(int[] a, int target) {
    int low = 0, high = a.length - 1;
    while (low <= high) {
        int mid = low + (high - low) / 2;   // avoids int overflow
        if (a[mid] == target) return mid;
        if (a[mid] < target) low = mid + 1;
        else high = mid - 1;
    }
    return -1;
}
`}
<h3>Bubble sort</h3>
${E`
int[] a = {5, 2, 9, 1, 7};
int n = a.length;
for (int i = 0; i < n - 1; i++) {
    for (int j = 0; j < n - 1 - i; j++) {
        if (a[j] > a[j + 1]) {
            int tmp = a[j];
            a[j] = a[j + 1];
            a[j + 1] = tmp;
        }
    }
}
System.out.println(Arrays.toString(a));
`}
<p>In real code use <code>Arrays.sort(a)</code> (fast, O(n log n)).</p>
<h3>Big-O cheat sheet</h3>
<table><tr><th>O(1)</th><th>O(log n)</th><th>O(n)</th><th>O(n²)</th></tr><tr><td>array access</td><td>binary search</td><td>linear search</td><td>bubble sort</td></tr></table>
<h3>Exceptions: handling the unexpected</h3>
<p>When something goes wrong at run time Java <i>throws</i> an exception. You can <b>catch</b> it and recover instead of crashing.</p>
${E`

    int result = 10 / 0;
    System.out.println(result);
} catch (ArithmeticException e) {
    System.out.println("Oops: " + e.getMessage());
} finally {
    System.out.println("Always runs");
}
`}
<p>You can also throw your own: <code>throw new IllegalArgumentException("Age cannot be negative");</code></p>

<p>A <b>variable</b> is a named box in memory. In Java you must declare its <b>type</b>, and the type can never change. Java is <b>statically typed</b>, which lets the compiler catch many mistakes before the program runs.</p>

<h3>Declaring several variables</h3>
${E`

<h3>Naming rules and conventions</h3>
<ul><li>Letters, digits, <code>_</code> and <code>$</code>; cannot start with a digit; no spaces; not a keyword.</li><li>Case-sensitive: <code>total</code> and <code>Total</code> differ.</li><li>Convention: <code>camelCase</code> for variables and methods, <code>PascalCase</code> for classes, <code>UPPER_SNAKE_CASE</code> for constants.</li></ul>

System.out.println(big + " " + d + " " + f);
System.out.println(c1 + " " + c2 + " " + c3);
System.out.println(text);
`}
<h3>Constants with final</h3>
<p>A <code>final</code> variable can be assigned only once. By convention, constants are written in capitals (and usually also <code>static</code> inside a class).</p>
${E`
final double PI = 3.14159;
final int MAX_PLAYERS = 4;
System.out.println(PI * 2 + " " + MAX_PLAYERS);
// PI = 3;      // compile error: cannot assign a value to final variable PI
`}
<h3>var: let the compiler infer the type (Java 10+)</h3>
${E`
var count = 10;               // int
var message = "hello";        // String
var prices = new double[]{1.5, 2.5};
System.out.println(count + " " + message + " " + prices.length);
`}
${tip('<code>var</code> only works for local variables with an initialiser, and the type is still fixed once inferred. Use it when the type is obvious from the right-hand side.')}`,
      code: S`
        public class Main {
            public static void main(String[] args) {
                final double TAX_RATE = 0.14;
                String item = "headphones";
                double price = 49.5;
                int quantity = 3;
                boolean member = true;

                double subtotal = price * quantity;
                double tax = subtotal * TAX_RATE;
                System.out.println("Item: " + item + " x" + quantity);
                System.out.println("Subtotal: " + subtotal);
                System.out.println("Tax: " + tax);
                System.out.println("Member discount applied: " + member);

                var total = subtotal + tax;
                System.out.println("Total: " + total);
                char initial = item.charAt(0);
                System.out.println("First letter: " + initial);
            }
        }
      `,
      quiz: [
        Q('Which declaration creates a constant?', ['const int X = 5;', 'final int X = 5;', 'static int X = 5;', 'int X = 5;'], 1, 'Java uses final (const is a reserved but unused word).'),
        Q('What does var count = 10; make count?', ['An Object', 'An int', 'A String', 'It stays untyped'], 1, 'The compiler infers int.'),
        Q('Which is the conventional style for a variable name?', ['TotalPrice', 'total_price', 'totalPrice', 'TOTALPRICE'], 2, 'Variables use camelCase.'),
      ] },

    { id: 'java-types', title: 'Data Types & Type Casting', mins: 17,
      body: `
<p>Java has two families of types: <b>primitive types</b> (simple values stored directly) and <b>reference types</b> (objects such as <code>String</code>, arrays and your own classes).</p>
<table><tr><th>Type</th><th>Size</th><th>Range / use</th></tr>
<tr><td><code>byte</code></td><td>8 bit</td><td>-128 … 127</td></tr><tr><td><code>short</code></td><td>16 bit</td><td>-32,768 … 32,767</td></tr>
<tr><td><code>int</code></td><td>32 bit</td><td>about ±2.1 billion (the default integer)</td></tr><tr><td><code>long</code></td><td>64 bit</td><td>about ±9.2 × 10<sup>18</sup></td></tr>
<tr><td><code>float</code></td><td>32 bit</td><td>≈ 7 digits of precision</td></tr><tr><td><code>double</code></td><td>64 bit</td><td>≈ 15 digits (the default decimal)</td></tr>
<tr><td><code>char</code></td><td>16 bit</td><td>one UTF-16 character</td></tr><tr><td><code>boolean</code></td><td>-</td><td><code>true</code> or <code>false</code></td></tr></table>
${E`
System.out.println(Integer.MAX_VALUE + " " + Integer.MIN_VALUE);
System.out.println(Long.MAX_VALUE);
System.out.println(Byte.MAX_VALUE + " " + Short.MAX_VALUE);
System.out.println(Double.MAX_VALUE);
`}
<h3>Overflow wraps around</h3>
${E`
System.out.println(Integer.MAX_VALUE + 1);        // -2147483648 !
byte small = (byte) 130;                           // 130 does not fit: wraps to -126
System.out.println(small);
`}
<h3>Widening: automatic and safe</h3>
<p>A smaller type converts to a larger one without losing information: <code>byte → short → int → long → float → double</code>.</p>
${E`
int whole = 42;
long bigger = whole;          // automatic
double decimal = whole;       // automatic: 42.0
System.out.println(bigger + " " + decimal);
char letter = 'A';
int code = letter;            // char -> int
System.out.println(code);
`}
<h3>Narrowing: explicit cast required</h3>
<p>Going to a smaller type may lose data, so Java insists you write the cast <code>(type)</code> yourself.</p>
${E`
double pi = 3.99;
int truncated = (int) pi;                 // the decimals are cut off, not rounded
System.out.println(truncated);            // 3
System.out.println((int) -3.99);          // -3
System.out.println(Math.round(3.99));     // 4  (rounding is a separate method)
long large = 123456789012L;
int broken = (int) large;                 // data loss!
System.out.println(broken);
char next = (char) ('A' + 2);             // arithmetic gives an int; cast back to char
System.out.println(next);
`}
<h3>Integer division and mixed arithmetic</h3>
${E`
int a = 7, b = 2;
System.out.println(a / b);                // 3   (int / int = int)
System.out.println((double) a / b);       // 3.5
System.out.println(a / 2.0);              // 3.5
System.out.println(7 % 3 + " " + -7 % 3); // 1 -1
`}
<h3>Wrapper classes and parsing</h3>
<p>Every primitive has an object <b>wrapper</b>: <code>Integer</code>, <code>Double</code>, <code>Boolean</code>, <code>Character</code> … They are needed for collections and offer helper methods. Java converts automatically between them (<b>autoboxing</b>).</p>
${E`
Integer boxed = 25;               // autoboxing
int plain = boxed;                // unboxing
int n = Integer.parseInt("123");
double d = Double.parseDouble("3.5");
String s = String.valueOf(99);
System.out.println(n + 1 + " " + (d * 2) + " " + s.length());
System.out.println(Integer.toBinaryString(10) + " " + Integer.toHexString(255));
System.out.println(Integer.compare(3, 7) + " " + Integer.valueOf(5).equals(5));
`}
${warn('<code>Integer.parseInt("abc")</code> throws <code>NumberFormatException</code>. Validate or catch it when the text comes from a user.')}
${tip('Use <code>int</code> and <code>double</code> by default. Reach for <code>long</code> when values may exceed two billion, and <code>BigDecimal</code> for exact money calculations.')}`,
      code: S`
        public class Main {
            public static void main(String[] args) {
                int apples = 17, people = 5;
                System.out.println("Each person gets " + apples / people + " apples");
                System.out.println("Left over: " + apples % people);
                System.out.println("Exact share: " + (double) apples / people);

                double price = 19.99;
                int dollars = (int) price;

                System.out.println("max int + 1 = " + (Integer.MAX_VALUE + 1));
            }

        Q('Which conversion needs an explicit cast?', ['int to long', 'int to double', 'double to int', 'char to int'], 2, 'Narrowing may lose data.'),
        Q('What is the result of 7 / 2 when both are int?', ['3.5', '3', '4', '3.0'], 1, 'Integer division drops the fraction.'),

    { id: 'java-ops', title: 'Operators in Depth', mins: 17,
      body: `
<h3>Arithmetic</h3>
${E`
int a = 17, b = 5;
System.out.println(a + b + " " + (a - b) + " " + a * b);
System.out.println(a / b + " " + a % b);              // 3 2
System.out.println(17.0 / 5);                         // 3.4
System.out.println("sum: " + a + b);                  // string concatenation: sum: 175
System.out.println("sum: " + (a + b));                // parentheses first: sum: 22
`}
<h3>Increment and decrement</h3>
${E`
int n = 5;
int x = n++;            // x = 5, then n becomes 6   (postfix)
int y = ++n;            // n becomes 7, then y = 7   (prefix)
System.out.println(x + " " + y + " " + n);
n--; --n;
System.out.println(n);
`}
<h3>Assignment operators</h3>
${E`
int v = 10;
v += 5; v -= 3; v *= 2; v /= 4; v %= 4;
System.out.println(v);
int shifted = 3;
shifted <<= 2;           // 12
shifted |= 1;            // 13
System.out.println(shifted);
`}
<h3>Relational and logical</h3>
${E`
int age = 20;
System.out.println((age > 18) + " " + (age == 20) + " " + (age != 20));
System.out.println((age > 18 && age < 65) + " " + (age < 13 || age > 65) + " " + !(age > 18));
`}
<p><code>&amp;&amp;</code> and <code>||</code> <b>short-circuit</b>: the right side is skipped when the left side already decides the answer. The single versions <code>&amp;</code> and <code>|</code> always evaluate both sides.</p>
${E`
int d = 0;
if (d != 0 && 10 / d > 1) System.out.println("big");
else System.out.println("skipped the division safely");
`}
<h3>Bitwise and shift operators</h3>
${E`
int p = 5, q = 3;                                  // 0101 and 0011
System.out.println((p & q) + " " + (p | q) + " " + (p ^ q) + " " + (~p));
System.out.println((p << 1) + " " + (p >> 1) + " " + (-16 >> 2) + " " + (-16 >>> 28));
System.out.println(Integer.toBinaryString(42));
`}
<h3>The ternary operator</h3>
${E`
int score = 72;
String result = (score >= 50) ? "pass" : "fail";
int bigger = (7 > 3) ? 7 : 3;
System.out.println(result + " " + bigger);
`}
<h3>instanceof</h3>
${E`
Object o = "hello";
System.out.println(o instanceof String);
System.out.println(o instanceof Integer);
`}
<h3>Precedence (high to low)</h3>
<table><tr><th>Level</th><th>Operators</th></tr><tr><td>1</td><td><code>( )</code> <code>[ ]</code> <code>.</code> postfix <code>++ --</code></td></tr><tr><td>2</td><td>prefix <code>++ --</code>, unary <code>+ - ! ~</code>, casts</td></tr><tr><td>3</td><td><code>* / %</code></td></tr><tr><td>4</td><td><code>+ -</code></td></tr><tr><td>5</td><td><code>&lt;&lt; &gt;&gt; &gt;&gt;&gt;</code></td></tr><tr><td>6</td><td><code>&lt; &lt;= &gt; &gt;= instanceof</code></td></tr><tr><td>7</td><td><code>== !=</code></td></tr><tr><td>8</td><td><code>&amp;</code> then <code>^</code> then <code>|</code></td></tr><tr><td>9</td><td><code>&amp;&amp;</code> then <code>||</code></td></tr><tr><td>10</td><td><code>?:</code> then assignments</td></tr></table>
${tip('Use parentheses whenever precedence is not obvious. They cost nothing and prevent bugs like <code>"sum: " + a + b</code>.')}`,
      code: S`
        public class Main {
            public static void main(String[] args) {
                int a = 23, b = 5;
                System.out.println("a / b = " + a / b + ", a % b = " + a % b);
                System.out.println("exact: " + (double) a / b);

                int i = 3;
                int post = i++;
                int pre = ++i;
                System.out.println("post=" + post + " pre=" + pre + " i=" + i);

                System.out.println("bits: " + (12 & 10) + " " + (12 | 10) + " " + (12 ^ 10) + " " + (1 << 4));
                int hour = 15;
                String greeting = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
                System.out.println(greeting);
                boolean leap = (2024 % 4 == 0 && 2024 % 100 != 0) || 2024 % 400 == 0;
                System.out.println("2024 is a leap year: " + leap);
                System.out.println(2 + 3 * 4 + " " + (2 + 3) * 4);
            }
        }
      `,
      quiz: [
        Q('What does "sum: " + 1 + 2 print?', ['sum: 3', 'sum: 12', 'sum: 1 2', 'Error'], 1, 'Left to right: the string comes first, so + concatenates.'),
        Q('What is -16 >> 2?', ['-4', '4', '-64', '16'], 0, 'Arithmetic right shift divides by 4, keeping the sign.'),
        Q('Which operator short-circuits?', ['&', '|', '&&', '^'], 2, '&& stops when the left side is false.'),
      ] },

    { id: 'java-io', title: 'Input & Output: Scanner, BufferedReader & printf', mins: 19,
      body: `
<h3>Output</h3>
<table><tr><th>Method</th><th>Does</th></tr><tr><td><code>System.out.println(x)</code></td><td>prints, then a new line</td></tr><tr><td><code>System.out.print(x)</code></td><td>prints, stays on the line</td></tr><tr><td><code>System.out.printf(fmt, ...)</code></td><td>formatted output</td></tr><tr><td><code>System.err.println(x)</code></td><td>error stream (shown in red in a terminal)</td></tr></table>
${E`
System.out.print("loading");
System.out.print("... ");
System.out.println("done");
System.out.println();                              // blank line
System.out.println("Tab\there, quote \" and backslash \\");
`}
<h3>Formatted output with printf</h3>
<table><tr><th>Specifier</th><th>Meaning</th></tr><tr><td><code>%d</code></td><td>integer</td></tr><tr><td><code>%f</code> <code>%.2f</code></td><td>decimal, with 2 digits after the point</td></tr><tr><td><code>%s</code></td><td>string (any object)</td></tr><tr><td><code>%c</code> <code>%b</code></td><td>char / boolean</td></tr><tr><td><code>%n</code></td><td>new line</td></tr><tr><td><code>%5d</code> <code>%-8s</code> <code>%05d</code> <code>%,d</code></td><td>width, left-align, zero-pad, thousands separator</td></tr></table>
${E`
String item = "pen";
double price = 1.5;
int qty = 12;
System.out.printf("%s costs %.2f%n", item, price);
System.out.printf("%-10s|%6.2f|%4d|%n", item, price, qty);
System.out.printf("%05d %,d %x %b%n", 42, 1234567, 255, true);
String line = String.format("%d x %s = %.1f", qty, item, qty * price);
System.out.println(line);
`}
<h3>Reading input with Scanner</h3>
<p><code>Scanner</code> (in <code>java.util</code>) reads from the keyboard (<code>System.in</code>) or files.</p>
${E`
Scanner sc = new Scanner(System.in);
System.out.print("Name? ");
String name = sc.nextLine();
System.out.print("Age? ");
int age = sc.nextInt();
System.out.print("Height? ");
double height = sc.nextDouble();
System.out.println(name + " is " + age + " and " + height + " m tall");
sc.close();
`}
<table><tr><th>Method</th><th>Reads</th></tr><tr><td><code>next()</code></td><td>one word</td></tr><tr><td><code>nextLine()</code></td><td>a whole line</td></tr><tr><td><code>nextInt()</code> <code>nextDouble()</code> <code>nextBoolean()</code></td><td>a number / boolean</td></tr><tr><td><code>hasNext()</code> <code>hasNextInt()</code> <code>hasNextLine()</code></td><td>is there more input?</td></tr></table>
${warn('<b>The leftover-newline trap:</b> after <code>nextInt()</code> the Enter key press is still in the buffer, so a following <code>nextLine()</code> returns an empty string. Call an extra <code>sc.nextLine()</code> to consume it.')}
${E`
Scanner sc = new Scanner(System.in);
int n = sc.nextInt();
sc.nextLine();                    // consume the rest of the line
String sentence = sc.nextLine();
System.out.println(n + " / " + sentence);
`}
<h3>Reading until the input ends</h3>
${E`
Scanner sc = new Scanner(System.in);
int sum = 0, count = 0;
while (sc.hasNextInt()) {
    sum += sc.nextInt();
    count++;
}
System.out.println(count + " numbers, sum " + sum);
`}
<h3>Checking user input</h3>
${E`
Scanner sc = new Scanner(System.in);
if (sc.hasNextInt()) {
    System.out.println("number: " + sc.nextInt());
} else {
    System.out.println("that was not a number: " + sc.next());
}
`}
<h3>BufferedReader: faster for large input</h3>
${E`
import java.io.*;
BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
String first = br.readLine();                    // always a String (null at the end)
int number = Integer.parseInt(first.trim());
System.out.println(number * 2);
`}
<p>Methods using <code>readLine()</code> must declare <code>throws IOException</code> (or catch it).</p>
${tip('On this site, put your input (one answer per line) in the <b>Input</b> box under the editor, or type it in the pop-up that appears when the program asks for more.')}`,

        public class Main {
            public static void main(String[] args) {

      ] },

    { id: 'java-str', title: 'Strings in Depth', mins: 20,
      body: `
<p>A <code>String</code> is an <b>object</b> that holds a sequence of characters. Strings are <b>immutable</b>: once created they never change; every "modification" returns a <i>new</i> string.</p>
${E`
String a = "Hello";
String b = new String("Hello");
String c = "Hello, " + "world";
System.out.println(a + " | " + b + " | " + c);
System.out.println(a.length() + " " + c.length());
`}
<h3>Common methods</h3>
${E`
String s = "  Learn Java, learn well  ";
System.out.println(s.length());
System.out.println(s.trim());                       // remove outer spaces
System.out.println(s.toUpperCase() + "|" + s.toLowerCase());
System.out.println(s.charAt(2));                    // 'L'
System.out.println(s.indexOf("Java") + " " + s.indexOf("zzz") + " " + s.lastIndexOf("learn"));
System.out.println(s.contains("well") + " " + s.trim().startsWith("Learn") + " " + s.trim().endsWith("."));
System.out.println(s.trim().substring(6));          // from index 6
System.out.println(s.trim().substring(0, 5));       // [0, 5)
System.out.println(s.replace("learn", "teach"));
System.out.println(s.isEmpty() + " " + "".isEmpty() + " " + "  ".isBlank());
`}
<h3>Comparing strings: equals, not ==</h3>
<p><code>==</code> compares <b>references</b> (are they the same object?); <code>equals</code> compares the <b>characters</b>.</p>
${E`
String s1 = "java";
String s2 = "java";
String s3 = new String("java");
System.out.println(s1 == s2);               // true  (same literal in the string pool)
System.out.println(s1 == s3);               // false (a different object)
System.out.println(s1.equals(s3));          // true  (same characters)
System.out.println("Java".equalsIgnoreCase("JAVA"));
System.out.println("apple".compareTo("banana") + " " + "b".compareTo("a") + " " + "a".compareTo("a"));
`}
<h3>Splitting and joining</h3>
${E`
String csv = "red,green,blue";
String[] parts = csv.split(",");
System.out.println(parts.length + " " + parts[1]);
for (String p : parts) System.out.print(p.toUpperCase() + " ");
System.out.println();
String[] words = "the  quick   brown fox".split("\\s+");     // regex: one or more spaces
System.out.println(words.length);
System.out.println(String.join("-", "a", "b", "c"));
System.out.println(String.join(" | ", parts));
`}
<h3>Characters inside a string</h3>
${E`
String word = "Hello World 2025";
int letters = 0, digits = 0, spaces = 0, upper = 0;
for (int i = 0; i < word.length(); i++) {
    char ch = word.charAt(i);
    if (Character.isLetter(ch)) letters++;
    if (Character.isDigit(ch)) digits++;
    if (Character.isWhitespace(ch)) spaces++;
    if (Character.isUpperCase(ch)) upper++;
}
System.out.println(letters + " " + digits + " " + spaces + " " + upper);
char[] arr = "hello".toCharArray();
System.out.println(arr.length + " " + arr[0]);
System.out.println(String.valueOf(arr) + " " + new String(arr));
`}
<h3>Palindrome and counting examples</h3>
${E`
String text = "racecar";
boolean palindrome = true;
for (int i = 0; i < text.length() / 2; i++) {
    if (text.charAt(i) != text.charAt(text.length() - 1 - i)) { palindrome = false; break; }
}
System.out.println(text + " palindrome? " + palindrome);

int vowels = 0;
for (char c : "programming language".toCharArray())
    if ("aeiou".indexOf(c) >= 0) vowels++;
System.out.println(vowels + " vowels");

String digitsOnly = "a1b2c3";
int sum = 0;
for (int i = 0; i < digitsOnly.length(); i++)
    if (Character.isDigit(digitsOnly.charAt(i))) sum += digitsOnly.charAt(i) - '0';
System.out.println("digit sum: " + sum);
`}
<h3>Formatting and conversion</h3>
${E`
int n = 42;
String fromNumber = String.valueOf(n);
String viaConcat = "" + n;
System.out.println(fromNumber + viaConcat);
System.out.println("Pi ~ " + String.format("%.3f", Math.PI));
System.out.println("hello".repeat(2) + " " + "Java".hashCode());
`}
${warn('<code>s.toUpperCase()</code> does not change <code>s</code>. Write <code>s = s.toUpperCase();</code> to keep the result.')}
${tip('Loops that build a big string with <code>+=</code> create many temporary objects. Use <code>StringBuilder</code> (next lesson).')}`,
      code: S`
        public class Main {
            static boolean isPalindrome(String s) {
                String clean = s.toLowerCase().replaceAll("[^a-z0-9]", "");
                String reversed = new StringBuilder(clean).reverse().toString();
                return clean.equals(reversed);
            }

            public static void main(String[] args) {
                String sentence = "The quick brown fox jumps over the lazy dog";
                String[] words = sentence.split(" ");
                System.out.println("Words: " + words.length);

                String longest = "";
                for (String w : words) if (w.length() > longest.length()) longest = w;
                System.out.println("Longest word: " + longest);

                StringBuilder initials = new StringBuilder();
                for (String w : words) initials.append(Character.toUpperCase(w.charAt(0)));
                System.out.println("Initials: " + initials);

                System.out.println("Upper: " + sentence.toUpperCase());
                System.out.println("Contains 'fox': " + sentence.contains("fox"));
                System.out.println("Index of 'jumps': " + sentence.indexOf("jumps"));

    { id: 'java-sb', title: 'StringBuilder, StringBuffer & Text Processing', mins: 14,
      body: `
<p>Because <code>String</code> is immutable, <code>s += "x"</code> inside a loop creates a brand new String every time. A <b><code>StringBuilder</code></b> is a <b>mutable</b> sequence of characters that changes in place, so building text is much faster.</p>
${E`
StringBuilder sb = new StringBuilder();
sb.append("Hello");
sb.append(' ');
sb.append("World");
sb.append("!").append(2025).append(true);       // methods return the builder: chain them
System.out.println(sb);
System.out.println(sb.toString().length() + " " + sb.length());
`}
<h3>Editing operations</h3>
${E`
StringBuilder sb = new StringBuilder("Java is fun");
sb.insert(0, ">> ");                 // insert at an index
sb.replace(8, 10, "IS");             // replace [8, 10)
sb.deleteCharAt(sb.length() - 1);    // remove the last char
sb.delete(0, 3);                     // remove [0, 3)
sb.setCharAt(0, 'j');
System.out.println(sb);
System.out.println(sb.reverse());
System.out.println(sb.indexOf("a") + " " + sb.charAt(1));
`}
<h3>Performance comparison</h3>
${E`
String slow = "";
for (int i = 0; i < 5; i++) slow += i + ",";      // five temporary String objects
StringBuilder fast = new StringBuilder();
for (int i = 0; i < 5; i++) fast.append(i).append(",");
System.out.println(slow.equals(fast.toString()));
System.out.println(fast);
`}
<h3>Practical uses</h3>
${E`
// 1. build a table row by row
StringBuilder table = new StringBuilder();
for (int row = 1; row <= 3; row++) {
    for (int col = 1; col <= 4; col++) table.append(row * col).append("\t");
    table.append("\n");
}
System.out.print(table);

// 2. reverse a sentence word by word
String[] words = "to be or not to be".split(" ");
StringBuilder reversed = new StringBuilder();
for (int i = words.length - 1; i >= 0; i--) {
    reversed.append(words[i]);
    if (i > 0) reversed.append(" ");
}
System.out.println(reversed);

// 3. comma separated list without a trailing comma
StringBuilder list = new StringBuilder();
for (String item : new String[]{"tea", "milk", "sugar"}) {
    if (list.length() > 0) list.append(", ");
    list.append(item);
}
System.out.println(list);
`}
<h3>StringBuilder vs StringBuffer vs String</h3>
<table><tr><th></th><th>String</th><th>StringBuilder</th><th>StringBuffer</th></tr><tr><td>Mutable?</td><td>no</td><td>yes</td><td>yes</td></tr><tr><td>Thread-safe?</td><td>yes (immutable)</td><td>no</td><td>yes (synchronised, slower)</td></tr><tr><td>Use for</td><td>fixed text</td><td>building text (default choice)</td><td>shared between threads</td></tr></table>
${tip('Handy: <code>String.join(", ", list)</code> and <code>String.format(...)</code> cover many cases where beginners reach for a builder.')}`,

    { id: 'java-bc', title: 'break, continue & Labeled Loops', mins: 13,
      body: `
<h3>break</h3>
<p><code>break</code> leaves the nearest loop (or <code>switch</code>) immediately.</p>
${E`
for (int i = 1; i <= 10; i++) {
    if (i * i > 30) {
        System.out.println("stopped at " + i);
        break;
    }
}
int[] data = {4, 8, 15, 16, 23, 42};
int target = 16, index = -1;
for (int i = 0; i < data.length; i++) {
    if (data[i] == target) { index = i; break; }
}
System.out.println("found at index " + index);
`}
<h3>continue</h3>
<p><code>continue</code> skips the rest of the current round and jumps to the next one.</p>
${E`
for (int i = 1; i <= 10; i++) {
    if (i % 3 == 0) continue;           // skip multiples of 3
    System.out.print(i + " ");
}
System.out.println();
int sum = 0;
for (int n : new int[]{5, -2, 8, -7, 3}) {
    if (n < 0) continue;                // ignore negatives
    sum += n;
}
System.out.println("sum of positives: " + sum);
`}
<h3>Labeled break and continue</h3>
<p>A plain <code>break</code> only exits the <i>inner</i> loop. Give the outer loop a <b>label</b> to jump out of both.</p>
${E`
outer:
for (int a = 1; a < 20; a++) {
    for (int b = a; b < 20; b++) {
        if (a * a + b * b == 13 * 13) {
            System.out.println("found " + a + " and " + b);
            break outer;                // leaves BOTH loops
        }
    }
}

rows:
for (int r = 1; r <= 4; r++) {
    for (int c = 1; c <= 4; c++) {
        if (c > r) continue rows;       // next row
        System.out.print(r * c + " ");
    }
    System.out.println();
}
`}
<h3>Nested loops: patterns</h3>
${E`
for (int row = 1; row <= 4; row++) {
    for (int col = 1; col <= row; col++) System.out.print("* ");
    System.out.println();
}
for (int i = 1; i <= 3; i++) {
    for (int j = 1; j <= 5; j++) System.out.print(i * j + "\t");
    System.out.println();
}
`}
<h3>while(true) with break</h3>
${E`
int tries = 0;
while (true) {
    tries++;
    if (tries == 4) break;
}
System.out.println("took " + tries + " attempts");
`}
${tip('Prefer a clear loop condition over many <code>break</code> statements. But for searches, <code>break</code> after the answer is found is perfectly fine.')}
${warn('Java has no <code>goto</code>. Labeled break/continue are the only "jumps", and they only go out of or to the next round of enclosing loops.')}`,
      code: S`
        public class Main {
            public static void main(String[] args) {
                // first prime above 50
                int n = 51;
                while (true) {
                    boolean prime = true;
                    for (int d = 2; d * d <= n; d++) {
                        if (n % d == 0) { prime = false; break; }
                    }
                    if (prime) break;
                    n++;
                }
                System.out.println("first prime above 50: " + n);

                // multiplication triangle skipping multiples of 4
                for (int i = 1; i <= 5; i++) {
                    for (int j = 1; j <= i; j++) {
                        if ((i * j) % 4 == 0) continue;
                        System.out.print(i * j + " ");
                    }
                    System.out.println();
                }

                int[][] grid = {{3, 5, 8}, {2, 9, 4}, {7, 1, 6}};
                int wanted = 9, foundRow = -1, foundCol = -1;
                search:
                for (int r = 0; r < grid.length; r++) {
                    for (int c = 0; c < grid[r].length; c++) {
                        if (grid[r][c] == wanted) { foundRow = r; foundCol = c; break search; }
                    }
                }
                System.out.println(wanted + " is at row " + foundRow + ", column " + foundCol);
            }
        }
      `,
      quiz: [
        Q('What does a labeled break do?', ['Names a variable', 'Exits the labeled outer loop', 'Pauses the program', 'Restarts a loop'], 1, 'break label; jumps out of the loop carrying that label.'),
        Q('What does continue do?', ['Ends the loop', 'Skips to the next iteration', 'Ends the program', 'Does nothing'], 1, 'The rest of the current round is skipped.'),
        Q('Does Java have goto?', ['Yes', 'No (it is reserved but unused)', 'Only in switch', 'Only in loops'], 1, 'goto is reserved but not implemented.'),

    { id: 'java-ovl', title: 'Method Overloading, Varargs & Pass-by-Value', mins: 18,
      body: `
<h3>Overloading</h3>
<p>Several methods may share a <b>name</b> if their <b>parameter lists differ</b> (number, types or order). The compiler chooses the best match from the arguments. Changing only the return type is not enough.</p>
${E`
static int add(int a, int b)             { return a + b; }
static double add(double a, double b)    { return a + b; }
static String add(String a, String b)    { return a + b; }
static int add(int a, int b, int c)      { return a + b + c; }

System.out.println(add(2, 3));                 // int version
System.out.println(add(2.5, 1.25));            // double version
System.out.println(add("Java", "!"));          // String version
System.out.println(add(1, 2, 3));              // three parameters
`}
<h3>Overloading to offer convenient forms</h3>
${E`
static void print(String text)            { System.out.println(text); }
static void print(String text, int times) {
    for (int i = 0; i < times; i++) System.out.println(text);
}
static double area(double side)           { return side * side; }
static double area(double w, double h)    { return w * h; }

print("hi");
print("bye", 2);
System.out.println(area(3) + " " + area(3, 4));
`}
<h3>Varargs: any number of arguments</h3>
<p>A <b>varargs</b> parameter (<code>type... name</code>) accepts zero or more values; inside the method it is an array. It must be the <b>last</b> parameter.</p>
${E`
static int sum(int... numbers) {
    int total = 0;
    for (int n : numbers) total += n;
    return total;
}
static String describe(String label, double... values) {
    return label + ": " + values.length + " values";
}

System.out.println(sum());                 // 0
System.out.println(sum(5));
System.out.println(sum(1, 2, 3, 4, 5));
System.out.println(describe("temps", 21.5, 22.0, 19.8));
System.out.println(sum(new int[]{10, 20}));     // an array works too
`}
<h3>Java is always pass-by-value</h3>
<p>When you call a method, Java copies the arguments. For primitives the method gets a copy of the <b>value</b>; for objects and arrays it gets a copy of the <b>reference</b> — so the method can change the object's <i>contents</i> but cannot make the caller's variable point somewhere else.</p>
${E`
static void changePrimitive(int x) { x = 100; }
static void changeArray(int[] arr) { arr[0] = 100; }
static void reassign(int[] arr)    { arr = new int[]{9, 9, 9}; }

int n = 5;
int[] data = {1, 2, 3};
changePrimitive(n);
changeArray(data);
reassign(data);
System.out.println(n + " " + data[0] + " " + data.length);   // 5 100 3
`}
<h3>Returning values and early return</h3>
${E`
static String grade(int score) {
    if (score >= 90) return "A";
    if (score >= 80) return "B";
    if (score >= 70) return "C";
    return "F";
}
static boolean isEven(int n) { return n % 2 == 0; }
static void warn(String msg) {
    if (msg.isEmpty()) return;          // leave a void method early
    System.out.println("WARNING: " + msg);
}
System.out.println(grade(85) + grade(40) + isEven(7));
warn("");
warn("low battery");
`}
${tip('Keep overloads doing the <i>same job</i>. If two methods behave differently, give them different names (<code>parseInt</code> vs <code>parseDouble</code>).')}`,
      code: S`
        public class Main {
            static double average(double... values) {
                if (values.length == 0) return 0;
                double sum = 0;
                for (double v : values) sum += v;
                return sum / values.length;
            }

            static String format(int cents) { return "$" + cents / 100 + "." + (cents % 100 < 10 ? "0" : "") + cents % 100; }
            static String format(double dollars) { return String.format("$%.2f", dollars); }
            static String format(String label, int cents) { return label + ": " + format(cents); }

            static void swapFirstTwo(int[] a) { int t = a[0]; a[0] = a[1]; a[1] = t; }
            static void tryToSwap(int x, int y) { int t = x; x = y; y = t; }

            public static void main(String[] args) {
                System.out.println(average(80, 90, 100) + " " + average());
                System.out.println(format(1999));
                System.out.println(format(19.5));
                System.out.println(format("Total", 4505));

                int[] nums = {1, 2, 3};
                swapFirstTwo(nums);
                System.out.println("array after swap: " + nums[0] + nums[1] + nums[2]);
                int p = 1, q = 2;
                tryToSwap(p, q);
                System.out.println("primitives after attempted swap: " + p + q);
            }
        }
      `,
      quiz: [
        Q('Which is a valid overload of void show(int x)?', ['int show(int x)', 'void show(double x)', 'void show(int y)', 'static void show(int x)'], 1, 'Overloads differ in parameter types or count.'),
        Q('What is a varargs parameter inside the method?', ['A list', 'An array', 'A string', 'A map'], 1, 'int... n behaves like int[] n.'),
        Q('Java passes arguments…', ['By reference always', 'By value always (objects pass a copy of the reference)', 'By name', 'By pointer'], 1, 'Reassigning a parameter never changes the caller\'s variable.'),
      ] },

    { id: 'java-rec', title: 'Recursion', mins: 17,
      body: `
<p>A method is <b>recursive</b> when it calls itself on a smaller problem. Every recursive method needs a <b>base case</b> (stops the recursion) and a <b>recursive case</b> (moves toward the base case).</p>
${E`
static int factorial(int n) {
    if (n <= 1) return 1;              // base case
    return n * factorial(n - 1);       // recursive case
}
System.out.println(factorial(5) + " " + factorial(10));
`}
<p>Trace of <code>factorial(3)</code>: <code>3 * factorial(2)</code> → <code>3 * (2 * factorial(1))</code> → <code>3 * (2 * 1)</code> = 6. The pending calls wait on the <b>call stack</b>.</p>
<h3>Fibonacci and memoisation</h3>
${E`
static int fib(int n) { return n < 2 ? n : fib(n - 1) + fib(n - 2); }

static long[] memo = new long[60];
static long fastFib(int n) {
    if (n < 2) return n;
    if (memo[n] != 0) return memo[n];
    return memo[n] = fastFib(n - 1) + fastFib(n - 2);
}
for (int i = 0; i < 10; i++) System.out.print(fib(i) + " ");
System.out.println();
System.out.println(fastFib(50));
`}
<h3>More examples</h3>
${E`
static int power(int base, int exp) { return exp == 0 ? 1 : base * power(base, exp - 1); }
static int gcd(int a, int b) { return b == 0 ? a : gcd(b, a % b); }
static int digitSum(int n) { return n < 10 ? n : n % 10 + digitSum(n / 10); }
static String reverse(String s) { return s.length() <= 1 ? s : reverse(s.substring(1)) + s.charAt(0); }
static boolean isPalindrome(String s) {
    if (s.length() < 2) return true;
    if (s.charAt(0) != s.charAt(s.length() - 1)) return false;
    return isPalindrome(s.substring(1, s.length() - 1));
}
System.out.println(power(2, 10) + " " + gcd(48, 18) + " " + digitSum(90817));
System.out.println(reverse("recursion") + " " + isPalindrome("racecar") + " " + isPalindrome("hello"));
`}
<h3>Towers of Hanoi</h3>
${E`
static void hanoi(int n, char from, char to, char via) {
    if (n == 0) return;
    hanoi(n - 1, from, via, to);
    System.out.println("move disk " + n + " " + from + " -> " + to);
    hanoi(n - 1, via, to, from);
}
hanoi(3, 'A', 'C', 'B');
`}
<h3>Recursion on arrays: binary search</h3>
${E`
static int search(int[] a, int lo, int hi, int target) {
    if (lo > hi) return -1;
    int mid = lo + (hi - lo) / 2;
    if (a[mid] == target) return mid;
    if (a[mid] < target) return search(a, mid + 1, hi, target);
    return search(a, lo, mid - 1, target);
}
int[] sorted = {2, 5, 8, 12, 16, 23, 38, 56, 72, 91};
System.out.println(search(sorted, 0, sorted.length - 1, 23));
`}
<h3>Infinite recursion</h3>
<p>Without a reachable base case the stack fills up and Java throws <code>StackOverflowError</code>.</p>
${E`
static int runaway(int n) { return runaway(n + 1); }
try {
    runaway(0);
} catch (StackOverflowError e) {
    System.out.println("caught StackOverflowError");
}
`}
${tip('Loops are usually faster and use less memory. Choose recursion when the problem is naturally recursive: trees, folders, divide-and-conquer, backtracking.')}`,
      code: S`
        public class Main {
            static int sumTo(int n) { return n == 0 ? 0 : n + sumTo(n - 1); }

            static void countdown(int n) {
                if (n == 0) { System.out.println("Liftoff!"); return; }
                System.out.print(n + "... ");
                countdown(n - 1);
            }

            static long fact(int n) { return n <= 1 ? 1 : n * fact(n - 1); }

            static void permutations(String prefix, String rest) {
                if (rest.isEmpty()) { System.out.print(prefix + " "); return; }
                for (int i = 0; i < rest.length(); i++)
                    permutations(prefix + rest.charAt(i), rest.substring(0, i) + rest.substring(i + 1));
            }

            static int countChar(String s, char c) {
                if (s.isEmpty()) return 0;
                return (s.charAt(0) == c ? 1 : 0) + countChar(s.substring(1), c);
            }

            public static void main(String[] args) {
                System.out.println(sumTo(100));
                countdown(5);
                System.out.println("20! = " + fact(20));
                permutations("", "abc");
                System.out.println();
                System.out.println("a's in banana: " + countChar("banana", 'a'));
            }
        }
      `,
      quiz: [
        Q('What does every recursive method need?', ['A loop', 'A base case', 'A static field', 'An array'], 1, 'It ends the recursion.'),
        Q('What error does infinite recursion cause?', ['OutOfRange', 'StackOverflowError', 'NullPointerException', 'ClassCastException'], 1, 'The call stack overflows.'),
        Q('What is gcd(48, 18) with the Euclidean algorithm?', ['3', '6', '9', '12'], 1, '48 % 18 = 12, 18 % 12 = 6, 12 % 6 = 0 → 6.'),
      ] },

    { id: 'java-arr', title: 'Arrays', mins: 19,
      body: `
<p>An <b>array</b> holds a fixed number of values of the same type. It is an <b>object</b>: it knows its <code>length</code> (a field, no parentheses!), and its indexes start at <b>0</b>.</p>
${E`
int[] scores = {90, 80, 70, 60, 50};          // create with values
int[] zeros = new int[5];                      // five zeros
String[] names = new String[3];                // three nulls
double[] prices = {1.5, 2.25, 3.0};
System.out.println(scores[0] + " " + scores[scores.length - 1] + " " + scores.length);
scores[2] = 75;
System.out.println(zeros[4] + " " + names[0] + " " + prices[1]);
names[0] = "Ali";
System.out.println(names[0]);
`}
<h3>Default values</h3>
<p>New array elements start as <code>0</code> (numbers), <code>false</code> (boolean), <code>'\\u0000'</code> (char) or <code>null</code> (objects).</p>
<h3>Looping</h3>
${E`
int[] data = {4, 8, 15, 16, 23, 42};
for (int i = 0; i < data.length; i++) System.out.print(data[i] + " ");
System.out.println();
for (int x : data) System.out.print(x * 2 + " ");        // for-each: read-only copy of each element
System.out.println();
int sum = 0, max = data[0];
for (int x : data) { sum += x; if (x > max) max = x; }
System.out.println("sum " + sum + ", max " + max + ", average " + (double) sum / data.length);
`}
<h3>Out-of-bounds protection</h3>
<p>Unlike C++, Java checks every access and throws <code>ArrayIndexOutOfBoundsException</code>.</p>
${E`
int[] small = new int[3];
try {
    small[3] = 1;                // valid indexes: 0, 1, 2
} catch (ArrayIndexOutOfBoundsException e) {
    System.out.println("Error: " + e.getMessage());
}
`}
<h3>The Arrays utility class</h3>
${E`
int[] a = {5, 2, 9, 1, 7};
System.out.println(Arrays.toString(a));             // printing an array directly shows junk like [I@1b6d3586
Arrays.sort(a);
System.out.println(Arrays.toString(a));
System.out.println(Arrays.binarySearch(a, 7));      // array must be sorted
int[] filled = new int[4];
Arrays.fill(filled, 8);
int[] copy = Arrays.copyOf(a, 3);
int[] part = Arrays.copyOfRange(a, 1, 4);
System.out.println(Arrays.toString(filled) + Arrays.toString(copy) + Arrays.toString(part));
System.out.println(Arrays.equals(copy, new int[]{1, 2, 5}));
`}
<h3>Arrays are references</h3>
${E`
int[] original = {1, 2, 3};
int[] alias = original;               // NOT a copy: two names, one array
alias[0] = 99;
System.out.println(original[0]);      // 99
int[] real = original.clone();        // a real copy
real[1] = -1;
System.out.println(original[1] + " " + real[1]);
`}
<h3>Arrays and methods</h3>
${E`
static int[] doubleAll(int[] in) {
    int[] out = new int[in.length];
    for (int i = 0; i < in.length; i++) out[i] = in[i] * 2;
    return out;
}
static int findMax(int[] a) {
    int best = a[0];
    for (int x : a) if (x > best) best = x;
    return best;
}
int[] result = doubleAll(new int[]{3, 6, 9});
System.out.println(Arrays.toString(result) + " max " + findMax(result));
`}
<h3>Reversing and counting</h3>
${E`
int[] r = {1, 2, 3, 4, 5};
for (int i = 0, j = r.length - 1; i < j; i++, j--) {
    int tmp = r[i]; r[i] = r[j]; r[j] = tmp;
}
System.out.println(Arrays.toString(r));
int[] counts = new int[5];
for (int roll : new int[]{1, 3, 3, 5, 3, 1}) counts[roll - 1]++;
System.out.println(Arrays.toString(counts));
`}

        import java.util.Arrays;

        public class Main {
            static void bubbleSort(int[] a) {
                for (int i = 0; i < a.length - 1; i++)
                    for (int j = 0; j < a.length - 1 - i; j++)
                        if (a[j] > a[j + 1]) { int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t; }
            }

            public static void main(String[] args) {
                int[] temps = {21, 25, 19, 30, 27, 23, 22};
                double sum = 0;
                for (int t : temps) sum += t;
                System.out.println("days: " + temps.length + ", average: " + sum / temps.length);

                    if (temps[i] > hottest) { hottest = temps[i]; hottestDay = i; }

                int[] sorted = temps.clone();
                bubbleSort(sorted);
                System.out.println("original: " + Arrays.toString(temps));
                System.out.println("sorted:   " + Arrays.toString(sorted));
                System.out.println("coldest three: " + Arrays.toString(Arrays.copyOf(sorted, 3)));
            }

<p>A <b>class</b> is a blueprint that describes what data (<b>fields</b>) and behaviour (<b>methods</b>) something has. An <b>object</b> is one concrete thing built from that blueprint with <code>new</code>.</p>
${E`
class Dog {
    String name;          // fields: the data each dog has
    int age;

    void bark() {         // method: what a dog can do
        System.out.println(name + " says Woof!");
    }
    void birthday() {
        age++;
    }
    String describe() {
        return name + " is " + age + " years old";
    }
}

Dog rex = new Dog();      // create an object
rex.name = "Rex";
rex.age = 3;
Dog luna = new Dog();
luna.name = "Luna";
luna.age = 5;
rex.bark();
rex.birthday();
System.out.println(rex.describe());
System.out.println(luna.describe());
`}
<p>Each object has its <b>own copy</b> of the fields: changing <code>rex.age</code> does not change <code>luna.age</code>.</p>
<h3>Objects live on the heap; variables hold references</h3>
${E`
class Point { int x, y; }
Point a = new Point();
a.x = 5;
Point b = a;              // copies the REFERENCE: both names point to one object
b.x = 99;
System.out.println(a.x);  // 99
Point c = new Point();    // a different object
c.x = 5;
System.out.println(a == c);        // false: different objects
Point nothing = null;              // a reference that points to no object
System.out.println(nothing == null);
`}
${warn('Using a <code>null</code> reference as if it were an object (<code>nothing.x</code>) throws <code>NullPointerException</code>, the most common Java runtime error.')}
<h3>The this keyword</h3>
<p>Inside a method, <code>this</code> means "the current object". It is needed when a parameter has the same name as a field.</p>
${E`
class Rectangle {
    double width, height;

    void setSize(double width, double height) {
        this.width = width;       // field = parameter
        this.height = height;
    }
    double area() { return width * height; }
    double perimeter() { return 2 * (width + height); }
    Rectangle scale(double k) {   // return this: allows chaining
        width *= k;
        height *= k;
        return this;
    }
}
Rectangle r = new Rectangle();
r.setSize(3, 4);
System.out.println(r.area() + " " + r.perimeter());
System.out.println(r.scale(2).scale(0.5).area());

      body: `
<p>A <b>constructor</b> is a special block of code that runs when an object is created with <code>new</code>. It has the <b>same name as the class</b> and <b>no return type</b>. Its job is to put the new object into a valid starting state.</p>
${E`
class Player {
    String name;
    int lives;

    Player(String name, int lives) {       // constructor
        this.name = name;
        this.lives = lives;
        System.out.println("created " + name);
    }
}
Player p = new Player("Ali", 3);
System.out.println(p.name + " has " + p.lives + " lives");
`}
<h3>The default constructor</h3>
<p>If you write <b>no</b> constructor, Java provides an invisible one with no parameters. As soon as you write any constructor, the free one disappears.</p>
<h3>Overloading constructors</h3>
${E`
class Car {
    String brand;
    int year;
    double price;

    Car() {                                   // no-argument constructor
        this("unknown", 2020, 0);
    }
    Car(String brand) {
        this(brand, 2020, 15000);
    }
    Car(String brand, int year, double price) {
        this.brand = brand;
        this.year = year;
        this.price = price;
    }
    void show() { System.out.println(brand + " " + year + " $" + price); }
}
new Car().show();
new Car("Toyota").show();
new Car("Kia", 2015, 8000).show();
`}
<p><code>this(...)</code> calls another constructor of the same class (it must be the <b>first</b> statement). This avoids repeating setup code.</p>
<h3>Validating in the constructor</h3>
${E`
class Temperature {
    private double celsius;
    Temperature(double celsius) {
        if (celsius < -273.15) {
            throw new IllegalArgumentException("below absolute zero: " + celsius);
        }
        this.celsius = celsius;
    }
    double getCelsius() { return celsius; }
}
System.out.println(new Temperature(25).getCelsius());
try {
    new Temperature(-500);
} catch (IllegalArgumentException e) {
    System.out.println("rejected: " + e.getMessage());
}
`}
<h3>Copy constructor</h3>
${E`
class Point {
    int x, y;
    Point(int x, int y) { this.x = x; this.y = y; }
    Point(Point other) { this(other.x, other.y); }      // copy
}
Point a = new Point(1, 2);
Point b = new Point(a);
b.x = 100;
System.out.println(a.x + " " + b.x);
`}
<h3>final fields</h3>
<p>A <code>final</code> field must be set exactly once, in the constructor or in its declaration. It makes the object's data permanent.</p>
${E`
class Product {
    final String id;
    final double price;
    int stock = 0;
    Product(String id, double price) { this.id = id; this.price = price; }
}
Product p = new Product("P-100", 9.5);
p.stock = 20;
System.out.println(p.id + " " + p.price + " " + p.stock);
`}
<h3>Order of initialisation</h3>
${E`
class Demo {
    int a = init("field a");
    Demo() { System.out.println("constructor body"); }
    static int init(String what) { System.out.println("initialising " + what); return 1; }
}
new Demo();
`}

      body: `
<p><b>Encapsulation</b> means bundling data with the methods that use it and <b>hiding the details</b> behind a controlled interface. Users of a class call methods; they never reach in and change fields directly. That lets the class protect its own rules.</p>
<h3>The four access levels</h3>
<table><tr><th>Modifier</th><th>Same class</th><th>Same package</th><th>Subclass (other package)</th><th>Anywhere</th></tr>
<tr><td><code>private</code></td><td>yes</td><td>no</td><td>no</td><td>no</td></tr>
<tr><td><i>(none = package-private)</i></td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td><code>protected</code></td><td>yes</td><td>yes</td><td>yes</td><td>no</td></tr>
<tr><td><code>public</code></td><td>yes</td><td>yes</td><td>yes</td><td>yes</td></tr></table>
${E`
class Account {
    private double balance;              // hidden

    public void deposit(double amount) {
        if (amount <= 0) {
            System.out.println("deposit must be positive");
            return;
        }
        balance += amount;
    }
    public boolean withdraw(double amount) {
        if (amount > balance) return false;
        balance -= amount;
        return true;
    }
    public double getBalance() { return balance; }     // getter
}
Account acc = new Account();
acc.deposit(100);
acc.deposit(-5);
System.out.println(acc.withdraw(30) + " " + acc.getBalance());
// acc.balance = 1000000;    // compile error: balance has private access in Account
`}
<h3>Getters and setters with validation</h3>
${E`
class Person {
    private String name;
    private int age;

    public String getName() { return name; }
    public void setName(String name) {
        if (name != null && !name.trim().isEmpty()) this.name = name.trim();
    }
    public int getAge() { return age; }
    public void setAge(int age) {
        if (age < 0 || age > 130) throw new IllegalArgumentException("invalid age: " + age);
        this.age = age;

<h3>Read-only and computed properties</h3>

class Circle {
    private final double radius;
    public Circle(double radius) { this.radius = radius; }
    public double getRadius() { return radius; }                 // no setter: read-only
    public double getArea() { return Math.PI * radius * radius; }        // computed on demand

<h3>Immutable classes</h3>
<p>An <b>immutable</b> object never changes after construction (like <code>String</code>). All fields are <code>private final</code>, there are no setters, and "changing" methods return a <i>new</i> object. Immutable objects are simple and safe to share.</p>
${E`
final class Money {
    private final long cents;
    public Money(long cents) { this.cents = cents; }
    public Money plus(Money other) { return new Money(cents + other.cents); }
    public long getCents() { return cents; }
    @Override public String toString() { return "$" + cents / 100 + "." + (cents % 100 < 10 ? "0" : "") + cents % 100; }
}
Money a = new Money(1250), b = new Money(399);
Money sum = a.plus(b);
System.out.println(a + " + " + b + " = " + sum);
`}
<h3>Packages (a quick tour)</h3>
<p>Classes are organised into <b>packages</b> (folders) such as <code>java.util</code>. Use <code>import java.util.Scanner;</code> to use a class without its full name. Put your own classes in a package with <code>package com.school.app;</code> as the first line of the file.</p>
${tip('The rule of thumb: make fields <code>private</code>, methods <code>public</code> only when other classes need them, and the rest private. You can always loosen access later; tightening is hard.')}`,

        class Thermostat {
            private double target = 21.0;
            private final double MIN = 10, MAX = 30;
            private int changes = 0;

            public double getTarget() { return target; }

            public boolean setTarget(double celsius) {
                if (celsius < MIN || celsius > MAX) {
                    System.out.println("refused " + celsius + " (allowed " + MIN + " - " + MAX + ")");
                    return false;
                }
                target = celsius;
                changes++;
                return true;
            }

            public int getChanges() { return changes; }
            public double getTargetFahrenheit() { return target * 9 / 5 + 32; }
        }

            public static void main(String[] args) {
                Thermostat t = new Thermostat();
                System.out.println("start: " + t.getTarget());
                t.setTarget(24);
                t.setTarget(99);
                t.setTarget(18.5);
                System.out.println("target: " + t.getTarget() + " C = " + t.getTargetFahrenheit() + " F");
                System.out.println("accepted changes: " + t.getChanges());
            }
        }
      `,

      body: `
<p>Normal (<b>instance</b>) members belong to each object. <b><code>static</code></b> members belong to the <b>class itself</b>: there is exactly one copy, shared by all objects, and you use it through the class name.</p>
<h3>Static fields</h3>

class Student {
    String name;
    static int count = 0;              // one shared counter
    static final String SCHOOL = "Abouzeid Academy";    // a constant

    Student(String name) {
        this.name = name;
        count++;
    }
